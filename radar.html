<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071b2b" />
    <meta name="color-scheme" content="light" />
    <title>Radar + satellite · Meteo Sicilia</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; background: #071b2b; }
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #fff;
      }
      #map { position: fixed; inset: 0; z-index: 0; }
      .bar {
        position: fixed; z-index: 10; top: 0; left: 0; right: 0;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
        background: rgba(7, 27, 43, 0.92); backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(120, 180, 210, 0.18);
      }
      .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .brand .mark {
        display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 34px;
        border-radius: 8px; background: #168bd2;
      }
      .brand .eyebrow {
        font-size: 8.5px; font-weight: 850; letter-spacing: .12em;
        text-transform: uppercase; color: #87b8d0;
      }
      .brand h1 { margin: 1px 0 0; font-size: 15px; letter-spacing: -.02em; }
      .back {
        display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto;
        min-height: 40px; padding: 0 13px; border-radius: 7px; text-decoration: none;
        border: 1px solid rgba(179, 226, 245, .28); background: rgba(255,255,255,.08);
        color: #fff; font-size: 11px; font-weight: 850;
      }
      .panel {
        position: fixed; z-index: 10; left: 14px; right: 14px;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        margin: 0 auto; max-width: 640px;
        display: flex; align-items: center; gap: 12px;
        padding: 11px 14px; border-radius: 10px;
        background: rgba(7, 27, 43, 0.92); backdrop-filter: blur(14px);
        border: 1px solid rgba(120, 180, 210, 0.18);
      }
      .play {
        display: grid; place-items: center; width: 40px; height: 40px; flex: 0 0 40px;
        border: 0; border-radius: 8px; background: #168bd2; color: #fff; cursor: pointer;
      }
      .play svg { width: 18px; height: 18px; fill: currentColor; }
      .panel .meta { flex: 0 0 auto; min-width: 118px; }
      .panel .meta .k {
        font-size: 8px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase;
        color: #87b8d0;
      }
      .panel .meta .v { font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 800; }
      .panel input[type="range"] { flex: 1 1 auto; accent-color: #18bfd0; }
      .note {
        position: fixed; z-index: 10; left: 14px;
        bottom: calc(72px + env(safe-area-inset-bottom, 0px));
        max-width: min(620px, calc(100vw - 28px));
        padding: 7px 9px; border-radius: 6px;
        background: rgba(7, 27, 43, 0.78);
        font-size: 9px; color: #a9c7d8; text-shadow: 0 1px 3px rgba(0,0,0,.5);
      }
      .note b { color: #e8f8ff; }
      .status {
        position: fixed; z-index: 10; top: 50%; left: 50%; transform: translate(-50%,-50%);
        padding: 12px 18px; border-radius: 8px; background: rgba(7,27,43,.9);
        font-size: 12px; font-weight: 700;
      }
      .status[hidden] { display: none; }
      .observations {
        position: fixed; z-index: 10;
        top: calc(66px + env(safe-area-inset-top, 0px)); left: 14px; right: 14px;
        margin: 0 auto; max-width: 780px;
        display: grid; grid-template-columns: auto auto minmax(220px, 1fr); gap: 8px;
        padding: 9px; border-radius: 10px;
        background: rgba(7, 27, 43, 0.9); backdrop-filter: blur(14px);
        border: 1px solid rgba(120, 180, 210, 0.18);
      }
      .observation-toggle, .product-select {
        min-height: 42px; border: 1px solid rgba(179, 226, 245, .24);
        border-radius: 8px; background: rgba(255,255,255,.07); color: #eaf8ff;
        font: inherit; font-size: 10px; font-weight: 850;
      }
      .observation-toggle { padding: 0 13px; cursor: pointer; }
      .observation-toggle[aria-pressed="true"] {
        border-color: rgba(40, 205, 218, .7);
        background: rgba(22, 139, 210, .3);
        box-shadow: inset 0 0 0 1px rgba(77, 222, 230, .18);
      }
      .product-select { min-width: 0; padding: 0 34px 0 11px; color-scheme: dark; }
      body.radar-off .panel { opacity: .64; }
      body.radar-off .panel .play, body.radar-off .panel input { pointer-events: none; }
      @media (max-width: 660px) {
        .observations { grid-template-columns: 1fr 1fr; top: calc(64px + env(safe-area-inset-top, 0px)); }
        .product-select { grid-column: 1 / -1; }
        .note { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
        .panel { gap: 8px; padding: 9px 10px; }
        .panel .meta { min-width: 82px; }
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Radar precipitazioni e copertura nuvolosa satellitare"></div>

    <header class="bar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a8 8 0 0 1 16 0"></path><path d="M8 14a4 4 0 0 1 8 0"></path><path d="M12 14v6"></path><path d="M9 21l3-2 3 2"></path></svg>
        </div>
        <div>
          <div class="eyebrow">Osservazioni sincronizzate · tempo reale</div>
          <h1>Radar + satellite</h1>
        </div>
      </div>
      <a class="back" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg>
        <span>Mappa</span>
      </a>
    </header>

    <div class="observations" aria-label="Controlli osservazioni">
      <button id="satellite-toggle" class="observation-toggle" type="button" aria-pressed="true">Satellite: ON</button>
      <button id="radar-toggle" class="observation-toggle" type="button" aria-pressed="true">Radar: ON</button>
      <select id="product-select" class="product-select" aria-label="Prodotto satellitare">
        <optgroup label="Immagini ad alta risoluzione">
          <option value="geocolour" selected>GeoColour · reale giorno / IR notte</option>
          <option value="truecolour">Colori reali · giorno</option>
          <option value="vis06">Visibile 0.6 µm · 500 m</option>
          <option value="ir105">Infrarosso 10.5 µm · 1 km</option>
        </optgroup>
        <optgroup label="Nubi e atmosfera">
          <option value="cloudphase">Fase delle nubi · giorno</option>
          <option value="cloudtype">Tipo di nube · giorno</option>
          <option value="fog">Nebbia e nubi basse · notte</option>
          <option value="dust">Polvere e cirri</option>
          <option value="snow">Neve e nubi · giorno</option>
        </optgroup>
        <optgroup label="Fenomeni osservati">
          <option value="lightning">Fulmini LI · 5 minuti</option>
          <option value="satprecip">Precipitazione satellitare</option>
          <option value="firetemp">Temperatura incendi</option>
          <option value="frp">Potenza radiativa incendi</option>
        </optgroup>
      </select>
    </div>

    <div class="note"><b id="product-name">GeoColour MTG</b> · fondo fotografico reale · <span id="satellite-time">satellite in caricamento</span></div>

    <div class="panel">
      <button id="play" class="play" type="button" aria-label="Avvia/ferma animazione">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"></path></svg>
      </button>
      <div class="meta">
        <div class="k">Frame</div>
        <div class="v" id="frame-time">—</div>
      </div>
      <input id="frame-slider" type="range" min="0" max="0" value="0" step="1" aria-label="Scorri i frame radar" />
    </div>

    <div id="status" class="status">Carico il radar…</div>

    <script>
      const DOMAIN = [3.0, 33.7, 22.0, 48.9]; // [W, S, E, N]
      const RADAR_COLOR = 4;   // schema colore RainViewer
      const RADAR_OPTS = "1_1"; // smooth + neve
      const RADAR_MAX_NATIVE_ZOOM = 7;
      const MODEL_BOUNDS = [[DOMAIN[0], DOMAIN[1]], [DOMAIN[2], DOMAIN[3]]];
      const CLOUD_WMS = "https://view.eumetsat.int/geoserver/wms";
      const CLOUD_SLOT_MS = 10 * 60 * 1000;
      const CLOUD_MAX_SIDE = 4096;
      const CLOUD_PRODUCTS = {
        geocolour: { layer:"mtg_fd:rgb_geocolour", name:"GeoColour", detail:"reale di giorno · infrarosso di notte", metres:1000, mode:"scene", opacity:.96 },
        truecolour: { layer:"mtg_fd:rgb_truecolour", name:"Colori reali", detail:"osservazione naturale · solo di giorno", metres:1000, mode:"scene", opacity:.96, dayOnly:true },
        vis06: { layer:"mtg_fd:vis06_hrfi", name:"Visibile 0.6 µm", detail:"massimo dettaglio · solo di giorno", metres:500, mode:"grey", opacity:.94, dayOnly:true, clear:95, solid:175, cold:235 },
        ir105: { layer:"mtg_fd:ir105_hrfi", name:"Infrarosso 10.5 µm", detail:"cime nuvolose · giorno e notte", metres:1000, mode:"grey", opacity:.94, clear:38, solid:105, cold:150 },
        cloudphase: { layer:"mtg_fd:rgb_cloudphase", name:"Fase delle nubi", detail:"acqua, ghiaccio e particelle · giorno", metres:500, mode:"diagnostic", opacity:.94, dayOnly:true, latencyMinutes:30 },
        cloudtype: { layer:"mtg_fd:rgb_cloudtype", name:"Tipo di nube", detail:"spessore, altezza e fase · giorno", metres:1000, mode:"diagnostic", opacity:.94, dayOnly:true },
        fog: { layer:"mtg_fd:rgb_fog", name:"Nebbia e nubi basse", detail:"microfisica soprattutto notturna", metres:1000, mode:"diagnostic", opacity:.94 },
        dust: { layer:"mtg_fd:rgb_dust", name:"Polvere e cirri", detail:"polvere, cirri e pennacchi · giorno e notte", metres:2000, mode:"diagnostic", opacity:.94, latencyMinutes:30 },
        snow: { layer:"mtg_fd:rgb_snow", name:"Neve", detail:"neve al suolo e copertura nuvolosa", metres:1000, mode:"diagnostic", opacity:.94, dayOnly:true },
        lightning: { layer:"mtg_fd:li_afa", name:"Fulmini LI", detail:"area dei lampi accumulata su 5 minuti", metres:4500, mode:"diagnostic", opacity:.9, slotMs:5*60*1000, latencyMinutes:8 },
        satprecip: { layer:"mtg_fd:h40b", name:"Precipitazione satellitare", detail:"FCI fuso con microonde dei satelliti polari", metres:3000, mode:"diagnostic", opacity:.88 },
        firetemp: { layer:"mtg_fd:rgb_firetemperature", name:"Temperatura incendi", detail:"RGB termico dei punti caldi", metres:1000, mode:"diagnostic", opacity:.94 },
        frp: { layer:"mtg_fd:frp", name:"Potenza radiativa incendi", detail:"energia emessa dai focolai rilevati", metres:1000, mode:"diagnostic", opacity:.9 }
      };
      let map;
      let frames = [];         // [{time, path}]
      let host = "";
      let index = 0;
      let playing = true;
      let timer = null;
      let cloudCanvas = null;
      let cloudObjectUrl = "";
      let cloudToken = 0;
      let cloudReloadTimer = 0;
      let cloudSignature = "";
      let cloudProduct = "geocolour";
      let showClouds = true;
      let showRadar = true;

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

      function modelDomainView() {
        const element = document.getElementById("map");
        const width = element.clientWidth || window.innerWidth || 1280;
        const height = element.clientHeight || window.innerHeight || 720;
        const mercatorFitY = function (latitude) {
          const phi = latitude * Math.PI / 180;
          return Math.log(Math.tan(Math.PI / 4 + phi / 2));
        };
        const southY = mercatorFitY(DOMAIN[1]);
        const northY = mercatorFitY(DOMAIN[3]);
        const longitudeFraction = (DOMAIN[2] - DOMAIN[0]) / 360;
        const latitudeFraction = (northY - southY) / (2 * Math.PI);
        const centreLatitude = Math.atan(Math.sinh((southY + northY) / 2)) * 180 / Math.PI;
        return {
          center: [(DOMAIN[0] + DOMAIN[2]) / 2, centreLatitude],
          zoom: Math.min(
            Math.log2(width / (512 * longitudeFraction)),
            Math.log2(height / (512 * latitudeFraction))
          )
        };
      }

      function lockMapToModelDomain() {
        if (!map) return;
        const view = modelDomainView();
        map.setMaxBounds(MODEL_BOUNDS);
        map.setMinZoom(view.zoom);
        if (map.getZoom() < view.zoom) map.setZoom(view.zoom);
      }

      function tileUrl(frame) {
        return host + frame.path + "/512/{z}/{x}/{y}/" + RADAR_COLOR + "/" + RADAR_OPTS + ".png";
      }

      function mercatorX(longitude) { return longitude * 20037508.34 / 180; }
      function mercatorY(latitude) {
        return Math.log(Math.tan((90 + latitude) * Math.PI / 360))
          / (Math.PI / 180) * 20037508.34 / 180;
      }

      function satelliteSlot(frame, product) {
        const selected = product || CLOUD_PRODUCTS[cloudProduct] || CLOUD_PRODUCTS.geocolour;
        const slotMs = selected.slotMs || CLOUD_SLOT_MS;
        const latency = (selected.latencyMinutes || 22) * 60 * 1000;
        const sourceTime = frame && frame.time ? frame.time * 1000 : Date.now() - latency;
        const value = Math.floor(sourceTime / slotMs) * slotMs;
        return {
          value: value,
          date: new Date(value),
          iso: new Date(value).toISOString().replace(/\.\d{3}Z$/, ".000Z")
        };
      }

      function cloudBox(padding) {
        const bounds = map && map.getBounds ? map.getBounds() : null;
        if (!bounds) return { west: DOMAIN[0], south: DOMAIN[1], east: DOMAIN[2], north: DOMAIN[3] };
        const spanX = bounds.getEast() - bounds.getWest();
        const spanY = bounds.getNorth() - bounds.getSouth();
        let box = {
          west: Math.max(DOMAIN[0], bounds.getWest() - spanX * padding),
          south: Math.max(DOMAIN[1], bounds.getSouth() - spanY * padding),
          east: Math.min(DOMAIN[2], bounds.getEast() + spanX * padding),
          north: Math.min(DOMAIN[3], bounds.getNorth() + spanY * padding)
        };
        if (!(box.east > box.west) || !(box.north > box.south)) {
          box = { west: DOMAIN[0], south: DOMAIN[1], east: DOMAIN[2], north: DOMAIN[3] };
        }
        return box;
      }

      function cloudSize(box, product) {
        const spanX = mercatorX(box.east) - mercatorX(box.west);
        const spanY = mercatorY(box.north) - mercatorY(box.south);
        const aspect = spanY / Math.max(spanX, 1);
        const memory = Number(navigator.deviceMemory) || 4;
        const maxPixels = memory >= 8
          ? CLOUD_MAX_SIDE * CLOUD_MAX_SIDE
          : (memory >= 4 ? 11000000 : 7000000);
        const nativeWidth = Math.ceil(spanX / product.metres);
        const pixelLimitedWidth = Math.floor(Math.sqrt(maxPixels / Math.max(aspect, .01)));
        const sideLimitedWidth = Math.floor(CLOUD_MAX_SIDE / Math.max(aspect, 1));
        const width = Math.max(512, Math.min(
          nativeWidth, CLOUD_MAX_SIDE, sideLimitedWidth, pixelLimitedWidth
        ));
        const height = Math.max(384, Math.min(
          CLOUD_MAX_SIDE, Math.round(width * aspect)
        ));
        return { width: width, height: height, metres: spanX / width };
      }

      function cloudUrl(box, size, product, slot, latestAvailable) {
        return CLOUD_WMS
          + "?service=WMS&version=1.1.1&request=GetMap&styles="
          + "&layers=" + encodeURIComponent(product.layer)
          + "&srs=EPSG:3857&format=image/png&transparent=true"
          + "&bbox=" + [
              mercatorX(box.west), mercatorY(box.south),
              mercatorX(box.east), mercatorY(box.north)
            ].map(function (value) { return value.toFixed(1); }).join(",")
          + "&width=" + size.width + "&height=" + size.height
          + (latestAvailable ? "" : "&time=" + slot.iso);
      }

      function publishClouds(image, box, size, product, slot, token) {
        if (token !== cloudToken || !map || !map.getSource("satellite-clouds")) return;
        const coordinates = [
          [box.west, box.north], [box.east, box.north],
          [box.east, box.south], [box.west, box.south]
        ];
        const update = function (url, objectUrl) {
          if (token !== cloudToken) {
            if (objectUrl) URL.revokeObjectURL(url);
            return;
          }
          map.getSource("satellite-clouds").updateImage({ url: url, coordinates: coordinates });
          map.setPaintProperty("satellite-clouds-layer", "raster-opacity", product.opacity || .94);
          map.setLayoutProperty("satellite-clouds-layer", "visibility", "visible");
          if (cloudObjectUrl) {
            const previous = cloudObjectUrl;
            setTimeout(function () { URL.revokeObjectURL(previous); }, 1600);
          }
          cloudObjectUrl = objectUrl ? url : "";
          document.getElementById("product-name").textContent = product.name;
          document.getElementById("satellite-time").textContent =
            product.detail + (slot.latest
              ? " · ultimo aggiornamento disponibile"
              : " · immagine delle "
                + slot.date.toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" }));
        };
        if (product.mode !== "grey") {
          update(image.src, false);
          return;
        }
        if (!cloudCanvas) cloudCanvas = document.createElement("canvas");
        cloudCanvas.width = size.width;
        cloudCanvas.height = size.height;
        const context = cloudCanvas.getContext("2d", { willReadFrequently: true });
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = "high";
        context.clearRect(0, 0, size.width, size.height);
        context.drawImage(image, 0, 0, size.width, size.height);
        if (product.mode === "grey") {
          const rendered = context.getImageData(0, 0, size.width, size.height);
          const pixels = rendered.data;
          const span = product.solid - product.clear;
          const coldSpan = (product.cold || product.solid) - product.clear;
          for (let offset = 0; offset < pixels.length; offset += 4) {
            const luminance = 0.299 * pixels[offset]
              + 0.587 * pixels[offset + 1] + 0.114 * pixels[offset + 2];
            let level = clamp((luminance - product.clear) / span, 0, 1);
            const alpha = level * level * (3 - 2 * level);
            const cold = clamp((luminance - product.clear) / coldSpan, 0, 1);
            const tone = Math.round(196 + 59 * cold);
            pixels[offset] = tone;
            pixels[offset + 1] = Math.min(255, tone + 8);
            pixels[offset + 2] = Math.min(255, tone + 18);
            pixels[offset + 3] = Math.round(alpha * 255);
          }
          context.putImageData(rendered, 0, 0);
        }
        if (typeof cloudCanvas.toBlob === "function" && typeof URL.createObjectURL === "function") {
          cloudCanvas.toBlob(function (blob) {
            if (blob) update(URL.createObjectURL(blob), true);
          }, "image/png");
        } else {
          update(cloudCanvas.toDataURL("image/png"), false);
        }
      }

      function loadClouds(frame, force) {
        if (!showClouds || !map || !map.getSource("satellite-clouds") || document.hidden) return;
        const product = CLOUD_PRODUCTS[cloudProduct] || CLOUD_PRODUCTS.geocolour;
        const slot = satelliteSlot(frame, product);
        const box = cloudBox(0.18);
        const size = cloudSize(box, product);
        const signature = [product.layer, slot.value, box.west.toFixed(2), box.south.toFixed(2), box.east.toFixed(2), box.north.toFixed(2), size.width].join("|");
        if (!force && signature === cloudSignature) return;
        cloudSignature = signature;
        const token = ++cloudToken;
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = function () {
          try { publishClouds(image, box, size, product, slot, token); }
          catch (error) {
            if (token === cloudToken) cloudSignature = "";
            document.getElementById("satellite-time").textContent = "satellite non elaborabile";
          }
        };
        image.onerror = function () {
          if (token === cloudToken) {
            if (!slot.latest) {
              slot.latest = true;
              image.src = cloudUrl(box, size, product, slot, true);
              return;
            }
            cloudSignature = "";
            document.getElementById("satellite-time").textContent = "satellite non disponibile per questo frame";
          }
        };
        image.src = cloudUrl(box, size, product, slot);
      }

      function scheduleCloudReload() {
        if (cloudReloadTimer) clearTimeout(cloudReloadTimer);
        cloudReloadTimer = setTimeout(function () {
          cloudReloadTimer = 0;
          loadClouds(frames[index], true);
        }, 500);
      }

      function showStatus(text) {
        const el = document.getElementById("status");
        if (!text) { el.hidden = true; return; }
        el.hidden = false; el.textContent = text;
      }

      function setFrame(i) {
        if (!frames.length || !map) {
          loadClouds(null, false);
          return;
        }
        index = (i + frames.length) % frames.length;
        const frame = frames[index];
        if (map.getSource("radar")) {
          try {
            map.getSource("radar").setTiles([tileUrl(frame)]);
          } catch (error) {
            // Fallback per versioni senza setTiles: rimonta la sorgente.
            if (map.getLayer("radar-layer")) map.removeLayer("radar-layer");
            if (map.getSource("radar")) map.removeSource("radar");
            addRadar(frame);
          }
        }
        const slider = document.getElementById("frame-slider");
        slider.value = String(index);
        const when = new Date(frame.time * 1000).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
        document.getElementById("frame-time").textContent = when;
        loadClouds(frame, false);
      }

      function addRadar(frame) {
        map.addSource("radar", {
          type: "raster",
          tiles: [tileUrl(frame)],
          // Tile 512 px: massima qualita' prevista dall'API RainViewer.
          tileSize: 512,
          // RainViewer serve z=0..7. Oltre, MapLibre effettua overzoom della
          // z=7: la carta continua a ingrandirsi senza URL «zoom unsupported».
          maxzoom: RADAR_MAX_NATIVE_ZOOM,
          bounds: DOMAIN,
          attribution: "Radar © RainViewer"
        });
        const radarLayer = {
          id: "radar-layer",
          type: "raster",
          source: "radar",
          layout: { visibility: showRadar ? "visible" : "none" },
          paint: {
            "raster-opacity": ["interpolate", ["linear"], ["zoom"], 7, .82, 11, .56],
            "raster-resampling": "linear",
            "raster-fade-duration": 0
          }
        };
        if (map.getLayer("labels")) map.addLayer(radarLayer, "labels");
        else map.addLayer(radarLayer);
      }

      function step() {
        if (!playing) return;
        setFrame(index + 1);
        // Il satellite richiede qualche istante in piu' del singolo tile radar:
        // una cadenza leggibile mantiene davvero fusi i due fotogrammi.
        const last = index === frames.length - 1;
        timer = setTimeout(step, last ? 1800 : 850);
      }

      function setPlaying(next) {
        playing = Boolean(next && showRadar && frames.length);
        document.getElementById("play-icon").innerHTML = playing
          ? "<path d='M6 5h4v14H6zM14 5h4v14h-4z'></path>"
          : "<path d='M8 5l11 7-11 7z'></path>";
        if (timer) { clearTimeout(timer); timer = null; }
        if (playing) step();
      }

      function updateObservationControls() {
        const radarToggle = document.getElementById("radar-toggle");
        const satelliteToggle = document.getElementById("satellite-toggle");
        radarToggle.setAttribute("aria-pressed", showRadar ? "true" : "false");
        satelliteToggle.setAttribute("aria-pressed", showClouds ? "true" : "false");
        radarToggle.textContent = "Radar: " + (showRadar ? "ON" : "OFF");
        satelliteToggle.textContent = "Satellite: " + (showClouds ? "ON" : "OFF");
        document.body.classList.toggle("radar-off", !showRadar);
      }

      function setRadarVisible(next) {
        showRadar = Boolean(next);
        if (map && map.getLayer("radar-layer")) {
          map.setLayoutProperty("radar-layer", "visibility", showRadar ? "visible" : "none");
        }
        if (!showRadar) {
          setPlaying(false);
          if (frames.length) setFrame(frames.length - 1);
        }
        updateObservationControls();
      }

      function setCloudsVisible(next) {
        showClouds = Boolean(next);
        cloudToken++;
        if (map && map.getLayer("satellite-clouds-layer")) {
          map.setLayoutProperty("satellite-clouds-layer", "visibility", showClouds ? "visible" : "none");
        }
        if (showClouds) {
          cloudSignature = "";
          loadClouds(frames[index] || null, true);
        } else {
          document.getElementById("satellite-time").textContent = "satellite spento";
        }
        updateObservationControls();
      }

      async function loadFrames() {
        try {
          const data = await fetch("https://api.rainviewer.com/public/weather-maps.json")
            .then(function (r) { return r.json(); });
          host = data.host || "";
          const past = (data.radar && data.radar.past) ? data.radar.past : [];
          // La vista è osservativa: non mescola i frame previsti «nowcast»
          // con la copertura nuvolosa realmente misurata dal satellite.
          frames = past;
          if (!host || !frames.length) {
            showRadar = false;
            updateObservationControls();
            loadClouds(null, true);
            showStatus("");
            return;
          }
          addRadar(frames[frames.length - 1]);
          const slider = document.getElementById("frame-slider");
          slider.max = String(frames.length - 1);
          slider.value = String(frames.length - 1);
          index = frames.length - 1;
          setFrame(index);
          showStatus("");
          setPlaying(showRadar);
        } catch (error) {
          showRadar = false;
          updateObservationControls();
          loadClouds(null, true);
          showStatus("");
        }
      }

      function setupMap() {
        const startView = modelDomainView();
        map = new maplibregl.Map({
          container: "map",
          center: startView.center,
          zoom: startView.zoom,
          minZoom: startView.zoom,
          maxBounds: MODEL_BOUNDS,
          maxZoom: 16,
          dragRotate: false,
          pitchWithRotate: false,
          attributionControl: true,
          style: {
            version: 8,
            sources: {
              satelliteBase: {
                type: "raster",
                tiles: [
                  "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
                ],
                tileSize: 256,
                maxzoom: 18,
                attribution: "World Imagery © Esri, Maxar, Earthstar Geographics"
              },
              labels: {
                type: "raster",
                tiles: [
                  "https://a.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}.png",
                  "https://b.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}.png"
                ],
                tileSize: 256,
                attribution: "Etichette © CARTO © OpenStreetMap contributors"
              }
            },
            layers: [
              { id: "bg", type: "background", paint: { "background-color": "#0a1c2b" } },
              { id: "base", type: "raster", source: "satelliteBase", paint: { "raster-opacity": 1, "raster-fade-duration": 0 } },
              { id: "labels", type: "raster", source: "labels", paint: { "raster-opacity": .86, "raster-fade-duration": 0 } }
            ]
          }
        });
        map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), "bottom-right");
        map.on("load", function () {
          map.addSource("satellite-clouds", {
            type: "image",
            url: "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=",
            coordinates: [[DOMAIN[0], DOMAIN[3]], [DOMAIN[2], DOMAIN[3]], [DOMAIN[2], DOMAIN[1]], [DOMAIN[0], DOMAIN[1]]]
          });
          map.addLayer({
            id: "satellite-clouds-layer",
            type: "raster",
            source: "satellite-clouds",
            layout: { visibility: showClouds ? "visible" : "none" },
            paint: { "raster-opacity": 0.96, "raster-resampling": "linear", "raster-fade-duration": 0 }
          }, "labels");
          // Contorno del dominio ICON-2I.
          map.addSource("domain", {
            type: "geojson",
            data: {
              type: "Feature",
              geometry: {
                type: "LineString",
                coordinates: [
                  [DOMAIN[0], DOMAIN[1]], [DOMAIN[2], DOMAIN[1]],
                  [DOMAIN[2], DOMAIN[3]], [DOMAIN[0], DOMAIN[3]], [DOMAIN[0], DOMAIN[1]]
                ]
              }
            }
          });
          map.addLayer({
            id: "domain-line", type: "line", source: "domain",
            paint: { "line-color": "rgba(120,200,230,0.55)", "line-width": 1, "line-dasharray": [3, 3] }
          });
          loadFrames();
        });
        map.on("moveend", scheduleCloudReload);
      }

      document.getElementById("play").addEventListener("click", function () { setPlaying(!playing); });
      document.getElementById("radar-toggle").addEventListener("click", function () {
        setRadarVisible(!showRadar);
      });
      document.getElementById("satellite-toggle").addEventListener("click", function () {
        setCloudsVisible(!showClouds);
      });
      document.getElementById("product-select").addEventListener("change", function (event) {
        cloudProduct = event.target.value;
        const product = CLOUD_PRODUCTS[cloudProduct] || CLOUD_PRODUCTS.geocolour;
        document.getElementById("product-name").textContent = product.name;
        document.getElementById("satellite-time").textContent = product.detail + " · caricamento";
        cloudSignature = "";
        if (showClouds) loadClouds(frames[index] || null, true);
      });
      document.getElementById("frame-slider").addEventListener("input", function (event) {
        setPlaying(false);
        setFrame(Number(event.target.value));
      });
      window.addEventListener("resize", function () {
        if (map) {
          map.resize();
          lockMapToModelDomain();
        }
        scheduleCloudReload();
      });

      updateObservationControls();
      setupMap();
    </script>
  </body>
</html>
