name: Validate Meteorological AI Agent

on:
  push:
    branches:
      - main
    paths:
      - 'meteo_analysis/agents/**'
      - 'scripts/generate_ai_bulletin.py'
      - 'scripts/tests/test_meteorologist_agent.py'
      - '.github/workflows/validate_ai_agent.yml'
  workflow_dispatch:

concurrency:
  group: ai-agent-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-live-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifica regressioni agente
        run: python scripts/tests/test_meteorologist_agent.py

      - name: Scarica l'ultimo bollettino deterministico pubblicato
        run: |
          mkdir -p data_weather
          base_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/data_weather"
          curl --fail --silent --show-error --location \
            "${base_url}/expert_bulletin.json.gz" \
            --output data_weather/expert_bulletin.json.gz
          curl --fail --silent --show-error --location \
            "${base_url}/catalog.json" \
            --output data_weather/catalog.json
          curl --fail --silent --show-error --location \
            "${base_url}/archive_manifest.json" \
            --output data_weather/archive_manifest.json

      - name: Verifica Gemini, Groq e arbitro sul run pubblicato
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/generate_ai_bulletin.py --data-dir data_weather
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(
              Path("data_weather/ai_agent_status.json").read_text(encoding="utf-8")
          )
          print(json.dumps(status, ensure_ascii=False, separators=(",", ":")))
          if status.get("status") != "validated":
              raise SystemExit("validazione live dell'agente non superata")
          PY

      - name: Conserva diagnostica della validazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-validation-${{ github.sha }}
          path: |
            data_weather/ai_agent_status.json
            data_weather/ai_expert_bulletin.json.gz
          if-no-files-found: warn
          retention-days: 7

