name: Test Meteorological Deep Learning

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'meteo_analysis/deep_learning/**'
      - 'scripts/train_front_unet.py'
      - 'scripts/train_downscaler.py'
      - 'scripts/infer_front_unet.py'
      - 'scripts/infer_downscaler.py'
      - 'scripts/prepare_front_unet_data.py'
      - 'scripts/validate_deep_learning_data.py'
      - 'scripts/tests/test_deep_learning.py'
      - 'requirements-deep-learning.txt'
      - 'requirements-ml-training.txt'
      - 'configs/*.json'
      - 'docs/ia_meteorologica_pytorch.md'
      - '.github/workflows/test_deep_learning.yml'
  pull_request:
    branches: [main]
    paths:
      - 'meteo_analysis/deep_learning/**'
      - 'scripts/train_front_unet.py'
      - 'scripts/train_downscaler.py'
      - 'scripts/infer_front_unet.py'
      - 'scripts/infer_downscaler.py'
      - 'scripts/prepare_front_unet_data.py'
      - 'scripts/validate_deep_learning_data.py'
      - 'scripts/tests/test_deep_learning.py'
      - 'requirements-deep-learning.txt'
      - 'requirements-ml-training.txt'
      - 'configs/*.json'
      - 'docs/ia_meteorologica_pytorch.md'
      - '.github/workflows/test_deep_learning.yml'

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PyTorch test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy
      - name: Compile and test
        run: |
          python -m compileall -q meteo_analysis/deep_learning
          python scripts/tests/test_deep_learning.py
