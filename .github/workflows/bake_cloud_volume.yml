name: Bake Cloud Volume

# Le nubi 3D (nubi_fusione.js) partono dall'ultimo fotogramma EUMETSAT e
# dall'ambiente ICON-2I gia' pubblicato dal run del modello
# (data_weather/cloud_environment.npz). Il satellite cambia ogni dieci
# minuti, il modello due volte al giorno: questa cottura rinfresca la
# texture ogni mezz'ora senza toccare il resto del sito.
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'meteo_analysis/clouds/**'
      - 'scripts/bake_cloud_volume.py'
      - '.github/workflows/bake_cloud_volume.yml'
  workflow_dispatch:

concurrency:
  group: bake-cloud-volume
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Niente eccodes ne' cfgrib: la cottura legge solo PNG e un npz.
      - name: Install minimal dependencies
        run: python -m pip install numpy Pillow requests

      - name: Verifica la fusione
        run: python scripts/tests/test_cloud_volume.py

      - name: Checkout ambiente e texture pubblicati
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public-site
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data_weather/cloud_environment.npz
            /data_weather/live/clouds/

      - name: Cuoce e pubblica la texture
        shell: bash
        run: |
          git -C public-site config user.name "MeteoBot"
          git -C public-site config user.email "bot@meteo.local"
          git -C public-site config http.lowSpeedLimit 1000
          git -C public-site config http.lowSpeedTime 60
          for attempt in 1 2 3; do
            git -C public-site fetch --depth=1 origin gh-pages
            git -C public-site reset --hard origin/gh-pages
            set +e
            python scripts/bake_cloud_volume.py \
              --environment public-site/data_weather/cloud_environment.npz \
              --output-dir public-site/data_weather/live/clouds
            esito=$?
            set -e
            # 2 = niente da cuocere (satellite o ambiente assenti): resta in
            # linea la texture precedente, non e' un errore del workflow.
            if [ "$esito" = "2" ]; then exit 0; fi
            if [ "$esito" != "0" ]; then exit "$esito"; fi
            git -C public-site add --sparse data_weather/live/clouds
            if git -C public-site diff --cached --quiet; then exit 0; fi
            git -C public-site commit -q -m "Aggiorna nubi 3D"
            if git -C public-site push origin HEAD:gh-pages; then exit 0; fi
            sleep 10
          done
          exit 1
