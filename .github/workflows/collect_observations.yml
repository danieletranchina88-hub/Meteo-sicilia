name: Collect Verification Observations

on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:

concurrency:
  group: collect-verification-observations
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install minimal dependency
        run: python -m pip install requests

      - name: Collect one time-stamped METAR snapshot
        run: python scripts/collect_observations.py --output-dir observations

      - name: Preserve observation snapshot
        uses: actions/upload-artifact@v4
        with:
          name: metar-observations-${{ github.run_id }}
          path: observations/
          if-no-files-found: error
          retention-days: 90
