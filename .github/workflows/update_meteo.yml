name: Update Meteo Data

on:
  schedule:
    - cron: '35 1,13 * * *'
    - cron: '20 3,15 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/process_data.py'
      - 'scripts/front_analysis.py'
      - 'scripts/front_analysis_v10.py'
      - 'scripts/front_detection.py'
      - 'scripts/front_locator.py'
      - 'scripts/front_tracking.py'
      - 'scripts/thermodynamics.py'
      - 'scripts/tests/**'
      - 'scripts/process_ecmwf.py'
      - 'requirements.txt'
      - '.github/workflows/update_meteo.yml'
  workflow_dispatch:

concurrency:
  group: meteo-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev libnetcdf-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # I trasferimenti git dei runner verso questo repo si sono congelati
      # in passato senza timeout (git pull fermo 46 minuti senza output).
      # Con low-speed limit un trasferimento stagnante viene abortito dopo
      # 60 secondi, cosi' i tentativi di retry possono partire davvero.
      - name: Configura timeout git anti-stallo
        run: |
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 60

      - name: Run ECMWF IFS processor
        continue-on-error: true
        run: python scripts/process_ecmwf.py

      # I dati non vivono piu' su main: se il processore ECMWF e' fallito,
      # recupera l'ultima copia pubblicata cosi' il sito conserva il layer
      # ECMWF e l'analisi ICON-2I mantiene la guida per filtrare i fronti.
      - name: Recupera dati ECMWF precedenti se il processore è fallito
        run: |
          if [ -d data_weather_ecmwf ] && [ -n "$(ls -A data_weather_ecmwf)" ]; then
            echo "Dati ECMWF freschi disponibili."
            exit 0
          fi
          echo "Processore ECMWF fallito: recupero l'ultima copia da gh-pages."
          if git fetch --depth 1 origin gh-pages; then
            git checkout FETCH_HEAD -- data_weather_ecmwf 2>/dev/null \
              && git reset -q -- data_weather_ecmwf \
              || echo "Nessuna copia ECMWF su gh-pages: si prosegue senza guida."
          else
            echo "Fetch di gh-pages non riuscito: si prosegue senza guida ECMWF."
          fi

      - name: Run ICON-2I processor
        run: python scripts/process_data.py

      # Unica pubblicazione: commit orfano su gh-pages da un repository
      # temporaneo isolato. Nessuna storia accumulata (la dimensione resta
      # quella dell'ultimo snapshot) e nessun push di dati su main.
      - name: Deploy dati su branch gh-pages
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d data_weather ] || [ -z "$(ls -A data_weather)" ]; then
            echo "data_weather assente o vuota: interrompo per non pubblicare un sito senza dati."
            exit 1
          fi

          STAGE=$(mktemp -d)
          cp index.html "$STAGE"/
          touch "$STAGE"/.nojekyll
          cp -r data_weather "$STAGE"/data_weather
          if [ -d data_weather_ecmwf ]; then
            cp -r data_weather_ecmwf "$STAGE"/data_weather_ecmwf
          fi

          cd "$STAGE"
          git init -q -b gh-pages
          git config user.name "MeteoBot"
          git config user.email "bot@meteo.local"
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 60
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -q -m "Pubblica dati meteo $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3; do
            if git push --force origin gh-pages; then
              echo "Deploy gh-pages completato (tentativo $attempt)."
              exit 0
            fi
            echo "Push gh-pages fallito (tentativo $attempt), riprovo tra 20s..."
            sleep 20
          done
          exit 1
