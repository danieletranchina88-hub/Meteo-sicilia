name: Update Meteo Data

on:
  schedule:
    - cron: '35 1,13 * * *'
    - cron: '20 3,15 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/process_data.py'
      - 'scripts/front_analysis.py'
      - 'scripts/process_ecmwf.py'
      - 'requirements.txt'
      - '.github/workflows/update_meteo.yml'
  workflow_dispatch:

concurrency:
  group: meteo-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev libnetcdf-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run ECMWF IFS processor
        continue-on-error: true
        run: python scripts/process_ecmwf.py

      - name: Publish ECMWF IFS data
        run: |
          git config user.name "MeteoBot"
          git config user.email "bot@meteo.local"
          if [ ! -d data_weather_ecmwf ]; then
            echo "Catalogo ECMWF non disponibile in questo tentativo."
          else
            git add data_weather_ecmwf/
            if git diff --staged --quiet; then
              echo "Nessuna modifica ECMWF."
            else
              git commit -m "Aggiorna dati ECMWF IFS"
              git pull --rebase --autostash
              git push
            fi
          fi

      - name: Run ICON-2I processor
        run: python scripts/process_data.py

      - name: Publish ICON-2I data
        run: |
          git config user.name "MeteoBot"
          git config user.email "bot@meteo.local"
          git add data_weather/
          if git diff --staged --quiet; then
            echo "Nessuna modifica ICON-2I."
            exit 0
          fi
          git commit -m "Aggiorna dati ICON-2I"
          git pull --rebase --autostash
          git push

      # Pubblica una copia del sito su un branch dedicato (gh-pages) con un
      # commit orfano ad ogni run: nessuna storia da trascinare, la
      # dimensione del branch resta sempre quella dell'ultimo snapshot.
      # Non tocca la storia di main, che continua a crescere finche' la
      # sorgente di GitHub Pages non viene spostata su gh-pages (Settings ->
      # Pages -> Source): a quel punto questa pubblicazione duplicata su
      # main potra' essere rimossa.
      - name: Deploy dati su branch gh-pages (senza storia accumulata)
        run: |
          if [ ! -d data_weather ] || [ -z "$(ls -A data_weather)" ]; then
            echo "data_weather assente o vuota: salto il deploy per non pubblicare un sito senza dati."
            exit 1
          fi

          git config user.name "MeteoBot"
          git config user.email "bot@meteo.local"

          STAGE=$(mktemp -d)
          cp index.html "$STAGE"/
          touch "$STAGE"/.nojekyll
          cp -r data_weather "$STAGE"/data_weather
          if [ -d data_weather_ecmwf ]; then
            cp -r data_weather_ecmwf "$STAGE"/data_weather_ecmwf
          fi

          git checkout --orphan gh-pages-deploy
          git rm -rf --cached . >/dev/null
          git clean -fdx -q
          cp -r "$STAGE"/. .
          git add -A
          git commit -q -m "Pubblica dati meteo $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force origin gh-pages-deploy:gh-pages
