name: Update Meteo Data

on:
  schedule:
    - cron: '35 1,13 * * *'
    - cron: '20 3,15 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/process_data.py'
      - 'scripts/process_ecmwf.py'
      - 'requirements.txt'
      - '.github/workflows/update_meteo.yml'
  workflow_dispatch:

concurrency:
  group: meteo-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev libnetcdf-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run ECMWF IFS processor
        continue-on-error: true
        run: python scripts/process_ecmwf.py

      - name: Run ICON-2I processor
        run: python scripts/process_data.py

      - name: Commit and push
        run: |
          git config user.name "MeteoBot"
          git config user.email "bot@meteo.local"
          git add data_weather/
          if [ -d data_weather_ecmwf ]; then
            git add data_weather_ecmwf/
          fi
          if git diff --staged --quiet; then
            echo "Nessuna modifica."
            exit 0
          fi
          git commit -m "Aggiorna dati ICON-2I ed ECMWF IFS"
          git pull --rebase --autostash
          git push
