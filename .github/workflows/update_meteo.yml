name: Update Meteo Data

on:
  schedule:
    - cron: '35 1,13 * * *'
    - cron: '20 3,15 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/process_data.py'
      - 'scripts/front_analysis.py'
      - 'scripts/front_analysis_v12.py'
      - 'scripts/front_consensus.py'
      - 'scripts/front_impact_validation.py'
      - 'scripts/front_detection.py'
      - 'scripts/front_locator.py'
      - 'scripts/front_physics.py'
      - 'scripts/front_ridge.py'
      - 'scripts/front_sections.py'
      - 'scripts/front_support.py'
      - 'scripts/front_occlusion.py'
      - 'scripts/front_tracking.py'
      - 'scripts/front_benchmark.py'
      - 'scripts/calibrate_thresholds.py'
      - 'scripts/climatology_thresholds.json'
      - 'scripts/thermodynamics.py'
      - 'meteo_analysis/**'
      - 'benchmarks/fronts/**'
      - 'scripts/tests/**'
      - 'index.html'
      - 'meteograms.html'
      - 'point_bulletin.js'
      - 'requirements.txt'
      - '.github/workflows/update_meteo.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/process_data.py'
      - 'scripts/front_analysis.py'
      - 'scripts/front_analysis_v12.py'
      - 'scripts/front_consensus.py'
      - 'scripts/front_impact_validation.py'
      - 'scripts/front_detection.py'
      - 'scripts/front_locator.py'
      - 'scripts/front_physics.py'
      - 'scripts/front_ridge.py'
      - 'scripts/front_sections.py'
      - 'scripts/front_support.py'
      - 'scripts/front_occlusion.py'
      - 'scripts/front_tracking.py'
      - 'scripts/front_benchmark.py'
      - 'scripts/calibrate_thresholds.py'
      - 'scripts/climatology_thresholds.json'
      - 'scripts/thermodynamics.py'
      - 'meteo_analysis/**'
      - 'benchmarks/fronts/**'
      - 'scripts/tests/**'
      - 'index.html'
      - 'meteograms.html'
      - 'point_bulletin.js'
      - 'requirements.txt'
      - '.github/workflows/update_meteo.yml'

concurrency:
  group: meteo-update-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev libnetcdf-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verifica nucleo scientifico dei fronti
        run: |
          python scripts/tests/test_front_locator.py
          python scripts/tests/test_front_detection.py
          python scripts/tests/test_front_consensus.py
          python scripts/tests/test_front_impact_validation.py
          python scripts/tests/test_front_physics.py
          python scripts/tests/test_front_tracking.py
          python scripts/tests/test_front_ridge.py
          python scripts/tests/test_front_sections.py
          python scripts/tests/test_front_support.py
          python scripts/tests/test_front_occlusion.py
          python scripts/tests/test_thermodynamics.py
          python scripts/tests/test_climatology.py
          python scripts/tests/test_front_analysis_status.py
          python scripts/tests/test_front_benchmark.py
          python scripts/tests/test_convection.py
          python scripts/tests/test_storms.py
          python scripts/tests/test_nlg.py
          python scripts/tests/test_hazards.py
          python scripts/tests/test_meteograms.py
          python scripts/tests/test_ml_fronts.py
          node scripts/tests/test_point_bulletin.js
          node scripts/tests/test_map_3d.js

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev libnetcdf-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # I trasferimenti git dei runner verso questo repo si sono congelati
      # in passato senza timeout (git pull fermo 46 minuti senza output).
      # Con low-speed limit un trasferimento stagnante viene abortito dopo
      # 60 secondi, cosi' i tentativi di retry possono partire davvero.
      - name: Configura timeout git anti-stallo
        run: |
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 60

      - name: Verifica nucleo scientifico dei fronti
        run: |
          python scripts/tests/test_front_locator.py
          python scripts/tests/test_front_detection.py
          python scripts/tests/test_front_consensus.py
          python scripts/tests/test_front_impact_validation.py
          python scripts/tests/test_front_physics.py
          python scripts/tests/test_front_tracking.py
          python scripts/tests/test_front_ridge.py
          python scripts/tests/test_front_sections.py
          python scripts/tests/test_front_support.py
          python scripts/tests/test_front_occlusion.py
          python scripts/tests/test_thermodynamics.py
          python scripts/tests/test_climatology.py
          python scripts/tests/test_front_analysis_status.py
          python scripts/tests/test_front_benchmark.py
          python scripts/tests/test_convection.py
          python scripts/tests/test_storms.py
          python scripts/tests/test_nlg.py
          python scripts/tests/test_hazards.py
          python scripts/tests/test_meteograms.py
          python scripts/tests/test_ml_fronts.py
          node scripts/tests/test_point_bulletin.js
          node scripts/tests/test_map_3d.js

      - name: Run ICON-2I processor
        run: python scripts/process_data.py

      - name: Archivia diagnostica QC dei fronti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-qc-${{ github.run_id }}
          path: data_weather/front_qc.json
          if-no-files-found: warn
          retention-days: 90

      # Unica pubblicazione: commit orfano su gh-pages da un repository
      # temporaneo isolato. Nessuna storia accumulata (la dimensione resta
      # quella dell'ultimo snapshot) e nessun push di dati su main.
      - name: Deploy dati su branch gh-pages
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d data_weather ] || [ -z "$(ls -A data_weather)" ]; then
            echo "data_weather assente o vuota: interrompo per non pubblicare un sito senza dati."
            exit 1
          fi

          STAGE=$(mktemp -d)
          cp index.html "$STAGE"/
          cp meteograms.html "$STAGE"/
          cp radar.html "$STAGE"/
          cp point_bulletin.js "$STAGE"/
          touch "$STAGE"/.nojekyll
          cp -r data_weather "$STAGE"/data_weather

          cd "$STAGE"
          git init -q -b gh-pages
          git config user.name "MeteoBot"
          git config user.email "bot@meteo.local"
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 60
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -q -m "Pubblica dati meteo $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3; do
            if git push --force origin gh-pages; then
              echo "Deploy gh-pages completato (tentativo $attempt)."
              exit 0
            fi
            echo "Push gh-pages fallito (tentativo $attempt), riprovo tra 20s..."
            sleep 20
          done
          exit 1
