name: Update Meteo Data

on:
  schedule:
    - cron: '35 1,13 * * *'
    - cron: '20 3,15 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/process_data.py'
      - 'scripts/archive_run.py'
      - 'scripts/import_icon2i_history.py'
      - 'scripts/collect_observations.py'
      - 'scripts/verify_archive.py'
      - 'scripts/front_analysis.py'
      - 'scripts/front_analysis_v12.py'
      - 'scripts/front_consensus.py'
      - 'scripts/front_impact_validation.py'
      - 'scripts/front_detection.py'
      - 'scripts/front_engine.py'
      - 'scripts/front_locator.py'
      - 'scripts/front_physics.py'
      - 'scripts/front_ridge.py'
      - 'scripts/front_sections.py'
      - 'scripts/front_support.py'
      - 'scripts/front_topology.py'
      - 'scripts/front_occlusion.py'
      - 'scripts/front_tracking.py'
      - 'scripts/front_benchmark.py'
      - 'scripts/calibrate_thresholds.py'
      - 'scripts/climatology_thresholds.json'
      - 'scripts/thermodynamics.py'
      - 'meteo_analysis/**'
      - 'benchmarks/fronts/**'
      - 'scripts/tests/**'
      - 'index.html'
      - 'meteograms.html'
      - 'radar.html'
      - 'forecast-cache.js'
      - 'modern-ui.js'
      - 'modern-ui.css'
      - 'meteograms-ui.css'
      - 'point_bulletin.js'
      - 'local_downscaling.js'
      - 'scripts/build_local_downscaling.py'
      - 'requirements.txt'
      - '.github/workflows/update_meteo.yml'
      - '.github/workflows/import_icon2i_history.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/process_data.py'
      - 'scripts/archive_run.py'
      - 'scripts/import_icon2i_history.py'
      - 'scripts/collect_observations.py'
      - 'scripts/verify_archive.py'
      - 'scripts/front_analysis.py'
      - 'scripts/front_analysis_v12.py'
      - 'scripts/front_consensus.py'
      - 'scripts/front_impact_validation.py'
      - 'scripts/front_detection.py'
      - 'scripts/front_engine.py'
      - 'scripts/front_locator.py'
      - 'scripts/front_physics.py'
      - 'scripts/front_ridge.py'
      - 'scripts/front_sections.py'
      - 'scripts/front_support.py'
      - 'scripts/front_topology.py'
      - 'scripts/front_occlusion.py'
      - 'scripts/front_tracking.py'
      - 'scripts/front_benchmark.py'
      - 'scripts/calibrate_thresholds.py'
      - 'scripts/climatology_thresholds.json'
      - 'scripts/thermodynamics.py'
      - 'meteo_analysis/**'
      - 'benchmarks/fronts/**'
      - 'scripts/tests/**'
      - 'index.html'
      - 'meteograms.html'
      - 'radar.html'
      - 'forecast-cache.js'
      - 'modern-ui.js'
      - 'modern-ui.css'
      - 'meteograms-ui.css'
      - 'point_bulletin.js'
      - 'local_downscaling.js'
      - 'scripts/build_local_downscaling.py'
      - 'requirements.txt'
      - '.github/workflows/update_meteo.yml'
      - '.github/workflows/import_icon2i_history.yml'

concurrency:
  group: meteo-update-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Che cosa ha toccato questo push? Una modifica a un CSS non ha bisogno di
  # riscaricare 1,7 GB di GRIB e rifare l'analisi dei fronti su 73 scadenze:
  # i dati su gh-pages sono gia' quelli giusti e verrebbero ripubblicati
  # identici. Misurato sul run 1199: 30 dei 32 minuti erano process_data.py.
  #
  # La classificazione sbaglia sempre dalla parte prudente. Qualunque dubbio
  # -- un push senza base nota, un confronto troncato, una chiamata fallita,
  # un file che non e' nell'elenco -- vale "no", cioe' pipeline completa.
  # L'errore costoso e' pubblicare l'interfaccia saltando un ricalcolo che
  # serviva; aspettare mezz'ora di troppo si nota e basta.
  ambito:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      solo_interfaccia: ${{ steps.esame.outputs.solo_interfaccia }}
    steps:
      - name: Classifica le modifiche del push
        id: esame
        uses: actions/github-script@v7
        with:
          script: |
            // Nessun checkout: basta il confronto fra i due commit, che
            // l'API restituisce in una chiamata sola.
            const INTERFACCIA = new Set([
              'index.html', 'meteograms.html', 'radar.html',
              'forecast-cache.js', 'modern-ui.js', 'modern-ui.css',
              'meteograms-ui.css', 'point_bulletin.js', 'local_downscaling.js'
            ]);
            function rapido(nome) {
              if (INTERFACCIA.has(nome)) return true;
              // Il fondo cartografico e' statico e viene pubblicato com'e'.
              if (nome.startsWith('data_base/')) return true;
              // Le prove in JavaScript girano anche nella corsia rapida.
              // Quelle in Python no: hanno bisogno di eccodes, netcdf e
              // dell'intero requirements, che la corsia rapida non installa.
              if (nome.startsWith('scripts/tests/') && nome.endsWith('.js')) return true;
              return false;
            }
            async function decidi() {
              if (context.eventName !== 'push') {
                core.info('Evento ' + context.eventName + ': pipeline completa.');
                return false;
              }
              const prima = context.payload.before;
              if (!prima || /^0+$/.test(prima)) {
                core.info('Push senza base nota: pipeline completa.');
                return false;
              }
              let confronto;
              try {
                confronto = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner, repo: context.repo.repo,
                  basehead: prima + '...' + context.sha
                });
              } catch (errore) {
                core.info('Confronto non riuscito (' + errore.message + '): pipeline completa.');
                return false;
              }
              // Un confronto troncato non elenca tutto, e quello che non si
              // vede potrebbe essere proprio il file che impone il ricalcolo.
              // L'API taglia l'elenco a 300 file; 'ahead' e 'identical' sono
              // gli unici stati in cui il confronto descrive davvero cosa e'
              // stato aggiunto (dopo un push forzato i rami divergono e il
              // confronto non dice piu' cosa e' cambiato rispetto a prima).
              if (!Array.isArray(confronto.data.files)) {
                core.info('Elenco dei file assente: pipeline completa.');
                return false;
              }
              if (confronto.data.files.length >= 300) {
                core.info('Elenco dei file troncato a 300: pipeline completa.');
                return false;
              }
              if (confronto.data.status !== 'ahead' && confronto.data.status !== 'identical') {
                core.info('Confronto in stato ' + confronto.data.status + ': pipeline completa.');
                return false;
              }
              const nomi = confronto.data.files.map((f) => f.filename);
              if (!nomi.length) {
                core.info('Nessun file modificato: pipeline completa.');
                return false;
              }
              const fuori = nomi.filter((n) => !rapido(n));
              core.info('File modificati: ' + nomi.join(', '));
              if (fuori.length) {
                core.info('Fuori dalla corsia rapida: ' + fuori.join(', '));
                return false;
              }
              return true;
            }
            const esito = await decidi();
            core.setOutput('solo_interfaccia', String(esito));
            core.info(esito
              ? 'Solo interfaccia: pubblico riusando i dati gia\' su gh-pages.'
              : 'Pipeline completa.');

  # La corsia rapida. Prova l'interfaccia e ripubblica i soli file statici
  # sopra il commit che gia' sta su gh-pages, quindi i dati meteo restano
  # esattamente quelli dell'ultimo run senza essere ricalcolati ne' ricaricati.
  pubblica_interfaccia:
    needs: ambito
    if: github.event_name == 'push' && needs.ambito.outputs.solo_interfaccia == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Niente apt, niente pip: le prove dell'interfaccia sono tutte in
      # JavaScript e girano sul Node gia' presente nel runner. E' questa la
      # ragione per cui la corsia rapida dura secondi invece di minuti.
      - name: Prove dell'interfaccia
        run: |
          set -e
          for prova in scripts/tests/test_*.js; do
            echo "--- $prova"
            node "$prova"
          done

      - name: Pubblica i file statici su gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const percorsi = [
              'index.html', 'meteograms.html', 'radar.html',
              'point_bulletin.js', 'local_downscaling.js',
              'forecast-cache.js', 'modern-ui.js', 'modern-ui.css',
              'meteograms-ui.css'
            ];
            for (const nome of fs.readdirSync('data_base')) {
              percorsi.push('data_base/' + nome);
            }
            const owner = context.repo.owner, repo = context.repo.repo;

            // I blob si caricano una volta sola: non dipendono dal commit su
            // cui si innesta l'albero, quindi un eventuale nuovo tentativo
            // non li ricarica.
            const voci = [];
            for (const percorso of percorsi) {
              const blob = await github.rest.git.createBlob({ owner, repo,
                content: fs.readFileSync(percorso).toString('base64'),
                encoding: 'base64' });
              voci.push({ path: percorso, mode: '100644', type: 'blob', sha: blob.data.sha });
            }

            // Un run dei dati puo' aver forzato gh-pages mentre lavoravamo.
            // In quel caso il nostro genitore non e' piu' la punta e
            // updateRef rifiuta: si rilegge il ramo e si riprova, senza mai
            // forzare -- forzare qui vorrebbe dire cancellare i dati appena
            // pubblicati da quel run.
            for (let tentativo = 1; tentativo <= 3; tentativo += 1) {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/gh-pages' });
              const padre = ref.data.object.sha;
              const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: padre });

              // Guardia: si pubblica sopra i dati, mai al posto loro. Se il
              // ramo non porta data_weather, l'innesto darebbe un sito di
              // sola interfaccia senza previsioni.
              const radice = await github.rest.git.getTree({ owner, repo,
                tree_sha: commit.data.tree.sha });
              if (!radice.data.tree.some((v) => v.path === 'data_weather')) {
                core.setFailed('gh-pages non contiene data_weather: serve un run completo.');
                return;
              }

              const albero = await github.rest.git.createTree({ owner, repo,
                base_tree: commit.data.tree.sha, tree: voci });
              if (albero.data.sha === commit.data.tree.sha) {
                core.info('I file pubblicati sono gia\' identici: niente da fare.');
                return;
              }
              const nuovo = await github.rest.git.createCommit({ owner, repo,
                message: 'Aggiorna interfaccia ' + new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
                tree: albero.data.sha, parents: [padre] });
              try {
                await github.rest.git.updateRef({ owner, repo, ref: 'heads/gh-pages',
                  sha: nuovo.data.sha });
                core.info('Interfaccia pubblicata su gh-pages (tentativo ' + tentativo + ').');
                return;
              } catch (errore) {
                core.info('gh-pages e\' cambiata sotto di noi (tentativo ' + tentativo
                  + '): ' + errore.message);
                await new Promise((r) => setTimeout(r, 4000));
              }
            }
            core.setFailed('Non sono riuscito ad aggiornare gh-pages: riprovare o lanciare un run completo.');

  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev libnetcdf-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verifica nucleo scientifico dei fronti
        run: |
          python scripts/tests/test_front_engine.py
          python scripts/tests/test_front_engine_graft.py
          python scripts/tests/test_front_continuity.py
          python scripts/tests/test_front_locator.py
          python scripts/tests/test_front_detection.py
          python scripts/tests/test_front_consensus.py
          python scripts/tests/test_front_impact_validation.py
          python scripts/tests/test_front_physics.py
          python scripts/tests/test_front_tracking.py
          python scripts/tests/test_front_ridge.py
          python scripts/tests/test_front_sections.py
          python scripts/tests/test_front_support.py
          python scripts/tests/test_front_topology.py
          python scripts/tests/test_front_occlusion.py
          python scripts/tests/test_thermodynamics.py
          python scripts/tests/test_climatology.py
          python scripts/tests/test_front_analysis_status.py
          python scripts/tests/test_front_benchmark.py
          python scripts/tests/test_convection.py
          python scripts/tests/test_storms.py
          python scripts/tests/test_nlg.py
          python scripts/tests/test_synoptic_engine.py
          python scripts/tests/test_meteohub.py
          python scripts/tests/test_run_selection.py
          python scripts/tests/test_process_exit.py
          node scripts/tests/test_forecast_ui.js
          node scripts/tests/test_map_downscaling.js
          python scripts/tests/test_verification.py
          python scripts/tests/test_historical_archive.py
          python scripts/tests/test_hazards.py
          python scripts/tests/test_meteograms.py
          python scripts/tests/test_ml_fronts.py
          python scripts/tests/test_neighbourhood.py
          python scripts/tests/test_vertical_profile.py
          python scripts/tests/test_local_downscaling.py
          node scripts/tests/test_local_downscaling.js
          node scripts/tests/test_point_bulletin.js
          node scripts/tests/test_pressure_centers.js
          node scripts/tests/test_map_3d.js
          node scripts/tests/test_blitzortung.js
          node scripts/tests/test_lampo.js
          node scripts/tests/test_workflow.js

  build:
    needs: ambito
    # !cancelled() e non il solo needs: se la classificazione si rompe, il
    # suo esito e' vuoto -- quindi diverso da 'true' -- e la pipeline
    # completa parte lo stesso. Senza questo, un guasto nel job che decide
    # farebbe saltare in silenzio i quattro aggiornamenti dei dati al giorno.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.ambito.outputs.solo_interfaccia != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev libnetcdf-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # I trasferimenti git dei runner verso questo repo si sono congelati
      # in passato senza timeout (git pull fermo 46 minuti senza output).
      # Con low-speed limit un trasferimento stagnante viene abortito dopo
      # 60 secondi, cosi' i tentativi di retry possono partire davvero.
      - name: Configura timeout git anti-stallo
        run: |
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 60

      - name: Verifica nucleo scientifico dei fronti
        run: |
          python scripts/tests/test_front_engine.py
          python scripts/tests/test_front_engine_graft.py
          python scripts/tests/test_front_continuity.py
          python scripts/tests/test_front_locator.py
          python scripts/tests/test_front_detection.py
          python scripts/tests/test_front_consensus.py
          python scripts/tests/test_front_impact_validation.py
          python scripts/tests/test_front_physics.py
          python scripts/tests/test_front_tracking.py
          python scripts/tests/test_front_ridge.py
          python scripts/tests/test_front_sections.py
          python scripts/tests/test_front_support.py
          python scripts/tests/test_front_topology.py
          python scripts/tests/test_front_occlusion.py
          python scripts/tests/test_thermodynamics.py
          python scripts/tests/test_climatology.py
          python scripts/tests/test_front_analysis_status.py
          python scripts/tests/test_front_benchmark.py
          python scripts/tests/test_convection.py
          python scripts/tests/test_storms.py
          python scripts/tests/test_nlg.py
          python scripts/tests/test_synoptic_engine.py
          python scripts/tests/test_meteohub.py
          python scripts/tests/test_run_selection.py
          python scripts/tests/test_process_exit.py
          node scripts/tests/test_forecast_ui.js
          node scripts/tests/test_map_downscaling.js
          python scripts/tests/test_verification.py
          python scripts/tests/test_historical_archive.py
          python scripts/tests/test_hazards.py
          python scripts/tests/test_meteograms.py
          python scripts/tests/test_ml_fronts.py
          python scripts/tests/test_neighbourhood.py
          python scripts/tests/test_vertical_profile.py
          python scripts/tests/test_local_downscaling.py
          node scripts/tests/test_local_downscaling.js
          node scripts/tests/test_point_bulletin.js
          node scripts/tests/test_pressure_centers.js
          node scripts/tests/test_map_3d.js
          node scripts/tests/test_blitzortung.js
          node scripts/tests/test_lampo.js
          node scripts/tests/test_workflow.js

      - name: Run ICON-2I processor
        env:
          # Storage is intentionally opt-in.  With no bucket secret the
          # processor continues in verified sample-only mode; with a bucket it
          # fails closed on any raw-GRIB upload or checksum mismatch.
          ICON_ARCHIVE_MODE: ${{ secrets.ICON_ARCHIVE_S3_BUCKET != '' && 'raw' || 'off' }}
          ICON_ARCHIVE_S3_BUCKET: ${{ secrets.ICON_ARCHIVE_S3_BUCKET }}
          ICON_ARCHIVE_S3_ENDPOINT: ${{ secrets.ICON_ARCHIVE_S3_ENDPOINT }}
          ICON_ARCHIVE_S3_REGION: ${{ secrets.ICON_ARCHIVE_S3_REGION }}
          ICON_ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.ICON_ARCHIVE_S3_ACCESS_KEY_ID }}
          ICON_ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.ICON_ARCHIVE_S3_SECRET_ACCESS_KEY }}
          ICON_ARCHIVE_S3_SESSION_TOKEN: ${{ secrets.ICON_ARCHIVE_S3_SESSION_TOKEN }}
          ICON_ARCHIVE_S3_PREFIX: ${{ secrets.ICON_ARCHIVE_S3_PREFIX }}
        run: python scripts/process_data.py

      - name: Calcola downscaling locale da osservazioni e ICON
        run: python scripts/build_local_downscaling.py --data-dir data_weather

      - name: Prepara archivio verificabile del run
        run: |
          python scripts/archive_run.py \
            --data-dir data_weather \
            --output-dir verification_archive

      - name: Conserva campioni previsione-osservazione
        uses: actions/upload-artifact@v4
        with:
          name: icon2i-verification-${{ github.run_id }}
          path: verification_archive/
          if-no-files-found: error
          retention-days: 90

      - name: Archivia diagnostica QC dei fronti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-qc-${{ github.run_id }}
          path: data_weather/front_qc.json
          if-no-files-found: warn
          retention-days: 90

      # Unica pubblicazione: commit orfano su gh-pages da un repository
      # temporaneo isolato. Nessuna storia accumulata (la dimensione resta
      # quella dell'ultimo snapshot) e nessun push di dati su main.
      - name: Deploy dati su branch gh-pages
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d data_weather ] || [ -z "$(ls -A data_weather)" ]; then
            echo "data_weather assente o vuota: interrompo per non pubblicare un sito senza dati."
            exit 1
          fi

          STAGE=$(mktemp -d)
          cp index.html "$STAGE"/
          cp meteograms.html "$STAGE"/
          cp radar.html "$STAGE"/
          cp point_bulletin.js "$STAGE"/
          cp local_downscaling.js "$STAGE"/
          cp forecast-cache.js modern-ui.js modern-ui.css meteograms-ui.css "$STAGE"/
          touch "$STAGE"/.nojekyll
          cp -r data_weather "$STAGE"/data_weather
          # Il fondo cartografico e' statico e sta nel repository, non fra i
          # dati generati: senza questa copia la pagina pubblicata resterebbe
          # senza coste, confini e toponimi.
          cp -r data_base "$STAGE"/data_base

          cd "$STAGE"
          git init -q -b gh-pages
          git config user.name "MeteoBot"
          git config user.email "bot@meteo.local"
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 60
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -q -m "Pubblica dati meteo $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3; do
            if git push --force origin gh-pages; then
              echo "Deploy gh-pages completato (tentativo $attempt)."
              exit 0
            fi
            echo "Push gh-pages fallito (tentativo $attempt), riprovo tra 20s..."
            sleep 20
          done
          exit 1


