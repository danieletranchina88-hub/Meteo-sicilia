name: Train Front U-Net Pilot

on:
  workflow_dispatch:
    inputs:
      sample_limit:
        description: "Numero di analisi DWD/ERA5 distribuite nel 2015-2020"
        required: true
        default: "120"
      stride_days:
        description: "Passo di campionamento cronologico in giorni"
        required: true
        default: "18"
  push:
    branches: [main]
    paths:
      - '.github/workflows/train_front_unet_pilot.yml'
      - 'configs/front_unet_pilot.json'

permissions:
  contents: read

concurrency:
  group: front-unet-real-data-pilot
  cancel-in-progress: false

jobs:
  train-cpu-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
      SAMPLE_LIMIT: ${{ inputs.sample_limit || '120' }}
      STRIDE_DAYS: ${{ inputs.stride_days || '18' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ml-training.txt
            requirements-deep-learning.txt
      - name: Install scientific and PyTorch dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ml-training.txt
      - name: Build real DWD and ERA5 pilot dataset
        run: |
          python scripts/prepare_front_unet_data.py \
            --start 2015-01-01 \
            --end 2020-12-31 \
            --stride "$STRIDE_DAYS" \
            --limit "$SAMPLE_LIMIT" \
            --output training_data/front_unet_pilot
      - name: Validate every dataset shard
        run: |
          python scripts/validate_deep_learning_data.py \
            training_data/front_unet_pilot/manifest.json
      - name: Train candidate without operational promotion
        run: |
          python scripts/train_front_unet.py \
            training_data/front_unet_pilot/manifest.json \
            --config configs/front_unet_pilot.json \
            --output models/candidates/front_unet_pilot.pt
      - name: Export auditable checkpoint report
        run: |
          python scripts/report_deep_learning_checkpoint.py \
            models/candidates/front_unet_pilot.pt \
            --output reports/front_unet_pilot.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: front-unet-real-data-pilot-${{ github.run_id }}
          path: |
            training_data/front_unet_pilot/
            models/candidates/front_unet_pilot.pt
            reports/front_unet_pilot.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
