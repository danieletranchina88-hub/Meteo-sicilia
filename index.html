<!DOCTYPE html>
<html>
<head>
  <title>Sicilia MeteoHub - ICON-2I GPS</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-velocity@1.8.0/dist/leaflet-velocity.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; color: #ddd; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #1a1a1a; }

    /* UI - HEADER */
    #model-info { position: absolute; top: 15px; left: 70px; z-index: 5000; pointer-events: none; text-shadow: 0 2px 4px #000; }
    #model-title { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
    #model-sub { font-size: 11px; color: #aaa; font-family: monospace; }
    #coords-display { position: absolute; bottom: 5px; left: 100px; z-index: 5000; pointer-events: none; font-family: monospace; font-size: 10px; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; }

    /* INFO BOX */
    #info-box { position: absolute; top: 15px; left: 20px; z-index: 5000; pointer-events: none; display: flex; align-items: center; gap: 15px; }
    #val-group { display: flex; flex-direction: column; margin-top: 40px; }
    #val-display { font-size: 3.2em; font-weight: 900; color: #fff; text-shadow: 0 2px 10px #000; line-height: 0.9; }
    #unit-display { font-size: 1.1em; color: #aaa; font-weight: 700; margin-top: 4px; }

    /* UI CONTROLS */
    #ui-container { position: absolute; top: 10px; right: 10px; z-index: 5000; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    .panel { background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 15px #000; }
    .toggle { width: 170px; display:flex; align-items:center; justify-content:space-between; padding: 10px 12px; margin: 4px 0; background: rgba(255,255,255,0.05); border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; transition: 0.2s; border: 1px solid transparent; color: #ccc; }
    .toggle.active { background: #0077ff !important; color: #fff !important; }
    
    /* BOTTONE GPS */
    .gps-btn { width: 170px; padding: 12px; border-radius: 8px; font-size: 13px; background: #28a745; color: white; cursor: pointer; font-weight: 800; border: none; margin-bottom: 5px; box-shadow: 0 4px 10px rgba(40,167,69,0.3); transition: 0.2s; }
    .gps-btn:active { transform: scale(0.95); background: #218838; }

    .mini { width: 170px; padding: 10px 12px; border-radius: 8px; font-size:12px; background: rgba(255,255,255,0.08); color:#fff; cursor:pointer; font-weight:800; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 5px; }
    .mini.active { background: #eee !important; color:#111 !important; }

    /* POPUP PERSONALIZZATO */
    .leaflet-popup-content-wrapper { background: rgba(30,30,30,0.95); color: white; border-radius: 12px; border: 1px solid #444; backdrop-filter: blur(5px); }
    .leaflet-popup-tip { background: rgba(30,30,30,0.95); }

    #bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(transparent, rgba(0,0,0,0.95)); display: flex; align-items: center; padding: 0 25px; z-index: 5000; }
    input[type=range] { flex-grow: 1; accent-color: #0077ff; cursor: pointer; }

    .dark-relief-tiles { filter: invert(100%) hue-rotate(180deg) brightness(0.6) contrast(1.3); }
    canvas.leaflet-layer { pointer-events: none !important; position: absolute; top: 0; left: 0; }
    canvas.leaflet-layer.scalar-layer { mix-blend-mode: screen; opacity: 0.65; }

  </style>
</head>

<body>
  <div id="model-info">
    <div id="model-title">ICON-2I <span style="color:#0077ff">2.2km</span></div>
    <div id="model-sub">LIVE GPS TRACKER | VALID: <span id="valid-time">--</span></div>
  </div>
  <div id="coords-display">LAT: --.---- LON: --.----</div>

  <div id="info-box">
    <div id="val-group"><div id="val-display">--</div><div id="unit-display">Caricamento...</div></div>
  </div>

  <div id="ui-container">
    <button class="gps-btn" onclick="getMyWeather()">📍 IL MIO METEO</button>
    
    <div class="panel">
      <button id="btn-flow" class="mini active" onclick="toggleParticles()">FLUSSO 🌬️ (ON)</button>
    </div>
    <div class="panel">
      <div class="toggle active" id="btn-wind" onclick="toggleLayer('wind')">VENTO 🧭</div>
      <div class="toggle" id="btn-temp" onclick="toggleLayer('temp')">TEMP 🌡️</div>
      <div class="toggle" id="btn-rain" onclick="toggleLayer('rain')">PIOGGIA ☔</div>
      <div class="toggle" id="btn-rh" onclick="toggleLayer('rh')">UMIDITÀ 💧</div>
      <div class="toggle" id="btn-press" onclick="toggleLayer('press')">PRESSIONE ⏲️</div>
      <div class="toggle" id="btn-cloud" onclick="toggleLayer('cloud')">NUVOLE ☁️</div>
      <div style="height:1px; background: rgba(255,255,255,0.1); margin:8px 0;"></div>
      <div class="toggle" id="btn-iso" onclick="toggleIsobars()">ISOBARE 〰️</div>
      <div class="toggle" id="btn-therm" onclick="toggleIsotherms()">ISOTERME 🌡️</div>
    </div>
  </div>

  <div id="map"></div>

  <div id="bottom-bar">
    <button id="play-btn" style="background:none; border:none; color:white; font-size:2em; cursor:pointer;" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label" style="color:white; font-weight:bold; margin-left:15px; min-width:120px;">--/-- --:--</div>
  </div>

<script>
  const DPR = window.devicePixelRatio || 1;
  const SCALAR_RES = 0.4; 
  const SICILY_BOUNDS = L.latLngBounds(L.latLng(35.0, 11.0), L.latLng(40.0, 17.5));
  
  let map, currentData = null, catalog = [], isPlaying = false;
  const selected = new Set(['wind']);
  let showIsobars = false, showIsotherms = false, particlesOn = true;
  let scalarCanvases = {}, arrowCanvas, isoCanvas, thermCanvas, userMarker;
  let velocityLayer = null;

  // PALETTE
  const WIND_COLOR_SCALE = ["#000080", "#0044ff", "#00ddff", "#00ff55", "#ffff00", "#ff6600", "#ff0000", "#ff00ff"];
  const TEMP_STOPS = [{v:-15,c:[156,218,216]},{v:-10,c:[119,198,191]},{v:-5,c:[101,172,187]},{v:0,c:[93,133,198]},{v:5,c:[89,134,76]},{v:10,c:[114,146,33]},{v:15,c:[181,165,13]},{v:20,c:[243,183,4]},{v:25,c:[238,128,17]},{v:30,c:[232,83,25]},{v:35,c:[184,64,20]},{v:40,c:[136,45,13]}];
  const RAIN_STOPS = [{v:0.0,c:[0,0,0],a:0},{v:0.6,c:[100,200,255],a:0.7},{v:1.0,c:[0,150,255],a:0.78},{v:5.0,c:[0,0,255],a:0.85},{v:10,c:[255,255,0],a:0.85},{v:30,c:[255,150,0],a:0.90},{v:50,c:[255,0,0],a:0.92}];
  const RH_STOPS = [{v:0,c:[173,85,56]},{v:30,c:[173,110,56]},{v:60,c:[56,173,121]},{v:80,c:[56,157,173]},{v:100,c:[56,70,114]}];
  const PRESS_STOPS = [{v:980,c:[0,32,96]},{v:1000,c:[0,117,146]},{v:1013,c:[182,182,182]},{v:1025,c:[163,116,67]},{v:1040,c:[111,24,64]}];
  const CLOUD_STOPS = [{v:0,c:[255,255,255],a:0},{v:50,c:[170,170,170],a:0.6},{v:100,c:[90,90,90],a:0.8}];

  // Helper per direzione vento
  function getWindDir(u, v) {
    const deg = (Math.atan2(u, v) * 180 / Math.PI + 180) % 360;
    const directions = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
    return directions[Math.round(deg / 45) % 8];
  }

  // --- FUNZIONE GEOLOCALIZZAZIONE ---
  function getMyWeather() {
    map.locate({setView: true, maxZoom: 10});
  }

  window.addEventListener('load', async () => {
    map = L.map('map', { zoomControl: false, background: '#1a1a1a' }).fitBounds(SICILY_BOUNDS);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', { className: 'dark-relief-tiles' }).addTo(map);

    map.createPane('scalarPane').style.zIndex = 200;
    map.createPane('particlePane').style.zIndex = 400; 
    map.createPane('vectorPane').style.zIndex = 600;   
    map.createPane('topPane').style.zIndex = 1000;    

    fetch('https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson')
      .then(r => r.json()).then(data => L.geoJSON(data, { pane: 'topPane', style: { color: "#fff", weight: 1.5, opacity: 0.7, fillOpacity: 0 } }).addTo(map));

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', { opacity: 0.3 }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { zIndex: 1100, opacity: 0.9 }).addTo(map);

    const mk = (z, pane, cl) => { const c = L.DomUtil.create('canvas', 'leaflet-layer '+(cl||'')); map.getPane(pane).appendChild(c); return c; };
    scalarCanvases = { wind: mk(1,'scalarPane','scalar-layer'), temp: mk(2,'scalarPane','scalar-layer'), rain: mk(3,'scalarPane','scalar-layer'), rh: mk(4,'scalarPane','scalar-layer'), press: mk(5,'scalarPane','scalar-layer'), cloud: mk(6,'scalarPane','scalar-layer') };
    arrowCanvas = mk(1, 'vectorPane'); isoCanvas = mk(2, 'vectorPane'); thermCanvas = mk(3, 'vectorPane');

    // EVENTO QUANDO TROVA LA TUA POSIZIONE
    map.on('locationfound', (e) => {
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.circleMarker(e.latlng, { radius: 8, color: '#0077ff', weight: 3, fillOpacity: 1, fillColor: 'white' }).addTo(map);
        
        // Estrai i dati meteo
        const m = currentData.meta;
        const gx = Math.round((e.latlng.lng - m.lo1) / m.dx), gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
        if(gx>=0 && gy>=0 && gx < m.nx && gy < m.ny) {
            const i = gy * m.nx + gx;
            const t = currentData.temp[i].toFixed(1);
            const r = currentData.rain[i] > 0.2 ? "🌧️ In corso" : "☀️ Assente";
            const u = currentData.wind_u.data[i], v = currentData.wind_v.data[i];
            const ws = (Math.sqrt(u**2 + v**2)*3.6).toFixed(1);
            const wd = getWindDir(u, v);
            const rh = Math.round(currentData.rh[i]);

            userMarker.bindPopup(`
                <div style="text-align:center; min-width:140px;">
                    <b style="font-size:1.2em; color:#0077ff;">REPORT POSIZIONE</b><br><hr style="border:0.5px solid #444">
                    🌡️ <b>Temp:</b> ${t}°C<br>
                    ☔ <b>Pioggia:</b> ${r}<br>
                    🌬️ <b>Vento:</b> ${ws} km/h (${wd})<br>
                    💧 <b>Umidità:</b> ${rh}%
                </div>
            `).openPopup();
        }
    });

    await loadCatalog();
    map.on('moveend zoomend', redrawAll);
    map.on('mousemove', (e) => {
        document.getElementById('coords-display').innerText = `LAT: ${e.latlng.lat.toFixed(4)} LON: ${e.latlng.lng.toFixed(4)}`;
        onPick(e);
    });
  });

  async function loadCatalog() {
    const r = await fetch('data_weather/catalog.json?t=' + Date.now());
    catalog = await r.json();
    document.getElementById('time-slider').max = catalog.length - 1;
    document.getElementById('time-slider').oninput = (e) => loadStep(parseInt(e.target.value));
    await loadStep(0);
  }

  async function loadStep(i) {
    const r = await fetch('data_weather/' + catalog[i].file);
    currentData = await r.json();
    document.getElementById('time-label').innerText = catalog[i].label;
    document.getElementById('valid-time').innerText = catalog[i].label;
    if(currentData.press) {
        currentData.cleanPress = new Float32Array(currentData.press.length);
        for(let j=0; j<currentData.press.length; j++) {
            let v = currentData.press[j]; if(v > 2000) v /= 100;
            currentData.cleanPress[j] = (!v || v < 850) ? 1013 : v;
        }
    }
    redrawAll();
  }

  function redrawAll() {
    if (!currentData) return;
    const size = map.getSize(), panePos = map.containerPointToLayerPoint([0, 0]);
    [...Object.values(scalarCanvases), arrowCanvas, isoCanvas, thermCanvas].forEach(c => {
        c.width = size.x * DPR; c.height = size.y * DPR;
        c.style.width = size.x + 'px'; c.style.height = size.y + 'px';
        L.DomUtil.setPosition(c, panePos);
    });
    drawSmoothScalar();
    drawWindArrows();
    if(showIsobars) drawContours("iso");
    if(showIsotherms) drawContours("therm");
    updateParticles();
  }

  function drawSmoothScalar() {
    const m = currentData.meta, size = map.getSize();
    const w = Math.ceil(size.x * SCALAR_RES), h = Math.ceil(size.y * SCALAR_RES);

    ['wind','temp','rain','rh','press','cloud'].forEach(l => {
        const c = scalarCanvases[l], ctx = c.getContext('2d');
        ctx.clearRect(0,0,c.width,c.height);
        if(!selected.has(l)) return;

        const img = ctx.createImageData(w, h), d = img.data;
        let arr = (l==='cloud'?(currentData.cloud||currentData.cld):currentData[l]);

        for(let y=0; y<h; y++) {
            for(let x=0; x<w; x++) {
                const ll = map.containerPointToLatLng([x/SCALAR_RES, y/SCALAR_RES]);
                const gx = (ll.lng-m.lo1)/m.dx, gy = (m.la1-ll.lat)/m.dy;
                const idx = (y*w + x)*4;
                if(gx<0||gy<0||gx>m.nx-1||gy>m.ny-1) continue;

                const x0=gx|0, y0=gy|0, fx=gx-x0, fy=gy-y0;
                const i00=y0*m.nx+x0, i10=Math.min(i00+1, m.nx*m.ny-1);
                
                let val, col;
                if(l==='wind'){
                    const sp = Math.sqrt(currentData.wind_u.data[i00]**2 + currentData.wind_v.data[i00]**2);
                    const rgb = vividWindColor(sp); col={...rgb, a:Math.min(sp/20, 0.3)};
                } else {
                    val = arr[i00];
                    if(l==='press' && val>2000) val/=100;
                    if((l==='rain'&&val<0.1)||(l==='cloud'&&val<5)) continue;
                    const res = interpStops(val, l==='temp'?TEMP_STOPS:l==='rain'?RAIN_STOPS:l==='rh'?RH_STOPS:l==='press'?PRESS_STOPS:CLOUD_STOPS);
                    col={r:res.r, g:res.g, b:res.b, a:res.a};
                }
                d[idx]=col.r; d[idx+1]=col.g; d[idx+2]=col.b; d[idx+3]=col.a*255;
            }
        }
        const tempC = document.createElement('canvas'); tempC.width=w; tempC.height=h;
        tempC.getContext('2d').putImageData(img,0,0);
        ctx.setTransform(DPR,0,0,DPR,0,0);
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(tempC, 0, 0, size.x, size.y);
    });
  }

  function drawWindArrows() {
    if(!selected.has('wind')) return;
    const ctx = arrowCanvas.getContext('2d');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = currentData.meta; const z = map.getZoom();
    const stride = z >= 11 ? 3 : 5;
    for(let y=0; y<m.ny; y+=stride) {
        for(let x=0; x<m.nx; x+=stride) {
            const i = y*m.nx + x;
            const u = currentData.wind_u.data[i], v = currentData.wind_v.data[i], sp = Math.sqrt(u*u+v*v);
            if(sp < 2) continue;
            const p = map.latLngToContainerPoint([m.la1-y*m.dy, m.lo1+x*m.dx]);
            const ang = Math.atan2(-v, u); const len = Math.min(sp * 2.5, 45);
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
            ctx.strokeStyle = "rgba(0,0,0,0.8)"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(-len/2, 0); ctx.lineTo(len/2, 0); ctx.lineTo(len/2-9, -6); ctx.moveTo(len/2,0); ctx.lineTo(len/2-9, 6); ctx.stroke();
            const c = vividWindColor(sp); ctx.strokeStyle = `rgb(${c.r},${c.g},${c.b})`; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
        }
    }
  }

  function drawContours(type) {
    const ctx = (type==="iso") ? isoCanvas.getContext('2d') : thermCanvas.getContext('2d');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = currentData.meta, data = (type==="iso") ? currentData.cleanPress : currentData.temp;
    const contours = d3.contours().size([m.nx, m.ny]).thresholds((type==="iso") ? d3.range(960, 1050, 2) : d3.range(-20, 50, 5))(data);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
    contours.forEach(c => {
        c.coordinates.forEach(poly => poly.forEach(ring => {
            ctx.beginPath(); let pts = [];
            ring.forEach((p, j) => {
                const pt = map.latLngToContainerPoint([m.la1 - p[1]*m.dy, m.lo1 + p[0]*m.dx]);
                if(j===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
                pts.push(pt);
            });
            ctx.stroke();
            if(pts.length > 50 && type==="iso") {
                const mid = pts[Math.floor(pts.length/2)];
                ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(mid.x-14, mid.y-8, 28, 16);
                ctx.fillStyle = "#fff"; ctx.font = "bold 10px Arial"; ctx.textAlign="center";
                ctx.fillText(Math.round(c.value), mid.x, mid.y+4);
            }
        }));
    });
  }

  function updateParticles() {
    if (velocityLayer) map.removeLayer(velocityLayer);
    if (!particlesOn) return;
    velocityLayer = L.velocityLayer({
        displayValues: false, data: [currentData.wind_u, currentData.wind_v],
        maxVelocity: 25, velocityScale: 0.008, particleMultiplier: 1/400, 
        lineWidth: 2, frameRate: 60, opacity: 0.85, colorScale: ["#fff"], pane: 'particlePane'
    }).addTo(map);
  }

  function onPick(e){
    if(!currentData) return;
    const m = currentData.meta;
    const gx = Math.round((e.latlng.lng - m.lo1) / m.dx), gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
    if(gx<0 || gy<0 || gx>=m.nx || gy>=m.ny) return;
    const i = gy * m.nx + gx;
    let val = "--", unit = "";
    if(selected.has('temp')) { val = currentData.temp[i].toFixed(1); unit = "°C"; }
    else if(selected.has('wind')) { val = (Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2)*3.6).toFixed(1); unit = "km/h"; }
    else if(selected.has('rain')) { val = currentData.rain[i].toFixed(1); unit = "mm"; }
    else if(selected.has('rh')) { val = Math.round(currentData.rh[i]); unit = "%"; }
    else if(selected.has('press')) { val = Math.round(currentData.cleanPress[i]); unit = "hPa"; }
    else if(selected.has('cloud')) { val = Math.round((currentData.cloud||currentData.cld)[i]); unit = "%"; }
    document.getElementById('val-display').innerText = val; document.getElementById('unit-display').innerText = unit;
  }

  window.toggleLayer = (l) => {
    if(selected.has(l)) selected.delete(l); else selected.add(l);
    updateUI(); redrawAll();
  };

  window.toggleIsobars = () => { showIsobars = !showIsobars; updateUI(); redrawAll(); };
  window.toggleIsotherms = () => { showIsotherms = !showIsotherms; updateUI(); redrawAll(); };
  window.toggleParticles = () => { particlesOn = !particlesOn; updateUI(); redrawAll(); };

  function updateUI(){
    ['wind','temp','rain','rh','press','cloud'].forEach(l => {
        const btn = document.getElementById('btn-' + l);
        if(selected.has(l)) btn.classList.add('active'); else btn.classList.remove('active');
    });
    if(showIsobars) document.getElementById('btn-iso').classList.add('active'); else document.getElementById('btn-iso').classList.remove('active');
    if(showIsotherms) document.getElementById('btn-therm').classList.add('active'); else document.getElementById('btn-therm').classList.remove('active');
    if(particlesOn) document.getElementById('btn-flow').classList.add('active'); else document.getElementById('btn-flow').classList.remove('active');
  }

  function togglePlay() { isPlaying = !isPlaying; document.getElementById('play-btn').innerText = isPlaying ? "❚❚" : "►"; if(isPlaying) playLoop(); }
  function playLoop() { if(!isPlaying) return; const s = document.getElementById('time-slider'); let v = parseInt(s.value) + 1; if(v >= catalog.length) v = 0; s.value = v; loadStep(v); setTimeout(playLoop, 950); }
</script>
</body>
</html>
