<!DOCTYPE html>
<html lang="it">
<head>
  <title>Italia MeteoHub Pro - Synoptic GPU</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    body { margin: 0; background: #0a0a0a; font-family: 'Segoe UI', Roboto, sans-serif; color: #ddd; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #0a0a0a; }

    #model-info { position: absolute; top: 15px; left: 20px; z-index: 5000; pointer-events: none; }
    #model-title { font-size: 18px; font-weight: 900; color: #fff; text-transform: uppercase; }
    #model-sub { font-size: 11px; color: #00eaff; font-family: monospace; }
    
    #info-box { position: absolute; top: 55px; left: 20px; z-index: 5000; pointer-events: none; text-shadow: 0px 2px 10px rgba(0,0,0,1); }
    #val-display { font-size: 3.5em; font-weight: 950; color: #fff; line-height: 0.8; }
    #unit-display { font-size: 1.1em; color: #ccc; font-weight: 700; margin-left: 5px; }

    #ui-container { position: absolute; top: 10px; right: 10px; z-index: 5000; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; max-height: 85vh; overflow-y: auto; scrollbar-width: none; }
    .panel { background: rgba(20,20,20,0.85); backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .toggle { width: 150px; display:flex; align-items:center; justify-content:space-between; padding: 12px 10px; margin: 4px 0; background: rgba(255,255,255,0.04); border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 11px; color: #bbb; border: 1px solid transparent; transition: 0.2s; }
    .toggle.active { background: #0077ff !important; color: #fff !important; }
    .gps-btn { width: 170px; padding: 14px; border-radius: 8px; font-size: 13px; background: #23a045; color: white; cursor: pointer; font-weight: 900; border: none; margin-bottom: 5px; }
    
    #bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to top, rgba(0,0,0,1), transparent); display: flex; align-items: center; padding: 0 15px; z-index: 5000; }
    input[type=range] { flex-grow: 1; accent-color: #0077ff; cursor: pointer; }
    
    #loading-indicator { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 1px solid #0077ff; color: white; padding: 15px 25px; border-radius: 10px; font-weight: bold; z-index: 9999; }
    #loading-indicator.active { display: block; }
  </style>
</head>
<body>
  <div id="model-info"><div id="model-title">ITALIA METEOHUB <span style="color:#00eaff">ICON-2I PRO</span></div><div id="model-sub">LIVE SYNC | VALID: <span id="valid-time">--</span></div></div>
  <div id="info-box"><div id="val-display">--</div><div id="unit-display">Clicca la mappa</div></div>
  <div id="loading-indicator">Elaborazione...</div>
  
  <div id="ui-container">
    <button class="gps-btn" onclick="getMyWeather()">📍 IL MIO METEO</button>
    <div class="panel">
        <div class="toggle active" id="btn-temp" onclick="toggleLayer('temp')">TEMPERATURA 🌡️</div>
        <div class="toggle" id="btn-feels" onclick="toggleLayer('feels')">PERCEPITA 🤒</div>
        <div class="toggle" id="btn-wind" onclick="toggleLayer('wind')">VENTO 🧭</div>
        <div class="toggle" id="btn-rain" onclick="toggleLayer('rain')">PIOGGIA ☔</div>
        <div class="toggle" id="btn-cloud" onclick="toggleLayer('cloud')">NUVOLE ☁️</div>
        <div class="toggle" id="btn-rh" onclick="toggleLayer('rh')">UMIDITÀ 💧</div>
        <div class="toggle" id="btn-press" onclick="toggleLayer('press')">PRESSIONE ⏲️</div>
        <div style="height:1px; background: rgba(255,255,255,0.1); margin:8px 0;"></div>
        <div class="toggle" onclick="alert('In arrivo: Isobare e Particelle Vettoriali')" style="opacity:0.4">AVANZATE 🚀</div>
    </div>
  </div>

  <div id="map"></div>
  
  <div id="bottom-bar">
    <button id="play-btn" style="background:none; border:none; color:white; font-size:2.2em; cursor:pointer;" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label" style="color:white; font-weight:bold; margin-left:15px; font-family: monospace; min-width: 100px;">--/-- --:--</div>
  </div>

<script>
  const WIND_BG_STOPS = [{v:0, c:[30,30,35], a:0.6}, {v:15, c:[0,120,160], a:0.75}, {v:30, c:[0,180,140], a:0.8}, {v:70, c:[220,160,0], a:0.9}, {v:120, c:[180,0,40], a:0.95}];
  const TEMP_STOPS = [{v:-20,c:[115,0,171]},{v:-10,c:[0,43,161]},{v:0,c:[0,217,255]},{v:10,c:[51,184,51]},{v:20,c:[255,242,0]},{v:25,c:[255,166,0]},{v:30,c:[255,64,0]},{v:35,c:[204,0,0]},{v:40,c:[128,0,34]}];
  const RAIN_STOPS = [{v:0,c:[0,0,0],a:0},{v:0.1,c:[80,160,255],a:0.6},{v:5,c:[0,50,200],a:0.85},{v:20,c:[255,200,0],a:0.95}];
  const CLOUD_STOPS = [{v:0,c:[255,255,255],a:0},{v:10,c:[200,200,220],a:0.3},{v:80,c:[150,150,170],a:0.85}];
  const RH_STOPS = [{v:0,c:[160,80,40],a:0.8},{v:40,c:[180,180,80],a:0.8},{v:80,c:[60,160,180],a:0.8},{v:100,c:[60,40,160],a:0.9}];
  const PRESS_STOPS = [{v:980,c:[0,100,160]},{v:1013,c:[220,220,220]},{v:1030,c:[180,120,40]}];

  function getStopColor(val, stops) {
    if (val <= stops[0].v) return [...stops[0].c, (stops[0].a ?? 0.85)];
    for (let i = 0; i < stops.length - 1; i++) {
      if (val >= stops[i].v && val <= stops[i+1].v) {
        const t = (val - stops[i].v) / (stops[i+1].v - stops[i].v);
        const a1 = stops[i].a ?? 0.85, a2 = stops[i+1].a ?? 0.85;
        return [(stops[i].c[0]*(1-t)+stops[i+1].c[0]*t)|0, (stops[i].c[1]*(1-t)+stops[i+1].c[1]*t)|0, (stops[i].c[2]*(1-t)+stops[i+1].c[2]*t)|0, (a1*(1-t)+a2*t)];
      }
    }
    return [...stops[stops.length-1].c, (stops[stops.length-1].a ?? 0.85)];
  }

  // INTERPOLAZIONE BILINEARE (Fondamentale per il Mercator Warp)
  function getBilinear(arr, gx, gy, nx, ny) {
    if (!arr) return 0;
    let x = Math.floor(gx), y = Math.floor(gy);
    if(x < 0) x = 0; if(x >= nx-1) x = nx-2;
    if(y < 0) y = 0; if(y >= ny-1) y = ny-2;
    const fx = gx - x, fy = gy - y;
    const i00 = y*nx + x;
    return arr[i00]*(1-fx)*(1-fy) + arr[i00+1]*fx*(1-fy) + arr[i00+nx]*(1-fx)*fy + arr[i00+nx+1]*fx*fy;
  }

  let map, currentData = null, catalog = [], isPlaying = false;
  const selected = new Set(['temp']); 
  const dataCache = {};
  const offscreenCanvas = document.createElement('canvas');
  const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

  window.addEventListener('load', async () => {
    map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', 
        bounds: [[6.0, 35.0], [19.5, 47.5]],
        dragRotate: false, 
        pitchWithRotate: false,
        antialias: false
    });

    map.on('load', async () => {
        // CONFINI REGIONALI
        map.addSource('italy-borders', {
            type: 'geojson',
            data: 'https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson'
        });

        map.addLayer({
            id: 'borders-layer',
            type: 'line',
            source: 'italy-borders',
            paint: { 'line-color': '#ffffff', 'line-width': 0.8, 'line-opacity': 0.5 }
        });

        map.addSource('weather-source', {
            type: 'image',
            url: 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=', 
            coordinates: [[0,0], [0,0], [0,0], [0,0]]
        });

        map.addLayer({
            id: 'weather-layer',
            type: 'raster',
            source: 'weather-source',
            paint: { 'raster-opacity': 0.82, 'raster-resampling': 'linear' }
        }, 'borders-layer');

        await loadCatalog();
    });

    map.on('click', (e) => {
        if(!currentData) return;
        const m = currentData.meta;
        const gx = (e.lngLat.lng - m.lo1) / m.dx;
        const gy = (m.la1 - e.lngLat.lat) / m.dy;
        
        if(gx>=0 && gy>=0 && gx<m.nx && gy<m.ny) {
            let activeLayer = [...selected].filter(l => l !== 'wind')[0] || [...selected][0] || 'temp';
            let val = 0;
            if (activeLayer === 'wind') {
                const u = getBilinear(currentData.wind_u.data, gx, gy, m.nx, m.ny);
                const v = getBilinear(currentData.wind_v.data, gx, gy, m.nx, m.ny);
                val = Math.sqrt(u*u+v*v)*3.6;
            } else {
                let dataKey = activeLayer === 'feels' ? 'feels_like' : activeLayer;
                val = getBilinear(currentData[dataKey], gx, gy, m.nx, m.ny);
            }
            document.getElementById('val-display').innerText = val.toFixed(1);
            document.getElementById('unit-display').innerText = (activeLayer==='temp'||activeLayer==='feels') ? "°C" : (activeLayer==='wind'?"km/h" : (activeLayer==='rain'?"mm":"%"));
        }
    });
  });

  async function loadCatalog() {
    try {
        const r = await fetch('data_weather/catalog.json?t=' + Date.now());
        catalog = await r.json();
        const s = document.getElementById('time-slider');
        s.max = catalog.length - 1;
        s.oninput = (e) => loadStep(parseInt(e.target.value));
        if(catalog.length > 0) {
            let bestIdx = 0, minDiff = Infinity, now = new Date();
            catalog.forEach((item, idx) => {
                const p = item.label.split(' '), d = p[0].split('/'), t = p[1].split(':');
                const dt = new Date(now.getFullYear(), parseInt(d[1])-1, parseInt(d[0]), parseInt(t[0]), 0);
                const diff = Math.abs(now - dt);
                if(diff < minDiff) { minDiff = diff; bestIdx = idx; }
            });
            s.value = bestIdx;
            await loadStep(bestIdx);
        }
    } catch(e) { console.error("Data error"); }
  }

  async function loadStep(i) {
    if (!catalog[i]) return;
    document.getElementById('loading-indicator').classList.add('active');
    if (dataCache[i]) {
        currentData = dataCache[i];
    } else {
        const r = await fetch('data_weather/' + catalog[i].file);
        currentData = await r.json();
        if (currentData.temp && currentData.rh && currentData.wind_u) {
            const len = currentData.meta.nx * currentData.meta.ny;
            currentData.feels_like = new Float32Array(len);
            for(let j=0; j<len; j++) {
                let T = currentData.temp[j], RH = currentData.rh[j], v = Math.sqrt(currentData.wind_u.data[j]**2 + currentData.wind_v.data[j]**2);
                let e = (RH / 100.0) * 6.105 * Math.exp((17.27 * T) / (237.7 + T));
                currentData.feels_like[j] = T + 0.33 * e - 0.70 * v - 4.00;
            }
        }
        dataCache[i] = currentData;
    }
    document.getElementById('valid-time').innerText = catalog[i].label;
    document.getElementById('time-label').innerText = catalog[i].label;
    updateGPULayer();
    document.getElementById('loading-indicator').classList.remove('active');
  }

  function updateGPULayer() {
    if (!currentData || !map.getSource('weather-source')) return;
    const m = currentData.meta;
    
    offscreenCanvas.width = m.nx; 
    offscreenCanvas.height = m.ny;
    const imgData = offscreenCtx.createImageData(m.nx, m.ny);
    const d = imgData.data;

    const drawOrder = ['temp', 'feels', 'rh', 'press', 'wind', 'cloud', 'rain'];
    const activeLayers = drawOrder.filter(l => selected.has(l));

    if (activeLayers.length === 0) {
        offscreenCtx.putImageData(imgData, 0, 0);
        return;
    }

    // --- ALGORITMO MERCATOR PRE-WARP ---
    // Calcoliamo i bordi reali dell'immagine per la correzione prospettica
    const dx2 = m.dx / 2;
    const dy2 = m.dy / 2;
    const topLat = m.la1 + dy2;
    const bottomLat = (m.la1 - (m.ny - 1) * m.dy) - dy2;

    // Convertiamo le latitudini in spazio Y di Mercatore
    const y1 = Math.log(Math.tan(Math.PI / 4 + (topLat * Math.PI / 180) / 2));
    const y2 = Math.log(Math.tan(Math.PI / 4 + (bottomLat * Math.PI / 180) / 2));

    for(let y=0; y < m.ny; y++) {
        // Deformazione proporzionale in base a Web Mercator
        const fy = y / (m.ny - 1);
        const mercY = y1 + fy * (y2 - y1);
        const lat = (2 * Math.atan(Math.exp(mercY)) - Math.PI / 2) * 180 / Math.PI;
        
        // Calcolo dell'indice Y con i float per l'interpolazione
        const gy = (m.la1 - lat) / m.dy;

        for(let x=0; x < m.nx; x++) {
            const gx = x; // La longitudine in Mercatore è lineare, non serve piegarla!

            let r=0, g=0, b=0, finalA=0;
            for(let l of activeLayers) {
                let val = 0, stops;
                let arr = (l === 'feels' ? currentData.feels_like : currentData[l]);
                
                if(l === 'wind') {
                    const u = getBilinear(currentData.wind_u.data, gx, gy, m.nx, m.ny);
                    const v = getBilinear(currentData.wind_v.data, gx, gy, m.nx, m.ny);
                    val = Math.sqrt(u*u+v*v)*3.6;
                    stops = WIND_BG_STOPS;
                } else if(arr) {
                    val = getBilinear(arr, gx, gy, m.nx, m.ny);
                    stops = (l==='temp'||l==='feels') ? TEMP_STOPS : (l==='rain'?RAIN_STOPS:(l==='cloud'?CLOUD_STOPS:(l==='rh'?RH_STOPS:PRESS_STOPS)));
                } else continue;

                const col = getStopColor(val, stops);
                const a = col[3];
                if(finalA === 0) { r=col[0]; g=col[1]; b=col[2]; finalA=a; }
                else { r=(col[0]*a)+(r*(1-a)); g=(col[1]*a)+(g*(1-a)); b=(col[2]*a)+(b*(1-a)); finalA=Math.max(finalA, a); }
            }
            const p = (y * m.nx + x) * 4; 
            d[p]=r; d[p+1]=g; d[p+2]=b; d[p+3]=finalA*255;
        }
    }
    offscreenCtx.putImageData(imgData, 0, 0);

    // Coordinate esatte dei bordi
    const leftLon = m.lo1 - dx2;
    const rightLon = m.lo1 + (m.nx - 1) * m.dx + dx2;

    const coords = [
        [leftLon, topLat], 
        [rightLon, topLat], 
        [rightLon, bottomLat], 
        [leftLon, bottomLat]
    ];

    map.getSource('weather-source').updateImage({ url: offscreenCanvas.toDataURL(), coordinates: coords });
  }

  window.toggleLayer = (l) => { selected.has(l) ? selected.delete(l) : selected.add(l); updateGPULayer(); updateBtns(); };
  function updateBtns() { document.querySelectorAll('.toggle').forEach(b => b.classList.toggle('active', selected.has(b.id.replace('btn-','')))); }
  window.togglePlay = () => { isPlaying = !isPlaying; document.getElementById('play-btn').innerText = isPlaying ? "❚❚" : "►"; if(isPlaying) playLoop(); };
  function playLoop() { if(!isPlaying) return; const s = document.getElementById('time-slider'); let v = (parseInt(s.value)+1)%catalog.length; s.value = v; loadStep(v); setTimeout(playLoop, 1200); }
  window.getMyWeather = () => navigator.geolocation.getCurrentPosition(p => map.flyTo({center:[p.coords.longitude, p.coords.latitude], zoom:9}));
</script>
</body>
</html>
