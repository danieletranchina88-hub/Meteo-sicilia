<!DOCTYPE html>
<html>
<head>
  <title>Sicilia MeteoHub - ICON-2I ULTIMATE</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-velocity@1.8.0/dist/leaflet-velocity.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; background: #0a0a0a; font-family: 'Segoe UI', sans-serif; color: #ddd; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #0a0a0a; }

    /* GPS OVERLAY */
    #gps-overlay {
        position: absolute; top: -150px; left: 0; right: 0; height: 100px;
        background: rgba(10,10,10,0.95); backdrop-filter: blur(20px);
        z-index: 6000; display: flex; align-items: center; justify-content: space-around;
        border-bottom: 2px solid #0077ff; transition: top 0.4s ease;
        padding: 0 40px; box-shadow: 0 10px 40px #000;
    }
    #gps-overlay.active { top: 0; }
    .gps-stat { text-align: center; }
    .gps-stat div:first-child { font-size: 0.7em; color: #888; text-transform: uppercase; font-weight: 800; }
    .gps-stat div:last-child { font-size: 1.8em; font-weight: 900; color: #fff; }
    #close-gps { position: absolute; right: 15px; top: 15px; cursor: pointer; color: #666; font-size: 1.2em; }

    /* HEADER */
    #model-info { position: absolute; top: 15px; left: 70px; z-index: 5000; pointer-events: none; }
    #model-title { font-size: 16px; font-weight: 900; color: #fff; text-transform: uppercase; }
    #model-sub { font-size: 10px; color: #aaa; font-family: monospace; }

    /* INFO BOX CURSORE */
    #info-box { position: absolute; top: 15px; left: 20px; z-index: 5000; pointer-events: none; }
    #val-group { margin-top: 45px; }
    #val-display { font-size: 3.2em; font-weight: 950; color: #fff; text-shadow: 0 2px 15px #000; line-height: 0.8; }
    #unit-display { font-size: 1em; color: #888; font-weight: 800; margin-top: 5px; }

    /* UI CONTROLS */
    #ui-container { position: absolute; top: 10px; right: 10px; z-index: 5000; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    .panel { background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
    .toggle { width: 170px; display:flex; align-items:center; justify-content:space-between; padding: 12px; margin: 4px 0; background: rgba(255,255,255,0.04); border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 12px; transition: 0.2s; color: #bbb; }
    .toggle.active { background: #0077ff !important; color: #fff !important; }
    .gps-btn { width: 170px; padding: 14px; border-radius: 8px; font-size: 13px; background: #23a045; color: white; cursor: pointer; font-weight: 900; border: none; margin-bottom: 5px; }

    #bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(transparent, rgba(0,0,0,0.98)); display: flex; align-items: center; padding: 0 25px; z-index: 5000; }
    input[type=range] { flex-grow: 1; accent-color: #0077ff; cursor: pointer; }

    .dark-relief-tiles { filter: invert(100%) hue-rotate(180deg) brightness(0.6) contrast(1.3); }
    canvas.leaflet-layer.scalar-layer { mix-blend-mode: screen; opacity: 0.65; }
  </style>
</head>

<body>
  <div id="gps-overlay">
    <div id="close-gps" onclick="toggleGpsPanel(false)">✕</div>
    <div class="gps-stat"><div>Temperatura</div><div id="gps-t">--</div></div>
    <div class="gps-stat"><div>Pioggia</div><div id="gps-r">--</div></div>
    <div class="gps-stat"><div>Vento</div><div id="gps-w">--</div></div>
    <div class="gps-stat"><div>Umidità</div><div id="gps-h">--</div></div>
  </div>

  <div id="model-info">
    <div id="model-title">ICON-2I <span style="color:#0077ff">2.2km</span></div>
    <div id="model-sub">LIVE SYNC | VALID: <span id="valid-time">--</span></div>
  </div>

  <div id="info-box"><div id="val-group"><div id="val-display">--</div><div id="unit-display">Caricamento...</div></div></div>

  <div id="ui-container">
    <button class="gps-btn" onclick="getMyWeather()">📍 IL MIO METEO</button>
    <div class="panel">
      <div class="toggle active" id="btn-wind" onclick="toggleLayer('wind')">VENTO 🧭</div>
      <div class="toggle" id="btn-temp" onclick="toggleLayer('temp')">TEMP 🌡️</div>
      <div class="toggle" id="btn-rain" onclick="toggleLayer('rain')">PIOGGIA ☔</div>
      <div class="toggle" id="btn-rh" onclick="toggleLayer('rh')">UMIDITÀ 💧</div>
      <div class="toggle" id="btn-press" onclick="toggleLayer('press')">PRESSIONE ⏲️</div>
      <div class="toggle" id="btn-cloud" onclick="toggleLayer('cloud')">NUVOLE ☁️</div>
      <div style="height:1px; background: rgba(255,255,255,0.1); margin:8px 0;"></div>
      <div class="toggle" id="btn-iso" onclick="toggleIsobars()">ISOBARE 〰️</div>
    </div>
  </div>

  <div id="map"></div>

  <div id="bottom-bar">
    <button id="play-btn" style="background:none; border:none; color:white; font-size:2em; cursor:pointer;" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label" style="color:white; font-weight:bold; margin-left:15px; min-width:120px;">--/-- --:--</div>
  </div>

<script>
  const DPR = window.devicePixelRatio || 1;
  const SICILY_BOUNDS = L.latLngBounds(L.latLng(35.2, 11.2), L.latLng(39.8, 17.0));
  
  let map, currentData = null, catalog = [], isPlaying = false;
  const selected = new Set(['wind']);
  let showIsobars = false, scalarCanvases = {}, arrowCanvas, isoCanvas, userMarker, velocityLayer = null;

  const WIND_COLOR_SCALE = ["#000080", "#0044ff", "#00ddff", "#00ff55", "#ffff00", "#ff6600", "#ff0000", "#ff00ff"];
  const TEMP_STOPS = [{v:-15,c:[156,218,216]},{v:0,c:[93,133,198]},{v:15,c:[181,165,13]},{v:30,c:[232,83,25]},{v:45,c:[89,22,3]}];
  const RAIN_STOPS = [{v:0.0,c:[0,0,0],a:0},{v:0.6,c:[100,200,255],a:0.7},{v:10,c:[0,0,255],a:0.85},{v:50,c:[255,0,0],a:0.9}];
  const RH_STOPS = [{v:0,c:[173,85,56]},{v:30,c:[173,110,56]},{v:60,c:[56,173,121]},{v:80,c:[56,157,173]},{v:100,c:[56,70,114]}];

  function getStopColor(val, stops) {
    if (val <= stops[0].v) return [...stops[0].c, 0.75];
    for (let i = 0; i < stops.length - 1; i++) {
      if (val >= stops[i].v && val <= stops[i+1].v) {
        const t = (val - stops[i].v) / (stops[i+1].v - stops[i].v);
        return [(stops[i].c[0]*(1-t)+stops[i+1].c[0]*t)|0, (stops[i].c[1]*(1-t)+stops[i+1].c[1]*t)|0, (stops[i].c[2]*(1-t)+stops[i+1].c[2]*t)|0, 0.75];
      }
    }
    return [...stops[stops.length-1].c, 0.75];
  }

  function vividWindColor(sp){
    const t = Math.min(sp/22.0, 0.99);
    const idx = (t*(WIND_COLOR_SCALE.length-1))|0, f = (t*(WIND_COLOR_SCALE.length-1)) - idx;
    const c1 = WIND_COLOR_SCALE[idx], c2 = WIND_COLOR_SCALE[idx+1] || c1;
    const r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
    const r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
    return {r:(r1*(1-f)+r2*f)|0, g:(g1*(1-f)+g2*f)|0, b:(b1*(1-f)+b2*f)|0};
  }

  function toggleGpsPanel(show) { document.getElementById('gps-overlay').className = show ? 'active' : ''; }
  function getMyWeather() { map.locate({setView: true, maxZoom: 10}); }

  window.addEventListener('load', async () => {
    map = L.map('map', { zoomControl: false, background: '#0a0a0a' }).fitBounds(SICILY_BOUNDS);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', { className: 'dark-relief-tiles' }).addTo(map);

    map.createPane('scalarPane').style.zIndex = 200;
    map.createPane('particlePane').style.zIndex = 400; 
    map.createPane('vectorPane').style.zIndex = 700;   
    map.createPane('topPane').style.zIndex = 1500;    

    fetch('https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson')
      .then(r => r.json()).then(data => L.geoJSON(data, { pane: 'topPane', style: { color: "#fff", weight: 1.5, opacity: 0.8, fillOpacity: 0 } }).addTo(map));

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', { opacity: 0.3 }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { zIndex: 1100, opacity: 0.9 }).addTo(map);

    const mk = (z, pane, cl) => { const c = L.DomUtil.create('canvas', 'leaflet-layer '+(cl||'')); map.getPane(pane).appendChild(c); return c; };
    scalarCanvases = { wind: mk(1,'scalarPane','scalar-layer'), temp: mk(2,'scalarPane','scalar-layer'), rain: mk(3,'scalarPane','scalar-layer'), rh: mk(4,'scalarPane','scalar-layer'), press: mk(5,'scalarPane','scalar-layer'), cloud: mk(6,'scalarPane','scalar-layer') };
    arrowCanvas = mk(1, 'vectorPane'); isoCanvas = mk(2, 'vectorPane');

    map.on('locationfound', (e) => {
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.circleMarker(e.latlng, { radius: 8, color: '#0077ff', weight: 4, fillOpacity: 1, fillColor: 'white' }).addTo(map);
        const m = currentData.meta;
        const gx = Math.round((e.latlng.lng - m.lo1) / m.dx), gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
        if(gx>=0 && gy>=0 && gx < m.nx && gy < m.ny) {
            const i = gy * m.nx + gx;
            document.getElementById('gps-t').innerText = currentData.temp[i].toFixed(1) + "°";
            document.getElementById('gps-r').innerText = currentData.rain[i].toFixed(1) + "mm";
            document.getElementById('gps-w').innerText = (Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2)*3.6).toFixed(0) + " km/h";
            document.getElementById('gps-h').innerText = Math.round(currentData.rh[i]) + "%";
            toggleGpsPanel(true);
        }
    });

    await loadCatalog();
    map.on('moveend zoomend', redrawAll);
    map.on('mousemove', onPick);
  });

  async function loadCatalog() {
    const r = await fetch('data_weather/catalog.json?t=' + Date.now());
    catalog = await r.json();
    const slider = document.getElementById('time-slider');
    slider.max = catalog.length - 1;
    slider.oninput = (e) => loadStep(parseInt(e.target.value));

    const now = new Date();
    let bestIdx = 0, minD = Infinity;
    catalog.forEach((item, idx) => {
        const p = item.label.split(' '); const dP = p[0].split('/'); const tP = p[1].split(':');
        const sD = new Date(2026, parseInt(dP[1])-1, parseInt(dP[0]), parseInt(tP[0]), parseInt(tP[1]));
        const d = Math.abs(now - sD); if(d < minD) { minD = d; bestIdx = idx; }
    });
    slider.value = bestIdx;
    await loadStep(bestIdx);
  }

  async function loadStep(i) {
    const r = await fetch('data_weather/' + catalog[i].file);
    currentData = await r.json();
    document.getElementById('time-label').innerText = catalog[i].label;
    document.getElementById('valid-time').innerText = catalog[i].label;
    if(currentData.press) {
        currentData.cleanP = new Float32Array(currentData.press.length);
        for(let j=0; j<currentData.press.length; j++) {
            let v = currentData.press[j]; if(v > 2000) v /= 100;
            currentData.cleanP[j] = (!v || v < 850) ? 1013 : v;
        }
    }
    redrawAll();
  }

  function redrawAll() {
    if (!currentData) return;
    const size = map.getSize(), panePos = map.containerPointToLayerPoint([0, 0]);
    [...Object.values(scalarCanvases), arrowCanvas, isoCanvas].forEach(c => {
        c.width = size.x * DPR; c.height = size.y * DPR;
        c.style.width = size.x + 'px'; c.style.height = size.y + 'px';
        L.DomUtil.setPosition(c, panePos);
    });
    drawSmoothScalar();
    drawProWindVectors();
    if(showIsobars) drawIsobarsLogic();
    updateParticles();
  }

  function drawSmoothScalar() {
    const m = currentData.meta, size = map.getSize();
    const w = Math.ceil(size.x * 0.45), h = Math.ceil(size.y * 0.45);
    ['wind','temp','rain','rh','press','cloud'].forEach(l => {
        const c = scalarCanvases[l], ctx = c.getContext('2d');
        ctx.clearRect(0,0,c.width,c.height);
        if(!selected.has(l)) return;
        const img = ctx.createImageData(w, h), d = img.data;
        let arr = (l==='cloud' ? (currentData.cloud || currentData.cld) : currentData[l]);
        for(let y=0; y<h; y++) {
            for(let x=0; x<w; x++) {
                const ll = map.containerPointToLatLng([x/0.45, y/0.45]);
                const gx = (ll.lng-m.lo1)/m.dx, gy = (m.la1-ll.lat)/m.dy;
                if(gx<0||gy<0||gx>m.nx-1||gy>m.ny-1) continue;
                const i = (y*w+x)*4; const idx = (gy|0)*m.nx+(gx|0);
                if(l==='wind'){
                    const sp = Math.sqrt(currentData.wind_u.data[idx]**2 + currentData.wind_v.data[idx]**2);
                    const rgb = vividWindColor(sp); d[i]=rgb.r; d[i+1]=rgb.g; d[i+2]=rgb.b; d[i+3]=Math.min(sp/18, 0.22)*255;
                } else {
                    let v = arr[idx]; if(l==='press'&&v>2000)v/=100;
                    if((l==='rain'&&v<0.1)||(l==='cloud'&&v<5)) continue;
                    const res = getStopColor(v, l==='temp'?TEMP_STOPS:l==='rain'?[{v:0,c:[0,0,0],a:0},{v:0.5,c:[0,150,255],a:0.6}]:l==='rh'?RH_STOPS:PRESS_STOPS);
                    d[i]=res[0]; d[i+1]=res[1]; d[i+2]=res[2]; d[i+3]=res[3]*255;
                }
            }
        }
        const tC = document.createElement('canvas'); tC.width=w; tC.height=h; tC.getContext('2d').putImageData(img,0,0);
        ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingEnabled = true; ctx.drawImage(tC, 0, 0, size.x, size.y);
    });
  }

  function drawProWindVectors() {
    if(!selected.has('wind')) return;
    const ctx = arrowCanvas.getContext('2d'), size = map.getSize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = currentData.meta, z = map.getZoom();
    const stride = z >= 11 ? 30 : (z >= 9 ? 45 : 60);

    for(let y=0; y < size.y; y += stride) {
        for(let x=0; x < size.x; x += stride) {
            const ll = map.containerPointToLatLng([x, y]);
            const gx = (ll.lng-m.lo1)/m.dx, gy = (m.la1-ll.lat)/m.dy;
            if(gx<0||gy<0||gx>m.nx-1||gy>m.ny-1) continue;
            const idx = (gy|0)*m.nx+(gx|0);
            const u = currentData.wind_u.data[idx], v = currentData.wind_v.data[idx], sp = Math.sqrt(u*u+v*v);
            if(sp < 0.8) continue;

            const len = Math.max(12, Math.min(sp * 2.8, 45));
            const ang = Math.atan2(-v, u);
            const c = vividWindColor(sp);

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(ang);
            // OUTLINE
            ctx.strokeStyle = "rgba(0,0,0,0.8)"; ctx.lineWidth = 3.5;
            ctx.beginPath(); ctx.moveTo(-len/2, 0); ctx.lineTo(len/2, 0); ctx.lineTo(len/2-8, -5); ctx.moveTo(len/2, 0); ctx.lineTo(len/2-8, 5); ctx.stroke();
            // COLOR
            ctx.strokeStyle = `rgb(${c.r},${c.g},${c.b})`; ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.restore();
        }
    }
  }

  function drawIsobarsLogic() {
    const ctx = isoCanvas.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = currentData.meta;
    const contours = d3.contours().size([m.nx, m.ny]).thresholds(d3.range(960, 1050, 2))(currentData.cleanP);
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1.5;
    contours.forEach(c => c.coordinates.forEach(poly => poly.forEach(ring => {
        ctx.beginPath(); ring.forEach((p, j) => {
            const pt = map.latLngToContainerPoint([m.la1-p[1]*m.dy, m.lo1+p[0]*m.dx]);
            if(j===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
        }); ctx.stroke();
    })));
  }

  function updateParticles() {
    if (velocityLayer) map.removeLayer(velocityLayer);
    if (!selected.has('wind')) return;
    velocityLayer = L.velocityLayer({ displayValues: false, data: [currentData.wind_u, currentData.wind_v], maxVelocity: 25, velocityScale: 0.008, particleMultiplier: 1/450, lineWidth: 2, frameRate: 60, opacity: 0.8, colorScale: ["#fff"], pane: 'particlePane' }).addTo(map);
  }

  function onPick(e){
    if(!currentData) return;
    const m = currentData.meta;
    const gx = Math.round((e.latlng.lng - m.lo1) / m.dx), gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
    if(gx<0 || gy<0 || gx>=m.nx || gy>=m.ny) return;
    const i = gy * m.nx + gx;
    let val = "--", unit = "";
    if(selected.has('temp')) { val = currentData.temp[i].toFixed(1); unit = "°C"; }
    else if(selected.has('wind')) { val = (Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2)*3.6).toFixed(1); unit = "km/h"; }
    else if(selected.has('rain')) { val = currentData.rain[i].toFixed(1); unit = "mm"; }
    else if(selected.has('rh')) { val = Math.round(currentData.rh[i]); unit = "%"; }
    else if(selected.has('press')) { val = Math.round(currentData.cleanP[i]); unit = "hPa"; }
    else if(selected.has('cloud')) { val = Math.round((currentData.cloud||currentData.cld)[i]); unit = "%"; }
    document.getElementById('val-display').innerText = val; document.getElementById('unit-display').innerText = unit;
  }

  window.toggleLayer = (l) => { if(selected.has(l)) selected.delete(l); else selected.add(l); updateUI(); redrawAll(); };
  window.toggleIsobars = () => { showIsobars = !showIsobars; updateUI(); redrawAll(); };

  function updateUI(){
    ['wind','temp','rain','rh','press','cloud'].forEach(l => {
        const btn = document.getElementById('btn-' + l);
        if(selected.has(l)) btn.classList.add('active'); else btn.classList.remove('active');
    });
    if(showIsobars) document.getElementById('btn-iso').classList.add('active'); else document.getElementById('btn-iso').classList.remove('active');
  }

  function togglePlay() { isPlaying = !isPlaying; document.getElementById('play-btn').innerText = isPlaying ? "❚❚" : "►"; if(isPlaying) playLoop(); }
  function playLoop() { if(!isPlaying) return; const s = document.getElementById('time-slider'); let v = parseInt(s.value) + 1; if(v >= catalog.length) v = 0; s.value = v; loadStep(v); setTimeout(playLoop, 950); }
</script>
</body>
</html>
