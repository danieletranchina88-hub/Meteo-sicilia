<!DOCTYPE html>
<html lang="it">
<head>
  <title>Italia MeteoHub Pro - GPU Accelerated</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; background: #0a0a0a; font-family: 'Segoe UI', Roboto, sans-serif; color: #ddd; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #0a0a0a; }

    /* UI Invariata */
    #gps-overlay { position: absolute; top: -250px; left: 0; right: 0; background: rgba(10,10,10,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 6000; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; border-bottom: 2px solid #0077ff; transition: top 0.4s ease; padding: 30px 10px 15px 10px; box-shadow: 0 10px 40px #000; }
    #gps-overlay.active { top: 0; }
    .gps-stat { width: 30%; text-align: center; margin-bottom: 12px; }
    .gps-stat div:first-child { font-size: 0.65em; color: #888; text-transform: uppercase; font-weight: 800; }
    .gps-stat div:last-child { font-size: 1.4em; font-weight: 900; color: #fff; }
    #close-gps { position: absolute; right: 15px; top: 10px; cursor: pointer; color: #888; font-size: 1.4em; }

    #model-info { position: absolute; top: 15px; left: 70px; z-index: 5000; pointer-events: none; }
    #model-title { font-size: 18px; font-weight: 900; color: #fff; text-transform: uppercase; }
    #model-sub { font-size: 11px; color: #00eaff; font-family: monospace; }
    
    #info-box { position: absolute; top: 15px; left: 20px; z-index: 5000; pointer-events: none; }
    #val-display { font-size: 3.5em; font-weight: 950; color: #fff; text-shadow: 0 2px 15px #000; line-height: 0.8; }
    #unit-display { font-size: 1.1em; color: #ccc; font-weight: 700; margin-left: 5px; }

    #ui-container { position: absolute; top: 10px; right: 10px; z-index: 5000; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; max-height: 85vh; overflow-y: auto; scrollbar-width: none; }
    .panel { background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .toggle { width: 150px; display:flex; align-items:center; justify-content:space-between; padding: 12px 10px; margin: 4px 0; background: rgba(255,255,255,0.04); border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 11px; color: #bbb; border: 1px solid transparent; transition: 0.2s; }
    .toggle.active { background: #0077ff !important; color: #fff !important; }
    .gps-btn { width: 170px; padding: 14px; border-radius: 8px; font-size: 13px; background: #23a045; color: white; cursor: pointer; font-weight: 900; border: none; margin-bottom: 5px; }
    
    #bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to top, rgba(0,0,0,1), transparent); display: flex; align-items: center; padding: 0 15px; z-index: 5000; }
    input[type=range] { flex-grow: 1; accent-color: #0077ff; cursor: pointer; }
    
    #loading-indicator { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 15px 25px; border-radius: 10px; font-weight: bold; z-index: 9999; }
    #loading-indicator.active { display: block; }
  </style>
</head>
<body>
  <div id="gps-overlay"><div id="close-gps" onclick="toggleGpsPanel(false)">✕</div><div class="gps-stat"><div>Temp.</div><div id="gps-t">--</div></div><div class="gps-stat"><div>Percepita</div><div id="gps-tf">--</div></div><div class="gps-stat"><div>Pioggia</div><div id="gps-r">--</div></div><div class="gps-stat"><div>Vento</div><div id="gps-w">--</div></div><div class="gps-stat"><div>Umidità</div><div id="gps-h">--</div></div><div class="gps-stat"><div>Pressione</div><div id="gps-p">--</div></div></div>
  <div id="model-info"><div id="model-title">ITALIA METEOHUB <span style="color:#00eaff">ICON-2I GPU</span></div><div id="model-sub">LIVE SYNC | VALID: <span id="valid-time">--</span></div></div>
  <div id="info-box"><div id="val-display">--</div><div id="unit-display">Attendere...</div></div>
  <div id="loading-indicator">Sincronizzazione GPU...</div>
  
  <div id="ui-container">
    <button class="gps-btn" onclick="getMyWeather()">📍 IL MIO METEO</button>
    <div class="panel">
        <div class="toggle active" id="btn-wind" onclick="selectScalar('wind')">VENTO 🧭</div>
        <div class="toggle" id="btn-temp" onclick="selectScalar('temp')">TEMPERATURA 🌡️</div>
        <div class="toggle" id="btn-feels" onclick="selectScalar('feels')">PERCEPITA 🤒</div>
        <div class="toggle" id="btn-rain" onclick="selectScalar('rain')">PIOGGIA ☔</div>
        <div class="toggle" id="btn-rh" onclick="selectScalar('rh')">UMIDITÀ 💧</div>
        <div class="toggle" id="btn-press" onclick="selectScalar('press')">PRESSIONE ⏲️</div>
        <div class="toggle" id="btn-cloud" onclick="selectScalar('cloud')">NUVOLE ☁️</div>
    </div>
  </div>

  <div id="map"></div>
  
  <div id="bottom-bar">
    <button id="play-btn" style="background:none; border:none; color:white; font-size:2.2em; cursor:pointer;" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label" style="color:white; font-weight:bold; margin-left:15px; font-family: monospace; min-width: 100px;">--/-- --:--</div>
  </div>

<script>
  // SCALETTA COLORI
  const WIND_BG_STOPS = [{v:0, c:[30,30,35], a:0.6}, {v:15, c:[0,120,160], a:0.75}, {v:30, c:[0,180,140], a:0.8}, {v:70, c:[220,160,0], a:0.9}, {v:120, c:[180,0,40], a:0.95}];
  const TEMP_STOPS = [{v:-20,c:[115,0,171]},{v:-10,c:[0,43,161]},{v:0,c:[0,217,255]},{v:10,c:[51,184,51]},{v:20,c:[255,242,0]},{v:25,c:[255,166,0]},{v:30,c:[255,64,0]},{v:35,c:[204,0,0]},{v:40,c:[128,0,34]}];
  const RAIN_STOPS = [{v:0,c:[0,0,0],a:0},{v:0.5,c:[80,160,255],a:0.75},{v:5,c:[0,50,200],a:0.85},{v:20,c:[255,200,0],a:0.95}];
  const CLOUD_STOPS = [{v:0,c:[255,255,255],a:0},{v:20,c:[200,200,220],a:0.4},{v:80,c:[150,150,170],a:0.8}];
  const RH_STOPS = [{v:0,c:[160,80,40],a:0.8},{v:40,c:[180,180,80],a:0.8},{v:80,c:[60,160,180],a:0.8},{v:100,c:[60,40,160],a:0.9}];
  const PRESS_STOPS = [{v:980,c:[0,100,160]},{v:1013,c:[220,220,220]},{v:1030,c:[180,120,40]}];

  function getStopColor(val, stops) {
    if (val <= stops[0].v) return [...stops[0].c, (stops[0].a ?? 0.85)];
    for (let i = 0; i < stops.length - 1; i++) {
      if (val >= stops[i].v && val <= stops[i+1].v) {
        const t = (val - stops[i].v) / (stops[i+1].v - stops[i].v);
        const a1 = stops[i].a ?? 0.85, a2 = stops[i+1].a ?? 0.85;
        return [(stops[i].c[0]*(1-t)+stops[i+1].c[0]*t)|0, (stops[i].c[1]*(1-t)+stops[i+1].c[1]*t)|0, (stops[i].c[2]*(1-t)+stops[i+1].c[2]*t)|0, (a1*(1-t)+a2*t)];
      }
    }
    return [...stops[stops.length-1].c, (stops[stops.length-1].a ?? 0.85)];
  }

  // VARIABILI GLOBALI
  let map, currentData = null, catalog = [], isPlaying = false;
  let activeScalar = 'wind'; 
  const dataCache = {};
  
  // Canvas invisibile che genererà la texture per la GPU
  const offscreenCanvas = document.createElement('canvas');
  const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

  window.addEventListener('load', async () => {
    // INIZIALIZZAZIONE MAPLIBRE (Addio Leaflet!)
    map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', // Mappa vettoriale fluida
        bounds: [[6.0, 35.0], [19.5, 47.5]], // Italia
        maxPitch: 60, // Permette di inclinare la mappa in 3D!
        antialias: true
    });

    map.on('load', async () => {
        // Aggiungiamo un layer immagine vuoto che verrà aggiornato dalla GPU
        map.addSource('weather-source', {
            type: 'image',
            url: 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=', // Pixel trasparente
            coordinates: [[0,0], [0,0], [0,0], [0,0]]
        });

        map.addLayer({
            id: 'weather-layer',
            type: 'raster',
            source: 'weather-source',
            paint: {
                'raster-opacity': 0.85,
                'raster-resampling': 'linear' // LA MAGIA: Bilineare fatta dalla Scheda Video!
            }
        }, 'watername_ocean'); // Lo mette SOTTO i nomi delle città!

        await loadCatalog();
    });

    // Clic per vedere il valore
    map.on('click', (e) => {
        if(!currentData) return;
        const m = currentData.meta;
        const lng = e.lngLat.lng, lat = e.lngLat.lat;
        
        // Calcolo rapido indice griglia (Nearest Neighbor per il click)
        const gx = Math.round((lng - m.lo1) / m.dx);
        const gy = Math.round((m.la1 - lat) / m.dy);
        
        if(gx>=0 && gy>=0 && gx<m.nx && gy<m.ny) {
            let val = 0;
            const idx = gy * m.nx + gx;
            if (activeScalar === 'wind') {
                const u = currentData.wind_u.data[idx], v = currentData.wind_v.data[idx];
                val = Math.sqrt(u*u+v*v)*3.6;
            } else {
                let dataKey = activeScalar === 'feels' ? 'feels_like' : activeScalar;
                val = currentData[dataKey][idx];
            }
            document.getElementById('val-display').innerText = val.toFixed(1);
            document.getElementById('unit-display').innerText = (activeScalar==='temp'||activeScalar==='feels') ? "°C" : (activeScalar==='wind'?"km/h" : (activeScalar==='rain'?"mm": (activeScalar==='press'?"hPa":"%")));
        }
    });
  });

  async function loadCatalog() {
    try {
        const r = await fetch('data_weather/catalog.json?t=' + Date.now());
        catalog = await r.json();
        const s = document.getElementById('time-slider');
        s.max = catalog.length - 1;
        s.oninput = (e) => loadStep(parseInt(e.target.value));
        
        if(catalog.length > 0) {
            let bestIdx = 0, minDiff = Infinity, now = new Date();
            catalog.forEach((item, idx) => {
                const p = item.label.split(' '), d = p[0].split('/'), t = p[1].split(':');
                const dt = new Date(now.getFullYear(), parseInt(d[1])-1, parseInt(d[0]), parseInt(t[0]), 0);
                const diff = Math.abs(now - dt);
                if(diff < minDiff) { minDiff = diff; bestIdx = idx; }
            });
            s.value = bestIdx;
            await loadStep(bestIdx);
        }
    } catch(e) { console.error("Catalogo non trovato"); }
  }

  async function loadStep(i) {
    if (!catalog[i]) return;
    document.getElementById('loading-indicator').classList.add('active');

    if (dataCache[i]) {
        currentData = dataCache[i];
    } else {
        const r = await fetch('data_weather/' + catalog[i].file);
        const data = await r.json();
        const len = data.meta.nx * data.meta.ny;
        
        if (!data.wind_u) data.wind_u = { data: new Float32Array(len) };
        if (!data.wind_v) data.wind_v = { data: new Float32Array(len) };

        if (data.temp && data.rh && data.wind_u.data) {
            data.feels_like = new Float32Array(len);
            for(let j=0; j<len; j++) {
                let T = data.temp[j], RH = data.rh[j], v_ms = Math.sqrt(data.wind_u.data[j]**2 + data.wind_v.data[j]**2);
                let e = (RH / 100.0) * 6.105 * Math.exp((17.27 * T) / (237.7 + T));
                data.feels_like[j] = T + 0.33 * e - 0.70 * v_ms - 4.00;
            }
        } else if (data.temp) { data.feels_like = data.temp; }

        dataCache[i] = data; 
        currentData = data;
    }

    document.getElementById('valid-time').innerText = catalog[i].label;
    document.getElementById('time-label').innerText = catalog[i].label;
    
    updateGPULayer();
    document.getElementById('loading-indicator').classList.remove('active');
  }

  // --- LA POTENZA DELLA GPU ---
  // Non facciamo più l'interpolazione noiosa. Creiamo un pixel per dato e lo inviamo alla scheda video.
  function updateGPULayer() {
    if (!currentData || !map.getSource('weather-source')) return;

    const m = currentData.meta;
    let dataKey = activeScalar === 'feels' ? 'feels_like' : activeScalar;
    let arr = currentData[dataKey];
    if(!arr && activeScalar!=='wind') return;

    // Impostiamo il canvas invisibile alla dimensione esatta della griglia (es. 500x600 px)
    offscreenCanvas.width = m.nx;
    offscreenCanvas.height = m.ny;
    const imgData = offscreenCtx.createImageData(m.nx, m.ny);
    const d = imgData.data;

    let stops = (activeScalar==='temp'||activeScalar==='feels') ? TEMP_STOPS : (activeScalar==='rain' ? RAIN_STOPS : (activeScalar==='cloud'?CLOUD_STOPS: (activeScalar==='rh'?RH_STOPS: (activeScalar==='press'?PRESS_STOPS: WIND_BG_STOPS))));

    // Ciclo ultra veloce: un giro = un pixel
    for(let i=0; i < m.nx * m.ny; i++) {
        let val = 0;
        if(activeScalar === 'wind') {
            const u = currentData.wind_u.data[i], v = currentData.wind_v.data[i];
            val = Math.sqrt(u*u+v*v)*3.6;
        } else {
            val = arr[i];
        }

        const col = getStopColor(val, stops);
        const ptr = i * 4;
        d[ptr] = col[0]; d[ptr+1] = col[1]; d[ptr+2] = col[2]; d[ptr+3] = col[3]*255;
    }

    offscreenCtx.putImageData(imgData, 0, 0);

    // Coordinate geografiche dei 4 angoli dell'immagine
    // (MapLibre spalmerà questa immagine usando la GPU per ammorbidirla perfettamente)
    const coordinates = [
        [m.lo1, m.la1], // Top-Left
        [m.lo1 + m.nx*m.dx, m.la1], // Top-Right
        [m.lo1 + m.nx*m.dx, m.la1 - m.ny*m.dy], // Bottom-Right
        [m.lo1, m.la1 - m.ny*m.dy] // Bottom-Left
    ];

    // Invia alla GPU
    map.getSource('weather-source').updateImage({
        url: offscreenCanvas.toDataURL('image/png'),
        coordinates: coordinates
    });
  }

  window.selectScalar = (l) => { activeScalar = l; updateGPULayer(); updateBtns(); };
  
  function updateBtns() {
    document.querySelectorAll('.toggle').forEach(b => {
        const id = b.id.replace('btn-','');
        b.classList.toggle('active', id === activeScalar);
    });
  }

  function togglePlay() { isPlaying = !isPlaying; document.getElementById('play-btn').innerText = isPlaying ? "❚❚" : "►"; if(isPlaying) playLoop(); }
  function playLoop() { if(!isPlaying) return; const s = document.getElementById('time-slider'); let v = parseInt(s.value)+1; if(v >= catalog.length) v = 0; s.value = v; loadStep(v); setTimeout(playLoop, 800); }
</script>
</body>
</html>
