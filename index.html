  let map, currentData = null, catalog = [];

  function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
  function lerp(a,b,t){ return a+(b-a)*t; }

  function interpStops(val, stops) {
    if(!stops || stops.length < 2) return {r:0,g:0,b:0,a:0};
    if(val <= stops[0].v) { const s=stops[0]; return {r:s.c[0],g:s.c[1],b:s.c[2],a:('a' in s)?s.a:0.82}; }
    for(let i=0;i<stops.length-1;i++){
      if(val >= stops[i].v && val < stops[i+1].v){
        const s1=stops[i], s2=stops[i+1];
        const t = (val-s1.v)/(s2.v-s1.v);
        const a1 = ('a' in s1) ? s1.a : 0.82;
        const a2 = ('a' in s2) ? s2.a : 0.82;
        return {
            r: Math.round(lerp(s1.c[0],s2.c[0],t)),
            g: Math.round(lerp(s1.c[1],s2.c[1],t)),
            b: Math.round(lerp(s1.c[2],s2.c[2],t)),
            a: lerp(a1, a2, t)
        };
      }
    }
    const s=stops[stops.length-1]; return {r:s.c[0],g:s.c[1],b:s.c[2],a:('a' in s)?s.a:0.82};
  }

  function vividWindColor(speedMs){
    const maxV = 20.0; const t = clamp(speedMs/maxV, 0, 0.9999);
    const n = WIND_COLOR_SCALE.length; const pos = t*(n-1);
    const i = Math.floor(pos); const f = pos - i;
    const hex1=WIND_COLOR_SCALE[i], hex2=WIND_COLOR_SCALE[Math.min(i+1,n-1)];
    const r1=parseInt(hex1.slice(1,3),16), g1=parseInt(hex1.slice(3,5),16), b1=parseInt(hex1.slice(5,7),16);
    const r2=parseInt(hex2.slice(1,3),16), g2=parseInt(hex2.slice(3,5),16), b2=parseInt(hex2.slice(5,7),16);
    return {r:Math.round(lerp(r1,r2,f)), g:Math.round(lerp(g1,g2,f)), b:Math.round(lerp(b1,b2,f))};
  }

  // ---------- Isobare: smoothing + A/B “intelligenti” (sinottico) ----------
  function boxBlur2D(src, nx, ny, r){
    const tmp = new Float32Array(src.length);
    const dst = new Float32Array(src.length);

    // orizzontale
    for(let y=0; y<ny; y++){
      let acc = 0;
      for(let dx=-r; dx<=r; dx++){
        const x = clamp(dx, 0, nx-1);
        acc += src[y*nx + x];
      }
      for(let x=0; x<nx; x++){
        tmp[y*nx + x] = acc / (2*r+1);
        const xOut = x - r;
        const xIn  = x + r + 1;
        const vOut = src[y*nx + clamp(xOut, 0, nx-1)];
        const vIn  = src[y*nx + clamp(xIn,  0, nx-1)];
        acc += (vIn - vOut);
      }
    }

    // verticale
    for(let x=0; x<nx; x++){
      let acc = 0;
      for(let dy=-r; dy<=r; dy++){
        const y = clamp(dy, 0, ny-1);
        acc += tmp[y*nx + x];
      }
      for(let y=0; y<ny; y++){
        dst[y*nx + x] = acc / (2*r+1);
        const yOut = y - r;
        const yIn  = y + r + 1;
        const vOut = tmp[clamp(yOut, 0, ny-1)*nx + x];
        const vIn  = tmp[clamp(yIn,  0, ny-1)*nx + x];
        acc += (vIn - vOut);
      }
    }
    return dst;
  }

  function percentileApprox(arr, q){
    const n = arr.length;
    const step = Math.max(1, Math.floor(n / 12000));
    const samp = [];
    for(let i=0; i<n; i+=step){
      const v = arr[i];
      if(Number.isFinite(v)) samp.push(v);
    }
    if(!samp.length) return NaN;
    samp.sort((a,b)=>a-b);
    const idx = Math.floor(clamp(q,0,1) * (samp.length-1));
    return samp[idx];
  }

  function findPressureExtrema(pressField, m){
    const nx=m.nx, ny=m.ny;

    // smoothing “sinottico” (riduce loop/artefatti)
    let p = boxBlur2D(pressField, nx, ny, 2);
    p = boxBlur2D(p, nx, ny, 3);

    const p90 = percentileApprox(p, 0.90);
    const p10 = percentileApprox(p, 0.10);
    if(!Number.isFinite(p90) || !Number.isFinite(p10)) return [];

    const r = 8;
    const step = 2;
    const minProm = 1.2; // hPa

    const candA = [];
    const candB = [];

    for(let y=r; y<ny-r; y+=step){
      for(let x=r; x<nx-r; x+=step){
        const idx=y*nx+x;
        const v=p[idx];
        if(!Number.isFinite(v)) continue;

        let neighMin=Infinity, neighMax=-Infinity;
        for(let dy=-r; dy<=r; dy++){
          const yy=y+dy, row=yy*nx;
          for(let dx=-r; dx<=r; dx++){
            if(dx===0 && dy===0) continue;
            const vv=p[row+(x+dx)];
            if(vv<neighMin) neighMin=vv;
            if(vv>neighMax) neighMax=vv;
          }
        }
        const promMax=v-neighMin;
        const promMin=neighMax-v;

        if(v>=p90 && promMax>=minProm) candA.push({x,y,v,prom:promMax,type:'A'});
        if(v<=p10 && promMin>=minProm) candB.push({x,y,v,prom:promMin,type:'B'});
      }
    }

    candA.sort((a,b)=>b.prom-a.prom);
    candB.sort((a,b)=>b.prom-a.prom);

    const chosen=[];
    const minPxDist=140;
    const maxPerType=2;

    function tryAdd(list){
      for(const c of list){
        const lat=m.la1 - c.y*m.dy;
        const lon=m.lo1 + c.x*m.dx;
        const pt=map.latLngToContainerPoint([lat,lon]);
        const s=map.getSize();
        if(pt.x<0||pt.y<0||pt.x>s.x||pt.y>s.y) continue;

        let ok=true;
        for(const o of chosen){
          if(Math.hypot(pt.x-o.px, pt.y-o.py) < minPxDist){ ok=false; break; }
        }
        if(!ok) continue;

        chosen.push({...c, px:pt.x, py:pt.y});
        if(chosen.filter(z=>z.type===c.type).length>=maxPerType) break;
      }
    }
    tryAdd(candA);
    tryAdd(candB);

    // sicurezza: evita casi assurdi (A più bassa di B nello stesso frame)
    const As = chosen.filter(e=>e.type==='A');
    const Bs = chosen.filter(e=>e.type==='B');
    if(As.length && Bs.length){
      const maxB = Math.max(...Bs.map(b=>b.v));
      const minA = Math.min(...As.map(a=>a.v));
      if(minA <= maxB){
        // se succede, tieni solo la più “prominente” del tipo con maggiore affidabilità
        // (meglio meno etichette che etichette fuorvianti)
        const keep = [];
        if(As.length) keep.push(As.sort((a,b)=>b.prom-a.prom)[0]);
        if(Bs.length) keep.push(Bs.sort((a,b)=>b.prom-a.prom)[0]);
        // se ancora A<=B, lascia solo quella con maggiore prom
        if(keep.length===2 && keep[0].type==='A' && keep[1].type==='B' && keep[0].v<=keep[1].v){
          keep.sort((a,b)=>b.prom-a.prom);
          return [keep[0]];
        }
        return keep;
      }
    }
    return chosen;
  }

  function drawAB(ctx, extrema){
    if(!extrema || !extrema.length) return;

    const z = map.getZoom();
    const letterPx = Math.round(clamp(22 + (z-7)*3.0, 22, 46));
    const valuePx  = Math.round(clamp(11 + (z-7)*1.3, 11, 22));
    const yOff = Math.round(letterPx*0.9);

    ctx.save();
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    for(const e of extrema){
      const letter=e.type;
      const color = (letter==='A') ? "#ff2d2d" : "#2d6bff";

      ctx.font = `900 ${letterPx}px Arial`;

      ctx.lineWidth = Math.round(letterPx * 0.28);
      ctx.strokeStyle = "rgba(255,255,255,0.92)";
      ctx.strokeText(letter, e.px, e.py);

      ctx.lineWidth = Math.round(letterPx * 0.16);
      ctx.strokeStyle = "rgba(0,0,0,0.90)";
      ctx.strokeText(letter, e.px, e.py);

      ctx.fillStyle = color;
      ctx.fillText(letter, e.px, e.py);

      const vtxt = `${Math.round(e.v)} hPa`;
      ctx.font = `900 ${valuePx}px Arial`;

      ctx.lineWidth = Math.max(3, Math.round(valuePx*0.45));
      ctx.strokeStyle = "rgba(0,0,0,0.80)";
      ctx.strokeText(vtxt, e.px, e.py + yOff);

      ctx.fillStyle = "rgba(255,255,255,0.96)";
      ctx.fillText(vtxt, e.px, e.py + yOff);
    }

    ctx.restore();
  }

  // ---------- Contours robusti su offscreen (evita linee nere/strane) ----------
  function renderContoursOffscreen(field, nx, ny, thresholds){
    const off = document.createElement('canvas');
    off.width = nx; off.height = ny;
    const octx = off.getContext('2d');
    octx.clearRect(0,0,nx,ny);

    const contours = d3.contours().size([nx, ny]).thresholds(thresholds)(field);
    const path = d3.geoPath(d3.geoIdentity(), octx);

    return {off, contours, path, octx};
  }

  function pickLabelPoint(contour){
    // ritorna un punto “centrale” in coordinate griglia [x,y]
    // (se non trova, null)
    try{
      const coords = contour.coordinates;
      if(!coords || !coords.length) return null;

      // prendi il ring più lungo
      let best = null;
      let bestLen = 0;

      for(const multi of coords){
        for(const poly of multi){
          for(const ring of poly){
            if(ring && ring.length > bestLen){
              bestLen = ring.length;
              best = ring;
            }
          }
        }
      }
      if(!best || bestLen < 10) return null;
      return best[Math.floor(bestLen/2)];
    }catch(e){
      return null;
    }
  }

  // ---------- App ----------
  window.addEventListener('load', async () => {
    map = L.map('map', { zoomControl: false, maxBounds: SICILY_BOUNDS.pad(0.5), background: '#1a1a1a' }).fitBounds(SICILY_BOUNDS);

    // BASE: Esri World Shaded Relief + Hillshade + Labels
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 13, attribution: 'Esri', className: 'dark-relief-tiles'
    }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, className: 'dark-relief-tiles', opacity: 0.42
    }).addTo(map);

    map.createPane('labelsPane');
    map.getPane('labelsPane').style.zIndex = 600;
    map.getPane('labelsPane').style.pointerEvents = 'none';
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
      pane: 'labelsPane', opacity: 0.9
    }).addTo(map);

    map.createPane('particlePane');
    map.getPane('particlePane').style.zIndex = 800;
    map.getPane('particlePane').style.pointerEvents = 'none';

    createCanvasLayers();
    await loadCatalog();

    map.on('mousemove', onPick);
    map.on('click', onPick);
    map.on('moveend zoomend resize', redrawAll);
    document.getElementById('unit-display').innerText = '';
  });

  function createCanvasLayers(){
    function mkCanvas(z, cls){
      const c = L.DomUtil.create('canvas', 'leaflet-layer ' + (cls||''));
      c.style.pointerEvents = 'none';
      c.style.zIndex = z;
      c.style.imageRendering = 'auto';
      map.getPanes().overlayPane.appendChild(c);
      return c;
    }
    scalarCanvases.wind  = mkCanvas(290, 'scalar-layer');
    scalarCanvases.temp  = mkCanvas(300, 'scalar-layer');
    scalarCanvases.rain  = mkCanvas(310, 'scalar-layer');
    scalarCanvases.rh    = mkCanvas(320, 'scalar-layer');
    scalarCanvases.press = mkCanvas(330, 'scalar-layer');
    scalarCanvases.cloud = mkCanvas(340, 'scalar-layer');

    arrowCanvas  = mkCanvas(380);
    isoCanvas    = mkCanvas(420);
    thermoCanvas = mkCanvas(430);
    gridCanvas   = mkCanvas(450);
  }

  async function loadCatalog(){
    try{
      const r = await fetch('data_weather/catalog.json?t=' + Date.now());
      if(!r.ok) throw new Error();
      catalog = await r.json();
      const slider = document.getElementById('time-slider');
      slider.max = catalog.length - 1;
      slider.addEventListener('input', (e)=> loadStep(parseInt(e.target.value)));
      await loadStep(0);
    } catch(e){
      document.getElementById('unit-display').innerText = 'Errore catalog.json';
    }
  }

  async function loadStep(i){
    if(!catalog[i]) return;
    document.getElementById('time-label').innerText = catalog[i].label;
    try{
      const r = await fetch('data_weather/' + catalog[i].file + '?t=' + Date.now());
      currentData = await r.json();
      redrawAll();
    } catch(e){
      document.getElementById('unit-display').innerText = 'Errore dati meteo';
    }
  }

  function redrawAll(){
    if(!currentData) return;
    drawScalars();
    drawWindArrows();
    drawIsobars();
    drawIsotherms();
    drawLatLonGrid();
    updateParticles();
  }

  function drawScalars(){
    ['wind','temp','rain','rh','press','cloud'].forEach(layer => {
      const canvas = scalarCanvases[layer];
      const ctx = canvas.getContext('2d');
      const s = map.getSize();
      canvas.width = s.x; canvas.height = s.y;
      L.DomUtil.setPosition(canvas, map.containerPointToLayerPoint([0,0]));
      ctx.clearRect(0,0,s.x,s.y);

      if(!selected.has(layer) || !currentData.meta) return;
      const m = currentData.meta;

      const off = document.createElement('canvas');
      off.width = m.nx; off.height = m.ny;
      const octx = off.getContext('2d');
      const img = octx.createImageData(m.nx, m.ny);
      const data = img.data;

      let arr, stops, isWindBg=false;
      if(layer==='wind') { isWindBg=true; }
      else if(layer==='temp') { arr = currentData.temp; stops = TEMP_STOPS; }
      else if(layer==='rain') { arr = currentData.rain; stops = RAIN_STOPS; }
      else if(layer==='rh') { arr = currentData.rh; stops = RH_STOPS; }
      else if(layer==='press') { arr = currentData.press; stops = PRESS_STOPS; }
      else if(layer==='cloud') { arr = (currentData.cloud??currentData.cld); stops = CLOUD_STOPS; }

      if(!arr && !isWindBg) return;

      for(let i=0; i<m.nx*m.ny; i++){
        let col = {r:0,g:0,b:0,a:0};
        if(isWindBg){
          const u = currentData.wind_u.data[i], v = currentData.wind_v.data[i];
          const sp = Math.sqrt(u*u+v*v);
          const rgb = vividWindColor(sp);
          col = {r:rgb.r,g:rgb.g,b:rgb.b,a:0.42};
        } else {
          const val = (arr[i] ?? 0);

          if(layer==='rain' && val < 0.6) { data[i*4+3]=0; continue; }
          if(layer==='cloud' && val < 10) { data[i*4+3]=0; continue; }

          col = interpStops(val, stops);
        }
        const p = i*4;
        data[p] = col.r; data[p+1] = col.g; data[p+2] = col.b; data[p+3] = Math.round(col.a*255);
      }
      octx.putImageData(img, 0, 0);

      const tl = map.latLngToContainerPoint([m.la1, m.lo1]);
      const br = map.latLngToContainerPoint([m.la2, m.lo2]);

      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(off, tl.x, tl.y, br.x-tl.x, br.y-tl.y);
      ctx.restore();
    });
  }

  function drawLatLonGrid(){
    const ctx = gridCanvas.getContext('2d');
    const s = map.getSize();
    gridCanvas.width = s.x; gridCanvas.height = s.y;
    L.DomUtil.setPosition(gridCanvas, map.containerPointToLayerPoint([0,0]));
    ctx.clearRect(0,0,s.x,s.y);
    if(!showGrid) return;

    const b = map.getBounds();
    const zoom = map.getZoom();
    let step = 1.0; if(zoom >= 9) step = 0.5; if(zoom >= 11) step = 0.2;

    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.setLineDash([5, 5]);
    ctx.font = "10px sans-serif";
    ctx.fillStyle = "#aaa";

    const startLon = Math.ceil(b.getWest() / step) * step;
    for(let lon = startLon; lon <= b.getEast(); lon += step){
      const x = map.latLngToContainerPoint([b.getSouth(), lon]).x;
      if(x<0||x>s.x) continue;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, s.y); ctx.stroke();
      ctx.fillText(lon.toFixed(1) + "°E", x + 2, s.y - 10);
    }

    const startLat = Math.ceil(b.getSouth() / step) * step;
    for(let lat = startLat; lat <= b.getNorth(); lat += step){
      const y = map.latLngToContainerPoint([lat, b.getWest()]).y;
      if(y<0||y>s.y) continue;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s.x, y); ctx.stroke();
      ctx.fillText(lat.toFixed(1) + "°N", 5, y - 2);
    }
    ctx.setLineDash([]);
  }

  function drawWindArrows(){
    const ctx = arrowCanvas.getContext('2d');
    const s = map.getSize();
    arrowCanvas.width = s.x; arrowCanvas.height = s.y;
    L.DomUtil.setPosition(arrowCanvas, map.containerPointToLayerPoint([0,0]));
    ctx.clearRect(0,0,s.x,s.y);

    if(!selected.has('wind') || !currentData) return;
    const m = currentData.meta; const zoom = map.getZoom();

    const stride = zoom >= 10 ? 3 : (zoom >= 9 ? 4 : 5);
    const baseLen = zoom >= 10 ? 28 : 22;
    const baseWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for(let y=0; y<m.ny; y+=stride){
      const lat = m.la1 - y*m.dy;
      for(let x=0; x<m.nx; x+=stride){
        const idx = y*m.nx + x;
        const u = currentData.wind_u.data[idx], v = currentData.wind_v.data[idx];
        const sp = Math.sqrt(u*u+v*v);
        if(sp < 1) continue;
        const lon = m.lo1 + x*m.dx;
        const p = map.latLngToContainerPoint([lat, lon]);

        const cRg = vividWindColor(sp);
        const fillStyle = `rgb(${cRg.r},${cRg.g},${cRg.b})`;
        const speedScale = clamp(sp/9.0, 0.65, 2.5);
        const currentLen = baseLen*speedScale;
        const currentWidth = baseWidth*speedScale;
        const headLen = currentLen*0.4;
        const headWidth = headLen*0.75;
        const angle = Math.atan2(-v, u);

        const shaftEndX = p.x + (currentLen-headLen)*Math.cos(angle);
        const shaftEndY = p.y + (currentLen-headLen)*Math.sin(angle);

        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(shaftEndX, shaftEndY);
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = currentWidth+2.5;
        ctx.stroke();
        ctx.strokeStyle = fillStyle;
        ctx.lineWidth = currentWidth;
        ctx.stroke();

        const tipX = p.x + currentLen*Math.cos(angle);
        const tipY = p.y + currentLen*Math.sin(angle);
        const wing1X = shaftEndX - headWidth*Math.cos(angle - Math.PI/2);
        const wing1Y = shaftEndY - headWidth*Math.sin(angle - Math.PI/2);
        const wing2X = shaftEndX - headWidth*Math.cos(angle + Math.PI/2);
        const wing2Y = shaftEndY - headWidth*Math.sin(angle + Math.PI/2);

        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(wing1X, wing1Y);
        ctx.lineTo(wing2X, wing2Y);
        ctx.closePath();

        ctx.fillStyle = "#000000";
        ctx.fill();
        ctx.lineWidth = 1.0;
        ctx.strokeStyle = "#000000";
        ctx.stroke();

        ctx.fillStyle = fillStyle;
        ctx.fill();
      }
    }
  }

  function updateParticles(){
    if(velocityLayer) { map.removeLayer(velocityLayer); velocityLayer = null; }
    if(!particlesOn || !currentData) return;

    velocityLayer = L.velocityLayer({
      displayValues: false,
      data: [ currentData.wind_u, currentData.wind_v ],
      maxVelocity: 20.0,
      velocityScale: 0.008,
      particleMultiplier: 1/180,
      lineWidth: 2.0,
      particleAge: 100,
      frameRate: 40,
      opacity: 1.0,
      colorScale: WIND_COLOR_SCALE,
      pane: 'particlePane'
    });
    velocityLayer.onAdd = function(map){
      L.VelocityLayer.prototype.onAdd.call(this, map);
      this._canvas.classList.add('velocity-canvas');
    };
    velocityLayer.addTo(map);
  }

  function drawIsobars(){
    const ctx = isoCanvas.getContext('2d');
    const s = map.getSize();
    isoCanvas.width = s.x; isoCanvas.height = s.y;
    L.DomUtil.setPosition(isoCanvas, map.containerPointToLayerPoint([0,0]));
    ctx.clearRect(0,0,s.x,s.y);

    if(!showIsobars || !currentData?.press || !currentData?.meta) return;

    const m = currentData.meta;

    // clean (evita valori fuori scala)
    const press = new Float32Array(currentData.press.length);
    for(let i=0;i<press.length;i++){
      const v = currentData.press[i];
      press[i] = (Number.isFinite(v) && v>=850 && v<=1100) ? v : 1013.25;
    }

    // thresholds sinottici: 2 hPa, più spesse ogni 4 e 8
    const thresholds = d3.range(960, 1052, 2);

    const {off, contours, path, octx} = renderContoursOffscreen(press, m.nx, m.ny, thresholds);

    // disegno su griglia (offscreen)
    octx.save();
    octx.clearRect(0,0,m.nx,m.ny);
    octx.translate(0,0);
    octx.scale(1,1);

    contours.forEach(c=>{
      const v = Math.round(c.value);
      const is8 = (v % 8 === 0);
      const is4 = (v % 4 === 0);

      octx.beginPath();
      path(c);

      octx.strokeStyle = "rgba(255,255,255,0.75)";
      octx.lineWidth = is8 ? 2.2 : (is4 ? 1.6 : 1.0);
      octx.setLineDash([]);
      octx.stroke();

      // etichetta sul canvas principale (non sull'offscreen), solo per linee ogni 4 hPa
    });

    octx.restore();

    // proietta su mappa
    const tl = map.latLngToContainerPoint([m.la1, m.lo1]);
    const br = map.latLngToContainerPoint([m.la2, m.lo2]);

    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, tl.x, tl.y, br.x-tl.x, br.y-tl.y);
    ctx.restore();

    // labels valori pressione lungo le linee (ogni 4 hPa)
    const z = map.getZoom();
    const labelPx = Math.round(clamp(10 + (z-7)*1.4, 10, 18));
    ctx.font = `900 ${labelPx}px Arial`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillStyle="#fff";
    ctx.strokeStyle="rgba(0,0,0,0.8)";
    ctx.lineWidth = Math.max(3, Math.round(labelPx*0.35));

    for(const c of contours){
      const v = Math.round(c.value);
      if(v % 4 !== 0) continue;

      const pxy = pickLabelPoint(c);
      if(!pxy) continue;

      const x = pxy[0], y = pxy[1];
      const lat = m.la1 - y*m.dy;
      const lon = m.lo1 + x*m.dx;
      const p = map.latLngToContainerPoint([lat, lon]);

      // evita label fuori vista
      if(p.x<0||p.y<0||p.x>s.x||p.y>s.y) continue;

      const txt = String(v);
      ctx.strokeText(txt, p.x, p.y);
      ctx.fillText(txt, p.x, p.y);
    }

    // A/B sinottiche (coerenti)
    const extrema = findPressureExtrema(press, m);
    drawAB(ctx, extrema);
  }

  function drawIsotherms(){
    const ctx = thermoCanvas.getContext('2d');
    const s = map.getSize();
    thermoCanvas.width = s.x; thermoCanvas.height = s.y;
    L.DomUtil.setPosition(thermoCanvas, map.containerPointToLayerPoint([0,0]));
    ctx.clearRect(0,0,s.x,s.y);

    if(!showIsotherms || !currentData?.temp || !currentData?.meta) return;

    const m = currentData.meta;

    // field temperatura pulito
    const temp = new Float32Array(currentData.temp.length);
    for(let i=0;i<temp.length;i++){
      const v = currentData.temp[i];
      temp[i] = Number.isFinite(v) ? v : 0;
    }

    // isoterme “sensibili”: ogni 1°C, ma label ogni 5°C
    const tMin = -30, tMax = 50;
    const thresholds = d3.range(tMin, tMax+1, 1);

    const {off, contours, path, octx} = renderContoursOffscreen(temp, m.nx, m.ny, thresholds);

    octx.save();
    octx.clearRect(0,0,m.nx,m.ny);

    contours.forEach(c=>{
      const v = Math.round(c.value);
      const is5 = (v % 5 === 0);

      octx.beginPath();
      path(c);

      // isoterme sottili, ogni 5°C più spesse
      octx.strokeStyle = is5 ? "rgba(255,255,255,0.55)" : "rgba(255,255,255,0.22)";
      octx.lineWidth = is5 ? 1.6 : 0.8;
      octx.setLineDash(is5 ? [] : [3,4]);
      octx.stroke();
    });

    octx.restore();

    // proietta su mappa
    const tl = map.latLngToContainerPoint([m.la1, m.lo1]);
    const br = map.latLngToContainerPoint([m.la2, m.lo2]);

    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, tl.x, tl.y, br.x-tl.x, br.y-tl.y);
    ctx.restore();

    // label ogni 5°C grandi e che reagiscono allo zoom
    const z = map.getZoom();
    const labelPx = Math.round(clamp(12 + (z-7)*2.0, 12, 28));
    ctx.font = `900 ${labelPx}px Arial`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillStyle="rgba(255,255,255,0.92)";
    ctx.strokeStyle="rgba(0,0,0,0.85)";
    ctx.lineWidth = Math.max(3, Math.round(labelPx*0.35));

    for(const c of contours){
      const v = Math.round(c.value);
      if(v % 5 !== 0) continue;

      const pxy = pickLabelPoint(c);
      if(!pxy) continue;

      const x = pxy[0], y = pxy[1];
      const lat = m.la1 - y*m.dy;
      const lon = m.lo1 + x*m.dx;
      const p = map.latLngToContainerPoint([lat, lon]);

      if(p.x<0||p.y<0||p.x>s.x||p.y>s.y) continue;

      const txt = `${v}°`;
      ctx.strokeText(txt, p.x, p.y);
      ctx.fillText(txt, p.x, p.y);
    }
  }

  // ---------- UI toggles ----------
  window.toggleLayer = function(name){
    if(selected.has(name)) selected.delete(name); else selected.add(name);
    updateToggleUI(); redrawAll();
  }
  window.toggleIsobars = function(){ showIsobars=!showIsobars; updateToggleUI(); redrawAll(); }
  window.toggleIsotherms = function(){ showIsotherms=!showIsotherms; updateToggleUI(); redrawAll(); }
  window.toggleGrid = function(){ showGrid=!showGrid; updateToggleUI(); redrawAll(); }
  window.toggleParticles = function(){ particlesOn=!particlesOn; updateToggleUI(); redrawAll(); }

  function updateToggleUI(){
    document.querySelectorAll('.toggle').forEach(el => {
      const txt = el.innerText.toLowerCase();
      if(txt.includes('vento') && selected.has('wind')) el.classList.add('active');
      else if(txt.includes('temp') && selected.has('temp')) el.classList.add('active');
      else if(txt.includes('pioggia') && selected.has('rain')) el.classList.add('active');
      else if(txt.includes('umidità') && selected.has('rh')) el.classList.add('active');
      else if(txt.includes('pressione') && selected.has('press')) el.classList.add('active');
      else if(txt.includes('nuvole') && selected.has('cloud')) el.classList.add('active');
      else if(txt.includes('isobare') && showIsobars) el.classList.add('active');
      else if(txt.includes('isoterme') && showIsotherms) el.classList.add('active');
      else if(txt.includes('reticolo') && showGrid) el.classList.add('active');
      else el.classList.remove('active');
    });

    const btnFlow = document.getElementById('btn-flow');
    if(particlesOn) btnFlow.classList.add('active'); else btnFlow.classList.remove('active');
    document.getElementById('wind-rose').style.display = selected.has('wind') ? 'flex' : 'none';
  }

  // ---------- Pick value ----------
  function onPick(e){
    if(!currentData) return;
    const m = currentData.meta;
    const y = Math.round((m.la1 - e.latlng.lat)/m.dy);
    const x = Math.round((e.latlng.lng - m.lo1)/m.dx);
    if(x<0||x>=m.nx||y<0||y>=m.ny) return;
    const idx = y*m.nx + x;

    let val='--', unit='';
    if(selected.has('rain') && currentData.rain) { val = (currentData.rain[idx] ?? 0).toFixed(1); unit='mm'; }
    else if(selected.has('temp') && currentData.temp) { val = (currentData.temp[idx] ?? 0).toFixed(1); unit='°C'; }
    else if(selected.has('wind') && currentData.wind_u && currentData.wind_v) {
      const u=currentData.wind_u.data[idx], v=currentData.wind_v.data[idx];
      val = (Math.sqrt(u*u+v*v)*3.6).toFixed(1); unit='km/h';
      const arrow = document.getElementById('rose-arrow');
      const deg = 90 - (Math.atan2(v, u) * 180 / Math.PI);
      arrow.style.transform = `rotate(${deg}deg)`;
    }
    else if(selected.has('rh') && currentData.rh) { val = Math.round(currentData.rh[idx] ?? 0); unit='%'; }
    else if(selected.has('press') && currentData.press) { val = Math.round(currentData.press[idx] ?? 0); unit='hPa'; }

    document.getElementById('val-display').innerText = val;
    document.getElementById('unit-display').innerText = unit;
  }

  // ---------- Timeline ----------
  window.togglePlay = function(){
    if(isPlaying){ isPlaying=false; document.getElementById('play-btn').innerText='►'; return; }
    isPlaying=true; document.getElementById('play-btn').innerText='❚❚';
    const s = document.getElementById('time-slider');
    let i = parseInt(s.value);
    const loop = setInterval(()=>{
      if(!isPlaying || i>=s.max) {
        clearInterval(loop);
        isPlaying=false;
        document.getElementById('play-btn').innerText='►';
        return;
      }
      i++; s.value=i; loadStep(i);
    }, 800);
  }
