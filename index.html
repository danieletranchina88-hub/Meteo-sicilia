<!DOCTYPE html>
<html>
<head>
  <title>Sicilia MeteoHub - ICON-2I FINAL STABLE</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-velocity@1.8.0/dist/leaflet-velocity.css" />
  <script src="https://unpkg.com/leaflet-velocity@1.8.0/dist/leaflet-velocity.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; color: #ddd; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #1a1a1a; }

    /* HEADER */
    #model-info { position: absolute; top: 15px; left: 60px; z-index: 3000; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
    #model-title { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 1px; }
    #model-sub { font-size: 12px; font-weight: 500; color: #ccc; font-family: monospace; margin-top: 2px; }

    #coords-display { position: absolute; bottom: 4px; left: 90px; z-index: 3000; pointer-events: none; font-family: monospace; font-size: 11px; font-weight: bold; color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; }
    .leaflet-control-scale-line { background: rgba(0,0,0,0.5) !important; border: 1px solid rgba(255,255,255,0.4) !important; border-top: none !important; color: #eee !important; font-weight: bold; font-size: 10px; }

    /* INFO BOX */
    #info-box { position: absolute; top: 15px; left: 20px; z-index: 9999; pointer-events: none; display: flex; align-items: center; gap: 15px; }
    #val-group { display: flex; flex-direction: column; align-items: flex-start; margin-top: 40px; }
    #val-display { font-size: 3.2em; font-weight: 900; line-height: 0.9; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    #unit-display { font-size: 1.1em; color: #aaa; font-weight: 850; margin-top: 4px; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }

    #wind-rose { width: 45px; height: 45px; background: rgba(255,255,255,0.9); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: none; align-items: center; justify-content: center; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-top: 40px; }
    #rose-arrow { width: 24px; height: 24px; fill: #000; transition: transform 0.1s; }

    /* UI CONTROLS */
    #ui-container { position: absolute; top: 10px; right: 10px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: auto; }
    .panel { background: rgba(30,30,30,0.9); backdrop-filter: blur(5px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.5); color: #eee; }
    .toggle { width: 170px; display:flex; align-items:center; justify-content:space-between; padding: 8px 12px; margin: 5px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ccc; border-radius: 8px; cursor: pointer; user-select:none; font-weight: 700; font-size: 13px; transition: background 0.1s; }
    .toggle.active { background: #0077ff; color: #fff; }
    
    .mini { width: 170px; padding: 8px 12px; border-radius: 8px; font-size:13px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color:#ccc; cursor:pointer; font-weight:800; }
    .mini.active { background: #eee; color:#111; border-color: #fff; }

    #bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); display: flex; align-items: center; padding: 0 20px; z-index: 9999; pointer-events: auto; }
    #play-btn { font-size: 2.2em; background: none; border: none; color: #fff; cursor: pointer; margin-right: 15px; }
    #time-label { font-size: 1.3em; font-weight: 900; margin-left: 15px; min-width: 140px; text-align: center; color: #fff; }
    input[type=range] { flex-grow: 1; height: 5px; cursor: pointer; accent-color: #0077ff; background: rgba(255,255,255,0.2); }

    .dark-relief-tiles { filter: invert(100%) hue-rotate(180deg) brightness(0.8) contrast(1.2) grayscale(20%); }
    canvas.leaflet-layer { pointer-events: none !important; position: absolute; top: 0; left: 0; }
    canvas.leaflet-layer.scalar-layer { mix-blend-mode: screen; opacity: 0.85; }
    canvas.leaflet-layer.velocity-canvas { mix-blend-mode: normal; opacity: 0.35; } 

  </style>
</head>

<body>
  <div id="model-info">
    <div id="model-title">ICON-2I <span style="color:#0077ff">2.2km</span></div>
    <div id="model-sub">INIT: 12:00 UTC <span style="opacity:0.5">|</span> VALID: <span id="valid-time" style="color:#fff; font-weight:bold">--</span></div>
  </div>
  <div id="coords-display">LAT: --.---- LON: --.----</div>

  <div id="info-box">
    <div id="val-group"><div id="val-display">--</div><div id="unit-display">Attendere...</div></div>
    <div id="wind-rose">
        <svg id="rose-arrow" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" /></svg>
    </div>
  </div>

  <div id="ui-container">
    <div class="panel">
      <button id="btn-flow" class="mini active" onclick="toggleParticles()">FLUSSO 🌬️ (ON)</button>
    </div>
    <div class="panel">
      <div style="font-weight:950; opacity:0.8; margin-bottom:6px; color:#aaa; font-size:11px;">DATA LAYERS</div>
      <div class="toggle active" onclick="toggleLayer('wind')"><span>VENTO 🧭</span><span>●</span></div>
      <div class="toggle" onclick="toggleLayer('temp')"><span>TEMP 🌡️</span><span>●</span></div>
      <div class="toggle" onclick="toggleLayer('rain')"><span>PIOGGIA ☔</span><span>●</span></div>
      <div class="toggle" onclick="toggleLayer('rh')"><span>UMIDITÀ 💧</span><span>●</span></div>
      <div class="toggle" onclick="toggleLayer('press')"><span>PRESSIONE ⏲️</span><span>●</span></div>
      <div class="toggle" onclick="toggleLayer('cloud')"><span>NUVOLE ☁️</span><span>●</span></div>
      <div style="height:1px; background: rgba(255,255,255,0.1); margin:8px 0;"></div>
      <div class="toggle" id="btn-iso" onclick="toggleIsobars()"><span>ISOBARE 〰️</span><span> </span></div>
      <div class="toggle" id="btn-therm" onclick="toggleIsotherms()"><span>ISOTERME 🌡️</span><span> </span></div>
      <div class="toggle" id="btn-grid" onclick="toggleGrid()"><span>RETICOLO #</span><span> </span></div>
    </div>
  </div>

  <div id="map"></div>

  <div id="bottom-bar">
    <button id="play-btn" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label">--/-- --:--</div>
  </div>

<script>
  const LAT_OFFSET = 0.00; const LON_OFFSET = 0.00;
  const SICILY_BOUNDS = L.latLngBounds(L.latLng(35.0, 11.0), L.latLng(39.5, 16.5));
  const DPR = window.devicePixelRatio || 1;

  const WIND_COLOR_SCALE = ["#000080", "#0044ff", "#00ddff", "#00ff55", "#ffff00", "#ff6600", "#ff0000", "#ff00ff"];
  const TEMP_STOPS = [{v:-15,c:[156,218,216]},{v:0,c:[93,133,198]},{v:15,c:[181,165,13]},{v:30,c:[232,83,25]},{v:45,c:[89,22,3]}];
  const RAIN_STOPS = [{v:0.0,c:[0,0,0],a:0},{v:0.6,c:[100,200,255],a:0.7},{v:5,c:[0,0,255],a:0.85},{v:50,c:[255,0,0],a:0.92}];
  const RH_STOPS = [{v:0,c:[173,85,56]},{v:50,c:[105,173,56]},{v:100,c:[56,70,114]}];
  const PRESS_STOPS = [{v:950,c:[0,32,96]},{v:1013,c:[182,182,182]},{v:1040,c:[48,8,24]}];
  const CLOUD_STOPS = [{v:0,c:[255,255,255],a:0},{v:100,c:[90,90,90],a:0.78}];

  let map, currentData = null, catalog = [];
  const selected = new Set(['wind']);
  let showIsobars = false, showIsotherms = false, showGrid = false, particlesOn = true;
  let scalarCanvases = {}, arrowCanvas, isoCanvas, thermCanvas, gridCanvas;
  let velocityLayer = null, isPlaying = false;

  function interpStops(val, stops) {
    if(val <= stops[0].v) return {r:stops[0].c[0],g:stops[0].c[1],b:stops[0].c[2],a:(stops[0].a!==undefined?stops[0].a:0.9)};
    for(let i=0; i<stops.length-1; i++){
      if(val >= stops[i].v && val <= stops[i+1].v){
        const t = (val - stops[i].v) / (stops[i+1].v - stops[i].v);
        return {
          r: (stops[i].c[0]*(1-t) + stops[i+1].c[0]*t)|0,
          g: (stops[i].c[1]*(1-t) + stops[i+1].c[1]*t)|0,
          b: (stops[i].c[2]*(1-t) + stops[i+1].c[2]*t)|0,
          a: ((stops[i].a!==undefined?stops[i].a:0.9)*(1-t) + (stops[i+1].a!==undefined?stops[i+1].a:0.9)*t)
        };
      }
    }
    return {r:stops[stops.length-1].c[0],g:stops[stops.length-1].c[1],b:stops[stops.length-1].c[2],a:(stops[stops.length-1].a!==undefined?stops[stops.length-1].a:0.9)};
  }

  function vividWindColor(sp){
    const t = Math.min(sp/20, 0.99);
    const idx = (t*(WIND_COLOR_SCALE.length-1))|0, f = (t*(WIND_COLOR_SCALE.length-1)) - idx;
    const c1 = WIND_COLOR_SCALE[idx], c2 = WIND_COLOR_SCALE[idx+1] || c1;
    const r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
    const r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
    return {r:(r1*(1-f)+r2*f)|0, g:(g1*(1-f)+g2*f)|0, b:(b1*(1-f)+b2*f)|0};
  }

  window.addEventListener('load', async () => {
    map = L.map('map', { zoomControl: false, background: '#1a1a1a', minZoom: 4 }).fitBounds(SICILY_BOUNDS);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', { maxZoom: 13, className: 'dark-relief-tiles' }).addTo(map);

    // CONFINI SOPRA TUTTO (zIndex 1000)
    map.createPane('boundaryPane').style.zIndex = 1000;
    map.getPane('boundaryPane').style.pointerEvents = 'none';
    fetch('https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson').then(r=>r.json()).then(data=>L.geoJSON(data,{pane:'boundaryPane',style:{color:"#ffffff",weight:1.5,opacity:0.6,fillOpacity:0}}).addTo(map));

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, className: 'dark-relief-tiles', opacity: 0.4 }).addTo(map);
    L.control.scale({ position: 'bottomleft', metric: true, imperial: false }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { zIndex: 1100, opacity: 0.9 }).addTo(map);

    const overlay = map.getPanes().overlayPane;
    const mk = (z, cl) => { const c = L.DomUtil.create('canvas', 'leaflet-layer ' + (cl||'')); c.style.zIndex = z; overlay.appendChild(c); return c; };
    scalarCanvases = { wind: mk(290,'scalar-layer'), temp: mk(300,'scalar-layer'), rain: mk(310,'scalar-layer'), rh: mk(320,'scalar-layer'), press: mk(330,'scalar-layer'), cloud: mk(340,'scalar-layer') };
    arrowCanvas = mk(380); isoCanvas = mk(420); thermCanvas = mk(430); gridCanvas = mk(450);
    map.createPane('particlePane').style.zIndex = 800;

    await loadCatalog();
    map.on('mousemove', onPick);
    map.on('moveend', redrawAll);
  });

  async function loadCatalog(){
    const r = await fetch('data_weather/catalog.json?t='+Date.now()); catalog = await r.json();
    const s = document.getElementById('time-slider'); s.max = catalog.length-1;
    s.addEventListener('input', e => loadStep(parseInt(e.target.value)));
    await loadStep(0);
  }

  async function loadStep(i){
    if(!catalog[i]) return;
    document.getElementById('time-label').innerText = catalog[i].label;
    document.getElementById('valid-time').innerText = catalog[i].label.split(' ')[1] || '--:--';
    const r = await fetch('data_weather/'+catalog[i].file); currentData = await r.json();
    if(currentData.press) {
        const clean = new Float32Array(currentData.press.length);
        for(let j=0; j<currentData.press.length; j++){ 
            let v = currentData.press[j]; if(v > 2000) v /= 100;
            clean[j] = (!v || v < 850) ? 1013 : v; 
        }
        currentData.cleanPress = clean;
    }
    redrawAll();
  }

  function redrawAll(){
    if(!currentData) return;
    const z = map.getZoom(), res = z>=10?0.8:(z>=8?0.5:0.25), size = map.getSize();
    const w = Math.ceil(size.x*res), h = Math.ceil(size.y*res);

    ['wind','temp','rain','rh','press','cloud'].forEach(l => {
      const c = scalarCanvases[l], ctx = c.getContext('2d');
      c.width=w; c.height=h; c.style.width=size.x+'px'; c.style.height=size.y+'px';
      L.DomUtil.setPosition(c, map.containerPointToLayerPoint([0,0]));
      if(!selected.has(l)){ ctx.clearRect(0,0,w,h); return; }
      const img = ctx.createImageData(w,h), d = img.data, m = currentData.meta;
      let arr = (l==='cloud'?(currentData.cloud||currentData.cld):currentData[l]);
      for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
          const ll = map.containerPointToLatLng([x/res, y/res]);
          const gx = (ll.lng-m.lo1)/m.dx, gy = (m.la1-ll.lat)/m.dy;
          if(gx<0||gy<0||gx>m.nx-1||gy>m.ny-1) continue;
          const idx = (gy|0)*m.nx+(gx|0);
          let col = {r:0,g:0,b:0,a:0};
          if(l==='wind'){
            const rgb = vividWindColor(Math.sqrt(currentData.wind_u.data[idx]**2 + currentData.wind_v.data[idx]**2)); col={...rgb,a:0.35};
          } else {
            let val = arr[idx]; if(l==='press' && val > 2000) val /= 100;
            if((l==='rain'&&val<0.6)||(l==='cloud'&&val<5)) col.a=0; 
            else col=interpStops(val, l==='temp'?TEMP_STOPS: (l==='rain'?RAIN_STOPS: (l==='rh'?RH_STOPS: (l==='press'?PRESS_STOPS:CLOUD_STOPS))));
          }
          const i=(y*w+x)*4; d[i]=col.r; d[i+1]=col.g; d[i+2]=col.b; d[i+3]=col.a*255;
        }
      }
      ctx.putImageData(img,0,0);
    });

    drawWindArrows(); drawIsobars(); drawIsotherms(); drawLatLonGrid(); updateParticles();
  }

  function drawWindArrows(){
    const size = map.getSize(), ctx = arrowCanvas.getContext('2d');
    arrowCanvas.width=size.x*DPR; arrowCanvas.height=size.y*DPR; arrowCanvas.style.width=size.x+'px'; arrowCanvas.style.height=size.y+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0); L.DomUtil.setPosition(arrowCanvas, map.containerPointToLayerPoint([0,0]));
    if(!selected.has('wind')) return;
    const m = currentData.meta, z = map.getZoom(); let stride = z>=11?3:4;
    for(let y=0; y<m.ny; y+=stride){
      for(let x=0; x<m.nx; x+=stride){
        const u = currentData.wind_u.data[y*m.nx+x], v = currentData.wind_v.data[y*m.nx+x], sp = Math.sqrt(u*u+v*v);
        if(sp < 1.2) continue;
        const p = map.latLngToContainerPoint([m.la1-y*m.dy, m.lo1+x*m.dx]);
        const c = vividWindColor(sp), ang = Math.atan2(-v, u), len = Math.min(25*(0.7+sp/15), 45);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
        ctx.beginPath(); ctx.moveTo(-len/2, 0); ctx.lineTo(len/2, 0); ctx.strokeStyle = `rgb(${c.r},${c.g},${c.b})`; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(len/2, 0); ctx.lineTo(len/2-8, -5); ctx.lineTo(len/2-8, 5); ctx.closePath(); ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`; ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawIsobars(){
    const size = map.getSize(), ctx = isoCanvas.getContext('2d');
    isoCanvas.width=size.x*DPR; isoCanvas.height=size.y*DPR; isoCanvas.style.width=size.x+'px'; isoCanvas.style.height=size.y+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0); L.DomUtil.setPosition(isoCanvas, map.containerPointToLayerPoint([0,0]));
    if(!showIsobars||!currentData?.cleanPress) return;
    const m = currentData.meta, smooth = smoothGrid(currentData.cleanPress, m.nx, m.ny);
    const contours = d3.contours().size([m.nx,m.ny]).thresholds(d3.range(960,1050,2))(smooth);
    ctx.strokeStyle="rgba(255,255,255,0.8)"; ctx.lineWidth=1.8;
    contours.forEach(c => {
      c.coordinates.forEach(poly => poly.forEach(ring => {
        ctx.beginPath(); ring.forEach((p,i) => {
          const pt = map.latLngToContainerPoint([m.la1-p[1]*m.dy, m.lo1+p[0]*m.dx]);
          if(i===0) ctx.moveTo(pt.x,pt.y); else ctx.lineTo(pt.x,pt.y);
        }); ctx.stroke();
      }));
    });
    // Centri A/B deduplicati
    const r = 35; let ex = [];
    for(let y=r; y<m.ny-r; y++){
      for(let x=r; x<m.nx-r; x++){
        const v = smooth[y*m.nx+x]; let isM=true, ism=true;
        for(let yy=y-r; yy<=y+r; yy++) for(let xx=x-r; xx<=x+r; xx++){ if(smooth[yy*m.nx+xx]>v) isM=false; if(smooth[yy*m.nx+xx]<v) ism=false; }
        if(isM && v>1016) ex.push({t:'A',x,y,v}); if(ism && v<1012) ex.push({t:'B',x,y,v});
      }
    }
    let kept = [];
    ex.forEach(p => {
        const s = map.latLngToContainerPoint([m.la1-p.y*m.dy, m.lo1+p.x*m.dx]);
        if(!kept.some(k => Math.hypot(k.x-s.x, k.y-s.y) < 150)) kept.push({x:s.x, y:s.y, t:p.t});
    });
    kept.forEach(pt => {
        const sz = clamp(50+(map.getZoom()-7)*8, 40, 90);
        ctx.save(); ctx.shadowColor="black"; ctx.shadowBlur=8; ctx.font=`900 ${sz}px Arial`; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillStyle=pt.t==='A'?"#ff2b2b":"#2b6bff"; ctx.strokeStyle="white"; ctx.lineWidth=5;
        ctx.strokeText(pt.t, pt.x, pt.y); ctx.fillText(pt.t, pt.x, pt.y); ctx.restore();
    });
  }

  function drawIsotherms(){
    const size = map.getSize(), ctx = thermCanvas.getContext('2d');
    thermCanvas.width=size.x*DPR; thermCanvas.height=size.y*DPR; thermCanvas.style.width=size.x+'px'; thermCanvas.style.height=size.y+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0); L.DomUtil.setPosition(thermCanvas, map.containerPointToLayerPoint([0,0]));
    if(!showIsotherms||!currentData?.temp) return;
    const m = currentData.meta, contours = d3.contours().size([m.nx,m.ny]).thresholds(d3.range(-20,50,5))(currentData.temp);
    ctx.strokeStyle="rgba(255,255,255,0.6)"; ctx.lineWidth=1.2; ctx.setLineDash([4,4]);
    contours.forEach(c => c.coordinates.forEach(poly => poly.forEach(ring => { ctx.beginPath(); ring.forEach((p,i) => { const pt = map.latLngToContainerPoint([m.la1-p[1]*m.dy, m.lo1+p[0]*m.dx]); if(i===0) ctx.moveTo(pt.x,pt.y); else ctx.lineTo(pt.x,pt.y); }); ctx.stroke(); })));
  }

  function updateParticles(){
    if(velocityLayer) map.removeLayer(velocityLayer);
    if(!particlesOn||!currentData) return;
    velocityLayer = L.velocityLayer({ displayValues:false, data:[currentData.wind_u, currentData.wind_v], maxVelocity:20, velocityScale:0.008, particleMultiplier:1/180, lineWidth:2, opacity:0.35, colorScale:["#ffffff"], pane:'particlePane' }).addTo(map);
  }

  function drawLatLonGrid(){
    const size = map.getSize(), ctx = gridCanvas.getContext('2d');
    gridCanvas.width=size.x*DPR; gridCanvas.height=size.y*DPR; gridCanvas.style.width=size.x+'px'; gridCanvas.style.height=size.y+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0); L.DomUtil.setPosition(gridCanvas, map.containerPointToLayerPoint([0,0]));
    if(!showGrid) return;
    ctx.strokeStyle="rgba(255,255,255,0.2)"; ctx.setLineDash([5,5]); ctx.font="10px Arial"; ctx.fillStyle="#aaa";
    const b = map.getBounds(); for(let lo=Math.ceil(b.getWest()); lo<=b.getEast(); lo+=1){ const x=map.latLngToContainerPoint([0,lo]).x; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,size.y); ctx.stroke(); ctx.fillText(lo+'°E',x+2,size.y-5); }
    for(let la=Math.ceil(b.getSouth()); la<=b.getNorth(); la+=1){ const y=map.latLngToContainerPoint([la,0]).y; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(size.x,y); ctx.stroke(); ctx.fillText(la+'°N',5,y-2); }
  }

  function onPick(e){
    if(!currentData?.meta) return; const m = currentData.meta;
    const gx = (e.latlng.lng-m.lo1)/m.dx, gy = (m.la1-e.latlng.lat)/m.dy;
    if(gx<0||gy<0||gx>m.nx-1||gy>m.ny-1) return;
    const idx = (gy|0)*m.nx+(gx|0);
    let val='--', unit='';
    if(selected.has('temp')){ val=currentData.temp[idx].toFixed(1); unit='°C'; }
    else if(selected.has('wind')){ val=(Math.sqrt(currentData.wind_u.data[idx]**2 + currentData.wind_v.data[idx]**2)*3.6).toFixed(1); unit='km/h'; document.getElementById('rose-arrow').style.transform=`rotate(${90-Math.atan2(currentData.wind_v.data[idx],currentData.wind_u.data[idx])*180/Math.PI}deg)`; document.getElementById('wind-rose').style.display='flex'; }
    else if(selected.has('rain')){ val=currentData.rain[idx].toFixed(1); unit='mm'; }
    else if(selected.has('rh')){ val=Math.round(currentData.rh[idx]); unit='%'; }
    else if(selected.has('press')){ let p=currentData.press[idx]; if(p>2000)p/=100; val=Math.round(p); unit='hPa'; }
    else if(selected.has('cloud')){ val=Math.round((currentData.cloud||currentData.cld)[idx]); unit='%'; }
    document.getElementById('val-display').innerText=val; document.getElementById('unit-display').innerText=unit;
  }

  window.toggleLayer = (n) => { if(selected.has(n)) selected.delete(n); else selected.add(n); updateUI(); redrawAll(); };
  window.toggleIsobars = () => { showIsobars=!showIsobars; updateUI(); redrawAll(); };
  window.toggleIsotherms = () => { showIsotherms=!showIsotherms; updateUI(); redrawAll(); };
  window.toggleGrid = () => { showGrid=!showGrid; updateUI(); redrawAll(); };
  window.toggleParticles = () => { particlesOn=!particlesOn; updateUI(); redrawAll(); };

  function updateUI(){
    document.querySelectorAll('.toggle').forEach(el => {
      const t = el.innerText.toLowerCase();
      if((t.includes('vento')&&selected.has('wind')) || (t.includes('temp')&&selected.has('temp')) || (t.includes('pioggia')&&selected.has('rain')) || (t.includes('umidità')&&selected.has('rh')) || (t.includes('pressione')&&selected.has('press')) || (t.includes('nuvole')&&selected.has('cloud')) || (t.includes('isobare')&&showIsobars) || (t.includes('isoterme')&&showIsotherms) || (t.includes('reticolo')&&showGrid)) el.classList.add('active'); else el.classList.remove('active');
    });
    document.getElementById('btn-flow').className = particlesOn ? 'mini active' : 'mini';
  }

  window.togglePlay = () => { 
    if(isPlaying){ isPlaying=false; document.getElementById('play-btn').innerText='►'; return; }
    isPlaying=true; document.getElementById('play-btn').innerText='❚❚';
    let i = parseInt(document.getElementById('time-slider').value);
    const loop = setInterval(()=>{ if(!isPlaying||i>=catalog.length-1){ clearInterval(loop); isPlaying=false; document.getElementById('play-btn').innerText='►'; return; } i++; document.getElementById('time-slider').value=i; loadStep(i); }, 800);
  };
</script>
</body>
</html>
