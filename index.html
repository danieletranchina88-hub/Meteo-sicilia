<!DOCTYPE html>

      z-index: 6000; display: flex; align-items: center; justify-content: space-around;

<script>
/* =========================
   CONFIG + PALETTE
========================= */
const DPR = window.devicePixelRatio || 1;

// Italia (tutta): bounds larghi per non “bloccare”

let map, currentData=null, catalog=[], isPlaying=false;
const selected = new Set(['wind']);
let showIsobars=false, showIsotherms=false, particlesOn=true;
let userMarker, velocityLayer=null;

// Palette (le tue)
const WIND_COLOR_SCALE = ["#000080", "#0044ff", "#00ddff", "#00ff55", "#ffff00", "#ff6600", "#ff0000", "#ff00ff"];
const TEMP_STOPS = [

  {v: 1,   c: [80,127,133]},  {v: 2,   c: [74,126,111]},  {v: 3,   c: [79,129,93]},   {v: 4,   c: [84,131,84]},
  {v: 5,   c: [89,134,76]},   {v: 6,   c: [94,136,67]},   {v: 7,   c: [99,139,58]},   {v: 8,   c: [104,141,50]},
  {v: 9,   c: [109,144,41]},  {v: 10,  c: [114,146,33]},  {v: 11,  c: [129,150,22]},  {v: 12,  c: [142,154,20]},
  {v: 13,  c: [155,158,17]},  {v: 14,  c: [168,161,15]},  {v: 15,  c: [181,165,13]},  {v: 16,  c: [194,169,11]},
  {v: 17,  c: [207,173,9]},   {v: 18,  c: [219,176,7]},   {v: 19,  c: [232,180,6]},   {v: 20,  c: [243,183,4]},
  {v: 21,  c: [242,172,7]},   {v: 22,  c: [241,161,9]},   {v: 23,  c: [240,150,12]},  {v: 24,  c: [239,139,15]},
  {v: 25,  c: [238,128,17]},  {v: 26,  c: [237,117,20]},  {v: 27,  c: [236,106,22]},  {v: 28,  c: [235,95,24]},
  {v: 29,  c: [234,84,25]},   {v: 30,  c: [232,83,25]},   {v: 31,  c: [222,79,24]},   {v: 32,  c: [212,75,23]},
  {v: 33,  c: [203,71,22]},   {v: 34,  c: [193,68,21]},   {v: 35,  c: [184,64,20]},   {v: 36,  c: [174,60,18]},
  {v: 37,  c: [165,56,17]},   {v: 38,  c: [155,52,16]},   {v: 39,  c: [146,48,15]},   {v: 40,  c: [136,45,13]},
  {v: 41,  c: [126,41,12]},   {v: 42,  c: [117,37,11]},   {v: 43,  c: [107,30,6]},    {v: 44,  c: [98,26,4]},
  {v: 45,  c: [89,22,3]}

const RAIN_STOPS = [
  {v:0.0, c:[0,0,0], a:0.0},
  {v:0.6, c:[100,200,255], a:0.70},
  {v:1.0, c:[0,150,255], a:0.78},
  {v:5.0, c:[0,0,255], a:0.85},

  {v:30,  c:[255,150,0], a:0.90},
  {v:50,  c:[255,0,0], a:0.92}
];
const RH_STOPS = [
  {v:0, c:[173,85,56]}, {v:30, c:[173,110,56]}, {v:60, c:[56,173,121]}, {v:80, c:[56,157,173]}, {v:100, c:[56,70,114]}
];
const PRESS_STOPS = [
  {v: 900, c: [8,16,48]}, {v: 950, c: [0,32,96]}, {v: 976, c: [0,52,146]}, {v: 986, c: [0,90,148]},
  {v: 995, c: [0,117,146]}, {v: 1002, c: [26,140,147]}, {v: 1007, c: [103,162,155]}, {v: 1011.25, c: [155,183,172]},
  {v: 1013.25, c: [182,182,182]}, {v: 1015.25, c: [176,174,152]}, {v: 1019, c: [167,147,107]}, {v: 1024, c: [163,116,67]},
  {v: 1030, c: [159,81,44]}, {v: 1038, c: [142,47,57]}, {v: 1046, c: [111,24,64]}, {v: 1080, c: [48,8,24]}
];
const CLOUD_STOPS = [
  {v:0, c:[255,255,255], a:0.00},
  {v:40, c:[220,220,220], a:0.40},
  {v:70, c:[170,170,170], a:0.60},

];

/* =========================
   UTILS
========================= */
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function lerp(a,b,t){ return a+(b-a)*t; }

function interpStops(val, stops) {
  if(!stops || stops.length < 2) return {r:0,g:0,b:0,a:0.0};
  if(val <= stops[0].v) { const s=stops[0]; return {r:s.c[0],g:s.c[1],b:s.c[2],a:('a' in s)?s.a:0.90}; }
  for(let i=0;i<stops.length-1;i++){
    if(val >= stops[i].v && val < stops[i+1].v){
      const s1=stops[i], s2=stops[i+1];
      const t = (val-s1.v)/(s2.v-s1.v);
      const a1 = ('a' in s1) ? s1.a : 0.90;
      const a2 = ('a' in s2) ? s2.a : 0.90;
      return {
        r: Math.round(lerp(s1.c[0],s2.c[0],t)),
        g: Math.round(lerp(s1.c[1],s2.c[1],t)),
        b: Math.round(lerp(s1.c[2],s2.c[2],t)),
        a: lerp(a1,a2,t)
      };
    }
  }
  const s=stops[stops.length-1];
  return {r:s.c[0],g:s.c[1],b:s.c[2],a:('a' in s)?s.a:0.90};
}

function vividWindColor(speedMs){
  const maxV = 22.0;
  const t = clamp(speedMs/maxV, 0, 0.9999);
  const n = WIND_COLOR_SCALE.length;
  const pos = t*(n-1);
  const i = Math.floor(pos);
  const f = pos - i;
  const hex1=WIND_COLOR_SCALE[i], hex2=WIND_COLOR_SCALE[Math.min(i+1,n-1)];
  const r1=parseInt(hex1.slice(1,3),16), g1=parseInt(hex1.slice(3,5),16), b1=parseInt(hex1.slice(5,7),16);
  const r2=parseInt(hex2.slice(1,3),16), g2=parseInt(hex2.slice(3,5),16), b2=parseInt(hex2.slice(5,7),16);
  return {r:Math.round(lerp(r1,r2,f)), g:Math.round(lerp(g1,g2,f)), b:Math.round(lerp(b1,b2,f))};
}

/* =========================
   LEAFLET CANVAS LAYER (FIX drift/offset)
   - The ONLY reliable way: make canvases Leaflet layers and let Leaflet position them
========================= */
const CanvasLayer = L.Layer.extend({
  initialize: function(opts){
    this.options = opts || {};
    this._draw = this.options.draw || function(){};
    this._pane = this.options.pane || 'overlayPane';
    this._className = this.options.className || '';
    this._z = this.options.zIndex || 300;
    this._useDpr = (this.options.useDpr !== false);
  },
  onAdd: function(map){
    this._map = map;
    this._canvas = L.DomUtil.create('canvas', 'meteo-canvas ' + this._className);
    this._canvas.style.zIndex = this._z;
    this._canvas.style.pointerEvents = 'none';
    map.getPane(this._pane).appendChild(this._canvas);

    map.on('move', this._reset, this);
    map.on('zoom', this._reset, this);
    map.on('resize', this._reset, this);
    map.on('moveend', this._redraw, this);
    map.on('zoomend', this._redraw, this);

    this._reset();
    this._redraw();
  },
  onRemove: function(map){
    map.off('move', this._reset, this);
    map.off('zoom', this._reset, this);
    map.off('resize', this._reset, this);
    map.off('moveend', this._redraw, this);
    map.off('zoomend', this._redraw, this);
    if(this._canvas && this._canvas.parentNode) this._canvas.parentNode.removeChild(this._canvas);
    this._canvas = null;
  },
  _reset: function(){
    if(!this._map || !this._canvas) return;
    const size = this._map.getSize();
    const dpr = this._useDpr ? (window.devicePixelRatio || 1) : 1;
    this._dpr = dpr;

    this._canvas.width  = Math.round(size.x * dpr);
    this._canvas.height = Math.round(size.y * dpr);
    this._canvas.style.width = size.x + 'px';
    this._canvas.style.height = size.y + 'px';

    // Let Leaflet position this canvas like any overlay
    const topLeft = this._map.containerPointToLayerPoint([0,0]);
    L.DomUtil.setPosition(this._canvas, topLeft);
  },
  _redraw: function(){
    if(!this._map || !this._canvas) return;
    const ctx = this._canvas.getContext('2d');
    ctx.setTransform(this._dpr,0,0,this._dpr,0,0);
    ctx.clearRect(0,0,this._canvas.width/this._dpr, this._canvas.height/this._dpr);
    this._draw(ctx, this._map, this._canvas, this._dpr);
  }
});

/* =========================
   APP STATE: canvas layers
========================= */
let scalarLayer, windArrowLayer, isoLayer, thermLayer;

// Rendering throttle (avoid heavy redraw while panning)
let redrawQueued=false;
function requestRedrawAll(){
  if(redrawQueued) return;
  redrawQueued=true;
  requestAnimationFrame(()=>{
    redrawQueued=false;
    redrawAll(true);
  });
}

/* =========================
   INIT
========================= */
function toggleGpsPanel(show) { document.getElementById('gps-overlay').className = show ? 'active' : ''; }
function getMyWeather() { map.locate({setView: true, maxZoom: 10}); }

window.addEventListener('load', async () => {
  map = L.map('map', {
    zoomControl: false,
    background: '#0a0a0a',
    worldCopyJump: true
  }).fitBounds(ITALY_BOUNDS);

  // Base dark grey (no invert)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '© CARTO'

  // Labels (clean)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {

  // Panes
  map.createPane('scalarPane'); map.getPane('scalarPane').style.zIndex = 300;
  map.createPane('vectorPane'); map.getPane('vectorPane').style.zIndex = 650;
  map.createPane('topPane');    map.getPane('topPane').style.zIndex = 1100;
  map.createPane('particlePane'); map.getPane('particlePane').style.zIndex = 500;

  // Canvas layers (FIX: now they follow map perfectly)
  scalarLayer = new CanvasLayer({
    pane: 'scalarPane',
    className: 'scalar-layer',
    zIndex: 310,
    draw: drawScalarComposite
  }).addTo(map);

  windArrowLayer = new CanvasLayer({
    pane: 'vectorPane',
    className: 'vector-layer',
    zIndex: 700,
    draw: drawWindArrowsPRO
  }).addTo(map);

  isoLayer = new CanvasLayer({
    pane: 'vectorPane',
    className: 'vector-layer',
    zIndex: 720,
    draw: drawIsobars
  }).addTo(map);

  thermLayer = new CanvasLayer({
    pane: 'vectorPane',
    className: 'vector-layer',
    zIndex: 740,
    draw: drawIsotherms
  }).addTo(map);

  map.on('mousemove', onPick);
  map.on('click', onPick);

  map.on('move', requestRedrawAll);
  map.on('zoom', requestRedrawAll);
  map.on('resize', requestRedrawAll);
  map.on('moveend', () => redrawAll(false));
  map.on('zoomend', () => redrawAll(false));

  map.on('locationfound', onLocationFound);

  await loadCatalog();

  document.getElementById('unit-display').innerText = '';
});

/* =========================
   DATA LOADING
========================= */
async function loadCatalog() {
  const r = await fetch('data_weather/catalog.json?t=' + Date.now());
  if(!r.ok) { console.error('catalog.json not found'); return; }
  catalog = await r.json();

  const slider = document.getElementById('time-slider');
  slider.max = Math.max(0, catalog.length - 1);
  slider.oninput = (e) => loadStep(parseInt(e.target.value, 10));

  slider.value = 0;
  await loadStep(0);
}

async function loadStep(i) {
  if(!catalog[i]) return;
  const r = await fetch('data_weather/' + catalog[i].file + '?t=' + Date.now());
  if(!r.ok) { console.error('step file not found'); return; }

  currentData = await r.json();
  document.getElementById('time-label').innerText = catalog[i].label;
  document.getElementById('valid-time').innerText = catalog[i].label;

  // pressure clean (Pa -> hPa)
  if(currentData.press){
    const raw = currentData.press;
    currentData.cleanP = new Float32Array(raw.length);
    for(let k=0;k<raw.length;k++){
      let v = raw[k];
      if(v > 2000) v = v/100;
      currentData.cleanP[k] = (!v || v < 850 || v > 1100) ? 1013 : v;
    }
  }

  redrawAll(false);
}

/* =========================
   REDRAW CONTROLLER
========================= */
function redrawAll(isDuringMove){
  if(!currentData) return;

  // During pan/zoom: keep it lighter (performance) without killing quality.
  renderQuality.scale = isDuringMove ? 0.55 : 0.75;     // 0.75 = sharp, 0.55 = smoother while moving
  renderQuality.maxArrows = isDuringMove ? 1200 : 2200; // cap arrows while moving
  renderQuality.skipIso = isDuringMove;                 // isolines redraw only at moveend/zoomend

  scalarLayer._redraw();
  windArrowLayer._redraw();

  if(showIsobars && !renderQuality.skipIso) isoLayer._redraw();
  if(showIsotherms && !renderQuality.skipIso) thermLayer._redraw();

  updateParticles();
}

const renderQuality = {
  scale: 0.75,
  maxArrows: 2200,
  skipIso: false
};

/* =========================
   SCALAR COMPOSITE (your approach, but fixed + faster)
========================= */
function drawScalarComposite(ctx, map){
  if(!currentData?.meta) return;

  const m = currentData.meta;
  const size = map.getSize();
  const scale = renderQuality.scale;

  const w = Math.max(120, Math.round(size.x * scale));
  const h = Math.max(120, Math.round(size.y * scale));

  // offscreen
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d');
  const img = octx.createImageData(w,h);
  const d = img.data;

  // which layer to paint? (only one at a time like your UI, but you can stack: we keep your set)
  // Here: we paint ALL selected layers in order (wind bg first), like before.
  // Clear => we composite manually per-pixel (fast enough at scaled res).

  // Pre-resolve arrays
  const hasWind = selected.has('wind');
  const hasTemp = selected.has('temp');
  const hasRain = selected.has('rain');
  const hasRh   = selected.has('rh');
  const hasPress= selected.has('press');
  const hasCloud= selected.has('cloud');

  const tempArr = currentData.temp;
  const rainArr = currentData.rain;
  const rhArr   = currentData.rh;
  const pressArr= currentData.cleanP || currentData.press;
  const cloudArr= currentData.cloud || currentData.cld;

  for(let py=0; py<h; py++){
    for(let px=0; px<w; px++){
      const cx = (px + 0.5) / scale;
      const cy = (py + 0.5) / scale;
      const ll = map.containerPointToLatLng([cx, cy]);

      const gx = (ll.lng - m.lo1) / m.dx;
      const gy = (m.la1 - ll.lat) / m.dy;
      if(gx < 0 || gy < 0 || gx > m.nx-1 || gy > m.ny-1) continue;

      const ix = gx | 0, iy = gy | 0;
      const idx = iy * m.nx + ix;

      let R=0, G=0, B=0, A=0;

      // 1) wind background
      if(hasWind && currentData.wind_u?.data && currentData.wind_v?.data){
        const u = currentData.wind_u.data[idx], v = currentData.wind_v.data[idx];
        const sp = Math.sqrt(u*u + v*v);
        if(sp > 0.2){
          const rgb = vividWindColor(sp);
          // low alpha background
          const a = clamp(sp/18, 0.05, 0.32);
          // simple over
          const oa = a;
          R = rgb.r*oa + R*(1-oa);
          G = rgb.g*oa + G*(1-oa);
          B = rgb.b*oa + B*(1-oa);
          A = 1 - (1-A)*(1-oa);
        }
      }

      // 2) temp
      if(hasTemp && tempArr){
        const v = tempArr[idx];
        const col = interpStops(v, TEMP_STOPS);
        const oa = clamp(col.a, 0, 0.92);
        R = col.r*oa + R*(1-oa);
        G = col.g*oa + G*(1-oa);
        B = col.b*oa + B*(1-oa);
        A = 1 - (1-A)*(1-oa);
      }

      // 3) rain
      if(hasRain && rainArr){
        const v = rainArr[idx];
        if(v >= 0.1){
          const col = interpStops(v, RAIN_STOPS);
          const oa = clamp(col.a, 0, 0.92);
          R = col.r*oa + R*(1-oa);
          G = col.g*oa + G*(1-oa);
          B = col.b*oa + B*(1-oa);
          A = 1 - (1-A)*(1-oa);
        }
      }

      // 4) RH
      if(hasRh && rhArr){
        const v = rhArr[idx];
        const col = interpStops(v, RH_STOPS);
        const oa = clamp(col.a, 0.20, 0.55) * 0.70;
        R = col.r*oa + R*(1-oa);
        G = col.g*oa + G*(1-oa);
        B = col.b*oa + B*(1-oa);
        A = 1 - (1-A)*(1-oa);
      }

      // 5) pressure
      if(hasPress && pressArr){
        const v = pressArr[idx];
        const col = interpStops(v, PRESS_STOPS);
        const oa = clamp(col.a, 0.15, 0.60) * 0.65;
        R = col.r*oa + R*(1-oa);
        G = col.g*oa + G*(1-oa);
        B = col.b*oa + B*(1-oa);
        A = 1 - (1-A)*(1-oa);
      }

      // 6) cloud (grey overlay)
      if(hasCloud && cloudArr){
        const v = cloudArr[idx];
        if(v >= 5){
          const col = interpStops(v, CLOUD_STOPS);
          const oa = clamp(col.a, 0.10, 0.80);
          R = col.r*oa + R*(1-oa);
          G = col.g*oa + G*(1-oa);
          B = col.b*oa + B*(1-oa);
          A = 1 - (1-A)*(1-oa);
        }
      }

      const p = (py*w+px)*4;
      d[p]   = R|0;
      d[p+1] = G|0;
      d[p+2] = B|0;
      d[p+3] = clamp(A,0,1)*255;
    }
  }

  octx.putImageData(img,0,0);

  // draw to map canvas
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(off, 0, 0, size.x, size.y);
}

/* =========================
   WIND ARROWS (NEW AESTHETIC, reactive & intuitive)
   - smooth tapered arrow + glow outline
   - density based on zoom & maxArrows cap
========================= */
function drawWindArrowsPRO(ctx, map){
  if(!currentData?.meta) return;
  if(!selected.has('wind')) return;
  if(!currentData.wind_u?.data || !currentData.wind_v?.data) return;

  const m = currentData.meta;
  const size = map.getSize();
  const z = map.getZoom();

  // Density
  // stride in pixels; lower => more arrows
  let stridePx = (z >= 8) ? 42 : 55;
  if(z >= 9) stridePx = 36;
  if(z >= 10) stridePx = 30;
  if(z >= 11) stridePx = 24;
  if(z >= 12) stridePx = 20;

  // Cap
  const maxArrows = renderQuality.maxArrows;
  const cols = Math.ceil(size.x / stridePx);
  const rows = Math.ceil(size.y / stridePx);
  const total = cols * rows;
  const step = total > maxArrows ? Math.ceil(total / maxArrows) : 1;

  // Styles
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Slight glow for readability
  ctx.shadowColor = 'rgba(0,0,0,0.65)';
  ctx.shadowBlur = 8;

  let counter = 0;

  for(let ry=0; ry<rows; ry++){
    const y = Math.round((ry + 0.5) * stridePx);
    if(y < 0 || y > size.y) continue;

    for(let rx=0; rx<cols; rx++){
      counter++;
      if(step > 1 && (counter % step) !== 0) continue;

      const x = Math.round((rx + 0.5) * stridePx);
      if(x < 0 || x > size.x) continue;

      const ll = map.containerPointToLatLng([x,y]);
      const gx = (ll.lng - m.lo1) / m.dx;
      const gy = (m.la1 - ll.lat) / m.dy;
      if(gx < 0 || gy < 0 || gx > m.nx-1 || gy > m.ny-1) continue;

      const idx = (gy|0)*m.nx + (gx|0);
      const u = currentData.wind_u.data[idx];
      const v = currentData.wind_v.data[idx];

      const sp = Math.sqrt(u*u + v*v);
      if(!Number.isFinite(sp) || sp < 0.6) continue;

      // Direction: atan2(-v, u) to match particles
      const ang = Math.atan2(-v, u);

      // Reactive sizing:
      // - length grows with speed, but bounded
      // - thickness grows with speed, but bounded
      const len = clamp(10 + sp * 3.2, 14, 64);
      const thick = clamp(0.9 + sp * 0.22, 1.2, 4.4);

      // Head sizes
      const head = clamp(len * 0.35, 7, 22);
      const tail = len - head;

      // Color by speed
      const rgb = vividWindColor(sp);
      const col = `rgb(${rgb.r},${rgb.g},${rgb.b})`;

      // Alpha by speed (stronger when windy)
      const alpha = clamp(0.40 + sp/18, 0.45, 0.95);

      // Draw a tapered arrow in local coords
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);

      // Outline (black) for contrast
      ctx.globalAlpha = clamp(alpha + 0.05, 0, 1);
      ctx.strokeStyle = 'rgba(0,0,0,0.90)';
      ctx.lineWidth = thick + 2.2;

      // shaft
      ctx.beginPath();
      ctx.moveTo(-tail*0.55, 0);
      ctx.lineTo(tail*0.55, 0);
      ctx.stroke();

      // arrow head outline
      ctx.beginPath();
      ctx.moveTo(tail*0.55 + head, 0);
      ctx.lineTo(tail*0.55, -head*0.42);
      ctx.moveTo(tail*0.55 + head, 0);
      ctx.lineTo(tail*0.55,  head*0.42);
      ctx.stroke();

      // Color stroke
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = col;
      ctx.lineWidth = thick;

      // shaft
      ctx.beginPath();
      ctx.moveTo(-tail*0.55, 0);
      ctx.lineTo(tail*0.55, 0);
      ctx.stroke();

      // head
      ctx.beginPath();
      ctx.moveTo(tail*0.55 + head, 0);
      ctx.lineTo(tail*0.55, -head*0.42);
      ctx.moveTo(tail*0.55 + head, 0);
      ctx.lineTo(tail*0.55,  head*0.42);
      ctx.stroke();

      // Small “dot” at base for intuitive anchor
      ctx.globalAlpha = clamp(alpha*0.9, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.beginPath(); ctx.arc(-tail*0.55, 0, thick+1.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(-tail*0.55, 0, thick*0.75, 0, Math.PI*2); ctx.fill();

      ctx.restore();
    }
  }

  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
}

/* =========================
   ISOBARE / ISOTERME (kept simple; drawn only at moveend)
========================= */
function contourToScreenPath(ctx, coordinates, m){
  for (const polygon of coordinates) {
    for (const ring of polygon) {
      if (!ring || ring.length < 2) continue;
      const p0 = ring[0];
      let lat = m.la1 - p0[1] * m.dy;
      let lon = m.lo1 + p0[0] * m.dx;
      let pt = map.latLngToContainerPoint([lat, lon]);
      ctx.beginPath();
      ctx.moveTo(pt.x, pt.y);
      for (let i = 1; i < ring.length; i++) {
        const p = ring[i];
        lat = m.la1 - p[1] * m.dy;
        lon = m.lo1 + p[0] * m.dx;
        pt = map.latLngToContainerPoint([lat, lon]);
        ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
    }
  }
}
function pickLabelPointFromContour(contour){
  try{
    const coords = contour.coordinates;
    let bestRing = null, bestLen = 0;
    for (const polygon of coords) for (const ring of polygon)
      if (ring && ring.length > bestLen) { bestLen = ring.length; bestRing = ring; }
    if (!bestRing || bestLen < 40) return null;
    return bestRing[Math.floor(bestLen*0.55)];
  } catch(e){ return null; }
}
function smoothGrid(src, nx, ny){
  const out = new Float32Array(nx*ny);
  for(let y=0;y<ny;y++){
    for(let x=0;x<nx;x++){
      let sum=0, wsum=0;
      for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
          const xx = x+dx, yy=y+dy;
          if(xx<0||yy<0||xx>=nx||yy>=ny) continue;
          const w = (dx===0 && dy===0) ? 4 : ((dx===0||dy===0)?2:1);
          sum += src[yy*nx+xx]*w;
          wsum += w;
        }
      }
      out[y*nx+x] = sum/wsum;
    }
  }
  return out;
}

function drawIsobars(ctx){
  if(!showIsobars) return;
  if(!currentData?.meta || !currentData.cleanP) return;
  const m = currentData.meta;
  const nx = m.nx, ny = m.ny;

  const smooth = smoothGrid(currentData.cleanP, nx, ny);
  const thresholds = d3.range(960, 1050, 2);
  const contours = d3.contours().size([nx, ny]).thresholds(thresholds)(smooth);

  for(const c of contours){
    const v = Math.round(c.value);
    // Color rule requested: <1010 blue, 1010-1015 purple, >1015 red
    let stroke = "rgba(160,100,255,0.75)"; // purple
    if(v < 1010) stroke = "rgba(60,120,255,0.78)";
    if(v > 1015) stroke = "rgba(255,80,80,0.78)";

    const is8 = (v % 8 === 0);
    const is4 = (v % 4 === 0);

    ctx.strokeStyle = stroke;
    ctx.lineWidth = is8 ? 2.6 : (is4 ? 1.9 : 1.15);
    ctx.setLineDash([]);
    contourToScreenPath(ctx, c.coordinates, m);
  }

  // value on each line (every 4 hPa)
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font = "900 12px Arial";

  const size = map.getSize();
  for(const c of contours){
    const v = Math.round(c.value);
    if(v % 4 !== 0) continue;

    const p = pickLabelPointFromContour(c);
    if(!p) continue;

    const lat = m.la1 - p[1]*m.dy;
    const lon = m.lo1 + p[0]*m.dx;
    const pt = map.latLngToContainerPoint([lat,lon]);
    if(pt.x<0||pt.y<0||pt.x>size.x||pt.y>size.y) continue;

    // background box
    const txt = `${v}`;
    const w = ctx.measureText(txt).width + 18;
    const h = 18;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(pt.x - w/2, pt.y - h/2, w, h);

    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(0,0,0,0.85)";
    ctx.strokeText(txt, pt.x, pt.y);
    ctx.fillStyle = "#fff";
    ctx.fillText(txt, pt.x, pt.y);
  }
}

function drawIsotherms(ctx){
  if(!showIsotherms) return;
  if(!currentData?.meta || !currentData.temp) return;

  const m = currentData.meta;
  const nx = m.nx, ny = m.ny;

  const raw = currentData.temp;
  const clean = new Float32Array(raw.length);
  let tMin=999, tMax=-999;
  for(let i=0;i<raw.length;i++){
    const v = raw[i];
    const vv = (v===null||v===undefined||Number.isNaN(v)) ? 0 : v;
    clean[i]=vv;
    if(vv<tMin) tMin=vv;
    if(vv>tMax) tMax=vv;
  }

  const lo = Math.floor(tMin)-1;
  const hi = Math.ceil(tMax)+1;
  const thresholds = d3.range(lo, hi+1, 1);
  const contours = d3.contours().size([nx, ny]).thresholds(thresholds)(clean);

  // Lines every 1°C; thicker every 5°C
  for(const c of contours){
    const v = Math.round(c.value);
    const thick = (v % 5 === 0) ? 2.2 : 1.0;
    ctx.strokeStyle = (v % 5 === 0) ? "rgba(255,255,255,0.70)" : "rgba(255,255,255,0.38)";
    ctx.lineWidth = thick;
    ctx.setLineDash([]);
    contourToScreenPath(ctx, c.coordinates, m);
  }

  // labels every 5°C, larger with zoom
  const z = map.getZoom();
  const fontSize = clamp(12 + (z-6)*1.6, 12, 28);
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font = `900 ${fontSize}px Arial`;

  const size = map.getSize();
  for(const c of contours){
    const v = Math.round(c.value);
    if(v % 5 !== 0) continue;

    const p = pickLabelPointFromContour(c);
    if(!p) continue;

    const lat = m.la1 - p[1]*m.dy;
    const lon = m.lo1 + p[0]*m.dx;
    const pt = map.latLngToContainerPoint([lat,lon]);
    if(pt.x<0||pt.y<0||pt.x>size.x||pt.y>size.y) continue;

    const txt = `${v}°`;
    const w = ctx.measureText(txt).width + 16;
    const h = fontSize + 10;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(pt.x - w/2, pt.y - h/2, w, h);

    ctx.lineWidth = 4;
    ctx.strokeStyle = "rgba(0,0,0,0.85)";
    ctx.strokeText(txt, pt.x, pt.y);
    ctx.fillStyle = "#fff";
    ctx.fillText(txt, pt.x, pt.y);
  }
}

   PARTICLES

function updateParticles(){
  if(velocityLayer){ map.removeLayer(velocityLayer); velocityLayer=null; }
  if(!particlesOn || !currentData?.wind_u || !currentData?.wind_v) return;

  velocityLayer = L.velocityLayer({
    displayValues: false,
    data: [ currentData.wind_u, currentData.wind_v ],

    velocityScale: 0.008,

    lineWidth: 2.0,

    frameRate: 50,
    opacity: 0.85,
    colorScale: WIND_COLOR_SCALE,
    pane: 'particlePane'
  }).addTo(map);
}

/* =========================
   PICK VALUE + GPS
========================= */
function onPick(e){
  if(!currentData?.meta) return;
  const m = currentData.meta;

  const gx = Math.round((e.latlng.lng - m.lo1) / m.dx);
  const gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
  if(gx<0 || gy<0 || gx>=m.nx || gy>=m.ny) return;

  const i = gy*m.nx + gx;

  let val="--", unit="";
  if(selected.has('temp') && currentData.temp){ val = currentData.temp[i].toFixed(1); unit="°C"; }
  else if(selected.has('wind') && currentData.wind_u?.data && currentData.wind_v?.data){
    const u=currentData.wind_u.data[i], v=currentData.wind_v.data[i];
    val = (Math.sqrt(u*u+v*v)*3.6).toFixed(1); unit="km/h";
  }
  else if(selected.has('rain') && currentData.rain){ val = (currentData.rain[i] ?? 0).toFixed(1); unit="mm"; }
  else if(selected.has('rh') && currentData.rh){ val = Math.round(currentData.rh[i] ?? 0); unit="%"; }
  else if(selected.has('press') && (currentData.cleanP || currentData.press)){ val = Math.round((currentData.cleanP ? currentData.cleanP[i] : currentData.press[i]) ?? 1013); unit="hPa"; }
  else if(selected.has('cloud') && (currentData.cloud||currentData.cld)){ val = Math.round((currentData.cloud||currentData.cld)[i] ?? 0); unit="%"; }

  document.getElementById('val-display').innerText = val;
  document.getElementById('unit-display').innerText = unit;
}

function onLocationFound(e){
  if(!currentData?.meta) return;
  if(userMarker) map.removeLayer(userMarker);
  userMarker = L.circleMarker(e.latlng, {
    radius: 8, color:'#0077ff', weight:4, fillOpacity:1, fillColor:'#fff'
  }).addTo(map);

  const m = currentData.meta;
  const gx = Math.round((e.latlng.lng - m.lo1) / m.dx);
  const gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
  if(gx<0 || gy<0 || gx>=m.nx || gy>=m.ny) return;

  const i = gy*m.nx + gx;

  document.getElementById('gps-t').innerText = (currentData.temp?.[i] ?? 0).toFixed(1) + "°";
  document.getElementById('gps-r').innerText = (currentData.rain?.[i] ?? 0).toFixed(1) + "mm";
  if(currentData.wind_u?.data && currentData.wind_v?.data){
    const u=currentData.wind_u.data[i], v=currentData.wind_v.data[i];
    document.getElementById('gps-w').innerText = (Math.sqrt(u*u+v*v)*3.6).toFixed(0) + " km/h";
  } else {
    document.getElementById('gps-w').innerText = "--";
  }
  document.getElementById('gps-h').innerText = Math.round(currentData.rh?.[i] ?? 0) + "%";
  toggleGpsPanel(true);
}
