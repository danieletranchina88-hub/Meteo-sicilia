<!DOCTYPE html>
<html lang="it">
<head>
  <title>Italia MeteoHub Scientifico - ICON-2I</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-velocity@1.8.0/dist/leaflet-velocity.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; background: #0a0a0a; font-family: 'Segoe UI', Roboto, sans-serif; color: #ddd; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #0a0a0a; }

    /* GPS OVERLAY */
    #gps-overlay {
        position: absolute; top: -150px; left: 0; right: 0; height: 100px;
        background: rgba(10,10,10,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        z-index: 6000; display: flex; align-items: center; justify-content: space-around;
        border-bottom: 2px solid #0077ff; transition: top 0.4s ease;
        padding: 0 40px; box-shadow: 0 10px 40px #000;
    }
    #gps-overlay.active { top: 0; }
    .gps-stat { text-align: center; }
    .gps-stat div:first-child { font-size: 0.7em; color: #888; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
    .gps-stat div:last-child { font-size: 1.8em; font-weight: 900; color: #fff; }
    #close-gps { position: absolute; right: 15px; top: 15px; cursor: pointer; color: #666; font-size: 1.2em; }

    /* UI - HEADER */
    #model-info { position: absolute; top: 15px; left: 70px; z-index: 5000; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    #model-title { font-size: 18px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
    #model-sub { font-size: 11px; color: #00eaff; font-family: monospace; font-weight: bold; }

    /* INFO BOX CURSORE */
    #info-box { position: absolute; top: 15px; left: 20px; z-index: 5000; pointer-events: none; }
    #val-group { margin-top: 55px; }
    #val-display { font-size: 3.5em; font-weight: 950; color: #fff; text-shadow: 0 2px 15px #000; line-height: 0.8; font-variant-numeric: tabular-nums; }
    #unit-display { font-size: 1.1em; color: #ccc; font-weight: 700; margin-top: 5px; margin-left: 5px; }

    /* UI CONTROLS */
    #ui-container { position: absolute; top: 10px; right: 10px; z-index: 5000; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    .panel { background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .toggle { width: 170px; display:flex; align-items:center; justify-content:space-between; padding: 12px; margin: 4px 0; background: rgba(255,255,255,0.04); border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 12px; transition: all 0.2s; color: #bbb; border: 1px solid transparent; letter-spacing: 0.5px;}
    .toggle:hover { background: rgba(255,255,255,0.1); }
    .toggle.active { background: #0077ff !important; color: #fff !important; box-shadow: 0 2px 8px rgba(0,119,255,0.4); border: 1px solid rgba(255,255,255,0.2); }
    .gps-btn { width: 170px; padding: 14px; border-radius: 8px; font-size: 13px; background: #23a045; color: white; cursor: pointer; font-weight: 900; border: none; margin-bottom: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: background 0.2s;}
    .gps-btn:hover { background: #2cb850; }

    .mini { width: 170px; padding: 12px; border-radius: 8px; font-size:12px; background: rgba(255,255,255,0.08); color:#fff; cursor:pointer; font-weight:800; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 5px; transition: all 0.2s;}
    .mini.active { background: #eee !important; color:#111 !important; box-shadow: 0 2px 8px rgba(255,255,255,0.3);}

    #bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0.8), transparent); display: flex; align-items: center; padding: 0 25px; z-index: 5000; }
    input[type=range] { flex-grow: 1; accent-color: #0077ff; cursor: pointer; height: 6px; }
    
    /* Stile per la scala di Leaflet */
    .leaflet-control-scale-line { border: 2px solid #777; border-top: none; line-height: 1.1; padding: 2px 5px; color: #eee; font-weight: bold; background: rgba(0,0,0,0.5); }

    .dark-relief-tiles { filter: invert(100%) hue-rotate(180deg) brightness(0.5) contrast(1.2) saturate(0); }
    canvas.leaflet-layer { pointer-events: none !important; position: absolute; top: 0; left: 0; }
    /* Aumentata opacità per rendere i colori più vividi */
    canvas.leaflet-layer.scalar-layer { opacity: 0.85; mix-blend-mode: hard-light; } 
  </style>
</head>

<body>
  <div id="gps-overlay">
    <div id="close-gps" onclick="toggleGpsPanel(false)">✕</div>
    <div class="gps-stat"><div>Temperatura</div><div id="gps-t">--</div></div>
    <div class="gps-stat"><div>Pioggia</div><div id="gps-r">--</div></div>
    <div class="gps-stat"><div>Vento</div><div id="gps-w">--</div></div>
    <div class="gps-stat"><div>Umidità</div><div id="gps-h">--</div></div>
  </div>

  <div id="model-info">
    <div id="model-title">ITALIA METEOHUB <span style="color:#00eaff">ICON-2I</span></div>
    <div id="model-sub">LIVE SYNC | VALID: <span id="valid-time">--</span></div>
  </div>

  <div id="info-box"><div id="val-group"><div id="val-display">--</div><div id="unit-display">Attendere...</div></div></div>

  <div id="ui-container">
    <button class="gps-btn" onclick="getMyWeather()">📍 IL MIO METEO</button>
    <div class="panel">
      <button id="btn-flow" class="mini active" onclick="toggleParticles()">PARTICELLE 🌬️ (ON)</button>
    </div>
    <div class="panel">
      <div class="toggle active" id="btn-wind" onclick="toggleLayer('wind')">VENTO (VETTORI) 🧭</div>
      <div class="toggle" id="btn-temp" onclick="toggleLayer('temp')">TEMPERATURA 🌡️</div>
      <div class="toggle" id="btn-rain" onclick="toggleLayer('rain')">PIOGGIA ☔</div>
      <div class="toggle" id="btn-rh" onclick="toggleLayer('rh')">UMIDITÀ REL. 💧</div>
      <div class="toggle" id="btn-press" onclick="toggleLayer('press')">PRESSIONE MSL ⏲️</div>
      <div class="toggle" id="btn-cloud" onclick="toggleLayer('cloud')">NUVOLE TOTALI ☁️</div>
      <div style="height:1px; background: rgba(255,255,255,0.1); margin:8px 0;"></div>
      <div class="toggle" id="btn-iso" onclick="toggleIsobars()">ISOBARE (1 hPa) 〰️</div>
      </div>
  </div>

  <div id="map"></div>

  <div id="bottom-bar">
    <button id="play-btn" style="background:none; border:none; color:white; font-size:2.2em; cursor:pointer; margin-right: 10px; filter: drop-shadow(0 2px 4px #000);" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label" style="color:white; font-weight:bold; margin-left:20px; min-width:140px; font-family: monospace; font-size: 1.1em;">--/-- --:--</div>
  </div>

<script>
  const DPR = window.devicePixelRatio || 1;
  // 1. MODIFICA BOUNDS: Inquadratura sull'Italia
  const ITALY_BOUNDS = L.latLngBounds(L.latLng(35.0, 6.0), L.latLng(47.5, 19.5));
  
  let map, currentData = null, catalog = [], isPlaying = false;
  const selected = new Set(['wind']);
  let showIsobars = false, particlesOn = true; // Rimosso showIsotherms
  let scalarCanvases = {}, arrowCanvas, isoCanvas, userMarker, velocityLayer = null; // Rimosso thermCanvas

  // =========================================
  // NUOVE PALETTE COLORI AD ALTO CONTRASTO
  // =========================================

  // Palette specifica per lo SFONDO del vento (più scura e satura per far risaltare le frecce)
  const WIND_BG_STOPS = [
      {v:0, c:[30,30,35], a:0.6}, {v:5, c:[0,60,120], a:0.7}, {v:15, c:[0,120,160], a:0.75}, 
      {v:30, c:[0,180,140], a:0.8}, {v:50, c:[160,200,40], a:0.85}, {v:70, c:[220,160,0], a:0.9}, 
      {v:90, c:[220,60,0], a:0.9}, {v:120, c:[180,0,40], a:0.95}
  ];
  
  // Palette specifica per le FRECCE del vento (Colori molto vividi)
  function vividWindArrowColor(sp_kmh){
    const s = sp_kmh;
    if(s<5) return {r:100,g:150,b:255}; // Blu chiaro debole
    if(s<15) return {r:0,g:220,b:255}; // Ciano
    if(s<30) return {r:0,g:255,b:100}; // Verde brillante
    if(s<50) return {r:200,g:255,b:0}; // Giallo lime
    if(s<80) return {r:255,g:140,b:0}; // Arancio
    if(s<110) return {r:255,g:30,b:0}; // Rosso brillante
    return {r:255,g:0,b:180}; // Viola estremo
  }

  // Temperatura: stacchi netti, specialmente attorno allo zero
  const TEMP_STOPS = [
      {v:-30,c:[40,0,90]}, {v:-20,c:[70,0,140]}, {v:-10,c:[0,60,180]}, 
      {v:-5,c:[0,120,220]}, {v:-2,c:[60,160,240]}, {v:0,c:[140,200,255]}, 
      {v:1,c:[100,180,100]}, {v:5,c:[40,160,40]}, {v:10,c:[160,220,50]}, 
      {v:16,c:[240,220,40]}, {v:22,c:[255,140,0]}, {v:28,c:[240,60,0]}, 
      {v:35,c:[180,20,0]}, {v:42,c:[100,0,0]}
  ];
  // Pioggia: enfasi sui fenomeni intensi
  const RAIN_STOPS = [
      {v:0.0,c:[0,0,0],a:0},{v:0.2,c:[80,160,255],a:0.6},{v:1.0,c:[0,100,255],a:0.8},
      {v:3.0,c:[0,40,200],a:0.85},{v:7.0,c:[40,180,40],a:0.9},{v:15,c:[255,220,0],a:0.9},
      {v:30,c:[255,120,0],a:0.92},{v:60,c:[220,20,0],a:0.95},{v:100,c:[140,0,60],a:0.95}
  ];
  // Umidità: transizione secca verso satura molto evidente
  const RH_STOPS = [
      {v:0,c:[160,80,40]},{v:20,c:[180,130,60]},{v:40,c:[180,180,80]},{v:60,c:[120,180,120]},
      {v:80,c:[60,160,180]},{v:95,c:[20,100,180]},{v:100,c:[60,40,160]}
  ];
  // Pressione: Scala sinottica classica ma con colori forti
  const PRESS_STOPS = [
    {v:970,c:[60,0,80]},{v:985,c:[0,40,120]},{v:1000,c:[0,100,160]},{v:1010,c:[100,180,200]},
    {v:1013,c:[220,220,220]},{v:1016,c:[200,200,120]},{v:1025,c:[180,120,40]},{v:1040,c:[120,40,20]},{v:1050,c:[80,0,0]}
  ];
  const CLOUD_STOPS = [{v:0,c:[50,80,120],a:0},{v:20,c:[100,130,170],a:0.4},{v:60,c:[160,170,180],a:0.7},{v:100,c:[230,230,240],a:0.9}];


  // Funzione di interpolazione colori (invariata, funziona bene con le nuove palette)
  function getStopColor(val, stops) {
    if (val <= stops[0].v) return [...stops[0].c, (stops[0].a !== undefined ? stops[0].a : 0.85)];
    for (let i = 0; i < stops.length - 1; i++) {
      if (val >= stops[i].v && val <= stops[i+1].v) {
        const t = (val - stops[i].v) / (stops[i+1].v - stops[i].v);
        const a1 = stops[i].a !== undefined ? stops[i].a : 0.85, a2 = stops[i+1].a !== undefined ? stops[i+1].a : 0.85;
        return [(stops[i].c[0]*(1-t)+stops[i+1].c[0]*t)|0, (stops[i].c[1]*(1-t)+stops[i+1].c[1]*t)|0, (stops[i].c[2]*(1-t)+stops[i+1].c[2]*t)|0, (a1*(1-t)+a2*t)];
      }
    }
    return [...stops[stops.length-1].c, 0.85];
  }

  function toggleGpsPanel(show) { document.getElementById('gps-overlay').className = show ? 'active' : ''; }
  function getMyWeather() { map.locate({setView: true, maxZoom: 9}); }

  window.addEventListener('load', async () => {
    // Mappa centrata sull'Italia
    map = L.map('map', { zoomControl: false, background: '#0a0a0a', inertia: true, inertiaDeceleration: 3000, maxZoom: 12, minZoom: 5 }).fitBounds(ITALY_BOUNDS);
    
    // Aggiunta scientifica: Scala grafica
    L.control.scale({position: 'bottomleft', metric: true, imperial: false, maxWidth: 150}).addTo(map);

    // Base layers scuri per contrasto
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', { opacity: 0.6, className: 'dark-relief-tiles' }).addTo(map);
    // Etichette chiare sopra tutto
    map.createPane('labels').style.zIndex = 1100;
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { pane: 'labels', opacity: 0.8 }).addTo(map);

    map.createPane('scalarPane').style.zIndex = 200;
    map.createPane('particlePane').style.zIndex = 300; // Particelle sotto le frecce
    map.createPane('vectorPane').style.zIndex = 400;   // Frecce sopra tutto
    map.createPane('topPane').style.zIndex = 1000;    

    // Confini regionali
    fetch('https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson')
      .then(r => r.json()).then(data => L.geoJSON(data, { pane: 'topPane', style: { color: "#ffffff", weight: 1, opacity: 0.4, fillOpacity: 0 } }).addTo(map));

    const mk = (z, pane, cl) => { const c = L.DomUtil.create('canvas', 'leaflet-layer '+(cl||'')); map.getPane(pane).appendChild(c); return c; };
    scalarCanvases = { wind: mk(1,'scalarPane','scalar-layer'), temp: mk(2,'scalarPane','scalar-layer'), rain: mk(3,'scalarPane','scalar-layer'), rh: mk(4,'scalarPane','scalar-layer'), press: mk(5,'scalarPane','scalar-layer'), cloud: mk(6,'scalarPane','scalar-layer') };
    // Rimosso thermCanvas
    arrowCanvas = mk(1, 'vectorPane'); isoCanvas = mk(2, 'vectorPane'); 

    map.on('locationfound', (e) => {
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.circleMarker(e.latlng, { radius: 8, color: '#0077ff', weight: 4, fillOpacity: 1, fillColor: 'white' }).addTo(map);
        updateGpsReadout(e.latlng);
    });

    await loadCatalog();
    
    map.on('viewreset move resize', redrawAll);
    map.on('mousemove click', onPick);
  });

  // Funzione di utility per il GPS readout
  function updateGpsReadout(latlng) {
      if(!currentData) return;
      const m = currentData.meta;
      const gx = Math.round((latlng.lng - m.lo1) / m.dx), gy = Math.round((m.la1 - latlng.lat) / m.dy);
      if(gx>=0 && gy>=0 && gx < m.nx && gy < m.ny) {
          const i = gy * m.nx + gx;
          document.getElementById('gps-t').innerText = currentData.temp[i].toFixed(1) + "°";
          document.getElementById('gps-r').innerText = currentData.rain[i].toFixed(1) + "mm";
          const wsp = Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2)*3.6;
          document.getElementById('gps-w').innerText = wsp.toFixed(0) + "km/h";
          document.getElementById('gps-h').innerText = Math.round(currentData.rh[i]) + "%";
          toggleGpsPanel(true);
      }
  }

  async function loadCatalog() {
    const r = await fetch('data_weather/catalog.json?t=' + Date.now());
    catalog = await r.json();
    const slider = document.getElementById('time-slider');
    slider.max = catalog.length - 1;
    slider.oninput = (e) => loadStep(parseInt(e.target.value));

    // Auto-selezione del timestep più vicino ad ora
    const now = new Date(); let bestIdx = 0, minD = Infinity;
    catalog.forEach((item, idx) => {
        const p = item.label.split(' '); const dP = p[0].split('/'); const tP = p[1].split(':');
        const sD = new Date(now.getFullYear(), parseInt(dP[1])-1, parseInt(dP[0]), parseInt(tP[0]), parseInt(tP[1]));
        const d = Math.abs(now - sD); if(d < minD) { minD = d; bestIdx = idx; }
    });
    slider.value = bestIdx;
    await loadStep(bestIdx);
  }

  async function loadStep(i) {
    // Assume che i file JSON ora contengano dati per TUTTA L'ITALIA
    const r = await fetch('data_weather/' + catalog[i].file);
    currentData = await r.json();
    document.getElementById('time-label').innerText = catalog[i].label;
    document.getElementById('valid-time').innerText = catalog[i].label;
    // Pressione: cleanP serve per le isobare (rimuove valori nulli/estremi del terreno)
    if(currentData.press) {
        currentData.cleanP = new Float32Array(currentData.press.length);
        for(let j=0; j<currentData.press.length; j++) {
            let v = currentData.press[j]; if(v > 2000) v /= 100; // Fix se in Pa invece di hPa
            currentData.cleanP[j] = (!v || v < 850 || v > 1080) ? 1013 : v;
        }
    }
    redrawAll();
    if(userMarker) updateGpsReadout(userMarker.getLatLng());
  }

  function redrawAll() {
    if (!currentData) return;
    const size = map.getSize(), panePos = map.containerPointToLayerPoint([0, 0]);
    // Rimosso thermCanvas
    [...Object.values(scalarCanvases), arrowCanvas, isoCanvas].forEach(c => {
        c.width = size.x * DPR; c.height = size.y * DPR;
        c.style.width = size.x + 'px'; c.style.height = size.y + 'px';
        L.DomUtil.setPosition(c, panePos);
    });
    drawSmoothScalar();
    drawWindArrows(); // Frecce migliorate
    if(showIsobars) drawContours(); // Isobare migliorate
    updateParticles();
  }

  // 2. & 3. RENDERING SCALARE MIGLIORATO (Colori coerenti, meno pixel)
  function drawSmoothScalar() {
    const m = currentData.meta, size = map.getSize();
    // Aumentata risoluzione interna del canvas per gradienti più definiti (0.75 invece di 0.4)
    // Bilancia performance e qualità visiva.
    const scaleFactor = 0.75; 
    const ctx_w = Math.ceil(size.x * scaleFactor), ctx_h = Math.ceil(size.y * scaleFactor);

    ['wind','temp','rain','rh','press','cloud'].forEach(l => {
        const c = scalarCanvases[l], ctx = c.getContext('2d');
        ctx.clearRect(0,0,c.width,c.height);
        if(!selected.has(l)) return;

        const img = ctx.createImageData(ctx_w, ctx_h), d = img.data;
        let arr = (l==='cloud' ? (currentData.cloud || currentData.cld) : (l==='press'?currentData.cleanP:currentData[l]));
        // Selezione delle nuove palette ad alto contrasto
        let stops = l==='wind'?WIND_BG_STOPS : l==='temp'?TEMP_STOPS : l==='rain'?RAIN_STOPS : l==='rh'?RH_STOPS : l==='press'?PRESS_STOPS : CLOUD_STOPS;

        // Rendering Nearest-Neighbor su canvas interno a risoluzione aumentata.
        // Il browser poi farà l'interpolazione bicubica (imageSmoothingEnabled=true) nel drawImage finale.
        for(let y=0; y<ctx_h; y++) {
            for(let x=0; x<ctx_w; x++) {
                // Proiezione inversa: da pixel canvas a coordinate geografiche
                const ll = map.containerPointToLatLng([x/scaleFactor, y/scaleFactor]);
                // Mapping su indici griglia modello
                const gx = Math.round((ll.lng-m.lo1)/m.dx), gy = Math.round((m.la1-ll.lat)/m.dy);
                
                // Boundary check
                if(gx<0||gy<0||gx>m.nx-1||gy>m.ny-1) continue;

                const idx = (y*ctx_w + x)*4; const i00 = (gy|0)*m.nx+(gx|0);
                
                let col, alphaMulti = 1;
                if(l==='wind'){
                    const sp_ms = Math.sqrt(currentData.wind_u.data[i00]**2 + currentData.wind_v.data[i00]**2);
                    const res = getStopColor(sp_ms * 3.6, stops); // Uso la nuova palette di sfondo
                    col={r:res[0],g:res[1],b:res[2],a:res[3]};
                } else if(l==='cloud') {
                    let v = arr[i00]; if(v<5) continue; // Taglio nuvole basse
                    col={r:240,g:240,b:255,a:v/100 * 0.85};
                } else {
                    let v = arr[i00]; if(l==='rain'&&v<0.05) continue; // Taglio pioggia debole
                    const res = getStopColor(v, stops); col={r:res[0],g:res[1],b:res[2],a:res[3]};
                }
                d[idx]=col.r; d[idx+1]=col.g; d[idx+2]=col.b; d[idx+3]=col.a*255*alphaMulti;
            }
        }
        const tC = document.createElement('canvas'); tC.width=ctx_w; tC.height=ctx_h; tC.getContext('2d').putImageData(img,0,0);
        ctx.setTransform(DPR,0,0,DPR,0,0); 
        ctx.imageSmoothingEnabled = true; // Abilita smoothing del browser per ridurre pixel
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(tC, 0, 0, size.x, size.y);
    });
  }

  // 2. VENTO VETTORIALE MIGLIORATO (Frecce che reagiscono)
  function drawWindArrows() {
    if(!selected.has('wind')) return;
    const ctx = arrowCanvas.getContext('2d'), size = map.getSize();
    ctx.clearRect(0,0,arrowCanvas.width, arrowCanvas.height); // Pulizia fondamentale
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = currentData.meta, z = map.getZoom();
    // Densità delle frecce in base allo zoom
    const stride = z >= 11 ? 30 : (z >= 9 ? 45 : (z >= 7 ? 60 : 80));

    for(let y=stride/2; y < size.y; y += stride) {
        for(let x=stride/2; x < size.x; x += stride) {
            const ll = map.containerPointToLatLng([x, y]);
            const gx = Math.round((ll.lng-m.lo1)/m.dx), gy = Math.round((m.la1-ll.lat)/m.dy);
            if(gx<0||gy<0||gx>=m.nx||gy>=m.ny) continue;
            
            const idx = gy*m.nx+gx;
            const u = currentData.wind_u.data[idx], v = currentData.wind_v.data[idx];
            const sp_ms = Math.sqrt(u*u+v*v);
            const sp_kmh = sp_ms * 3.6;

            if(sp_kmh < 3) continue; // Non disegnare se calma

            // Reazione all'intensità: Lunghezza e spessore dinamici
            // Frecce più lunghe e imponenti
            let len = Math.min(sp_kmh * 1.8, 70); 
            if(len < 18) len = 18; // Lunghezza minima

            const ang = Math.atan2(v, u); // Inversione non necessaria se U/V sono meteorologici standard
            const c = vividWindArrowColor(sp_kmh);

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(ang);

            // Bordo nero per contrasto elevato
            ctx.strokeStyle = "rgba(0,0,0,0.8)"; 
            ctx.lineWidth = len > 40 ? 6 : 5; 
            ctx.lineCap = "round"; ctx.lineJoin = "round";

            ctx.beginPath(); 
            // Disegno freccia (corpo + punta)
            const headLen = len * 0.35; 
            ctx.moveTo(-len/2, 0); ctx.lineTo(len/2, 0); // Corpo
            ctx.moveTo(len/2 - headLen, -headLen*0.6); ctx.lineTo(len/2, 0); ctx.lineTo(len/2 - headLen, headLen*0.6); // Punta
            ctx.stroke(); // Disegna bordo

            // Riempimento colorato vivido
            ctx.strokeStyle = `rgb(${c.r},${c.g},${c.b})`; 
            ctx.lineWidth = len > 40 ? 3.5 : 3;
            ctx.stroke(); // Disegna interno
            
            ctx.restore();
        }
    }
  }

  // 4. ISOBARE e DI PRECISIONE
  function drawContours() {
    const ctx = isoCanvas.getContext('2d');
    ctx.clearRect(0,0,isoCanvas.width, isoCanvas.height);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = currentData.meta, data = currentData.cleanP;
    
    // D3 Contours: Soglie ogni 1 hPa per massima precisione (970-1050)
    const thresholds = d3.range(970, 1051, 1); 
    const contours = d3.contours().size([m.nx, m.ny]).thresholds(thresholds)(data);

    // Stile isobare: sottili ma definite
    ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 1.2;
    ctx.shadowColor = "rgba(0,0,0,1)"; ctx.shadowBlur = 3; // Ombra per stacco

    contours.forEach(c => {
        const val = Math.round(c.value);
        // Evidenzia isobare principali (ogni 4 hPa)
        const isMajor = val % 4 === 0;
        ctx.lineWidth = isMajor ? 1.8 : 1.0;
        ctx.strokeStyle = isMajor ? "rgba(255,255,255,1)" : "rgba(255,255,255,0.7)";

        c.coordinates.forEach(poly => poly.forEach(ring => {
        ctx.beginPath(); let pts=[]; ring.forEach((p, j) => {
            // Conversione coordinate griglia -> pixel mappa
            const pt = map.latLngToContainerPoint([m.la1-p[1]*m.dy, m.lo1+p[0]*m.dx]);
            if(j===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); pts.push(pt);
        }); ctx.stroke();

        // Etichette numeriche lungo le linee (solo se la linea è abbastanza lunga)
        if(pts.length > 80 && isMajor) {
            // Trova un punto centrale non troppo vicino ai bordi
            let midIdx = Math.floor(pts.length/2);
            // Semplice tentativo di evitare sovrapposizioni
            if(midIdx%2!==0) midIdx = Math.floor(pts.length/3);
            const mid = pts[midIdx];

            ctx.shadowBlur=0; // Reset ombra per il testo
            ctx.fillStyle = "rgba(10,10,10,0.8)"; ctx.fillRect(mid.x-14, mid.y-8, 28, 16); // Box sfondo
            ctx.fillStyle = "#fff"; ctx.font = "bold 11px 'Segoe UI', Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
            ctx.fillText(val, mid.x, mid.y);
            ctx.shadowBlur=3; // Ripristina ombra per linee
        }
    }))});
    ctx.shadowBlur=0;
    drawExtremaPrecise(ctx, m);
  }

  // NUOVA FUNZIONE RICERCA DI PRECISIONE A/B
  function drawExtremaPrecise(ctx, m) {
    const data = currentData.cleanP;
    const width = m.nx, height = m.ny;
    // Raggio di ricerca per definire un "picco locale" (in punti griglia)
    // Un raggio troppo piccolo trova troppi picchi, troppo grande ne manca alcuni.
    // ~40 punti griglia su ICON-2I (~2.2km) sono circa 80-90km di raggio.
    const radius = 45; 
    const minDistancePixels = 150; // Distanza minima visiva tra etichette sulla mappa

    let extrema = [];

    // Itera sulla griglia interna (saltando i bordi per evitare errori di indice)
    for (let y = radius; y < height - radius; y += 5) { // Step 5 per performance, poi si affina
      for (let x = radius; x < width - radius; x += 5) {
        let currentVal = data[y * width + x];
        
        // Cerca il vero massimo/minimo locale nell'area circostante
        let isMax = true, isMin = true;
        let bestX = x, bestY = y, extremeVal = currentVal;

        for (let ky = y - radius; ky <= y + radius; ky++) {
          for (let kx = x - radius; kx <= x + radius; kx++) {
             const val = data[ky * width + kx];
             if (val > extremeVal) { extremeVal = val; bestX = kx; bestY = ky; isMax = false; } // Trovato un valore più alto, il centro non è il max
             if (val < extremeVal) { extremeVal = val; bestX = kx; bestY = ky; isMin = false; } // Trovato un valore più basso, il centro non è il min
          }
        }

        // Verifica finale: Se dopo il loop il punto centrale (o quello migliorato) è davvero un estremo locale
        let finalIsMax = true, finalIsMin = true;
        for (let ky = bestY - radius; ky <= bestY + radius; ky++) {
            for (let kx = bestX - radius; kx <= bestX + radius; kx++) {
                 const val = data[ky * width + kx];
                 if(val > data[bestY*width+bestX]) finalIsMax = false;
                 if(val < data[bestY*width+bestX]) finalIsMin = false;
            }
        }

        const finalVal = data[bestY * width + bestX];
        // Soglie sinottiche significative (A > 1018, B < 1010)
        if (finalIsMax && finalVal > 1018) {
           extrema.push({ type: 'A', val: finalVal, gx: bestX, gy: bestY });
        } else if (finalIsMin && finalVal < 1010) {
           extrema.push({ type: 'B', val: finalVal, gx: bestX, gy: bestY });
        }
      }
    }

    // Filtra per evitare sovrapposizioni visive
    let finalExtrema = [];
    extrema.sort((a,b) => (b.val - a.val)*(a.type==='A'?1:-1)); // Priorità ai valori più intensi

    extrema.forEach(ex => {
        const pt = map.latLngToContainerPoint([m.la1-ex.gy*m.dy, m.lo1+ex.gx*m.dx]);
        // Controlla se è troppo vicino a un altro già disegnato
        if(!finalExtrema.some(fe => Math.hypot(fe.pt.x-pt.x, fe.pt.y-pt.y) < minDistancePixels)) {
            finalExtrema.push({...ex, pt});
            // Disegno Etichetta
            ctx.font = "900 60px 'Arial Black', sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
            ctx.shadowColor="rgba(0,0,0,1)"; ctx.shadowBlur=15; ctx.shadowOffsetX=0; ctx.shadowOffsetY=2;
            
            ctx.fillStyle = ex.type === 'A' ? "#ff2222" : "#0066ff"; 
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 5;
            ctx.strokeText(ex.type, pt.x, pt.y);
            ctx.fillText(ex.type, pt.x, pt.y);
            
            ctx.font = "bold 18px sans-serif"; ctx.shadowBlur=4; ctx.lineWidth=3;
            ctx.strokeText(Math.round(ex.val), pt.x, pt.y+35);
            ctx.fillText(Math.round(ex.val), pt.x, pt.y+35);
        }
    });
  }

  // 5. RIMOZIONE LOGICA ISOTERME
  // Funzione drawIsothermsLogic rimossa.

  function updateParticles() {
    if (velocityLayer) map.removeLayer(velocityLayer);
    if (!particlesOn) return;
    velocityLayer = L.velocityLayer({ 
        displayValues: false, 
        data: [currentData.wind_u, currentData.wind_v], 
        maxVelocity: 30, // Adattato per valori nazionali
        velocityScale: 0.005, // Leggermente più veloce
        particleMultiplier: 1/300, // Più particelle per l'area più grande
        lineWidth: 2, frameRate: 40, opacity: 0.7, 
        colorScale: ["#ffffff"], pane: 'particlePane' 
    }).addTo(map);
  }

  function onPick(e){
    if(!currentData) return;
    const m = currentData.meta;
    const gx = Math.round((e.latlng.lng - m.lo1) / m.dx), gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
    if(gx<0 || gy<0 || gx>=m.nx || gy>=m.ny) {
        document.getElementById('val-display').innerText = "--"; return;
    }
    const i = gy * m.nx + gx;
    let val = "--", unit = "";
    if(selected.has('temp')) { val = currentData.temp[i].toFixed(1); unit = "°C"; }
    else if(selected.has('wind')) { 
        const u = currentData.wind_u.data[i], v = currentData.wind_v.data[i];
        val = (Math.sqrt(u*u+v*v)*3.6).toFixed(0); unit = "km/h"; 
        // Aggiunta scientifica: Direzione gradi
        const deg = (Math.atan2(u, v) * (180 / Math.PI) + 180) % 360;
        unit += ` (${Math.round(deg)}°)`;
    }
    else if(selected.has('rain')) { val = currentData.rain[i].toFixed(1); unit = "mm"; }
    else if(selected.has('rh')) { val = Math.round(currentData.rh[i]); unit = "%"; }
    else if(selected.has('press')) { val = (currentData.cleanP[i]).toFixed(1); unit = "hPa"; }
    else if(selected.has('cloud')) { val = Math.round((currentData.cloud||currentData.cld)[i]); unit = "%"; }
    document.getElementById('val-display').innerText = val; document.getElementById('unit-display').innerText = unit;
  }

  window.toggleLayer = (l) => { if(selected.has(l)) selected.delete(l); else selected.add(l); updateUI(); redrawAll(); };
  window.toggleIsobars = () => { showIsobars = !showIsobars; updateUI(); redrawAll(); };
  // window.toggleIsotherms rimosso
  window.toggleParticles = () => { particlesOn = !particlesOn; updateUI(); redrawAll(); };

  function updateUI(){
    ['wind','temp','rain','rh','press','cloud'].forEach(l => {
        const btn = document.getElementById('btn-' + l);
        if(selected.has(l)) btn.classList.add('active'); else btn.classList.remove('active');
    });
    if(showIsobars) document.getElementById('btn-iso').classList.add('active'); else document.getElementById('btn-iso').classList.remove('active');
    // bottone isoterme rimosso
    if(particlesOn) document.getElementById('btn-flow').classList.add('active'); else document.getElementById('btn-flow').classList.remove('active');
  }

  function togglePlay() { isPlaying = !isPlaying; document.getElementById('play-btn').innerText = isPlaying ? "❚❚" : "►"; if(isPlaying) playLoop(); }
  function playLoop() { if(!isPlaying) return; const s = document.getElementById('time-slider'); let v = parseInt(s.value) + 1; if(v >= catalog.length) v = 0; s.value = v; loadStep(v); setTimeout(playLoop, 800); }
</script>
