  let map, currentData = null, catalog = [];

  // --- perf helpers ---
  function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
  function lerp(a,b,t){ return a+(b-a)*t; }

  function throttleRAF(fn){
    let scheduled = false;
    return function(){
      if(scheduled) return;
      scheduled = true;
      requestAnimationFrame(()=>{
        scheduled = false;
        fn();
      });
    }
  }

  function interpStops(val, stops) {
    if(!stops || stops.length < 2) return {r:0,g:0,b:0,a:0.0};
    if(val <= stops[0].v) { const s=stops[0]; return {r:s.c[0],g:s.c[1],b:s.c[2],a:('a' in s)?s.a:0.90}; }
    for(let i=0;i<stops.length-1;i++){
      if(val >= stops[i].v && val < stops[i+1].v){
        const s1=stops[i], s2=stops[i+1];
        const t = (val-s1.v)/(s2.v-s1.v);
        const a1 = ('a' in s1) ? s1.a : 0.90;
        const a2 = ('a' in s2) ? s2.a : 0.90;
        return {
          r: Math.round(lerp(s1.c[0],s2.c[0],t)),
          g: Math.round(lerp(s1.c[1],s2.c[1],t)),
          b: Math.round(lerp(s1.c[2],s2.c[2],t)),
          a: lerp(a1,a2,t)
        };
      }
    }
    const s=stops[stops.length-1];
    return {r:s.c[0],g:s.c[1],b:s.c[2],a:('a' in s)?s.a:0.90};
  }

  function vividWindColor(speedMs){
    const maxV = 20.0;
    const t = clamp(speedMs/maxV, 0, 0.9999);
    const n = WIND_COLOR_SCALE.length;
    const pos = t*(n-1);
    const i = Math.floor(pos);
    const f = pos - i;
    const hex1=WIND_COLOR_SCALE[i], hex2=WIND_COLOR_SCALE[Math.min(i+1,n-1)];
    const r1=parseInt(hex1.slice(1,3),16), g1=parseInt(hex1.slice(3,5),16), b1=parseInt(hex1.slice(5,7),16);
    const r2=parseInt(hex2.slice(1,3),16), g2=parseInt(hex2.slice(3,5),16), b2=parseInt(hex2.slice(5,7),16);
    return {r:Math.round(lerp(r1,r2,f)), g:Math.round(lerp(g1,g2,f)), b:Math.round(lerp(b1,b2,f))};
  }

  function contourToScreenPath(ctx, coordinates, m){
    for (const polygon of coordinates) {
      for (const ring of polygon) {
        if (!ring || ring.length < 2) continue;

        const p0 = ring[0];
        let lat = m.la1 - p0[1] * m.dy;
        let lon = m.lo1 + p0[0] * m.dx;
        let pt = map.latLngToContainerPoint([lat, lon]);

        ctx.beginPath();
        ctx.moveTo(pt.x, pt.y);

        for (let i = 1; i < ring.length; i++) {
          const p = ring[i];
          lat = m.la1 - p[1] * m.dy;
          lon = m.lo1 + p[0] * m.dx;
          pt = map.latLngToContainerPoint([lat, lon]);
          ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
      }
    }
  }

  function pickLabelPointFromContour(contour){
    try{
      const coords = contour.coordinates;
      let bestRing = null, bestLen = 0;
      for (const polygon of coords) {
        for (const ring of polygon) {
          if (ring && ring.length > bestLen) { bestLen = ring.length; bestRing = ring; }
        }
      }
      if (!bestRing || bestLen < 40) return null;
      return bestRing[Math.floor(bestLen * 0.55)];
    } catch(e){ return null; }
  }

  function smoothGrid(src, nx, ny){
    const out = new Float32Array(nx*ny);
    for(let y=0;y<ny;y++){
      for(let x=0;x<nx;x++){
        let sum=0, wsum=0;
        for(let dy=-1;dy<=1;dy++){
          for(let dx=-1;dx<=1;dx++){
            const xx = x+dx, yy = y+dy;
            if(xx<0||yy<0||xx>=nx||yy>=ny) continue;
            const w = (dx===0 && dy===0) ? 4 : ((dx===0||dy===0)?2:1);
            sum += src[yy*nx+xx]*w;
            wsum += w;
          }
        }
        out[y*nx+x] = sum/wsum;
      }
    }
    return out;
  }

  function findExtremaAB(field, nx, ny){
    const cand = [];
    const r = 4;
    for(let y=r; y<ny-r; y++){
      for(let x=r; x<nx-r; x++){
        const idx = y*nx + x;
        const v = field[idx];

        let isMax = true, isMin = true;
        for(let yy=y-r; yy<=y+r; yy++){
          for(let xx=x-r; xx<=x+r; xx++){
            if(xx===x && yy===y) continue;
            const n = field[yy*nx+xx];
            if(n >= v) isMax = false;
            if(n <= v) isMin = false;
            if(!isMax && !isMin) break;
          }
          if(!isMax && !isMin) break;
        }
        if(isMax) cand.push({type:'A', x, y, v});
        else if(isMin) cand.push({type:'B', x, y, v});
      }
    }
    return cand;
  }

  function dedupeByDistance(points, minDistPx){
    const kept = [];
    for(const p of points){
      let ok = true;
      for(const k of kept){
        const dx = p.px - k.px, dy = p.py - k.py;
        if(dx*dx + dy*dy < minDistPx*minDistPx){ ok=false; break; }
      }
      if(ok) kept.push(p);
    }
    return kept;
  }

  function createCanvasLayers(){

  async function loadCatalog(){
    try{
      const r = await fetch('data_weather/catalog.json?t=' + Date.now());
      if(!r.ok) throw new Error('catalog load failed');
      catalog = await r.json();
      const slider = document.getElementById('time-slider');
      slider.max = catalog.length - 1;
      slider.addEventListener('input', (e)=> loadStep(parseInt(e.target.value)));
      await loadStep(0);
    } catch(e){
      console.error(e);
    }
  }

  async function loadStep(i){
    if(!catalog[i]) return;
    document.getElementById('time-label').innerText = catalog[i].label;
    try{
      const r = await fetch('data_weather/' + catalog[i].file + '?t=' + Date.now());
      currentData = await r.json();
      redrawAll();
    } catch(e){
      console.error(e);
    }
  }

  function resizeCanvasToMap(c){
    const s = map.getSize();
    if(c.width !== s.x) c.width = s.x;
    if(c.height !== s.y) c.height = s.y;

  function clearCanvas(c){
    const ctx = c.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,c.width,c.height);

  function redrawLightDuringMove(){
    if(!currentData) return;
    // vento è quello più evidente
    if(selected.has('wind')) drawWindArrows();
    // se vuoi anche griglia durante move, sbloccala:
    if(showGrid) drawLatLonGrid();
    // isolinee durante move: costose → NO (ridisegno a moveend)
  }

  function drawScalars(){
    const m = currentData.meta;
    if(!m) return;

    for (const layer of ['wind','temp','rain','rh','press','cloud']) {
      const canvas = scalarCanvases[layer];
      resizeCanvasToMap(canvas);
      const ctx = clearCanvas(canvas);

      if(!selected.has(layer)) continue;

      const off = document.createElement('canvas');
      off.width = m.nx; off.height = m.ny;
      const octx = off.getContext('2d');
      const img = octx.createImageData(m.nx, m.ny);
      const data = img.data;

      let arr = null, stops = null, isWindBg = false;

      if(layer==='wind'){ isWindBg = true; }
      else if(layer==='temp'){ arr = currentData.temp; stops = TEMP_STOPS; }
      else if(layer==='rain'){ arr = currentData.rain; stops = RAIN_STOPS; }
      else if(layer==='rh'){ arr = currentData.rh; stops = RH_STOPS; }
      else if(layer==='press'){ arr = currentData.press; stops = PRESS_STOPS; }
      else if(layer==='cloud'){ arr = currentData.cloud ?? currentData.cld ?? null; stops = CLOUD_STOPS; }

      if(!arr && !isWindBg) continue;

      for(let i=0; i<m.nx*m.ny; i++){
        let col = {r:0,g:0,b:0,a:0};

        if(isWindBg){
          const u = currentData.wind_u.data[i], v = currentData.wind_v.data[i];
          const sp = Math.sqrt(u*u+v*v);
          const rgb = vividWindColor(sp);
          col = {r:rgb.r,g:rgb.g,b:rgb.b,a:0.30};
        } else {
          const val = (arr[i] ?? 0);
          if(layer==='rain' && val < 0.6) { data[i*4+3]=0; continue; }
          if(layer==='cloud' && val < 5) { data[i*4+3]=0; continue; }
          col = interpStops(val, stops);
          col.a = clamp(col.a * 1.05, 0, 0.95);
        }

        const p = i*4;
        data[p] = col.r; data[p+1] = col.g; data[p+2] = col.b; data[p+3] = Math.round(col.a*255);
      }

      octx.putImageData(img, 0, 0);

      const tl = map.latLngToContainerPoint([m.la1, m.lo1]);
      const br = map.latLngToContainerPoint([m.la2, m.lo2]);

      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(off, tl.x, tl.y, br.x-tl.x, br.y-tl.y);
      ctx.restore();
    }
  }

  // STRIDE “intelligente” per griglie più grandi
  function computeArrowStride(m, zoom){
    // target ~1000 frecce a schermo (ordine di grandezza)
    const target = (zoom >= 10) ? 1400 : (zoom >= 8 ? 1100 : 800);
    const approx = Math.sqrt((m.nx*m.ny) / target);
    let stride = Math.ceil(approx);

    // aggiusta in base allo zoom
    if(zoom >= 11) stride = Math.max(2, Math.round(stride * 0.70));
    else if(zoom >= 10) stride = Math.max(2, Math.round(stride * 0.85));
    else if(zoom <= 7) stride = Math.max(3, Math.round(stride * 1.15));

    return clamp(stride, 2, 10);
  }

  function drawWindArrows(){
    if(!selected.has('wind') || !currentData?.meta) {
      // pulisci se spento
      resizeCanvasToMap(arrowCanvas);
      clearCanvas(arrowCanvas);
      return;
    }

    const m = currentData.meta;
    const zoom = map.getZoom();

    resizeCanvasToMap(arrowCanvas);
    const ctx = clearCanvas(arrowCanvas);

    const stride = computeArrowStride(m, zoom);
    const baseLen = zoom >= 11 ? 26 : (zoom >= 10 ? 22 : (zoom >= 8 ? 18 : 15));

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for(let y=0; y<m.ny; y+=stride){
      const lat = m.la1 - y*m.dy;
      for(let x=0; x<m.nx; x+=stride){
        const idx = y*m.nx + x;
        const u = currentData.wind_u.data[idx], v = currentData.wind_v.data[idx];
        const sp = Math.sqrt(u*u+v*v);
        if(sp < 0.8) continue;

        const lon = m.lo1 + x*m.dx;
        const p = map.latLngToContainerPoint([lat, lon]);

        const c = vividWindColor(sp);
        const fillStyle = `rgb(${c.r},${c.g},${c.b})`;

        const speedScale = clamp(sp/8.0, 0.70, 2.8);
        const len = baseLen * speedScale;
        const width = clamp(1.1 * speedScale, 1.2, 3.0);

        const headLen = len * 0.38;
        const headWidth = headLen * 0.70;

        const angle = Math.atan2(-v, u);

        const shaftEndX = p.x + (len-headLen)*Math.cos(angle);
        const shaftEndY = p.y + (len-headLen)*Math.sin(angle);

        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(shaftEndX, shaftEndY);
        ctx.strokeStyle = "rgba(0,0,0,0.95)";
        ctx.lineWidth = width + 1.8;
        ctx.stroke();

        ctx.strokeStyle = fillStyle;
        ctx.lineWidth = width;
        ctx.stroke();

        const tipX = p.x + len*Math.cos(angle);
        const tipY = p.y + len*Math.sin(angle);
        const wing1X = shaftEndX - headWidth*Math.cos(angle - Math.PI/2);
        const wing1Y = shaftEndY - headWidth*Math.sin(angle - Math.PI/2);
        const wing2X = shaftEndX - headWidth*Math.cos(angle + Math.PI/2);
        const wing2Y = shaftEndY - headWidth*Math.sin(angle + Math.PI/2);

        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(wing1X, wing1Y);
        ctx.lineTo(wing2X, wing2Y);
        ctx.closePath();

        ctx.fillStyle = "rgba(0,0,0,0.95)";
        ctx.fill();
        ctx.fillStyle = fillStyle;
        ctx.fill();
      }
    }
  }

  function updateParticles(){
    if(velocityLayer) { map.removeLayer(velocityLayer); velocityLayer = null; }
    if(!particlesOn || !currentData) return;

    // adattivo: più grande la griglia, meno densità (senza perdere qualità)
    const m = currentData.meta;
    const gridSize = m ? (m.nx*m.ny) : 20000;
    const zoom = map.getZoom();

    // valore base, poi “scarico” su griglie grandi
    let pm = 1/180;
    if(gridSize > 80000) pm = 1/260;
    if(gridSize > 150000) pm = 1/340;
    if(zoom <= 7) pm *= 0.85;

    velocityLayer = L.velocityLayer({
      displayValues: false,
      data: [ currentData.wind_u, currentData.wind_v ],
      maxVelocity: 20.0,
      velocityScale: 0.008,
      particleMultiplier: pm,
      lineWidth: 2.0,
      particleAge: 100,
      frameRate: 40,
      opacity: 1.0,
      colorScale: WIND_COLOR_SCALE,
      pane: 'particlePane'
    });

    velocityLayer.onAdd = function(map){
      L.VelocityLayer.prototype.onAdd.call(this, map);
      this._canvas.classList.add('velocity-canvas');
    };
    velocityLayer.addTo(map);
  }

  function drawLatLonGrid(){
    resizeCanvasToMap(gridCanvas);
    const ctx = clearCanvas(gridCanvas);
    if(!showGrid) return;

    const s = map.getSize();
    const b = map.getBounds();
    const zoom = map.getZoom();
    let step = 1.0;
    if(zoom >= 9) step = 0.5;
    if(zoom >= 11) step = 0.2;

    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.setLineDash([5,5]);
    ctx.font = "10px sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.55)";

    const startLon = Math.ceil(b.getWest() / step) * step;
    for(let lon = startLon; lon <= b.getEast(); lon += step){
      const x = map.latLngToContainerPoint([b.getSouth(), lon]).x;
      if(x<0||x>s.x) continue;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,s.y); ctx.stroke();
      ctx.fillText(lon.toFixed(1) + "°E", x+2, s.y-10);
    }

    const startLat = Math.ceil(b.getSouth() / step) * step;
    for(let lat = startLat; lat <= b.getNorth(); lat += step){
      const y = map.latLngToContainerPoint([lat, b.getWest()]).y;
      if(y<0||y>s.y) continue;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(s.x,y); ctx.stroke();
      ctx.fillText(lat.toFixed(1) + "°N", 5, y-2);
    }
    ctx.setLineDash([]);
  }

  function drawIsobars(){
    resizeCanvasToMap(isoCanvas);
    const ctx = clearCanvas(isoCanvas);

    if(!showIsobars || !currentData?.press || !currentData?.meta) return;

    try{
      const m = currentData.meta;
      const nx = m.nx, ny = m.ny;

      const raw = currentData.press;
      const clean = new Float32Array(raw.length);
      for(let i=0;i<raw.length;i++){
        const v = raw[i];
        clean[i] = (!v || v < 850 || v > 1100) ? 1013 : v;
      }

      const smooth = smoothGrid(clean, nx, ny);
      const thresholds = d3.range(960, 1050, 2);
      const contours = d3.contours().size([nx, ny]).thresholds(thresholds)(smooth);

      for(const c of contours){
        const v = Math.round(c.value);
        const is8 = (v % 8 === 0);
        const is4 = (v % 4 === 0);

        ctx.strokeStyle = "rgba(255,255,255,0.75)";
        ctx.lineWidth = is8 ? 2.4 : (is4 ? 1.7 : 1.05);
        ctx.setLineDash([]);
        contourToScreenPath(ctx, c.coordinates, m);
      }

      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.font = "900 12px Arial";

      for(const c of contours){
        const v = Math.round(c.value);
        if(v % 4 !== 0) continue;

        const p = pickLabelPointFromContour(c);
        if(!p) continue;

        const lat = m.la1 - p[1]*m.dy;
        const lon = m.lo1 + p[0]*m.dx;
        const pt = map.latLngToContainerPoint([lat,lon]);

        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(pt.x-16, pt.y-8, 32, 16);
        ctx.fillStyle = "#fff";
        ctx.fillText(v.toString(), pt.x, pt.y);
      }

      const cand = findExtremaAB(smooth, nx, ny);
      const highs = cand.filter(p=>p.type==='A').sort((a,b)=>b.v-a.v);
      const lows  = cand.filter(p=>p.type==='B').sort((a,b)=>a.v-b.v);

      function projectPoint(p){
        const lat = m.la1 - p.y*m.dy;
        const lon = m.lo1 + p.x*m.dx;
        const pt = map.latLngToContainerPoint([lat, lon]);
        return {...p, px:pt.x, py:pt.y};
      }

      const minDist = (map.getZoom() >= 10) ? 140 : 190;
      const highsPx = highs.slice(0, 30).map(projectPoint).filter(p=>p.px>=0 && p.py>=0 && p.px<=isoCanvas.width && p.py<=isoCanvas.height);
      const lowsPx  = lows.slice(0, 30).map(projectPoint).filter(p=>p.px>=0 && p.py>=0 && p.px<=isoCanvas.width && p.py<=isoCanvas.height);

      const Apts = dedupeByDistance(highsPx, minDist).slice(0, 3);
      const Bpts = dedupeByDistance(lowsPx,  minDist).slice(0, 3);

      const z = map.getZoom();
      const letterSize = clamp(18 + (z-7)*2.2, 18, 34);
      const valueSize  = clamp(11 + (z-7)*1.2, 11, 20);

      for(const p of Apts){ drawAB(ctx, p.px, p.py, "A", "#ff2b2b", Math.round(p.v), letterSize, valueSize); }
      for(const p of Bpts){ drawAB(ctx, p.px, p.py, "B", "#2b6bff", Math.round(p.v), letterSize, valueSize); }

    } catch(err){
      console.error("Isobare error:", err);
    }
  }

  function drawAB(ctx, x, y, letter, color, value, letterSize, valueSize){
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = `900 ${letterSize}px Arial`;
    ctx.lineWidth = 5;
    ctx.strokeStyle = "rgba(0,0,0,0.85)";
    ctx.strokeText(letter, x, y);
    ctx.fillStyle = color;
    ctx.fillText(letter, x, y);

    ctx.font = `900 ${valueSize}px Arial`;
    const vy = y + letterSize*0.85;
    const txt = `${value} hPa`;

    ctx.fillStyle = "rgba(0,0,0,0.55)";
    const padX = 10, padY = 6;
    const w = ctx.measureText(txt).width + padX*2;
    const h = valueSize + padY*2;
    ctx.fillRect(x - w/2, vy - h/2, w, h);

    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(0,0,0,0.85)";
    ctx.strokeText(txt, x, vy);
    ctx.fillStyle = "#fff";
    ctx.fillText(txt, x, vy);

    ctx.restore();
  }

  function drawIsotherms(){
    resizeCanvasToMap(thermCanvas);
    const ctx = clearCanvas(thermCanvas);

    if(!showIsotherms || !currentData?.temp || !currentData?.meta) return;

    try{
      const m = currentData.meta;
      const nx = m.nx, ny = m.ny;

      const raw = currentData.temp;
      const clean = new Float32Array(raw.length);
      let tMin = 999, tMax = -999;
      for(let i=0;i<raw.length;i++){
        const v = raw[i];
        const vv = (v===null || v===undefined || Number.isNaN(v)) ? 0 : v;
        clean[i] = vv;
        if(vv < tMin) tMin = vv;
        if(vv > tMax) tMax = vv;
      }

      const lo = Math.floor(tMin) - 1;
      const hi = Math.ceil(tMax) + 1;
      const thresholds = d3.range(lo, hi+1, 1);

      const contours = d3.contours().size([nx, ny]).thresholds(thresholds)(clean);

      ctx.setLineDash([]);
      ctx.strokeStyle = "rgba(255,255,255,0.38)";
      ctx.lineWidth = 1.0;

      for(const c of contours){
        contourToScreenPath(ctx, c.coordinates, m);
      }

      const z = map.getZoom();
      const fontSize = clamp(12 + (z-7)*1.6, 12, 26);

      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.font = `900 ${fontSize}px Arial`;

      for(const c of contours){
        const v = Math.round(c.value);
        if(v % 5 !== 0) continue;

        const p = pickLabelPointFromContour(c);
        if(!p) continue;

        const lat = m.la1 - p[1]*m.dy;
        const lon = m.lo1 + p[0]*m.dx;
        const pt = map.latLngToContainerPoint([lat,lon]);

        const txt = `${v}°`;
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        const w = ctx.measureText(txt).width + 16;
        const h = fontSize + 10;
        ctx.fillRect(pt.x - w/2, pt.y - h/2, w, h);

        ctx.lineWidth = 4;
        ctx.strokeStyle = "rgba(0,0,0,0.85)";
        ctx.strokeText(txt, pt.x, pt.y);
        ctx.fillStyle = "#fff";
        ctx.fillText(txt, pt.x, pt.y);
      }

    } catch(err){
      console.error("Isoterme error:", err);
    }
  }

  // --- UI ---
  window.toggleLayer = function(name){
    if(selected.has(name)) selected.delete(name); else selected.add(name);
    updateToggleUI(); redrawAll();
  }
  window.toggleIsobars = function(){ showIsobars=!showIsobars; updateToggleUI(); redrawAll(); }
  window.toggleIsotherms = function(){ showIsotherms=!showIsotherms; updateToggleUI(); redrawAll(); }
  window.toggleGrid = function(){ showGrid=!showGrid; updateToggleUI(); redrawAll(); }
  window.toggleParticles = function(){ particlesOn=!particlesOn; updateToggleUI(); redrawAll(); }

  function updateToggleUI(){
    document.querySelectorAll('.toggle').forEach(el => {
      const txt = el.innerText.toLowerCase();
      if(txt.includes('vento') && selected.has('wind')) el.classList.add('active');
      else if(txt.includes('temp') && selected.has('temp')) el.classList.add('active');
      else if(txt.includes('pioggia') && selected.has('rain')) el.classList.add('active');
      else if(txt.includes('umidità') && selected.has('rh')) el.classList.add('active');
      else if(txt.includes('pressione') && selected.has('press')) el.classList.add('active');
      else if(txt.includes('nuvole') && selected.has('cloud')) el.classList.add('active');
      else if(txt.includes('isobare') && showIsobars) el.classList.add('active');
      else if(txt.includes('isoterme') && showIsotherms) el.classList.add('active');
      else if(txt.includes('reticolo') && showGrid) el.classList.add('active');
      else el.classList.remove('active');
    });

    const btnFlow = document.getElementById('btn-flow');
    if(particlesOn) btnFlow.classList.add('active'); else btnFlow.classList.remove('active');

    document.getElementById('wind-rose').style.display = selected.has('wind') ? 'flex' : 'none';
  }

  function onPick(e){
    if(!currentData?.meta) return;

    const m = currentData.meta;
    const y = Math.round((m.la1 - e.latlng.lat)/m.dy);
    const x = Math.round((e.latlng.lng - m.lo1)/m.dx);
    if(x<0||x>=m.nx||y<0||y>=m.ny) return;

    const idx = y*m.nx + x;

    let val='--', unit='';
    if(selected.has('rain') && currentData.rain){ val = (currentData.rain[idx] ?? 0).toFixed(1); unit='mm'; }
    else if(selected.has('temp') && currentData.temp){ val = (currentData.temp[idx] ?? 0).toFixed(1); unit='°C'; }
    else if(selected.has('wind')){
      const u=currentData.wind_u.data[idx], v=currentData.wind_v.data[idx];
      val = (Math.sqrt(u*u+v*v)*3.6).toFixed(1); unit='km/h';
      const arrow = document.getElementById('rose-arrow');
      const deg = 90 - (Math.atan2(v, u) * 180 / Math.PI);
      arrow.style.transform = `rotate(${deg}deg)`;
    }
    else if(selected.has('rh') && currentData.rh){ val = Math.round(currentData.rh[idx] ?? 0); unit='%'; }
    else if(selected.has('press') && currentData.press){ val = Math.round(currentData.press[idx] ?? 0); unit='hPa'; }

    document.getElementById('val-display').innerText = val;
    document.getElementById('unit-display').innerText = unit;
  }

  // --- play ---
  window.togglePlay = function(){
    if(isPlaying){
      isPlaying=false;
      document.getElementById('play-btn').innerText='►';
      return;
    }
    isPlaying=true;
    document.getElementById('play-btn').innerText='❚❚';
    const s = document.getElementById('time-slider');
    let i = parseInt(s.value);
    const loop = setInterval(()=>{
      if(!isPlaying || i>=s.max){
        clearInterval(loop);
        isPlaying=false;
        document.getElementById('play-btn').innerText='►';
        return;
      }
      i++;
      s.value=i;
      loadStep(i);
    }, 800);
  }
</script>
