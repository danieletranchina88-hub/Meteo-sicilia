<!DOCTYPE html>
<html lang="it">
<head>
  <title>Italia MeteoHub Pro - Synoptic GPU</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; background: #0a0a0a; font-family: 'Segoe UI', Roboto, sans-serif; color: #ddd; overflow: hidden; }
    
    /* MAPPA E PARTICELLE */
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #0a0a0a; z-index: 1; }
    #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }

    /* UI Invariata */
    #model-info { position: absolute; top: 15px; left: 20px; z-index: 5000; pointer-events: none; }
    #model-title { font-size: 18px; font-weight: 900; color: #fff; text-transform: uppercase; text-shadow: 0 2px 4px #000; }
    #model-sub { font-size: 11px; color: #00eaff; font-family: monospace; text-shadow: 0 1px 2px #000; }
    
    #info-box { position: absolute; top: 55px; left: 20px; z-index: 5000; pointer-events: none; text-shadow: 0px 2px 10px rgba(0,0,0,1); }
    #val-display { font-size: 3.5em; font-weight: 950; color: #fff; line-height: 0.8; }
    #unit-display { font-size: 1.1em; color: #ccc; font-weight: 700; margin-left: 5px; }

    #ui-container { position: absolute; top: 10px; right: 10px; z-index: 5000; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; max-height: 85vh; overflow-y: auto; scrollbar-width: none; }
    .panel { background: rgba(20,20,20,0.85); backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .toggle { width: 150px; display:flex; align-items:center; justify-content:space-between; padding: 12px 10px; margin: 4px 0; background: rgba(255,255,255,0.04); border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 11px; color: #bbb; border: 1px solid transparent; transition: 0.2s; }
    .toggle.active { background: #0077ff !important; color: #fff !important; }
    .btn-special { background: rgba(255,255,255,0.1) !important; color: #fff !important; border: 1px solid rgba(255,255,255,0.2) !important; }
    .btn-special.active { background: #23a045 !important; border-color: #2ecf59 !important; }
    .gps-btn { width: 170px; padding: 14px; border-radius: 8px; font-size: 13px; background: #23a045; color: white; cursor: pointer; font-weight: 900; border: none; margin-bottom: 5px; }
    
    #bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to top, rgba(0,0,0,1), transparent); display: flex; align-items: center; padding: 0 15px; z-index: 5000; }
    input[type=range] { flex-grow: 1; accent-color: #0077ff; cursor: pointer; }
    
    #loading-indicator { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 1px solid #0077ff; color: white; padding: 15px 25px; border-radius: 10px; font-weight: bold; z-index: 9999; }
    #loading-indicator.active { display: block; }
  </style>
</head>
<body>
  <div id="model-info"><div id="model-title">ITALIA METEOHUB <span style="color:#00eaff">ICON-2I PRO</span></div><div id="model-sub">LIVE SYNC | VALID: <span id="valid-time">--</span></div></div>
  <div id="info-box"><div id="val-display">--</div><div id="unit-display">Clicca la mappa</div></div>
  <div id="loading-indicator">Elaborazione...</div>
  
  <div id="ui-container">
    <button class="gps-btn" onclick="getMyWeather()">📍 IL MIO METEO</button>
    <div class="panel">
        <div class="toggle btn-special" id="btn-flow" onclick="toggleParticles()">PARTICELLE 🌬️</div>
    </div>
    <div class="panel">
        <div class="toggle active" id="btn-temp" onclick="toggleLayer('temp')">TEMPERATURA 🌡️</div>
        <div class="toggle" id="btn-feels" onclick="toggleLayer('feels')">PERCEPITA 🤒</div>
        <div class="toggle" id="btn-wind" onclick="toggleLayer('wind')">VENTO 🧭</div>
        <div class="toggle" id="btn-rain" onclick="toggleLayer('rain')">PIOGGIA ☔</div>
        <div class="toggle" id="btn-cloud" onclick="toggleLayer('cloud')">NUVOLE ☁️</div>
        <div class="toggle" id="btn-rh" onclick="toggleLayer('rh')">UMIDITÀ 💧</div>
        <div class="toggle" id="btn-press" onclick="toggleLayer('press')">PRESSIONE ⏲️</div>
        <div style="height:1px; background: rgba(255,255,255,0.1); margin:8px 0;"></div>
        <div class="toggle" id="btn-iso" onclick="toggleIsobars()">ISOBARE A/B 〰️</div>
    </div>
  </div>

  <div id="map"></div>
  <canvas id="particle-canvas"></canvas>
  
  <div id="bottom-bar">
    <button id="play-btn" style="background:none; border:none; color:white; font-size:2.2em; cursor:pointer;" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label" style="color:white; font-weight:bold; margin-left:15px; font-family: monospace; min-width: 100px;">--/-- --:--</div>
  </div>

<script>
  // TAVOLOZZE COLORI MAPPA (Ricalibrate per sovrapposizione multipla pulita)
  const WIND_BG_STOPS = [{v:0, c:[30,30,35], a:0.6}, {v:15, c:[0,120,160], a:0.75}, {v:30, c:[0,180,140], a:0.8}, {v:70, c:[220,160,0], a:0.9}, {v:120, c:[180,0,40], a:0.95}];
  const TEMP_STOPS = [{v:-20,c:[115,0,171]},{v:-10,c:[0,43,161]},{v:0,c:[0,217,255]},{v:10,c:[51,184,51]},{v:20,c:[255,242,0]},{v:25,c:[255,166,0]},{v:30,c:[255,64,0]},{v:35,c:[204,0,0]},{v:40,c:[128,0,34]}];
  const RAIN_STOPS = [{v:0,c:[0,0,0],a:0},{v:0.1,c:[80,160,255],a:0.6},{v:5,c:[0,50,200],a:0.85},{v:20,c:[255,200,0],a:0.95}];
  const CLOUD_STOPS = [{v:0,c:[255,255,255],a:0},{v:10,c:[200,200,220],a:0.3},{v:80,c:[150,150,170],a:0.85}];
  const RH_STOPS = [{v:0,c:[160,80,40],a:0.8},{v:40,c:[180,180,80],a:0.8},{v:80,c:[60,160,180],a:0.8},{v:100,c:[60,40,160],a:0.9}];
  const PRESS_STOPS = [{v:980,c:[0,100,160]},{v:1013,c:[220,220,220]},{v:1030,c:[180,120,40]}];

  // COLORI PARTICELLE WINDY STYLE
  const PARTICLE_COLORS = [
      {v:0,  c:"#4287f5"}, // Calmo (Blu)
      {v:15, c:"#00ffcc"}, // Brezza (Ciano)
      {v:30, c:"#aeff00"}, // Moderato (Verde-Giallo)
      {v:50, c:"#ffea00"}, // Forte (Giallo)
      {v:70, c:"#ff7300"}, // Molto forte (Arancio)
      {v:90, c:"#ff0000"}, // Tempesta (Rosso)
      {v:120,c:"#cc00ff"}  // Uragano (Magenta)
  ];

  function getParticleColor(speed) {
      if(speed <= PARTICLE_COLORS[0].v) return PARTICLE_COLORS[0].c;
      if(speed >= PARTICLE_COLORS[PARTICLE_COLORS.length-1].v) return PARTICLE_COLORS[PARTICLE_COLORS.length-1].c;
      for (let i = 0; i < PARTICLE_COLORS.length - 1; i++) {
          if (speed >= PARTICLE_COLORS[i].v && speed <= PARTICLE_COLORS[i+1].v) return PARTICLE_COLORS[i+1].c;
      }
      return "#ffffff";
  }

  function getStopColor(val, stops) {
    if (val <= stops[0].v) return [...stops[0].c, (stops[0].a ?? 0.85)];
    for (let i = 0; i < stops.length - 1; i++) {
      if (val >= stops[i].v && val <= stops[i+1].v) {
        const t = (val - stops[i].v) / (stops[i+1].v - stops[i].v);
        const a1 = stops[i].a ?? 0.85, a2 = stops[i+1].a ?? 0.85;
        return [(stops[i].c[0]*(1-t)+stops[i+1].c[0]*t)|0, (stops[i].c[1]*(1-t)+stops[i+1].c[1]*t)|0, (stops[i].c[2]*(1-t)+stops[i+1].c[2]*t)|0, (a1*(1-t)+a2*t)];
      }
    }
    return [...stops[stops.length-1].c, (stops[stops.length-1].a ?? 0.85)];
  }

  function getBilinear(arr, gx, gy, nx, ny) {
    if (!arr) return 0;
    let x = Math.floor(gx), y = Math.floor(gy);
    if(x < 0) x = 0; if(x >= nx-1) x = nx-2;
    if(y < 0) y = 0; if(y >= ny-1) y = ny-2;
    const fx = gx - x, fy = gy - y;
    const i00 = y*nx + x;
    return arr[i00]*(1-fx)*(1-fy) + arr[i00+1]*fx*(1-fy) + arr[i00+nx]*(1-fx)*fy + arr[i00+nx+1]*fx*fy;
  }

  let map, currentData = null, catalog = [], isPlaying = false;
  // SELEZIONE MULTIPLA REALE: Usiamo un Set per permettere più layer contemporaneamente
  const selected = new Set(['temp']); 
  let showIsobars = false, showParticles = false;
  const dataCache = {};
  
  const offscreenCanvas = document.createElement('canvas');
  const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

  // INIT PARTICELLE
  const pCanvas = document.getElementById('particle-canvas');
  const pCtx = pCanvas.getContext('2d');
  let particles = [];
  const NUM_PARTICLES = 2500;
  let animFrame = null;

  window.addEventListener('load', async () => {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', 
        bounds: [[6.0, 35.0], [19.5, 47.5]],
        dragRotate: false, 
        pitchWithRotate: false,
        antialias: false
    });

    map.on('load', async () => {
        // Confini territoriali
        map.addSource('italy-borders', {
            type: 'geojson',
            data: 'https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson'
        });
        map.addLayer({
            id: 'borders-layer',
            type: 'line',
            source: 'italy-borders',
            paint: { 'line-color': '#ffffff', 'line-width': 0.8, 'line-opacity': 0.6 }
        });

        // Layer Meteo (Sotto i confini)
        map.addSource('weather-source', {
            type: 'image',
            url: 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=', 
            coordinates: [[0,0], [0,0], [0,0], [0,0]]
        });
        map.addLayer({
            id: 'weather-layer',
            type: 'raster',
            source: 'weather-source',
            paint: { 'raster-opacity': 0.85, 'raster-resampling': 'linear' }
        }, 'borders-layer');

        // Fonti Isobare Vuote
        map.addSource('isobars-source', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addSource('centers-source', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

        // Linee Pressione
        map.addLayer({
            id: 'isobars-line',
            type: 'line',
            source: 'isobars-source',
            layout: { 'visibility': 'none' },
            paint: {
                'line-color': '#ffffff',
                'line-width': ['match', ['%', ['get', 'value'], 4], 0, 1.8, 0.7], 
                'line-opacity': ['match', ['%', ['get', 'value'], 4], 0, 0.9, 0.4]
            }
        });

        // Lettere A e B INDICATIVE E GRANDI (Stile Sinottico)
        map.addLayer({
            id: 'centers-label',
            type: 'symbol',
            source: 'centers-source',
            layout: {
                'visibility': 'none',
                'text-field': ['get', 'label'],
                'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
                'text-size': 45, // Grandissime
                'text-allow-overlap': true
            },
            paint: {
                'text-color': ['match', ['get', 'type'], 'H', '#ff0000', 'L', '#0077ff', '#ffffff'], // A Rossa, B Blu
                'text-halo-color': '#ffffff',
                'text-halo-width': 3
            }
        });

        // Testo sulle Isobare
        map.addLayer({
            id: 'isobars-label',
            type: 'symbol',
            source: 'isobars-source',
            layout: {
                'visibility': 'none',
                'symbol-placement': 'line',
                'text-field': ['to-string', ['get', 'value']],
                'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
                'text-size': 12,
            },
            paint: { 'text-color': '#ffffff', 'text-halo-color': '#000000', 'text-halo-width': 1.5 }
        });

        // Se l'utente muove la mappa, nascondi temporaneamente le particelle per evitare che sbalzino
        map.on('move', () => { 
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            particles.forEach(p => p.age = 100); 
        });

        await loadCatalog();
    });

    map.on('click', (e) => {
        if(!currentData) return;
        const m = currentData.meta;
        const gx = (e.lngLat.lng - m.lo1) / m.dx;
        const gy = (m.la1 - e.lngLat.lat) / m.dy;
        
        if(gx>=0 && gy>=0 && gx<m.nx && gy<m.ny) {
            let activeLayer = [...selected].filter(l => l !== 'wind')[0] || [...selected][0] || 'temp';
            let val = 0;
            if (activeLayer === 'wind') {
                const u = getBilinear(currentData.wind_u.data, gx, gy, m.nx, m.ny);
                const v = getBilinear(currentData.wind_v.data, gx, gy, m.nx, m.ny);
                val = Math.sqrt(u*u+v*v)*3.6;
            } else {
                let dataKey = activeLayer === 'feels' ? 'feels_like' : activeLayer;
                val = getBilinear(currentData[dataKey], gx, gy, m.nx, m.ny);
            }
            document.getElementById('val-display').innerText = val.toFixed(1);
            document.getElementById('unit-display').innerText = (activeLayer==='temp'||activeLayer==='feels') ? "°C" : (activeLayer==='wind'?"km/h" : (activeLayer==='rain'?"mm":"%"));
        }
    });
  });

  function resizeCanvas() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
  }

  async function loadCatalog() {
    try {
        const r = await fetch('data_weather/catalog.json?t=' + Date.now());
        catalog = await r.json();
        const s = document.getElementById('time-slider');
        s.max = catalog.length - 1;
        s.oninput = (e) => loadStep(parseInt(e.target.value));
        if(catalog.length > 0) {
            let bestIdx = 0, minDiff = Infinity, now = new Date();
            catalog.forEach((item, idx) => {
                const p = item.label.split(' '), d = p[0].split('/'), t = p[1].split(':');
                const dt = new Date(now.getFullYear(), parseInt(d[1])-1, parseInt(d[0]), parseInt(t[0]), 0);
                const diff = Math.abs(now - dt);
                if(diff < minDiff) { minDiff = diff; bestIdx = idx; }
            });
            s.value = bestIdx;
            await loadStep(bestIdx);
        }
    } catch(e) { console.error("Data error"); }
  }

  async function loadStep(i) {
    if (!catalog[i]) return;
    document.getElementById('loading-indicator').classList.add('active');
    if (dataCache[i]) {
        currentData = dataCache[i];
    } else {
        const r = await fetch('data_weather/' + catalog[i].file);
        currentData = await r.json();
        const m = currentData.meta;
        
        // Calcolo Percepita
        if (currentData.temp && currentData.rh && currentData.wind_u) {
            const len = m.nx * m.ny;
            currentData.feels_like = new Float32Array(len);
            for(let j=0; j<len; j++) {
                let T = currentData.temp[j], RH = currentData.rh[j], v = Math.sqrt(currentData.wind_u.data[j]**2 + currentData.wind_v.data[j]**2);
                let e = (RH / 100.0) * 6.105 * Math.exp((17.27 * T) / (237.7 + T));
                currentData.feels_like[j] = T + 0.33 * e - 0.70 * v - 4.00;
            }
        }

        // --- ISOBARE E A/B INTELLIGENTI ---
        if (currentData.press) {
            // Isobare ESATTE ogni 2 hPa
            const contours = d3.contours().size([m.nx, m.ny]).thresholds(d3.range(960, 1052, 2))(currentData.press);
            const features = [];
            contours.forEach(c => {
                const mappedCoords = c.coordinates.map(polygon => polygon.map(ring => ring.map(pt => [m.lo1 + pt[0]*m.dx, m.la1 - pt[1]*m.dy])));
                features.push({ type: "Feature", geometry: { type: c.type, coordinates: mappedCoords }, properties: { value: c.value } });
            });
            currentData.isoGeoJSON = { type: "FeatureCollection", features: features };

            // A/B su GRANDE SCALA (Individua solo i centri reali, non i micro-picchi)
            const centers = [];
            const step = 60; // Step gigante (circa 130km) per evitare cloni
            for(let y = step; y < m.ny - step; y += step) {
                for(let x = step; x < m.nx - step; x += step) {
                    let val = currentData.press[y * m.nx + x];
                    let isMax = true, isMin = true;
                    // Scansiona area circostante
                    for(let i = -step; i <= step; i += 10) {
                        for(let j = -step; j <= step; j += 10) {
                            let v = currentData.press[(y+i) * m.nx + (x+j)];
                            if (v > val) isMax = false;
                            if (v < val) isMin = false;
                        }
                    }
                    // Aggiunge solo se sono valori sinottici sensati
                    if (isMax && val >= 1016) {
                        centers.push({ type: "Feature", geometry: { type: "Point", coordinates: [m.lo1 + x*m.dx, m.la1 - y*m.dy] }, properties: { type: 'H', label: 'A' }});
                    }
                    if (isMin && val <= 1012) {
                        centers.push({ type: "Feature", geometry: { type: "Point", coordinates: [m.lo1 + x*m.dx, m.la1 - y*m.dy] }, properties: { type: 'L', label: 'B' }});
                    }
                }
            }
            currentData.centersGeoJSON = { type: "FeatureCollection", features: centers };
        }

        dataCache[i] = currentData;
    }
    
    document.getElementById('valid-time').innerText = catalog[i].label;
    document.getElementById('time-label').innerText = catalog[i].label;
    
    updateGPULayer();
    updateIsobars();
    
    // Resetta le particelle al cambio orario
    particles.forEach(p => p.age = 100);
    
    document.getElementById('loading-indicator').classList.remove('active');
  }

  function updateGPULayer() {
    if (!currentData || !map.getSource('weather-source')) return;
    const m = currentData.meta;
    
    offscreenCanvas.width = m.nx; offscreenCanvas.height = m.ny;
    const imgData = offscreenCtx.createImageData(m.nx, m.ny);
    const d = imgData.data;

    // Ordine di renderizzazione: Pioggia sempre sopra Nuvole, Nuvole sopra Temperatura, ecc.
    const drawOrder = ['temp', 'feels', 'rh', 'press', 'wind', 'cloud', 'rain'];
    const activeLayers = drawOrder.filter(l => selected.has(l));

    if (activeLayers.length === 0) {
        offscreenCtx.putImageData(imgData, 0, 0);
        return;
    }

    // MERCATOR PRE-WARP ALLINEAMENTO PERFETTO
    const dx2 = m.dx / 2, dy2 = m.dy / 2;
    const topLat = m.la1 + dy2;
    const bottomLat = (m.la1 - (m.ny - 1) * m.dy) - dy2;
    const y1 = Math.log(Math.tan(Math.PI / 4 + (topLat * Math.PI / 180) / 2));
    const y2 = Math.log(Math.tan(Math.PI / 4 + (bottomLat * Math.PI / 180) / 2));

    for(let y=0; y < m.ny; y++) {
        const fy = y / (m.ny - 1);
        const mercY = y1 + fy * (y2 - y1);
        const lat = (2 * Math.atan(Math.exp(mercY)) - Math.PI / 2) * 180 / Math.PI;
        const gy = (m.la1 - lat) / m.dy;

        for(let x=0; x < m.nx; x++) {
            let r=0, g=0, b=0, finalA=0;
            
            // BLENDING MULTIPLO
            for(let l of activeLayers) {
                let val, stops, arr = (l === 'feels' ? currentData.feels_like : currentData[l]);
                if(l === 'wind') {
                    const u = getBilinear(currentData.wind_u.data, x, gy, m.nx, m.ny);
                    const v = getBilinear(currentData.wind_v.data, x, gy, m.nx, m.ny);
                    val = Math.sqrt(u*u+v*v)*3.6; stops = WIND_BG_STOPS;
                } else if(arr) {
                    val = getBilinear(arr, x, gy, m.nx, m.ny);
                    stops = (l==='temp'||l==='feels') ? TEMP_STOPS : (l==='rain'?RAIN_STOPS:(l==='cloud'?CLOUD_STOPS:(l==='rh'?RH_STOPS:PRESS_STOPS)));
                } else continue;

                // Salta i valori minimi per pioggia e nuvole per non coprire
                if ((l === 'cloud' && val < 5) || (l === 'rain' && val < 0.1)) continue;

                const col = getStopColor(val, stops); 
                const a = col[3];
                
                if(a > 0) {
                    if(finalA === 0) { r=col[0]; g=col[1]; b=col[2]; finalA=a; }
                    else { 
                        // Corretta formula di sovrapposizione colori
                        r=(col[0]*a)+(r*(1-a)); 
                        g=(col[1]*a)+(g*(1-a)); 
                        b=(col[2]*a)+(b*(1-a)); 
                        finalA=Math.max(finalA, a); 
                    }
                }
            }
            const p = (y * m.nx + x) * 4; d[p]=r; d[p+1]=g; d[p+2]=b; d[p+3]=finalA*255;
        }
    }
    offscreenCtx.putImageData(imgData, 0, 0);

    const left = m.lo1 - dx2, right = m.lo1 + (m.nx - 1) * m.dx + dx2;
    map.getSource('weather-source').updateImage({ url: offscreenCanvas.toDataURL(), coordinates: [[left, topLat], [right, topLat], [right, bottomLat], [left, bottomLat]] });
  }

  // --- MOTORE PARTICELLE WINDY STYLE ---
  function initParticles() {
      particles = [];
      for(let i=0; i<NUM_PARTICLES; i++) {
          particles.push({ lng: 0, lat: 0, age: 100 }); // Iniziano morte per rigenerarsi
      }
      if(animFrame) cancelAnimationFrame(animFrame);
      animateParticles();
  }

  function animateParticles() {
      if(!showParticles || !currentData || !currentData.wind_u) {
          pCtx.clearRect(0,0, pCanvas.width, pCanvas.height);
          return;
      }

      // Effetto Scia Sfumata (Fade)
      pCtx.fillStyle = 'rgba(0, 0, 0, 0.88)';
      pCtx.globalCompositeOperation = 'destination-in';
      pCtx.fillRect(0, 0, pCanvas.width, pCanvas.height);
      pCtx.globalCompositeOperation = 'source-over';

      const m = currentData.meta;
      
      // Raggruppiamo i colori per ottimizzare la CPU
      let colorPaths = {};

      particles.forEach(p => {
          if(p.age > 90) { // Durata vita particella
              p.lng = m.lo1 + Math.random() * (m.nx * m.dx);
              p.lat = m.la1 - Math.random() * (m.ny * m.dy);
              p.age = Math.random() * 20; // sfalsamento
          }

          let gx = (p.lng - m.lo1) / m.dx;
          let gy = (m.la1 - p.lat) / m.dy;

          if(gx >= 0 && gy >= 0 && gx < m.nx-1 && gy < m.ny-1) {
              let u = getBilinear(currentData.wind_u.data, gx, gy, m.nx, m.ny);
              let v = getBilinear(currentData.wind_v.data, gx, gy, m.nx, m.ny);
              let speed = Math.sqrt(u*u + v*v);

              if (speed > 1) { // Solo se c'è un po' di vento
                  let startPx = map.project([p.lng, p.lat]);
                  
                  // Velocità bilanciata (Windy Style)
                  p.lng += u * 0.003;
                  p.lat += v * 0.003;
                  
                  let endPx = map.project([p.lng, p.lat]);

                  let color = getParticleColor(speed * 3.6);
                  if(!colorPaths[color]) colorPaths[color] = [];
                  colorPaths[color].push({sx: startPx.x, sy: startPx.y, ex: endPx.x, ey: endPx.y, w: Math.min((speed/4)+1, 3)});
              } else { p.age = 100; }
          } else { p.age = 100; }
          p.age++;
      });

      // Disegno ottimizzato per colore
      for(let c in colorPaths) {
          pCtx.beginPath();
          pCtx.strokeStyle = c;
          pCtx.lineWidth = colorPaths[c][0].w;
          colorPaths[c].forEach(line => {
              pCtx.moveTo(line.sx, line.sy);
              pCtx.lineTo(line.ex, line.ey);
          });
          pCtx.stroke();
      }

      animFrame = requestAnimationFrame(animateParticles);
  }

  function updateIsobars() {
      if(!currentData || !map.getSource('isobars-source')) return;
      const vis = showIsobars ? 'visible' : 'none';
      map.setLayoutProperty('isobars-line', 'visibility', vis);
      map.setLayoutProperty('isobars-label', 'visibility', vis);
      map.setLayoutProperty('centers-label', 'visibility', vis);
      if(showIsobars) {
          map.getSource('isobars-source').setData(currentData.isoGeoJSON);
          map.getSource('centers-source').setData(currentData.centersGeoJSON);
      }
  }

  // GESTIONE PULSANTI MULTIPLI
  window.toggleLayer = (l) => { 
      if(selected.has(l)) { selected.delete(l); } 
      else { selected.add(l); }
      updateGPULayer(); 
      updateBtns(); 
  };
  
  window.toggleParticles = () => { 
      showParticles = !showParticles; 
      if(showParticles) initParticles(); 
      else { pCtx.clearRect(0,0, pCanvas.width, pCanvas.height); if(animFrame) cancelAnimationFrame(animFrame); }
      updateBtns(); 
  };
  
  window.toggleIsobars = () => { showIsobars = !showIsobars; updateIsobars(); updateBtns(); };
  
  function updateBtns() { 
      document.querySelectorAll('.toggle').forEach(b => {
          const id = b.id.replace('btn-','');
          if (id === 'iso') b.classList.toggle('active', showIsobars);
          else if (id === 'flow') b.classList.toggle('active', showParticles);
          else b.classList.toggle('active', selected.has(id));
      }); 
  }

  window.togglePlay = () => { isPlaying = !isPlaying; document.getElementById('play-btn').innerText = isPlaying ? "❚❚" : "►"; if(isPlaying) playLoop(); };
  function playLoop() { if(!isPlaying) return; const s = document.getElementById('time-slider'); let v = (parseInt(s.value)+1)%catalog.length; s.value = v; loadStep(v); setTimeout(playLoop, 1200); }
  window.getMyWeather = () => navigator.geolocation.getCurrentPosition(p => map.flyTo({center:[p.coords.longitude, p.coords.latitude], zoom:9}));
</script>
</body>
</html>
