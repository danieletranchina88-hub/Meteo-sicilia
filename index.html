<!DOCTYPE html>
<html>
<head>
  <title>Sicilia MeteoHub - ICON-2I NATIVE</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-velocity@1.8.0/dist/leaflet-velocity.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; background: #0a0a0a; font-family: 'Segoe UI', sans-serif; color: #ddd; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #0a0a0a; }

    /* HEADER SCIENTIFICO */
    #model-info { position: absolute; top: 15px; left: 60px; z-index: 4000; pointer-events: none; text-shadow: 0 2px 4px #000; }
    #model-title { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 1px; }
    #model-sub { font-size: 11px; font-weight: 500; color: #aaa; font-family: monospace; }

    #coords-display { position: absolute; bottom: 5px; left: 90px; z-index: 4000; pointer-events: none; font-family: monospace; font-size: 10px; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; }

    /* INFO BOX */
    #info-box { position: absolute; top: 15px; left: 20px; z-index: 9999; pointer-events: none; display: flex; align-items: center; gap: 15px; }
    #val-group { display: flex; flex-direction: column; margin-top: 40px; }
    #val-display { font-size: 3.2em; font-weight: 900; color: #fff; text-shadow: 0 2px 8px #000; line-height: 0.9; }
    #unit-display { font-size: 1.1em; color: #aaa; font-weight: 700; margin-top: 4px; }

    #wind-rose { width: 45px; height: 45px; background: rgba(255,255,255,0.9); border-radius: 50%; display: none; align-items: center; justify-content: center; position: relative; box-shadow: 0 4px 10px #000; margin-top: 40px; }
    #rose-arrow { width: 24px; height: 24px; fill: #000; }

    /* UI CONTROLS */
    #ui-container { position: absolute; top: 10px; right: 10px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    .panel { background: rgba(25,25,25,0.85); backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); color: #eee; }
    .toggle { width: 165px; display:flex; align-items:center; justify-content:space-between; padding: 8px 12px; margin: 4px 0; background: rgba(255,255,255,0.05); border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; transition: 0.2s; }
    .toggle.active { background: #0077ff; color: #fff; }
    .mini { width: 165px; padding: 8px 12px; border-radius: 8px; font-size:12px; background: rgba(255,255,255,0.05); color:#ccc; cursor:pointer; font-weight:800; border: 1px solid rgba(255,255,255,0.1); }
    .mini.active { background: #eee; color:#111; }

    #bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(transparent, rgba(0,0,0,0.95)); display: flex; align-items: center; padding: 0 20px; z-index: 9999; }
    #play-btn { font-size: 2em; background: none; border: none; color: #fff; cursor: pointer; }
    #time-label { font-size: 1.2em; font-weight: 900; margin-left: 15px; color: #fff; min-width: 130px; text-align: center; }
    input[type=range] { flex-grow: 1; accent-color: #0077ff; cursor: pointer; }

    /* MAP LAYERS */
    .dark-relief-tiles { filter: invert(100%) hue-rotate(180deg) brightness(0.6) contrast(1.3); }
    canvas.leaflet-layer { pointer-events: none !important; position: absolute; top: 0; left: 0; }
    canvas.leaflet-layer.scalar-layer { mix-blend-mode: screen; opacity: 0.8; }
  </style>
</head>

<body>
  <div id="model-info">
    <div id="model-title">ICON-2I <span style="color:#0077ff">2.2km</span></div>
    <div id="model-sub">INIT: 12:00 UTC | VALID: <span id="valid-time">--</span></div>
  </div>
  <div id="coords-display">LAT: --.---- LON: --.----</div>

  <div id="info-box">
    <div id="val-group"><div id="val-display">--</div><div id="unit-display">Attendere...</div></div>
    <div id="wind-rose">
        <svg id="rose-arrow" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" /></svg>
    </div>
  </div>

  <div id="ui-container">
    <div class="panel">
      <button id="btn-flow" class="mini active" onclick="toggleParticles()">FLUSSO 🌬️ (ON)</button>
    </div>
    <div class="panel">
      <div class="toggle active" onclick="toggleLayer('wind')">VENTO 🧭</div>
      <div class="toggle" onclick="toggleLayer('temp')">TEMP 🌡️</div>
      <div class="toggle" onclick="toggleLayer('rain')">PIOGGIA ☔</div>
      <div class="toggle" onclick="toggleLayer('rh')">UMIDITÀ 💧</div>
      <div class="toggle" onclick="toggleLayer('press')">PRESSIONE ⏲️</div>
      <div class="toggle" onclick="toggleLayer('cloud')">NUVOLE ☁️</div>
      <div style="height:1px; background: rgba(255,255,255,0.1); margin:8px 0;"></div>
      <div class="toggle" id="btn-iso" onclick="toggleIsobars()">ISOBARE 〰️</div>
      <div class="toggle" id="btn-therm" onclick="toggleIsotherms()">ISOTERME 🌡️</div>
    </div>
  </div>

  <div id="map"></div>

  <div id="bottom-bar">
    <button id="play-btn" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label">--/-- --:--</div>
  </div>

<script>
  // --- CONFIGURAZIONE ---
  const DPR = window.devicePixelRatio || 1;
  const SICILY_BOUNDS = L.latLngBounds(L.latLng(35.2, 11.5), L.latLng(39.2, 16.2));
  
  let map, currentData = null, catalog = [], isPlaying = false;
  const selected = new Set(['wind']);
  let showIsobars = false, showIsotherms = false, particlesOn = true;
  let scalarCanvases = {}, arrowCanvas, isoCanvas, thermCanvas;
  let velocityLayer = null;

  // --- COLORI NATIVI ---
  const TEMP_STOPS = [{v:-15,c:[156,218,216]},{v:0,c:[93,133,198]},{v:15,c:[181,165,13]},{v:30,c:[232,83,25]},{v:45,c:[89,22,3]}];
  const RAIN_STOPS = [{v:0,c:[0,0,0],a:0},{v:0.6,c:[100,200,255],a:0.7},{v:10,c:[255,255,0],a:0.8},{v:50,c:[255,0,0],a:0.9}];
  const RH_STOPS = [{v:0,c:[173,85,56]},{v:100,c:[56,70,114]}];
  const PRESS_STOPS = [{v:980,c:[0,32,96]},{v:1013,c:[182,182,182]},{v:1040,c:[48,8,24]}];

  function getStopColor(val, stops) {
    if (val <= stops[0].v) return stops[0].c;
    for (let i = 0; i < stops.length - 1; i++) {
      if (val >= stops[i].v && val <= stops[i+1].v) {
        const t = (val - stops[i].v) / (stops[i+1].v - stops[i].v);
        return [ (stops[i].c[0]*(1-t)+stops[i+1].c[0]*t)|0, (stops[i].c[1]*(1-t)+stops[i+1].c[1]*t)|0, (stops[i].c[2]*(1-t)+stops[i+1].c[2]*t)|0 ];
      }
    }
    return stops[stops.length-1].c;
  }

  // --- INITIALIZATION ---
  window.addEventListener('load', async () => {
    map = L.map('map', { zoomControl: false, background: '#0a0a0a' }).fitBounds(SICILY_BOUNDS);
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', { className: 'dark-relief-tiles' }).addTo(map);

    // CONFINI SOPRA TUTTO (Pane alto)
    map.createPane('topPane').style.zIndex = 1500;
    fetch('https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson')
      .then(r => r.json()).then(data => L.geoJSON(data, { pane: 'topPane', style: { color: "#fff", weight: 1.2, opacity: 0.6, fillOpacity: 0 } }).addTo(map));

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', { opacity: 0.3 }).addTo(map);
    L.control.scale({ position: 'bottomleft', metric: true, imperial: false }).addTo(map);

    // Crea Canvas
    const mk = (z) => { const c = L.DomUtil.create('canvas', 'leaflet-layer'); c.style.zIndex = z; map.getPanes().overlayPane.appendChild(c); return c; };
    scalarCanvases = { wind: mk(200), temp: mk(210), rain: mk(220), rh: mk(230), press: mk(240), cloud: mk(250) };
    arrowCanvas = mk(300); isoCanvas = mk(310); thermCanvas = mk(320);

    await loadCatalog();
    map.on('moveend zoomend', redrawAll);
    map.on('mousemove', (e) => {
        document.getElementById('coords-display').innerText = `LAT: ${e.latlng.lat.toFixed(4)} LON: ${e.latlng.lng.toFixed(4)}`;
        onPick(e);
    });
  });

  async function loadCatalog() {
    const r = await fetch('data_weather/catalog.json?t=' + Date.now());
    catalog = await r.json();
    document.getElementById('time-slider').max = catalog.length - 1;
    document.getElementById('time-slider').oninput = (e) => loadStep(parseInt(e.target.value));
    await loadStep(0);
  }

  async function loadStep(i) {
    const r = await fetch('data_weather/' + catalog[i].file);
    currentData = await r.json();
    document.getElementById('time-label').innerText = catalog[i].label;
    document.getElementById('valid-time').innerText = catalog[i].label;
    
    // Pulizia Pressione (Pascal to hPa)
    if(currentData.press) {
        currentData.cleanPress = new Float32Array(currentData.press.length);
        for(let j=0; j<currentData.press.length; j++) {
            let v = currentData.press[j];
            if(v > 2000) v /= 100;
            currentData.cleanPress[j] = (!v || v < 850) ? 1013 : v;
        }
    }
    redrawAll();
  }

  // --- RENDERING ENGINE ---
  function redrawAll() {
    if (!currentData) return;
    const size = map.getSize();
    const panePos = map.containerPointToLayerPoint([0, 0]);

    [...Object.values(scalarCanvases), arrowCanvas, isoCanvas, thermCanvas].forEach(c => {
        c.width = size.x * DPR; c.height = size.y * DPR;
        c.style.width = size.x + 'px'; c.style.height = size.y + 'px';
        L.DomUtil.setPosition(c, panePos);
    });

    drawNativeGrid();
    drawWindNeedles();
    if(showIsobars) drawIsobarsLogic();
    if(showIsotherms) drawIsothermsLogic();
    updateParticles();
  }

  // DISEGNA QUADRATI 2.2KM (Native Resolution)
  function drawNativeGrid() {
    const m = currentData.meta;
    ['wind','temp','rain','rh','press','cloud'].forEach(l => {
        const ctx = scalarCanvases[l].getContext('2d');
        ctx.clearRect(0,0,ctx.canvas.width, ctx.canvas.height);
        if(!selected.has(l)) return;

        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        let arr = (l==='cloud'?(currentData.cloud||currentData.cld):currentData[l]);
        let stops = l==='temp'?TEMP_STOPS: l==='rain'?RAIN_STOPS: l==='rh'?RH_STOPS: l==='press'?PRESS_STOPS:null;

        const dw = map.latLngToContainerPoint([m.la1, m.lo1+m.dx]).x - map.latLngToContainerPoint([m.la1, m.lo1]).x;
        const dh = map.latLngToContainerPoint([m.la1-m.dy, m.lo1]).y - map.latLngToContainerPoint([m.la1, m.lo1]).y;

        for (let y = 0; y < m.ny; y++) {
            const lat = m.la1 - y * m.dy;
            for (let x = 0; x < m.nx; x++) {
                const i = y * m.nx + x;
                let val = (l === 'wind') ? Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2) : arr[i];
                if(l==='press' && val > 2000) val /= 100;
                if((l==='rain' && val < 0.6) || (l==='cloud' && val < 10)) continue;

                const p = map.latLngToContainerPoint([lat, m.lo1 + x * m.dx]);
                const c = stops ? getStopColor(val, stops) : [255,255,255];
                
                ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
                ctx.fillRect(p.x - dw/2, p.y - dh/2, dw + 0.5, dh + 0.5); // +0.5 per evitare linee nere tra celle
            }
        }
    });
  }

  function drawWindNeedles() {
    if(!selected.has('wind')) return;
    const ctx = arrowCanvas.getContext('2d');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = currentData.meta;
    const z = map.getZoom();
    const stride = z >= 11 ? 3 : 5;

    for(let y=0; y<m.ny; y+=stride) {
        for(let x=0; x<m.nx; x+=stride) {
            const i = y*m.nx + x;
            const u = currentData.wind_u.data[i], v = currentData.wind_v.data[i], sp = Math.sqrt(u*u+v*v);
            if(sp < 1.5) continue;
            const p = map.latLngToContainerPoint([m.la1-y*m.dy, m.lo1+x*m.dx]);
            const ang = Math.atan2(-v, u);
            const len = Math.min(sp * 2, 40);

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(ang);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-len/2, 0); ctx.lineTo(len/2, 0); ctx.lineTo(len/2-6, -4); ctx.moveTo(len/2, 0); ctx.lineTo(len/2-6, 4);
            ctx.stroke();
            ctx.restore();
        }
    }
  }

  function drawIsobarsLogic() {
    const ctx = isoCanvas.getContext('2d');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = currentData.meta;
    const contours = d3.contours().size([m.nx, m.ny]).thresholds(d3.range(960, 1050, 2))(currentData.cleanPress);
    
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.2;
    contours.forEach(c => {
        c.coordinates.forEach(poly => poly.forEach(ring => {
            ctx.beginPath();
            ring.forEach((p, j) => {
                const pt = map.latLngToContainerPoint([m.la1 - p[1]*m.dy, m.lo1 + p[0]*m.dx]);
                if(j===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
            });
            ctx.stroke();
        }));
    });

    // Centri A/B
    const r = 25;
    for(let y=r; y<m.ny-r; y+=5) {
        for(let x=r; x<m.nx-r; x+=5) {
            const v = currentData.cleanPress[y*m.nx+x];
            let isM=true, ism=true;
            for(let yy=y-r; yy<=y+r; yy+=2) for(let xx=x-r; xx<=x+r; xx+=2) {
                const n = currentData.cleanPress[yy*m.nx+xx];
                if(n > v) isM=false; if(n < v) ism=false;
            }
            if((isM && v>1016) || (ism && v<1012)) {
                const p = map.latLngToContainerPoint([m.la1-y*m.dy, m.lo1+x*m.dx]);
                ctx.font = "900 60px Arial"; ctx.textAlign="center";
                ctx.shadowColor="black"; ctx.shadowBlur=10;
                ctx.fillStyle = isM ? "#ff3333" : "#3366ff";
                ctx.fillText(isM?"A":"B", p.x, p.y);
                ctx.shadowBlur=0;
            }
        }
    }
  }

  function drawIsothermsLogic() {
    const ctx = thermCanvas.getContext('2d');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = currentData.meta;
    const contours = d3.contours().size([m.nx, m.ny]).thresholds(d3.range(-20, 50, 5))(currentData.temp);
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.setLineDash([5,5]);
    contours.forEach(c => {
        c.coordinates.forEach(poly => poly.forEach(ring => {
            ctx.beginPath();
            ring.forEach((p, j) => {
                const pt = map.latLngToContainerPoint([m.la1 - p[1]*m.dy, m.lo1 + p[0]*m.dx]);
                if(j===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
            });
            ctx.stroke();
        }));
    });
    ctx.setLineDash([]);
  }

  function updateParticles() {
    if (velocityLayer) map.removeLayer(velocityLayer);
    if (!selected.has('wind') || !particlesOn) return;
    velocityLayer = L.velocityLayer({
        displayValues: false, data: [currentData.wind_u, currentData.wind_v],
        maxVelocity: 20, velocityScale: 0.006, particleMultiplier: 1/350, 
        lineWidth: 1.5, opacity: 0.35, colorScale: ["#fff"], pane: 'particlePane'
    }).addTo(map);
  }

  function onPick(e) {
    if(!currentData) return;
    const m = currentData.meta;
    const gx = Math.round((e.latlng.lng - m.lo1) / m.dx);
    const gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
    if(gx<0 || gy<0 || gx>=m.nx || gy>=m.ny) return;
    const i = gy * m.nx + gx;

    let val = "--", unit = "";
    if(selected.has('temp')) { val = currentData.temp[i].toFixed(1); unit = "°C"; }
    else if(selected.has('wind')) { 
        const u=currentData.wind_u.data[i], v=currentData.wind_v.data[i];
        val = (Math.sqrt(u**2 + v**2)*3.6).toFixed(1); unit = "km/h"; 
        document.getElementById('rose-arrow').style.transform = `rotate(${90-Math.atan2(v,u)*180/Math.PI}deg)`;
        document.getElementById('wind-rose').style.display = 'flex';
    }
    else if(selected.has('rain')) { val = currentData.rain[i].toFixed(1); unit = "mm"; }
    else if(selected.has('rh')) { val = Math.round(currentData.rh[i]); unit = "%"; }
    else if(selected.has('press')) { val = Math.round(currentData.cleanPress[i]); unit = "hPa"; }
    
    document.getElementById('val-display').innerText = val;
    document.getElementById('unit-display').innerText = unit;
  }

  window.toggleLayer = (l) => {
    if(selected.has(l)) selected.delete(l); else selected.add(l);
    document.querySelectorAll('.toggle').forEach(btn => { if(btn.innerText.toLowerCase().includes(l)) btn.classList.toggle('active'); });
    redrawAll();
  };

  window.toggleIsobars = () => { showIsobars = !showIsobars; document.getElementById('btn-iso').classList.toggle('active'); redrawAll(); };
  window.toggleIsotherms = () => { showIsotherms = !showIsotherms; document.getElementById('btn-therm').classList.toggle('active'); redrawAll(); };
  window.toggleParticles = () => { particlesOn = !particlesOn; document.getElementById('btn-flow').classList.toggle('active'); redrawAll(); };

  function togglePlay() { isPlaying = !isPlaying; document.getElementById('play-btn').innerText = isPlaying ? "❚❚" : "►"; if(isPlaying) playLoop(); }
  function playLoop() { if(!isPlaying) return; const s = document.getElementById('time-slider'); let v = parseInt(s.value) + 1; if(v >= catalog.length) v = 0; s.value = v; loadStep(v); setTimeout(playLoop, 800); }
</script>
</body>
</html>
