<!DOCTYPE html>
<html>
<head>
  <title>Sicilia MeteoHub - ICON-2I ULTRA-FLUID</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-velocity@1.8.0/dist/leaflet-velocity.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; background: #0a0a0a; font-family: 'Segoe UI', sans-serif; color: #ddd; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #0a0a0a; }

    /* GPS OVERLAY */
    #gps-overlay {
      position: absolute; top: -150px; left: 0; right: 0; height: 100px;
      background: rgba(10,10,10,0.95); backdrop-filter: blur(20px);
      z-index: 6000; display: flex; align-items: center; justify-content: space-around;
      border-bottom: 2px solid #0077ff; transition: top 0.4s ease;
      padding: 0 40px; box-shadow: 0 10px 40px #000;
    }
    #gps-overlay.active { top: 0; }
    .gps-stat { text-align: center; }
    .gps-stat div:first-child { font-size: 0.7em; color: #888; text-transform: uppercase; font-weight: 800; }
    .gps-stat div:last-child { font-size: 1.8em; font-weight: 900; color: #fff; }
    #close-gps { position: absolute; right: 15px; top: 15px; cursor: pointer; color: #666; font-size: 1.2em; }

    /* UI - HEADER */
    #model-info { position: absolute; top: 15px; left: 70px; z-index: 5000; pointer-events: none; }
    #model-title { font-size: 16px; font-weight: 900; color: #fff; text-transform: uppercase; }
    #model-sub { font-size: 10px; color: #0077ff; font-family: monospace; font-weight: bold; }

    /* INFO BOX */
    #info-box { position: absolute; top: 15px; left: 20px; z-index: 5000; pointer-events: none; }
    #val-group { margin-top: 45px; }
    #val-display { font-size: 3.2em; font-weight: 950; color: #fff; text-shadow: 0 2px 15px #000; line-height: 0.8; }
    #unit-display { font-size: 1em; color: #888; font-weight: 800; margin-top: 5px; }

    /* UI CONTROLS */
    #ui-container { position: absolute; top: 10px; right: 10px; z-index: 5000; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    .panel { background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
    .toggle { width: 170px; display:flex; align-items:center; justify-content:space-between; padding: 12px; margin: 4px 0; background: rgba(255,255,255,0.04); border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 12px; transition: 0.2s; color: #bbb; }
    .toggle.active { background: #0077ff !important; color: #fff !important; }
    .gps-btn { width: 170px; padding: 14px; border-radius: 8px; font-size: 13px; background: #23a045; color: white; cursor: pointer; font-weight: 900; border: none; margin-bottom: 5px; }
    .mini { width: 170px; padding: 10px 12px; border-radius: 8px; font-size:12px; background: rgba(255,255,255,0.08); color:#fff; cursor:pointer; font-weight:800; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 5px; }
    .mini.active { background: #eee !important; color:#111 !important; }

    #bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(transparent, rgba(0,0,0,0.98)); display: flex; align-items: center; padding: 0 25px; z-index: 5000; }
    input[type=range] { flex-grow: 1; accent-color: #0077ff; cursor: pointer; }

    .dark-relief-tiles { filter: invert(100%) hue-rotate(180deg) brightness(0.6) contrast(1.3); }
    canvas.leaflet-layer { pointer-events: none !important; position: absolute; top: 0; left: 0; will-change: transform; }
    canvas.leaflet-layer.scalar-layer { opacity: 0.8; }
  </style>
</head>

<body>
  <div id="gps-overlay">
    <div id="close-gps" onclick="toggleGpsPanel(false)">✕</div>
    <div class="gps-stat"><div>Temperatura</div><div id="gps-t">--</div></div>
    <div class="gps-stat"><div>Pioggia</div><div id="gps-r">--</div></div>
    <div class="gps-stat"><div>Vento</div><div id="gps-w">--</div></div>
    <div class="gps-stat"><div>Umidità</div><div id="gps-h">--</div></div>
  </div>

  <div id="model-info">
    <div id="model-title">ICON-2I <span style="color:#0077ff">2.2km</span></div>
    <div id="model-sub">LIVE SYNC | VALID: <span id="valid-time">--</span></div>
  </div>

  <div id="info-box"><div id="val-group"><div id="val-display">--</div><div id="unit-display">Attendere...</div></div></div>

  <div id="ui-container">
    <button class="gps-btn" onclick="getMyWeather()">📍 IL MIO METEO</button>
    <div class="panel">
      <button id="btn-flow" class="mini active" onclick="toggleParticles()">FLUSSO 🌬️ (ON)</button>
    </div>
    <div class="panel">
      <div class="toggle active" id="btn-wind" onclick="toggleLayer('wind')">VENTO 🧭</div>
      <div class="toggle" id="btn-temp" onclick="toggleLayer('temp')">TEMP 🌡️</div>
      <div class="toggle" id="btn-rain" onclick="toggleLayer('rain')">PIOGGIA ☔</div>
      <div class="toggle" id="btn-rh" onclick="toggleLayer('rh')">UMIDITÀ 💧</div>
      <div class="toggle" id="btn-press" onclick="toggleLayer('press')">PRESSIONE ⏲️</div>
      <div class="toggle" id="btn-cloud" onclick="toggleLayer('cloud')">NUVOLE ☁️</div>
      <div style="height:1px; background: rgba(255,255,255,0.1); margin:8px 0;"></div>
      <div class="toggle" id="btn-iso" onclick="toggleIsobars()">ISOBARE 〰️</div>
      <div class="toggle" id="btn-therm" onclick="toggleIsotherms()">ISOTERME 🌡️</div>
    </div>
  </div>

  <div id="map"></div>

  <div id="bottom-bar">
    <button id="play-btn" style="background:none; border:none; color:white; font-size:2em; cursor:pointer;" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label" style="color:white; font-weight:bold; margin-left:15px; min-width:120px;">--/-- --:--</div>
  </div>

<script>
  // Se vuoi più fluidità su mobile senza perdita percepibile, usa Math.min(...,2)
  // const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const DPR = window.devicePixelRatio || 1;

  const SICILY_BOUNDS = L.latLngBounds(L.latLng(35.2, 11.2), L.latLng(39.8, 17.5));

  let map, currentData = null, catalog = [], isPlaying = false;
  const selected = new Set(['wind']);
  let showIsobars = false, showIsotherms = false, particlesOn = true;
  let scalarCanvases = {}, arrowCanvas, isoCanvas, thermCanvas, userMarker, velocityLayer = null;

  // --- OTTIMIZZAZIONI ---
  let rasterCache = {};     // { stepKey: { wind: ImageBitmap|Canvas, ... } }
  let contourCache = {};    // { stepKey: { iso: contours|null, therm: contours|null } }
  let currentStepKey = null;
  let redrawPending = false;
  let particlesDirty = true;
  let isMoving = false;

  // PALETTE ORIGINALI
  const WIND_COLOR_SCALE = ["#000080", "#0044ff", "#00ddff", "#00ff55", "#ffff00", "#ff6600", "#ff0000", "#ff00ff"];
  const TEMP_STOPS = [{v:-15,c:[156,218,216]},{v:-10,c:[119,198,191]},{v:-5,c:[101,172,187]},{v:0,c:[93,133,198]},{v:5,c:[89,134,76]},{v:10,c:[114,146,33]},{v:15,c:[181,165,13]},{v:20,c:[243,183,4]},{v:25,c:[238,128,17]},{v:30,c:[232,83,25]},{v:35,c:[184,64,20]},{v:40,c:[136,45,13]}];
  const RAIN_STOPS = [{v:0.0,c:[0,0,0],a:0},{v:0.6,c:[100,200,255],a:0.7},{v:1.0,c:[0,150,255],a:0.78},{v:5.0,c:[0,0,255],a:0.85},{v:10,c:[255,255,0],a:0.85},{v:30,c:[255,150,0],a:0.90},{v:50,c:[255,0,0],a:0.92}];
  const RH_STOPS = [{v:0,c:[173,85,56]},{v:30,c:[173,110,56]},{v:60,c:[56,173,121]},{v:80,c:[56,157,173]},{v:100,c:[56,70,114]}];
  const PRESS_STOPS = [{v:980,c:[0,32,96]},{v:1000,c:[0,117,146]},{v:1013,c:[182,182,182]},{v:1025,c:[163,116,67]},{v:1040,c:[111,24,64]}];

  function getStopColor(val, stops) {
    if (val <= stops[0].v) return [...stops[0].c, (stops[0].a !== undefined ? stops[0].a : 0.8)];
    for (let i = 0; i < stops.length - 1; i++) {
      if (val >= stops[i].v && val <= stops[i+1].v) {
        const t = (val - stops[i].v) / (stops[i+1].v - stops[i].v);
        const a1 = stops[i].a !== undefined ? stops[i].a : 0.8, a2 = stops[i+1].a !== undefined ? stops[i+1].a : 0.8;
        return [
          (stops[i].c[0]*(1-t)+stops[i+1].c[0]*t)|0,
          (stops[i].c[1]*(1-t)+stops[i+1].c[1]*t)|0,
          (stops[i].c[2]*(1-t)+stops[i+1].c[2]*t)|0,
          (a1*(1-t)+a2*t)
        ];
      }
    }
    return [...stops[stops.length-1].c, 0.8];
  }

  function vividWindColor(sp){
    const t = Math.min(sp/22.0, 0.99);
    const idx = (t*(WIND_COLOR_SCALE.length-1))|0, f = (t*(WIND_COLOR_SCALE.length-1)) - idx;
    const c1 = WIND_COLOR_SCALE[idx], c2 = WIND_COLOR_SCALE[idx+1] || c1;
    const r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
    const r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
    return {r:(r1*(1-f)+r2*f)|0, g:(g1*(1-f)+g2*f)|0, b:(b1*(1-f)+b2*f)|0};
  }

  function toggleGpsPanel(show) { document.getElementById('gps-overlay').className = show ? 'active' : ''; }
  function getMyWeather() { map.locate({setView: true, maxZoom: 10}); }

  function requestRedraw() {
    if (redrawPending) return;
    redrawPending = true;
    requestAnimationFrame(() => {
      redrawPending = false;
      redrawAll();
    });
  }

  async function buildLayerRaster(layer) {
    const m = currentData.meta;
    const w = m.nx, h = m.ny;

    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently: false });

    const img = ctx.createImageData(w, h);
    const d = img.data;

    const arr = (layer === 'cloud') ? (currentData.cloud || currentData.cld)
              : (layer === 'press') ? currentData.cleanP
              : (layer === 'wind')  ? null
              : currentData[layer];

    const stops = layer==='temp'?TEMP_STOPS
              : layer==='rain'?RAIN_STOPS
              : layer==='rh'?RH_STOPS
              : layer==='press'?PRESS_STOPS
              : null;

    for (let gy=0; gy<h; gy++) {
      const row = gy*w;
      for (let gx=0; gx<w; gx++) {
        const i = row + gx;
        const p = i*4;

        let r=0,g=0,b=0,a=0;

        if (layer === 'wind') {
          const u = currentData.wind_u.data[i], v = currentData.wind_v.data[i];
          const sp = Math.sqrt(u*u + v*v);
          if (sp < 0.2) { d[p+3]=0; continue; }
          const rgb = vividWindColor(sp);
          r = rgb.r; g = rgb.g; b = rgb.b;
          a = Math.min(sp/18, 0.35)*255;
        } else if (layer === 'cloud') {
          const v = arr[i];
          if (v < 8) { d[p+3]=0; continue; }
          r=255; g=255; b=255;
          a = (v/100 * 0.8)*255;
        } else {
          const v = arr[i];
          if (layer === 'rain' && v < 0.1) { d[p+3]=0; continue; }
          const res = getStopColor(v, stops);
          r=res[0]; g=res[1]; b=res[2]; a=res[3]*255;
        }

        d[p]=r; d[p+1]=g; d[p+2]=b; d[p+3]=a|0;
      }
    }

    ctx.putImageData(img, 0, 0);

    if ('createImageBitmap' in window) {
      try { return await createImageBitmap(c); } catch(e) {}
    }
    return c;
  }

  // ✅ DRAW SCALAR: affine georeferenziata + FIX half-pixel (allinea centro cella)
  function drawSmoothScalar() {
    if (!currentData || !currentStepKey) return;

    const m = currentData.meta;
    const nx = m.nx, ny = m.ny;

    const latN = m.la1;
    const lonW = m.lo1;
    const lonE = m.lo1 + m.dx * (nx - 1);
    const latS = m.la1 - m.dy * (ny - 1);

    const p00 = map.latLngToContainerPoint([latN, lonW]); // NW
    const p10 = map.latLngToContainerPoint([latN, lonE]); // NE
    const p01 = map.latLngToContainerPoint([latS, lonW]); // SW

    const a = (p10.x - p00.x) / (nx - 1);
    const b = (p10.y - p00.y) / (nx - 1);
    const c = (p01.x - p00.x) / (ny - 1);
    const d = (p01.y - p00.y) / (ny - 1);

    // FIX: allinea (0.5,0.5) della texture al gridpoint (lo1,la1)
    const e = p00.x - a*0.5 - c*0.5;
    const f = p00.y - b*0.5 - d*0.5;

    ['wind','temp','rain','rh','press','cloud'].forEach(l => {
      const canvas = scalarCanvases[l];
      const ctx = canvas.getContext('2d');

      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!selected.has(l)) return;

      const tex = rasterCache[currentStepKey]?.[l];
      if (!tex) return;

      ctx.imageSmoothingEnabled = true;
      ctx.setTransform(DPR*a, DPR*b, DPR*c, DPR*d, DPR*e, DPR*f);
      ctx.drawImage(tex, 0, 0, nx, ny);
    });
  }

  function drawWindArrows() {
    const ctx = arrowCanvas.getContext('2d');
    ctx.clearRect(0,0,arrowCanvas.width, arrowCanvas.height);

    if(!selected.has('wind') || !currentData) return;
    if (isMoving) return;

    const size = map.getSize();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const m = currentData.meta, z = map.getZoom();
    const stride = z >= 11 ? 28 : (z >= 9 ? 40 : 55);

    for(let y=0; y < size.y; y += stride) {
      for(let x=0; x < size.x; x += stride) {
        const ll = map.containerPointToLatLng([x, y]);
        const gx = (ll.lng-m.lo1)/m.dx, gy = (m.la1-ll.lat)/m.dy;
        if(gx<0||gy<0||gx>m.nx-1||gy>m.ny-1) continue;

        const idx = (gy|0)*m.nx+(gx|0);
        const u = currentData.wind_u.data[idx], v = currentData.wind_v.data[idx];
        const sp = Math.sqrt(u*u+v*v);
        if(sp < 0.8) continue;

        const len = Math.max(12, Math.min(sp * 2.6, 42));
        const ang = Math.atan2(-v, u);
        const c = vividWindColor(sp);

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang);

        ctx.strokeStyle = "rgba(0,0,0,0.8)";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-len/2, 0); ctx.lineTo(len/2, 0);
        ctx.lineTo(len/2-8, -5);
        ctx.moveTo(len/2, 0); ctx.lineTo(len/2-8, 5);
        ctx.stroke();

        ctx.strokeStyle = `rgb(${c.r},${c.g},${c.b})`;
        ctx.lineWidth = 1.8;
        ctx.stroke();

        ctx.restore();
      }
    }
  }

  function drawContours(type) {
    const ctx = (type==="iso") ? isoCanvas.getContext('2d') : thermCanvas.getContext('2d');
    ctx.clearRect(0,0,(type==="iso"?isoCanvas.width:thermCanvas.width),(type==="iso"?isoCanvas.height:thermCanvas.height));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const m = currentData.meta;
    const cache = contourCache[currentStepKey] || (contourCache[currentStepKey] = { iso:null, therm:null });

    if (type==="iso" && !cache.iso) {
      cache.iso = d3.contours().size([m.nx, m.ny]).thresholds(d3.range(960, 1060, 2))(currentData.cleanP);
    }
    if (type==="therm" && !cache.therm) {
      cache.therm = d3.contours().size([m.nx, m.ny]).thresholds(d3.range(-20, 50, 5))(currentData.temp);
    }

    const contours = (type==="iso") ? cache.iso : cache.therm;

    ctx.strokeStyle = (type==="iso") ? "rgba(255,255,255,0.85)" : "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1.8;
    if(type==="therm") ctx.setLineDash([8,5]);

    contours.forEach(c => c.coordinates.forEach(poly => poly.forEach(ring => {
      ctx.beginPath();
      let pts=[];
      ring.forEach((p, j) => {
        const pt = map.latLngToContainerPoint([m.la1-p[1]*m.dy, m.lo1+p[0]*m.dx]);
        if(j===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
        pts.push(pt);
      });
      ctx.stroke();

      if(pts.length > 80 && type==="iso") {
        const mid = pts[Math.floor(pts.length/2)];
        ctx.fillStyle = "rgba(0,0,0,0.9)";
        ctx.fillRect(mid.x-15, mid.y-10, 30, 20);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 11px Arial";
        ctx.textAlign="center";
        ctx.fillText(Math.round(c.value), mid.x, mid.y+5);
      }
    })));

    if(type==="iso") drawExtremaAB(ctx, m);
    ctx.setLineDash([]);
  }

  function drawExtremaAB(ctx, m) {
    const r = 40; let pts = [];
    for(let y=r; y<m.ny-r; y+=10) for(let x=r; x<m.nx-r; x+=10) {
      const v = currentData.cleanP[y*m.nx+x]; let isM=true, ism=true;
      for(let yy=y-r; yy<=y+r; yy+=10) for(let xx=x-r; xx<=x+r; xx+=10) {
        const n = currentData.cleanP[yy*m.nx+xx]; if(n > v) isM=false; if(n < v) ism=false;
      }
      if((isM && v>1015) || (ism && v<1011)) {
        const p = map.latLngToContainerPoint([m.la1-y*m.dy, m.lo1+x*m.dx]);
        if(!pts.some(k => Math.hypot(k.x-p.x, k.y-p.y) < 180)) {
          pts.push(p);
          ctx.font = "950 65px Arial";
          ctx.textAlign="center";
          ctx.shadowColor="#000";
          ctx.shadowBlur=15;
          ctx.fillStyle = isM ? "#ff3333" : "#3377ff";
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 4;
          ctx.strokeText(isM?"A":"B", p.x, p.y);
          ctx.fillText(isM?"A":"B", p.x, p.y);
          ctx.shadowBlur=0;
        }
      }
    }
  }

  function updateParticles(force=false) {
    if (!particlesOn) {
      if (velocityLayer) { map.removeLayer(velocityLayer); velocityLayer = null; }
      return;
    }
    if (!force && !particlesDirty) return;
    particlesDirty = false;

    if (velocityLayer) { map.removeLayer(velocityLayer); velocityLayer = null; }

    velocityLayer = L.velocityLayer({
      displayValues: false,
      data: [currentData.wind_u, currentData.wind_v],
      maxVelocity: 25,
      velocityScale: 0.008,
      particleMultiplier: 1/520,
      lineWidth: 2,
      frameRate: 40,
      opacity: 0.8,
      colorScale: ["#fff"],
      pane: 'particlePane'
    }).addTo(map);
  }

  function onPick(e){
    if(!currentData) return;
    const m = currentData.meta;
    const gx = Math.round((e.latlng.lng - m.lo1) / m.dx), gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
    if(gx<0 || gy<0 || gx>=m.nx || gy>=m.ny) return;
    const i = gy * m.nx + gx;
    let val = "--", unit = "";
    if(selected.has('temp')) { val = currentData.temp[i].toFixed(1); unit = "°C"; }
    else if(selected.has('wind')) { val = (Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2)*3.6).toFixed(1); unit = "km/h"; }
    else if(selected.has('rain')) { val = currentData.rain[i].toFixed(1); unit = "mm"; }
    else if(selected.has('rh')) { val = Math.round(currentData.rh[i]); unit = "%"; }
    else if(selected.has('press')) { val = Math.round(currentData.cleanP[i]); unit = "hPa"; }
    else if(selected.has('cloud')) { val = Math.round((currentData.cloud||currentData.cld)[i]); unit = "%"; }
    document.getElementById('val-display').innerText = val;
    document.getElementById('unit-display').innerText = unit;
  }

  function updateUI(){
    ['wind','temp','rain','rh','press','cloud'].forEach(l => {
      const btn = document.getElementById('btn-' + l);
      if(selected.has(l)) btn.classList.add('active'); else btn.classList.remove('active');
    });
    if(showIsobars) document.getElementById('btn-iso').classList.add('active'); else document.getElementById('btn-iso').classList.remove('active');
    if(showIsotherms) document.getElementById('btn-therm').classList.add('active'); else document.getElementById('btn-therm').classList.remove('active');
    if(particlesOn) document.getElementById('btn-flow').classList.add('active'); else document.getElementById('btn-flow').classList.remove('active');
    document.getElementById('btn-flow').innerText = particlesOn ? "FLUSSO 🌬️ (ON)" : "FLUSSO 🌬️ (OFF)";
  }

  window.toggleLayer = async (l) => {
    if(selected.has(l)) selected.delete(l); else selected.add(l);
    updateUI();

    if (currentStepKey && selected.has(l) && !rasterCache[currentStepKey]?.[l]) {
      rasterCache[currentStepKey] = rasterCache[currentStepKey] || {};
      rasterCache[currentStepKey][l] = await buildLayerRaster(l);
    }

    requestRedraw();
  };

  window.toggleIsobars = () => { showIsobars = !showIsobars; updateUI(); requestRedraw(); };
  window.toggleIsotherms = () => { showIsotherms = !showIsotherms; updateUI(); requestRedraw(); };
  window.toggleParticles = () => { particlesOn = !particlesOn; updateUI(); updateParticles(true); requestRedraw(); };

  function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('play-btn').innerText = isPlaying ? "❚❚" : "►";
    if(isPlaying) playLoop();
  }
  function playLoop() {
    if(!isPlaying) return;
    const s = document.getElementById('time-slider');
    let v = parseInt(s.value) + 1;
    if(v >= catalog.length) v = 0;
    s.value = v;
    loadStep(v);
    setTimeout(playLoop, 950);
  }

  async function loadCatalog() {
    const r = await fetch('data_weather/catalog.json?t=' + Date.now());
    catalog = await r.json();

    const slider = document.getElementById('time-slider');
    slider.max = catalog.length - 1;

    slider.addEventListener('input', (e) => {
      const idx = parseInt(e.target.value);
      loadStep(idx);
    });

    const now = new Date();
    let bestIdx = 0, minD = Infinity;
    catalog.forEach((item, idx) => {
      const p = item.label.split(' ');
      const dP = p[0].split('/'); const tP = p[1].split(':');
      const sD = new Date(now.getFullYear(), parseInt(dP[1])-1, parseInt(dP[0]), parseInt(tP[0]), parseInt(tP[1]));
      const d = Math.abs(now - sD);
      if(d < minD) { minD = d; bestIdx = idx; }
    });

    slider.value = bestIdx;
    await loadStep(bestIdx);
  }

  async function loadStep(i) {
    const r = await fetch('data_weather/' + catalog[i].file);
    currentData = await r.json();

    document.getElementById('time-label').innerText = catalog[i].label;
    document.getElementById('valid-time').innerText = catalog[i].label;

    if(currentData.press) {
      currentData.cleanP = new Float32Array(currentData.press.length);
      for(let j=0; j<currentData.press.length; j++) {
        let v = currentData.press[j];
        if(v > 2000) v /= 100;
        currentData.cleanP[j] = (!v || v < 850) ? 1013 : v;
      }
    }

    currentStepKey = catalog[i].file;

    if (!rasterCache[currentStepKey]) rasterCache[currentStepKey] = {};
    if (!contourCache[currentStepKey]) contourCache[currentStepKey] = { iso:null, therm:null };

    const needed = ['wind','temp','rain','rh','press','cloud'];
    for (const l of needed) {
      if (!rasterCache[currentStepKey][l]) {
        rasterCache[currentStepKey][l] = await buildLayerRaster(l);
      }
    }

    particlesDirty = true;
    requestRedraw();
  }

  function redrawAll() {
    if (!currentData) return;

    const size = map.getSize();
    const panePos = map.containerPointToLayerPoint([0, 0]);

    [...Object.values(scalarCanvases), arrowCanvas, isoCanvas, thermCanvas].forEach(c => {
      c.width = size.x * DPR; c.height = size.y * DPR;
      c.style.width = size.x + 'px'; c.style.height = size.y + 'px';
      L.DomUtil.setPosition(c, panePos);
    });

    drawSmoothScalar();
    drawWindArrows();

    if(showIsobars) drawContours("iso"); else isoCanvas.getContext('2d').clearRect(0,0,isoCanvas.width,isoCanvas.height);
    if(showIsotherms) drawContours("therm"); else thermCanvas.getContext('2d').clearRect(0,0,thermCanvas.width,thermCanvas.height);

    updateParticles();
  }

  window.addEventListener('load', async () => {
    map = L.map('map', { zoomControl: false, background: '#0a0a0a', inertia: true }).fitBounds(SICILY_BOUNDS);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', { className: 'dark-relief-tiles' }).addTo(map);

    map.createPane('scalarPane').style.zIndex = 200;
    map.createPane('particlePane').style.zIndex = 400;
    map.createPane('vectorPane').style.zIndex = 700;
    map.createPane('topPane').style.zIndex = 1500;

    fetch('https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson')
      .then(r => r.json())
      .then(data => L.geoJSON(data, { pane: 'topPane', style: { color: "#fff", weight: 2, opacity: 0.8, fillOpacity: 0 } }).addTo(map));

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', { opacity: 0.3 }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { zIndex: 1100, opacity: 0.9 }).addTo(map);

    const mk = (pane, cl) => { const c = L.DomUtil.create('canvas', 'leaflet-layer '+(cl||'')); map.getPane(pane).appendChild(c); return c; };

    scalarCanvases = {
      wind: mk('scalarPane','scalar-layer'),
      temp: mk('scalarPane','scalar-layer'),
      rain: mk('scalarPane','scalar-layer'),
      rh: mk('scalarPane','scalar-layer'),
      press: mk('scalarPane','scalar-layer'),
      cloud: mk('scalarPane','scalar-layer')
    };
    arrowCanvas = mk('vectorPane');
    isoCanvas = mk('vectorPane');
    thermCanvas = mk('vectorPane');

    map.on('movestart', () => { isMoving = true; });
    map.on('moveend zoomend', () => { isMoving = false; requestRedraw(); });

    map.on('move', requestRedraw);
    map.on('viewreset zoomend moveend', requestRedraw);

    map.on('mousemove click', onPick);

    map.on('locationfound', (e) => {
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker(e.latlng, { radius: 8, color: '#0077ff', weight: 4, fillOpacity: 1, fillColor: 'white' }).addTo(map);

      if(!currentData) return;
      const m = currentData.meta;
      const gx = Math.round((e.latlng.lng - m.lo1) / m.dx), gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
      if(gx>=0 && gy>=0 && gx < m.nx && gy < m.ny) {
        const i = gy * m.nx + gx;
        document.getElementById('gps-t').innerText = currentData.temp[i].toFixed(1) + "°";
        document.getElementById('gps-r').innerText = currentData.rain[i].toFixed(1) + "mm";
        document.getElementById('gps-w').innerText = (Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2)*3.6).toFixed(0) + " km/h";
        document.getElementById('gps-h').innerText = Math.round(currentData.rh[i]) + "%";
        toggleGpsPanel(true);
      }
    });

    await loadCatalog();
    updateUI();
    requestRedraw();
  });
</script>
</body>
