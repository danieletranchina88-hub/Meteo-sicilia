<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Italia MeteoHub Pro | ICON-2I</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <style>
        :root { --ink: #111820; --accent: #0a69d8; --glass: rgba(255, 255, 255, 0.85); }
        * { box-sizing: border-box; }
        body, html { margin: 0; width: 100%; height: 100%; font-family: 'Inter', sans-serif; background: #eef2f5; overflow: hidden; }
        #map { position: fixed; inset: 0; z-index: 1; }
        
        /* Glassmorphism Pro */
        .glass { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.3); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }

        /* Header */
        #topbar { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 1000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Menu Laterale */
        #drawer { position: fixed; top: 90px; right: 20px; width: 280px; z-index: 900; padding: 20px; transition: transform 0.3s ease; transform: translateX(120%); }
        #drawer.open { transform: translateX(0); }
        
        /* Bottoni */
        .btn { cursor: pointer; padding: 10px 15px; border-radius: 8px; border: none; background: #f0f0f0; font-weight: 600; transition: 0.2s; }
        .btn:hover { background: #e0e0e0; }
        .btn.active { background: var(--accent); color: white; }
        .layer-btn { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 12px; }

        /* Footer */
        #bottomBar { position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 1000; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div id="map"></div>

    <header id="topbar" class="glass">
        <div>
            <h1 style="margin:0; font-size:18px;">Italia MeteoHub Pro</h1>
            <div id="status" style="font-size:12px; color:gray;">Caricamento dati...</div>
        </div>
        <button class="btn" id="menuToggle">MENU</button>
    </header>

    <aside id="drawer" class="glass">
        <h3>Layer</h3>
        <button class="btn layer-btn active" data-layer="precip">Precipitazioni</button>
        <button class="btn layer-btn" data-layer="temp">Temperatura</button>
        <button class="btn layer-btn" data-layer="wind">Vento</button>
        <button class="btn layer-btn" data-layer="press">Pressione</button>
    </aside>

    <footer id="bottomBar" class="glass">
        <button class="btn" id="prevBtn">&larr; Prec</button>
        <div id="timeLabel">--/-- --:--</div>
        <button class="btn" id="nextBtn">Succ &rarr;</button>
    </footer>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
            center: [13.5, 37.5], zoom: 6
        });

        // Toggle Menu
        document.getElementById('menuToggle').onclick = () => {
            document.getElementById('drawer').classList.toggle('open');
        };

        // Logic Layer Selection
        document.querySelectorAll('.layer-btn').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                console.log("Cambiato layer a:", e.target.getAttribute('data-layer'));
                // Qui chiamerai la tua funzione di aggiornamento dati
            };
        });

        map.on('load', () => {
            document.getElementById('status').innerText = "Sistema operativo.";
        });
    </script>
</body>
</html>
