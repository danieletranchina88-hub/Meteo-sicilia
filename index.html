<!DOCTYPE html>
<html>
<head>
  <title>Sicilia MeteoHub - ICON-2I ULTIMATE FLUID</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-velocity@1.8.0/dist/leaflet-velocity.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; background: #050505; font-family: 'Segoe UI', sans-serif; color: #ddd; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #050505; }

    /* REPORT GPS IN ALTO */
    #gps-overlay {
        position: absolute; top: -150px; left: 0; right: 0; height: 110px;
        background: rgba(10,10,10,0.96); backdrop-filter: blur(15px);
        z-index: 6000; display: flex; align-items: center; justify-content: space-around;
        border-bottom: 3px solid #0077ff; transition: top 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        padding: 0 40px; box-shadow: 0 10px 40px #000;
    }
    #gps-overlay.active { top: 0; }
    .gps-stat { text-align: center; }
    .gps-stat div:first-child { font-size: 0.75em; color: #0077ff; text-transform: uppercase; font-weight: 800; }
    .gps-stat div:last-child { font-size: 2.2em; font-weight: 900; color: #fff; margin-top: 3px; }
    #close-gps { position: absolute; right: 20px; top: 15px; cursor: pointer; color: #ff3333; font-weight: bold; font-size: 1.2em; }

    /* HEADER */
    #model-info { position: absolute; top: 15px; left: 70px; z-index: 5000; pointer-events: none; text-shadow: 0 2px 5px #000; }
    #model-title { font-size: 17px; font-weight: 900; color: #fff; text-transform: uppercase; }
    #model-sub { font-size: 11px; color: #0077ff; font-family: monospace; font-weight: bold; }

    /* INFO BOX CURSORE */
    #info-box { position: absolute; top: 15px; left: 20px; z-index: 5000; pointer-events: none; }
    #val-group { margin-top: 45px; }
    #val-display { font-size: 3.5em; font-weight: 950; color: #fff; text-shadow: 0 0 15px rgba(0,0,0,0.8); line-height: 0.8; }
    #unit-display { font-size: 1.2em; color: #aaa; font-weight: 800; margin-top: 5px; }

    /* UI CONTROLS */
    #ui-container { position: absolute; top: 10px; right: 10px; z-index: 5000; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
    .panel { background: rgba(15,15,15,0.92); backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 30px #000; }
    .toggle { width: 170px; display:flex; align-items:center; justify-content:space-between; padding: 12px 14px; margin: 4px 0; background: rgba(255,255,255,0.05); border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 12px; transition: 0.2s; color: #bbb; }
    .toggle.active { background: #0077ff !important; color: #fff !important; box-shadow: 0 0 15px rgba(0,119,255,0.4); }
    .gps-btn { width: 170px; padding: 14px; border-radius: 8px; font-size: 13px; background: #23a045; color: white; cursor: pointer; font-weight: 900; border: none; margin-bottom: 5px; }
    .mini { width: 170px; padding: 12px; border-radius: 8px; font-size:12px; background: rgba(255,255,255,0.1); color:#fff; cursor:pointer; font-weight:900; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 5px; }
    .mini.active { background: #fff !important; color:#000 !important; }

    #bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 85px; background: linear-gradient(transparent, rgba(0,0,0,1)); display: flex; align-items: center; padding: 0 30px; z-index: 5000; }
    input[type=range] { flex-grow: 1; accent-color: #0077ff; cursor: pointer; height: 6px; }

    /* LAYERS STILI */
    .dark-relief-tiles { filter: invert(100%) hue-rotate(180deg) brightness(0.4) contrast(1.5); }
    .smooth-overlay { image-rendering: auto; opacity: 0.85; mix-blend-mode: normal; } /* AUTO = Smooth Hardware */
  </style>
</head>

<body>
  <div id="gps-overlay">
    <div id="close-gps" onclick="toggleGpsPanel(false)">✕</div>
    <div class="gps-stat"><div>Temperatura</div><div id="gps-t">--</div></div>
    <div class="gps-stat"><div>Pioggia</div><div id="gps-r">--</div></div>
    <div class="gps-stat"><div>Vento</div><div id="gps-w">--</div></div>
    <div class="gps-stat"><div>Umidità</div><div id="gps-h">--</div></div>
  </div>

  <div id="model-info">
    <div id="model-title">ICON-2I <span style="color:#0077ff">2.2km</span></div>
    <div id="model-sub">HARDWARE ACCELERATED | VALID: <span id="valid-time">--</span></div>
  </div>

  <div id="info-box"><div id="val-group"><div id="val-display">--</div><div id="unit-display">Caricamento...</div></div></div>

  <div id="ui-container">
    <button class="gps-btn" onclick="getMyWeather()">📍 IL MIO METEO</button>
    <div class="panel">
      <button id="btn-flow" class="mini active" onclick="toggleParticles()">FLUSSO 🌬️ (ON)</button>
    </div>
    <div class="panel">
      <div class="toggle active" id="btn-wind" onclick="toggleLayer('wind')">VENTO 🧭</div>
      <div class="toggle" id="btn-temp" onclick="toggleLayer('temp')">TEMP 🌡️</div>
      <div class="toggle" id="btn-rain" onclick="toggleLayer('rain')">PIOGGIA ☔</div>
      <div class="toggle" id="btn-rh" onclick="toggleLayer('rh')">UMIDITÀ 💧</div>
      <div class="toggle" id="btn-press" onclick="toggleLayer('press')">PRESSIONE ⏲️</div>
      <div class="toggle" id="btn-cloud" onclick="toggleLayer('cloud')">NUVOLE ☁️</div>
      <div style="height:1px; background: rgba(255,255,255,0.1); margin:8px 0;"></div>
      <div class="toggle" id="btn-iso" onclick="toggleIsobars()">ISOBARE 〰️</div>
      <div class="toggle" id="btn-therm" onclick="toggleIsotherms()">ISOTERME 🌡️</div>
    </div>
  </div>

  <div id="map"></div>

  <div id="bottom-bar">
    <button id="play-btn" style="background:none; border:none; color:white; font-size:2.5em; cursor:pointer;" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label" style="color:white; font-weight:900; margin-left:20px; min-width:140px; font-size:1.1em;">--/-- --:--</div>
  </div>

<script>
  const DPR = window.devicePixelRatio || 1;
  const SICILY_BOUNDS = L.latLngBounds(L.latLng(35.0, 11.0), L.latLng(40.5, 17.5));
  
  let map, currentData = null, catalog = [], isPlaying = false;
  const selected = new Set(['wind']);
  let showIsobars = false, showIsotherms = false, particlesOn = true;
  
  let scalarOverlay = null; // Il nuovo layer immagine GPU-accelerato
  let userMarker, velocityLayer = null;

  // COLORI EVIDENTI (Alto Contrasto per cambi netti)
  const WIND_COLOR_SCALE = ["#000080", "#0044ff", "#00ddff", "#00ff55", "#ffff00", "#ff6600", "#ff0000", "#ff00ff"];
  const TEMP_STOPS = [
    {v:-10, c:[40,0,80]}, {v:-5, c:[60,50,180]}, {v:0, c:[100,180,250]}, 
    {v:5, c:[120,220,180]}, {v:10, c:[180,240,100]}, {v:15, c:[240,240,50]}, 
    {v:20, c:[255,170,0]}, {v:25, c:[255,80,0]}, {v:30, c:[220,0,0]}, 
    {v:35, c:[150,0,40]}, {v:45, c:[80,0,60]}
  ];
  const RAIN_STOPS = [{v:0.0,c:[0,0,0],a:0},{v:0.5,c:[0,200,255],a:0.7},{v:5,c:[0,50,255],a:0.85},{v:20,c:[255,255,0],a:0.9},{v:50,c:[255,0,0],a:0.95}];
  const RH_STOPS = [{v:0,c:[173,85,56]},{v:40,c:[150,150,50]},{v:70,c:[56,173,121]},{v:100,c:[56,70,114]}];
  const PRESS_STOPS = [{v:980,c:[0,32,96]},{v:1000,c:[0,117,146]},{v:1013,c:[182,182,182]},{v:1025,c:[163,116,67]},{v:1040,c:[111,24,64]}];

  function getStopColor(val, stops) {
    if (val <= stops[0].v) return [...stops[0].c, (stops[0].a !== undefined ? stops[0].a : 0.85)];
    for (let i = 0; i < stops.length - 1; i++) {
      if (val >= stops[i].v && val <= stops[i+1].v) {
        const t = (val - stops[i].v) / (stops[i+1].v - stops[i].v);
        const a1 = stops[i].a !== undefined ? stops[i].a : 0.85, a2 = stops[i+1].a !== undefined ? stops[i+1].a : 0.85;
        return [(stops[i].c[0]*(1-t)+stops[i+1].c[0]*t)|0, (stops[i].c[1]*(1-t)+stops[i+1].c[1]*t)|0, (stops[i].c[2]*(1-t)+stops[i+1].c[2]*t)|0, (a1*(1-t)+a2*t)];
      }
    }
    return [...stops[stops.length-1].c, 0.85];
  }

  function vividWindColor(sp){
    const t = Math.min(sp/25.0, 0.99);
    const idx = (t*(WIND_COLOR_SCALE.length-1))|0, f = (t*(WIND_COLOR_SCALE.length-1)) - idx;
    const c1 = WIND_COLOR_SCALE[idx], c2 = WIND_COLOR_SCALE[idx+1] || c1;
    const r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
    const r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
    return {r:(r1*(1-f)+r2*f)|0, g:(g1*(1-f)+g2*f)|0, b:(b1*(1-f)+b2*f)|0};
  }

  // --- CUSTOM CANVAS LAYER (Per Frecce e Isobare. Si aggiorna senza lag) ---
  const VectorLayer = L.Layer.extend({
      onAdd: function(map) {
          this._map = map;
          this._canvas = L.DomUtil.create('canvas', 'leaflet-zoom-animated');
          this._canvas.style.pointerEvents = 'none';
          this._canvas.style.zIndex = '600';
          this.getPane().appendChild(this._canvas);
          map.on('moveend zoomend', this._reset, this);
          map.on('resize', this._resize, this);
          this._resize(); this._reset();
      },
      onRemove: function(map) {
          L.DomUtil.remove(this._canvas);
          map.off('moveend zoomend', this._reset, this);
          map.off('resize', this._resize, this);
      },
      _resize: function() {
          const size = this._map.getSize();
          this._canvas.width = size.x * DPR; this._canvas.height = size.y * DPR;
          this._canvas.style.width = size.x + 'px'; this._canvas.style.height = size.y + 'px';
      },
      _reset: function() {
          const topLeft = this._map.containerPointToLayerPoint([0, 0]);
          L.DomUtil.setPosition(this._canvas, topLeft);
          this.redraw();
      },
      redraw: function() {
          const ctx = this._canvas.getContext('2d');
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          ctx.clearRect(0, 0, this._canvas.width/DPR, this._canvas.height/DPR);
          if (!currentData) return;
          if (selected.has('wind')) drawProWindVectors(ctx, this._map);
          if (showIsobars) drawContours(ctx, this._map, "iso");
          if (showIsotherms) drawContours(ctx, this._map, "therm");
      }
  });
  let customVectorLayer = new VectorLayer();

  // --- INIT MAPPA ---
  window.addEventListener('load', async () => {
    map = L.map('map', { zoomControl: false, background: '#0a0a0a' }).fitBounds(SICILY_BOUNDS);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', { className: 'dark-relief-tiles' }).addTo(map);

    map.createPane('particlePane').style.zIndex = 400; 
    map.createPane('topPane').style.zIndex = 1500;    

    fetch('https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson')
      .then(r => r.json()).then(data => L.geoJSON(data, { pane: 'topPane', style: { color: "#fff", weight: 2, opacity: 0.7, fillOpacity: 0 } }).addTo(map));

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', { opacity: 0.35 }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { zIndex: 1100, opacity: 0.9 }).addTo(map);

    customVectorLayer.addTo(map);

    map.on('locationfound', (e) => {
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.circleMarker(e.latlng, { radius: 10, color: '#0077ff', weight: 5, fillOpacity: 1, fillColor: '#fff' }).addTo(map);
        if(!currentData) return;
        const m = currentData.meta;
        const gx = Math.round((e.latlng.lng - m.lo1) / m.dx), gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
        if(gx>=0 && gy>=0 && gx < m.nx && gy < m.ny) {
            const i = gy * m.nx + gx;
            document.getElementById('gps-t').innerText = currentData.temp[i].toFixed(1) + "°";
            document.getElementById('gps-r').innerText = currentData.rain[i].toFixed(1) + "mm";
            document.getElementById('gps-w').innerText = (Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2)*3.6).toFixed(0) + " km/h";
            document.getElementById('gps-h').innerText = Math.round(currentData.rh[i]) + "%";
            toggleGpsPanel(true);
        }
    });

    await loadCatalog();
    map.on('mousemove click', onPick);
  });

  async function loadCatalog() {
    const r = await fetch('data_weather/catalog.json?t=' + Date.now());
    catalog = await r.json();
    const slider = document.getElementById('time-slider');
    slider.max = catalog.length - 1;
    slider.oninput = (e) => loadStep(parseInt(e.target.value));

    const now = new Date();
    let bestIdx = 0, minD = Infinity;
    catalog.forEach((item, idx) => {
        const p = item.label.split(' '); const dP = p[0].split('/'); const tP = p[1].split(':');
        const sD = new Date(now.getFullYear(), parseInt(dP[1])-1, parseInt(dP[0]), parseInt(tP[0]), parseInt(tP[1]));
        const d = Math.abs(now - sD); if(d < minD) { minD = d; bestIdx = idx; }
    });
    slider.value = bestIdx;
    await loadStep(bestIdx);
  }

  async function loadStep(i) {
    const r = await fetch('data_weather/' + catalog[i].file);
    currentData = await r.json();
    document.getElementById('time-label').innerText = catalog[i].label;
    document.getElementById('valid-time').innerText = catalog[i].label;
    if(currentData.press) {
        currentData.cleanP = new Float32Array(currentData.press.length);
        for(let j=0; j<currentData.press.length; j++) {
            let v = currentData.press[j]; if(v > 2000) v /= 100;
            currentData.cleanP[j] = (!v || v < 850) ? 1013 : v;
        }
    }
    updateAllVisuals();
  }

  function updateAllVisuals() {
    updateHardwareScalar();
    customVectorLayer.redraw();
    updateParticles();
  }

  // --- RENDERING ACCELERATO HARDWARE ---
  // Genera un'immagine perfetta che Leaflet gestisce senza lag
  function updateHardwareScalar() {
      if (scalarOverlay) { map.removeLayer(scalarOverlay); scalarOverlay = null; }
      
      let activeL = Array.from(selected).find(l => ['wind','temp','rain','rh','press','cloud'].includes(l));
      if (!activeL || !currentData) return;

      const m = currentData.meta;
      const tCanvas = document.createElement('canvas');
      tCanvas.width = m.nx; tCanvas.height = m.ny;
      const ctx = tCanvas.getContext('2d');
      const img = ctx.createImageData(m.nx, m.ny);
      const d = img.data;

      let arr = (activeL==='cloud' ? (currentData.cloud || currentData.cld) : (activeL==='press'?currentData.cleanP:currentData[activeL]));
      let stops = activeL==='temp'?TEMP_STOPS:activeL==='rain'?RAIN_STOPS:activeL==='rh'?RH_STOPS:PRESS_STOPS;

      for(let i=0; i<m.nx*m.ny; i++) {
          let col = [0,0,0,0];
          if(activeL==='wind') {
              const sp = Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2);
              const rgb = vividWindColor(sp); col = [rgb.r, rgb.g, rgb.b, Math.min(sp/18, 0.45)*255];
          } else if (activeL==='cloud') {
              if(arr[i] >= 8) col = [255, 255, 255, (arr[i]/100)*220];
          } else {
              if(!(activeL==='rain' && arr[i]<0.1)) {
                  const res = getStopColor(arr[i], stops); col = [res[0], res[1], res[2], res[3]*255];
              }
          }
          const p = i * 4;
          d[p]=col[0]; d[p+1]=col[1]; d[p+2]=col[2]; d[p+3]=col[3];
      }
      ctx.putImageData(img, 0, 0);

      // Limiti esatti del modello geografico
      const bounds = [[m.la1 - m.ny*m.dy, m.lo1], [m.la1, m.lo1 + m.nx*m.dx]];
      
      scalarOverlay = L.imageOverlay(tCanvas.toDataURL(), bounds, {
          opacity: 0.85,
          className: 'smooth-overlay' // Questo attiva il CSS image-rendering: auto (liscio e perfetto)
      }).addTo(map);
  }

  // --- FRECCE VENTO "PRO" (Forma di Freccia solida con bordo) ---
  function drawProWindVectors(ctx, mmap) {
    const m = currentData.meta, size = mmap.getSize();
    
    // Spaziatura fissa basata sullo schermo, non sui dati. Mai sovrapposte.
    const stepPx = 45; 

    for(let y = 20; y < size.y; y += stepPx) {
        for(let x = 20; x < size.x; x += stepPx) {
            const ll = mmap.containerPointToLatLng([x, y]);
            const gx = (ll.lng-m.lo1)/m.dx, gy = (m.la1-ll.lat)/m.dy;
            if(gx<0||gy<0||gx>m.nx-1||gy>m.ny-1) continue;
            
            const idx = (gy|0)*m.nx+(gx|0);
            const u = currentData.wind_u.data[idx], v = currentData.wind_v.data[idx];
            const sp = Math.sqrt(u*u+v*v);
            
            if(sp < 0.5) continue; // Ignora calma piatta
            
            const len = Math.max(18, Math.min(sp * 2.8, 50)); // Minimo 18px per far vedere la freccia
            const ang = Math.atan2(-v, u);
            const c = vividWindColor(sp);

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(ang);

            // Disegno Poligono Freccia (Corpo + Punta)
            const hw = 3;  // Metà spessore asta
            const hl = 10; // Lunghezza punta
            const hhw = 7; // Metà larghezza punta

            ctx.beginPath();
            ctx.moveTo(-len/2, -hw);
            ctx.lineTo(len/2 - hl, -hw);
            ctx.lineTo(len/2 - hl, -hhw);
            ctx.lineTo(len/2, 0);
            ctx.lineTo(len/2 - hl, hhw);
            ctx.lineTo(len/2 - hl, hw);
            ctx.lineTo(-len/2, hw);
            ctx.closePath();

            // Bordo Nero Spesso
            ctx.strokeStyle = "rgba(0,0,0,0.9)";
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Interno Colorato
            ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
            ctx.fill();

            ctx.restore();
        }
    }
  }

  function drawContours(ctx, mmap, type) {
    const m = currentData.meta, data = (type==="iso") ? currentData.cleanP : currentData.temp;
    const contours = d3.contours().size([m.nx, m.ny]).thresholds((type==="iso") ? d3.range(960, 1060, 2) : d3.range(-20, 50, 5))(data);
    ctx.strokeStyle = (type==="iso") ? "rgba(255,255,255,0.9)" : "rgba(255,255,255,0.6)"; 
    ctx.lineWidth = 1.8; if(type==="therm") ctx.setLineDash([8, 5]);
    
    contours.forEach(c => c.coordinates.forEach(poly => poly.forEach(ring => {
        ctx.beginPath(); let pts=[]; ring.forEach((p, j) => {
            const pt = mmap.latLngToContainerPoint([m.la1-p[1]*m.dy, m.lo1+p[0]*m.dx]);
            if(j===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); pts.push(pt);
        }); ctx.stroke();
        if(pts.length > 80 && type==="iso") {
            const mid = pts[Math.floor(pts.length/2)];
            ctx.fillStyle = "rgba(0,0,0,0.9)"; ctx.fillRect(mid.x-15, mid.y-10, 30, 20);
            ctx.fillStyle = "#fff"; ctx.font = "bold 11px Arial"; ctx.textAlign="center"; ctx.fillText(Math.round(c.value), mid.x, mid.y+5);
        }
    })));
    if(type==="iso") drawExtremaAB(ctx, mmap, m);
    ctx.setLineDash([]);
  }

  function drawExtremaAB(ctx, mmap, m) {
    const r = 40; let pts = [];
    for(let y=r; y<m.ny-r; y+=10) for(let x=r; x<m.nx-r; x+=10) {
        const v = currentData.cleanP[y*m.nx+x]; let isM=true, ism=true;
        for(let yy=y-r; yy<=y+r; yy+=10) for(let xx=x-r; xx<=x+r; xx+=10) {
            const n = currentData.cleanP[yy*m.nx+xx]; if(n > v) isM=false; if(n < v) ism=false;
        }
        if((isM && v>1015) || (ism && v<1011)) {
            const p = mmap.latLngToContainerPoint([m.la1-y*m.dy, m.lo1+x*m.dx]);
            if(!pts.some(k => Math.hypot(k.x-p.x, k.y-p.y) < 180)) {
                pts.push(p); ctx.font = "900 70px Arial"; ctx.textAlign="center"; ctx.shadowColor="#000"; ctx.shadowBlur=15;
                ctx.fillStyle = isM ? "#ff3333" : "#3377ff"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
                ctx.strokeText(isM?"A":"B", p.x, p.y); ctx.fillText(isM?"A":"B", p.x, p.y); ctx.shadowBlur=0;
            }
        }
    }
  }

  function updateParticles() {
    if (velocityLayer) map.removeLayer(velocityLayer);
    if (!particlesOn) return;
    velocityLayer = L.velocityLayer({ displayValues: false, data: [currentData.wind_u, currentData.wind_v], maxVelocity: 25, velocityScale: 0.008, particleMultiplier: 1/450, lineWidth: 2.5, frameRate: 60, opacity: 0.9, colorScale: ["#fff"], pane: 'particlePane' }).addTo(map);
  }

  function toggleGpsPanel(show) { document.getElementById('gps-overlay').className = show ? 'active' : ''; }
  function getMyWeather() { map.locate({setView: true, maxZoom: 10}); }

  function onPick(e){
    if(!currentData) return;
    const m = currentData.meta;
    const gx = Math.round((e.latlng.lng - m.lo1) / m.dx), gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
    if(gx<0 || gy<0 || gx>=m.nx || gy>=m.ny) return;
    const i = gy * m.nx + gx;
    let val = "--", unit = "";
    if(selected.has('temp')) { val = currentData.temp[i].toFixed(1); unit = "°C"; }
    else if(selected.has('wind')) { val = (Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2)*3.6).toFixed(1); unit = "km/h"; }
    else if(selected.has('rain')) { val = currentData.rain[i].toFixed(1); unit = "mm"; }
    else if(selected.has('rh')) { val = Math.round(currentData.rh[i]); unit = "%"; }
    else if(selected.has('press')) { val = Math.round(currentData.cleanP[i]); unit = "hPa"; }
    else if(selected.has('cloud')) { val = Math.round((currentData.cloud||currentData.cld)[i]); unit = "%"; }
    document.getElementById('val-display').innerText = val; document.getElementById('unit-display').innerText = unit;
  }

  window.toggleLayer = (l) => { 
      if(selected.has(l)) selected.delete(l); 
      else {
          // Mantieni i layer scalari esclusivi tra loro per pulizia, tranne il vento che convive con tutto
          if (l !== 'wind') {
             selected.delete('temp'); selected.delete('rain'); selected.delete('rh'); selected.delete('press'); selected.delete('cloud');
          }
          selected.add(l); 
      }
      updateUI(); updateAllVisuals(); 
  };
  window.toggleIsobars = () => { showIsobars = !showIsobars; updateUI(); customVectorLayer.redraw(); };
  window.toggleIsotherms = () => { showIsotherms = !showIsotherms; updateUI(); customVectorLayer.redraw(); };
  window.toggleParticles = () => { particlesOn = !particlesOn; updateUI(); updateParticles(); };

  function updateUI(){
    ['wind','temp','rain','rh','press','cloud'].forEach(l => {
        const btn = document.getElementById('btn-' + l);
        if(selected.has(l)) btn.classList.add('active'); else btn.classList.remove('active');
    });
    if(showIsobars) document.getElementById('btn-iso').classList.add('active'); else document.getElementById('btn-iso').classList.remove('active');
    if(showIsotherms) document.getElementById('btn-therm').classList.add('active'); else document.getElementById('btn-therm').classList.remove('active');
    if(particlesOn) document.getElementById('btn-flow').classList.add('active'); else document.getElementById('btn-flow').classList.remove('active');
  }

  function togglePlay() { isPlaying = !isPlaying; document.getElementById('play-btn').innerText = isPlaying ? "❚❚" : "►"; if(isPlaying) playLoop(); }
  function playLoop() { if(!isPlaying) return; const s = document.getElementById('time-slider'); let v = parseInt(s.value) + 1; if(v >= catalog.length) v = 0; s.value = v; loadStep(v); setTimeout(playLoop, 950); }
</script>
</body>
</html>
