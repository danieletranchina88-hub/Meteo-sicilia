  function interpStops(val, stops) {
    if(val <= stops[0].v) { const s=stops[0]; return {r:s.c[0],g:s.c[1],b:s.c[2],a:(s.a!==undefined)?s.a:0.90}; }
    for(let i=0; i<stops.length-1; i++){
      const s1 = stops[i];
      const s2 = stops[i+1];
      if(val >= s1.v && val <= s2.v){
        const t = (val - s1.v) / (s2.v - s1.v);
        const a1 = (s1.a!==undefined)?s1.a:0.90;
        const a2 = (s2.a!==undefined)?s2.a:0.90;
        return {
          r: (s1.c[0]*(1-t) + s2.c[0]*t) | 0,
          g: (s1.c[1]*(1-t) + s2.c[1]*t) | 0,
          b: (s1.c[2]*(1-t) + s2.c[2]*t) | 0,
          a: a1*(1-t) + a2*t
        };
      }
    }
    const s=stops[stops.length-1];
    return {r:s.c[0],g:s.c[1],b:s.c[2],a:(s.a!==undefined)?s.a:0.90};
  }

  function vividWindColor(speedMs){
    const maxV = 20.0;
    const t = clamp(speedMs/maxV, 0, 0.999);
    const n = WIND_COLOR_SCALE.length;
    const pos = t*(n-1);
    const i = Math.floor(pos);
    const f = pos - i;
    const hex1=WIND_COLOR_SCALE[i], hex2=WIND_COLOR_SCALE[Math.min(i+1,n-1)];
    const r1=parseInt(hex1.slice(1,3),16), g1=parseInt(hex1.slice(3,5),16), b1=parseInt(hex1.slice(5,7),16);
    const r2=parseInt(hex2.slice(1,3),16), g2=parseInt(hex2.slice(3,5),16), b2=parseInt(hex2.slice(5,7),16);
    return {r:(r1*(1-f)+r2*f)|0, g:(g1*(1-f)+g2*f)|0, b:(b1*(1-f)+b2*f)|0};
  }

  function contourToScreenPath(ctx, coordinates, m){
    for (const polygon of coordinates) {
      for (const ring of polygon) {
        if (!ring || ring.length < 2) continue;
        ctx.beginPath();
        let first = true;
        for (const p of ring) {
          let lat = (m.la1 + LAT_OFFSET) - p[1] * m.dy;
          let lon = (m.lo1 + LON_OFFSET) + p[0] * m.dx;
          let pt = map.latLngToContainerPoint([lat, lon]);
          if(first){ ctx.moveTo(pt.x, pt.y); first=false; }
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();
      }
    }
  }

  function pickLabelPointInsideSicily(contour, m){
    if(!contour.coordinates || !contour.coordinates[0]) return null;
    const ring = contour.coordinates[0][0]; 
    if(!ring || ring.length < 10) return null;
    return ring[Math.floor(ring.length/2)];
  }

  function smoothGrid(src, nx, ny){
    const out = new Float32Array(nx*ny);
    for(let y=1; y<ny-1; y++){
      for(let x=1; x<nx-1; x++){
        const v = src[y*nx+x]*4 + src[y*nx+x-1] + src[y*nx+x+1] + src[(y-1)*nx+x] + src[(y+1)*nx+x];
        out[y*nx+x] = v / 8;
      }
    }
    return out;
  }

  function findExtremaAB(field, nx, ny){
    const cand = [];
    const r = 15; // RAGGIO DI RICERCA MOLTO AMPIO PER EVITARE RUMORE
    for(let y=r; y<ny-r; y++){
      for(let x=r; x<nx-r; x++){
        const idx = y*nx + x;
        const v = field[idx];
        let isMax=true, isMin=true;
        for(let yy=y-r; yy<=y+r; yy++){
          for(let xx=x-r; xx<=x+r; xx++){
            const n = field[yy*nx+xx];
            if(n > v) isMax=false;
            if(n < v) isMin=false;
          }
        }
        if(isMax && v > 1016) cand.push({type:'A', x, y, v});
        if(isMin && v < 1012) cand.push({type:'B', x, y, v});
      }
    }
    return cand;
  }

  function dedupeByDistance(points, minDistPx){
    const kept = [];
    for(const p of points){
      let ok = true;
      for(const k of kept){
        const dx = p.px - k.px, dy = p.py - k.py;
        if(dx*dx + dy*dy < minDistPx*minDistPx){ ok=false; break; }
      }
      if(ok) kept.push(p);
    }
    return kept;
  }

  function drawAB(ctx, x, y, letter, color, value, letterSize, valueSize){
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    
    // OMBRA
    ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 6;

    // LETTERA
    ctx.font = `900 ${letterSize}px Arial`;
    ctx.fillStyle = color;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;
    ctx.strokeText(letter, x, y);
    ctx.fillText(letter, x, y);

    // VALORE
    ctx.shadowBlur = 0;
    ctx.font = `bold ${valueSize}px Arial`;
    const vy = y + letterSize*0.75;
    const txt = `${Math.round(value)} hPa`;
    
    // Sfondo etichetta
    ctx.fillStyle = "rgba(0,0,0,0.7)"; 
    const w = ctx.measureText(txt).width + 12;
    const h = valueSize + 8;
    ctx.fillRect(x - w/2, vy - h/2, w, h);

    // Testo bianco
    ctx.fillStyle = "#fff";
    ctx.fillText(txt, x, vy);
    ctx.restore();
  }

          const raw = currentData.press;
          const clean = new Float32Array(raw.length);
          for(let j=0; j<raw.length; j++){
              const v = raw[j];
              clean[j] = (!v || v < 850 || v > 1100) ? 1013 : v;
          }
          currentData.cleanPress = clean;
      }
      redrawAll();
    } catch(e){}
  }

  function redrawAll(){
    if(!currentData) return;
    drawScalars();
    drawWindArrows();
    drawIsobars();
    drawIsotherms();
    drawLatLonGrid();
    updateParticles();
  }

  function drawScalars(){
    const size = map.getSize();
    const w = Math.ceil(size.x * SCALAR_RESOLUTION);
    const h = Math.ceil(size.y * SCALAR_RESOLUTION);

    ['wind','temp','rain','rh','press','cloud'].forEach(layer => {
      const canvas = scalarCanvases[layer];
      const ctx = canvas.getContext('2d');
      if(canvas.width !== w || canvas.height !== h) {
          canvas.width = w; canvas.height = h;
          canvas.style.width = size.x + 'px'; canvas.style.height = size.y + 'px';
      }
      L.DomUtil.setPosition(canvas, map.containerPointToLayerPoint([0,0]));
      const imgData = ctx.createImageData(w, h);
      const data = imgData.data;

      if(!selected.has(layer) || !currentData.meta) { ctx.clearRect(0,0,w,h); return; }
      const m = currentData.meta;
      let arr = null, stops = null, isWindBg = false;
      if(layer==='wind'){ isWindBg = true; }
      else if(layer==='temp'){ arr = currentData.temp; stops = TEMP_STOPS; }
      else if(layer==='rain'){ arr = currentData.rain; stops = RAIN_STOPS; }
      else if(layer==='rh'){ arr = currentData.rh; stops = RH_STOPS; }
      else if(layer==='press'){ arr = currentData.press; stops = PRESS_STOPS; }
      else if(layer==='cloud'){ arr = currentData.cloud ?? currentData.cld ?? null; stops = CLOUD_STOPS; }
      
      if(!arr && !isWindBg) { ctx.clearRect(0,0,w,h); return; }

      for(let y=0; y<h; y++){
          for(let x=0; x<w; x++){
              const sx = x / SCALAR_RESOLUTION;
              const sy = y / SCALAR_RESOLUTION;
              const latlng = map.containerPointToLatLng([sx, sy]);
              const gx = (latlng.lng - (m.lo1 + LON_OFFSET)) / m.dx;
              const gy = ((m.la1 + LAT_OFFSET) - latlng.lat) / m.dy;
              if(gx<0 || gy<0 || gx>m.nx-1 || gy>m.ny-1) continue;

              const x0 = Math.floor(gx), y0 = Math.floor(gy);
              const x1 = Math.min(x0+1, m.nx-1), y1 = Math.min(y0+1, m.ny-1);
              const fx = gx - x0, fy = gy - y0;
              let col = {r:0,g:0,b:0,a:0};

              if(isWindBg){
                  const u00 = currentData.wind_u.data[y0*m.nx+x0], u10 = currentData.wind_u.data[y0*m.nx+x1];
                  const u01 = currentData.wind_u.data[y1*m.nx+x0], u11 = currentData.wind_u.data[y1*m.nx+x1];
                  const v00 = currentData.wind_v.data[y0*m.nx+x0], v10 = currentData.wind_v.data[y0*m.nx+x1];
                  const v01 = currentData.wind_v.data[y1*m.nx+x0], v11 = currentData.wind_v.data[y1*m.nx+x1];
                  const u = (u00*(1-fx)+u10*fx)*(1-fy) + (u01*(1-fx)+u11*fx)*fy;
                  const v = (v00*(1-fx)+v10*fx)*(1-fy) + (v01*(1-fx)+v11*fx)*fy;
                  const sp = Math.sqrt(u*u+v*v);
                  const rgb = vividWindColor(sp);
                  col = {r:rgb.r,g:rgb.g,b:rgb.b,a:0.35};
              } else {
                  const v00 = arr[y0*m.nx+x0], v10 = arr[y0*m.nx+x1];
                  const v01 = arr[y1*m.nx+x0], v11 = arr[y1*m.nx+x1];
                  const val = (v00*(1-fx)+v10*fx)*(1-fy) + (v01*(1-fx)+v11*fx)*fy;
                  if(layer==='rain' && val < 0.6) col.a = 0;
                  else if(layer==='cloud' && val < 5) col.a = 0;
                  else {
                      col = interpStops(val, stops);
                      col.a = clamp(col.a * 1.05, 0, 0.95);
                  }
              }
              const idx = (y * w + x) * 4;
              data[idx] = col.r; data[idx+1] = col.g; data[idx+2] = col.b; data[idx+3] = (col.a*255)|0;
          }
      }
      ctx.putImageData(imgData, 0, 0);
    });
  }

  function drawWindArrows(){
    const size = map.getSize();
    const w = size.x * DPR;
    const h = size.y * DPR;
    const ctx = arrowCanvas.getContext('2d');
    if(arrowCanvas.width !== w || arrowCanvas.height !== h){
        arrowCanvas.width = w; arrowCanvas.height = h;
        arrowCanvas.style.width = size.x + 'px'; arrowCanvas.style.height = size.y + 'px';
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    L.DomUtil.setPosition(arrowCanvas, map.containerPointToLayerPoint([0,0]));
    ctx.clearRect(0,0,size.x,size.y);

    if(!selected.has('wind') || !currentData?.meta) return;
    const m = currentData.meta;
    const zoom = map.getZoom();
    const stride = zoom >= 11 ? 2 : (zoom >= 10 ? 3 : 4);
    const baseLen = zoom >= 11 ? 26 : (zoom >= 10 ? 22 : 18);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    for(let y=0; y<m.ny; y+=stride){
      const lat = (m.la1 + LAT_OFFSET) - y*m.dy;
      for(let x=0; x<m.nx; x+=stride){
        const idx = y*m.nx + x;
        const u = currentData.wind_u.data[idx], v = currentData.wind_v.data[idx];
        const sp = Math.sqrt(u*u+v*v);
        if(sp < 0.8) continue;
        const lon = (m.lo1 + LON_OFFSET) + x*m.dx;
        const p = map.latLngToContainerPoint([lat, lon]);
        if(p.x < -30 || p.y < -30 || p.x > size.x+30 || p.y > size.y+30) continue;

        const c = vividWindColor(sp);
        const fillStyle = `rgb(${c.r},${c.g},${c.b})`;
        const speedScale = clamp(sp/8.0, 0.70, 2.8);
        const len = baseLen * speedScale;
        const width = clamp(1.1 * speedScale, 1.2, 3.0);
        const headLen = len * 0.38;
        const headWidth = headLen * 0.70;
        const angle = Math.atan2(-v, u);
        const shaftEndX = p.x + (len-headLen)*Math.cos(angle);
        const shaftEndY = p.y + (len-headLen)*Math.sin(angle);

        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(shaftEndX, shaftEndY);
        ctx.strokeStyle = "rgba(0,0,0,0.95)"; ctx.lineWidth = width + 1.8; ctx.stroke();
        ctx.strokeStyle = fillStyle; ctx.lineWidth = width; ctx.stroke();

        const tipX = p.x + len*Math.cos(angle);
        const tipY = p.y + len*Math.sin(angle);
        const wing1X = shaftEndX - headWidth*Math.cos(angle - Math.PI/2);
        const wing1Y = shaftEndY - headWidth*Math.sin(angle - Math.PI/2);
        const wing2X = shaftEndX - headWidth*Math.cos(angle + Math.PI/2);
        const wing2Y = shaftEndY - headWidth*Math.sin(angle + Math.PI/2);

        ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(wing1X, wing1Y); ctx.lineTo(wing2X, wing2Y); ctx.closePath();
        ctx.fillStyle = "rgba(0,0,0,0.95)"; ctx.fill(); ctx.fillStyle = fillStyle; ctx.fill();
      }
    }
  }

  function drawIsobars(){
    const size = map.getSize();
    const w = size.x * DPR;
    const h = size.y * DPR;
    const ctx = isoCanvas.getContext('2d');
    if(isoCanvas.width !== w || isoCanvas.height !== h){
        isoCanvas.width = w; isoCanvas.height = h;
        isoCanvas.style.width = size.x + 'px'; isoCanvas.style.height = size.y + 'px';
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    L.DomUtil.setPosition(isoCanvas, map.containerPointToLayerPoint([0,0]));
    ctx.clearRect(0,0,size.x,size.y);

    if(!showIsobars || !currentData?.cleanPress || !currentData?.meta) return;

    try{
      const m = currentData.meta;
      const smooth = smoothGrid(currentData.cleanPress, m.nx, m.ny);
      const thresholds = d3.range(960, 1050, 2);
      const contours = d3.contours().size([m.nx, m.ny]).thresholds(thresholds)(smooth);

      // ISOBARE BIANCHE
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 1.8;

      for(const c of contours){
        ctx.setLineDash([]);
        contourToScreenPath(ctx, c.coordinates, m);
      }

      const z = map.getZoom();
      const baseFont = clamp(12 + (z-7)*1.5, 12, 26);
      ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font = `bold ${baseFont}px Arial`;

      for(const c of contours){
        const v = Math.round(c.value);
        const p = pickLabelPointInsideSicily(c, m);
        if(!p) continue;
        const lat = (m.la1 + LAT_OFFSET) - p[1]*m.dy;
        const lon = (m.lo1 + LON_OFFSET) + p[0]*m.dx;
        const pt = map.latLngToContainerPoint([lat,lon]);
        if(pt.x < 0 || pt.y < 0 || pt.x > size.x || pt.y > size.y) continue;

        const txt = `${v}`;
        const txtW = ctx.measureText(txt).width + 14;
        const txtH = baseFont + 10;
        
        // ETICHETTA PIU' EVIDENTE
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(pt.x - txtW/2, pt.y - txtH/2, txtW, txtH);
        
        ctx.fillStyle = "#fff";
        ctx.fillText(txt, pt.x, pt.y);
      }

      const cand = findExtremaAB(smooth, m.nx, m.ny);
      const highs = cand.filter(p=>p.type==='A').sort((a,b)=>b.v-a.v);
      const lows  = cand.filter(p=>p.type==='B').sort((a,b)=>a.v-b.v);

      function projectPoint(p){
        const lat = (m.la1 + LAT_OFFSET) - p.y*m.dy;
        const lon = (m.lo1 + LON_OFFSET) + p.x*m.dx;
        const pt = map.latLngToContainerPoint([lat, lon]);
        return {...p, px:pt.x, py:pt.y};
      }

      const minDist = (map.getZoom() >= 10) ? 120 : 160;
      const highsPx = highs.slice(0, 30).map(projectPoint).filter(p=>p.px>=0 && p.py>=0 && p.px<=size.x && p.py<=size.y);
      const lowsPx  = lows.slice(0, 30).map(projectPoint).filter(p=>p.px>=0 && p.py>=0 && p.px<=size.x && p.py<=size.y);
      const Apts = dedupeByDistance(highsPx, minDist).slice(0, 3);
      const Bpts = dedupeByDistance(lowsPx,  minDist).slice(0, 3);

      const letterSize = clamp(36 + (z-7)*4, 36, 72); // A e B Molto Grandi
      const valueSize  = clamp(14 + (z-7)*1.5, 14, 26);

      for(const p of Apts) drawAB(ctx, p.px, p.py, "A", "#ff3333", Math.round(p.v), letterSize, valueSize);
      for(const p of Bpts) drawAB(ctx, p.px, p.py, "B", "#3366ff", Math.round(p.v), letterSize, valueSize);

    } catch(err){ console.error(err); }
  }

  function drawIsotherms(){
    const size = map.getSize();
    const w = size.x * DPR;
    const h = size.y * DPR;
    const ctx = thermCanvas.getContext('2d');
    if(thermCanvas.width !== w || thermCanvas.height !== h){
        thermCanvas.width = w; thermCanvas.height = h;
        thermCanvas.style.width = size.x + 'px'; thermCanvas.style.height = size.y + 'px';
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    L.DomUtil.setPosition(thermCanvas, map.containerPointToLayerPoint([0,0]));
    ctx.clearRect(0,0,size.x,size.y);

    if(!showIsotherms || !currentData?.temp || !currentData?.meta) return;

    const m = currentData.meta;
    const raw = currentData.temp;
    const clean = new Float32Array(raw.length);
    let tMin = 999, tMax = -999;
    for(let i=0;i<raw.length;i++){
      const v = raw[i];
      const vv = (v===null || v===undefined || Number.isNaN(v)) ? 0 : v;
      clean[i] = vv;
      if(vv < tMin) tMin = vv;
      if(vv > tMax) tMax = vv;
    }

    // Step 5 gradi (Pulizia)
    const lo = Math.floor(tMin/5)*5;
    const hi = Math.ceil(tMax/5)*5;
    const thresholds = d3.range(lo, hi+1, 5);
    const contours = d3.contours().size([m.nx, m.ny]).thresholds(thresholds)(clean);

    ctx.strokeStyle = "rgba(255,255,255,0.75)";
    ctx.lineWidth = 1.3;
    ctx.setLineDash([4, 4]);

    for(const c of contours){
      contourToScreenPath(ctx, c.coordinates, m);
    }

    const z = map.getZoom();
    const baseFont = clamp(11 + (z-7)*1.3, 11, 20);
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font = `bold ${baseFont}px Arial`;

    for(const c of contours){
      const v = Math.round(c.value);
      const p = pickLabelPointInsideSicily(c, m);
      if(!p) continue;
      const lat = (m.la1 + LAT_OFFSET) - p[1]*m.dy;
      const lon = (m.lo1 + LON_OFFSET) + p[0]*m.dx;
      const pt = map.latLngToContainerPoint([lat,lon]);
      if(pt.x < 0 || pt.y < 0 || pt.x > size.x || pt.y > size.y) continue;

      const txt = `${v}°`;
      const w = ctx.measureText(txt).width + 8;
      const h = baseFont + 6;
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(pt.x - w/2, pt.y - h/2, w, h);
      ctx.fillStyle = "#fff";
      ctx.fillText(txt, pt.x, pt.y);
    }
  }

  function updateParticles(){
    if(velocityLayer) { map.removeLayer(velocityLayer); velocityLayer = null; }
    if(!particlesOn || !currentData) return;

    velocityLayer = L.velocityLayer({
      displayValues: false,
      data: [ currentData.wind_u, currentData.wind_v ],
      maxVelocity: 20.0,
      velocityScale: 0.008,
      particleMultiplier: 1/180,
      lineWidth: 2.0,
      particleAge: 100,
      frameRate: 40,
      opacity: 0.35, // BIANCO TRASPARENTE (35%)
      colorScale: ["#ffffff"], 
      pane: 'particlePane'
    });

    velocityLayer.onAdd = function(map){
      L.VelocityLayer.prototype.onAdd.call(this, map);
      this._canvas.classList.add('velocity-canvas');
    };
    velocityLayer.addTo(map);
  }

  function drawLatLonGrid(){
    const size = map.getSize();
    const w = size.x * DPR;
    const h = size.y * DPR;
    const ctx = gridCanvas.getContext('2d');
    if(gridCanvas.width !== w || gridCanvas.height !== h){
        gridCanvas.width = w; gridCanvas.height = h;
        gridCanvas.style.width = size.x + 'px'; gridCanvas.style.height = size.y + 'px';
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    L.DomUtil.setPosition(gridCanvas, map.containerPointToLayerPoint([0,0]));
    ctx.clearRect(0,0,size.x,size.y);
    
    if(!showGrid) return;

    const b = map.getBounds();
    const zoom = map.getZoom();
    let step = 1.0;
    if(zoom >= 9) step = 0.5;
    if(zoom >= 11) step = 0.2;

    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,0.20)";
    ctx.setLineDash([5,5]);
    ctx.font = "10px sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.65)";

    const startLon = Math.ceil(b.getWest() / step) * step;
    for(let lon = startLon; lon <= b.getEast(); lon += step){
      const x = map.latLngToContainerPoint([b.getSouth(), lon]).x;
      if(x<0||x>size.x) continue;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,size.y); ctx.stroke();
      ctx.fillText(lon.toFixed(1) + "°E", x+2, size.y-10);
    }

    const startLat = Math.ceil(b.getSouth() / step) * step;
    for(let lat = startLat; lat <= b.getNorth(); lat += step){
      const y = map.latLngToContainerPoint([lat, b.getWest()]).y;
      if(y<0||y>size.y) continue;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(size.x,y); ctx.stroke();
      ctx.fillText(lat.toFixed(1) + "°N", 5, y-2);
    }
    ctx.setLineDash([]);
  }

  function bilinearSample(arr, m, lat, lon){
    const gx = (lon - (m.lo1 + LON_OFFSET)) / m.dx;
    const gy = ((m.la1 + LAT_OFFSET) - lat) / m.dy;
    if(gx < 0 || gy < 0 || gx > (m.nx-1) || gy > (m.ny-1)) return null;
    const x0 = Math.floor(gx), y0 = Math.floor(gy);
    const x1 = Math.min(x0+1, m.nx-1), y1 = Math.min(y0+1, m.ny-1);
    const fx = gx - x0, fy = gy - y0;
    const v00 = arr[y0*m.nx + x0], v10 = arr[y0*m.nx + x1];
    const v01 = arr[y1*m.nx + x0], v11 = arr[y1*m.nx + x1];
    if(!isFinite(v00)||!isFinite(v10)||!isFinite(v01)||!isFinite(v11)) return null;
    return (v00*(1-fx) + v10*fx)*(1-fy) + (v01*(1-fx) + v11*fx)*fy;
  }

  function onPick(e){
    if(!currentData?.meta) return;
    const m = currentData.meta;
    let val='--', unit='';

    if(selected.has('temp') && currentData.temp){
      const v = bilinearSample(currentData.temp, m, e.latlng.lat, e.latlng.lng);
      if(v!==null){ val = v.toFixed(1); unit='°C'; }
    }
    else if(selected.has('press') && currentData.press){
      const v = bilinearSample(currentData.press, m, e.latlng.lat, e.latlng.lng);
      if(v!==null){ val = Math.round(v); unit='hPa'; }
    }
    else if(selected.has('rain') && currentData.rain){
      const v = bilinearSample(currentData.rain, m, e.latlng.lat, e.latlng.lng);
      if(v!==null){ val = v.toFixed(1); unit='mm'; }
    }
    else if(selected.has('rh') && currentData.rh){
      const v = bilinearSample(currentData.rh, m, e.latlng.lat, e.latlng.lng);
      if(v!==null){ val = Math.round(v); unit='%'; }
    }
    else if(selected.has('wind')){
      const u = bilinearSample(currentData.wind_u.data, m, e.latlng.lat, e.latlng.lng);
      const v = bilinearSample(currentData.wind_v.data, m, e.latlng.lat, e.latlng.lng);
      if(u!==null && v!==null){
        val = (Math.sqrt(u*u+v*v)*3.6).toFixed(1);
        unit='km/h';
        const arrow = document.getElementById('rose-arrow');
        const deg = 90 - (Math.atan2(v, u) * 180 / Math.PI);
        arrow.style.transform = `rotate(${deg}deg)`;
      }
    }

    document.getElementById('val-display').innerText = val;
    document.getElementById('unit-display').innerText = unit;
  }

  window.toggleLayer = function(name){
    if(selected.has(name)) selected.delete(name); else selected.add(name);
    updateToggleUI(); redrawAll();
  }
  window.toggleIsobars = function(){ showIsobars=!showIsobars; updateToggleUI(); redrawAll(); }
  window.toggleIsotherms = function(){ showIsotherms=!showIsotherms; updateToggleUI(); redrawAll(); }
  window.toggleGrid = function(){ showGrid=!showGrid; updateToggleUI(); redrawAll(); }
  window.toggleParticles = function(){ particlesOn=!particlesOn; updateToggleUI(); redrawAll(); }

  function updateToggleUI(){
    document.querySelectorAll('.toggle').forEach(el => {
      const txt = el.innerText.toLowerCase();
      if(txt.includes('vento') && selected.has('wind')) el.classList.add('active');
      else if(txt.includes('temp') && selected.has('temp')) el.classList.add('active');
      else if(txt.includes('pioggia') && selected.has('rain')) el.classList.add('active');
      else if(txt.includes('umidità') && selected.has('rh')) el.classList.add('active');
      else if(txt.includes('pressione') && selected.has('press')) el.classList.add('active');
      else if(txt.includes('nuvole') && selected.has('cloud')) el.classList.add('active');
      else if(txt.includes('isobare') && showIsobars) el.classList.add('active');
      else if(txt.includes('isoterme') && showIsotherms) el.classList.add('active');
      else if(txt.includes('reticolo') && showGrid) el.classList.add('active');
      else el.classList.remove('active');
    });

    const btnFlow = document.getElementById('btn-flow');
    if(particlesOn) btnFlow.classList.add('active'); else btnFlow.classList.remove('active');
    document.getElementById('wind-rose').style.display = selected.has('wind') ? 'flex' : 'none';
  }

  window.togglePlay = function(){
    if(isPlaying){ isPlaying=false; document.getElementById('play-btn').innerText='►'; return; }
    isPlaying=true; document.getElementById('play-btn').innerText='❚❚';
    const s = document.getElementById('time-slider');
    let i = parseInt(s.value);
    const loop = setInterval(()=>{
      if(!isPlaying || i>=s.max){ clearInterval(loop); isPlaying=false; document.getElementById('play-btn').innerText='►'; return; }
      i++; s.value=i; loadStep(i);
    }, 800);
  }
</script>
