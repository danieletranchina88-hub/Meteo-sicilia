<!DOCTYPE html>
<html>
<head>
  <title>Sicilia MeteoHub - HIGH PERFORMANCE</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-velocity@1.8.0/dist/leaflet-velocity.css" />
  <script src="https://unpkg.com/leaflet-velocity@1.8.0/dist/leaflet-velocity.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; background: #111; font-family: 'Segoe UI', sans-serif; color: #ddd; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #111; }

    /* UI Z-INDEX & PERFORMANCE */
    #ui-container, #info-box, #model-info, #bottom-bar { pointer-events: auto; z-index: 9999; }
    
    .panel { 
        background: rgba(20,20,20,0.8); backdrop-filter: blur(10px); 
        padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
        box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
    }

    #model-info { position: absolute; top: 15px; left: 15px; pointer-events: none; }
    #model-title { font-size: 16px; font-weight: 900; color: #fff; text-transform: uppercase; }
    
    #val-display { font-size: 3em; font-weight: 900; color: #fff; line-height: 1; }
    #unit-display { font-size: 1.1em; color: #888; font-weight: 700; }

    .toggle { 
        width: 160px; display:flex; align-items:center; justify-content:space-between; 
        padding: 8px 10px; margin: 4px 0; background: rgba(255,255,255,0.03); 
        border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700;
        transition: 0.2s;
    }
    .toggle.active { background: #0077ff; color: #fff; }

    #bottom-bar { 
        position: absolute; bottom: 0; left: 0; right: 0; height: 70px; 
        background: linear-gradient(transparent, rgba(0,0,0,0.9)); 
        display: flex; align-items: center; padding: 0 20px; 
    }
    input[type=range] { flex-grow: 1; accent-color: #0077ff; cursor: pointer; }

    /* GPU HINT */
    canvas { will-change: transform; pointer-events: none !important; }
    .scalar-layer { mix-blend-mode: screen; image-rendering: pixelated; } /* Pixelated per performance, smooth via CSS */
    .dark-relief-tiles { filter: invert(100%) hue-rotate(180deg) brightness(0.7) contrast(1.2); }
  </style>
</head>

<body>
  <div id="model-info">
    <div id="model-title">ICON-2I <span style="color:#0077ff">2.2km</span></div>
    <div id="valid-time" style="font-family:monospace; font-size:12px; color:#aaa;">Caricamento...</div>
  </div>

  <div id="info-box" style="position:absolute; top:80px; left:15px;">
    <div id="val-display">--</div>
    <div id="unit-display">--</div>
  </div>

  <div id="ui-container">
    <div class="panel">
      <div class="toggle active" onclick="toggleLayer('wind')">VENTO 🧭</div>
      <div class="toggle" onclick="toggleLayer('temp')">TEMP 🌡️</div>
      <div class="toggle" onclick="toggleLayer('rain')">PIOGGIA ☔</div>
      <div class="toggle" onclick="toggleLayer('rh')">UMIDITÀ 💧</div>
      <div class="toggle" onclick="toggleLayer('press')">PRESSIONE ⏲️</div>
      <div class="toggle" id="btn-iso" onclick="toggleIsobars()">ISOBARE 〰️</div>
      <div class="toggle" id="btn-therm" onclick="toggleIsotherms()">ISOTERME 🌡️</div>
    </div>
  </div>

  <div id="map"></div>

  <div id="bottom-bar">
    <button id="play-btn" style="background:none; border:none; color:#fff; font-size:2em; cursor:pointer;" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label" style="margin-left:15px; font-weight:900; min-width:100px;">--/--</div>
  </div>

<script>
  // CONFIG
  const SICILY_BOUNDS = L.latLngBounds(L.latLng(35.0, 11.5), L.latLng(39.0, 16.0));
  const DPR = window.devicePixelRatio || 1;
  let map, currentData = null, catalog = [], isPlaying = false;
  const selected = new Set(['wind']);
  let showIsobars = false, showIsotherms = false;
  let scalarCanvases = {}, arrowCanvas, isoCanvas, thermCanvas;
  let velocityLayer = null;

  // COLOR STOPS
  const TEMP_STOPS = [{v:-15,c:[156,218,216]},{v:0,c:[93,133,198]},{v:15,c:[181,165,13]},{v:30,c:[232,83,25]},{v:45,c:[89,22,3]}];
  const RAIN_STOPS = [{v:0,c:[0,0,0],a:0},{v:0.6,c:[100,200,255],a:0.7},{v:10,c:[255,255,0],a:0.8},{v:50,c:[255,0,0],a:0.9}];
  const RH_STOPS = [{v:0,c:[173,85,56]},{v:50,c:[105,173,56]},{v:100,c:[56,70,114]}];
  const PRESS_STOPS = [{v:980,c:[0,32,96]},{v:1013,c:[182,182,182]},{v:1040,c:[48,8,24]}];

  // --- ENGINE: FAST COLOR SAMPLING ---
  function getStopColor(val, stops) {
    if (val <= stops[0].v) return stops[0].c;
    for (let i = 0; i < stops.length - 1; i++) {
        if (val >= stops[i].v && val <= stops[i+1].v) {
            const t = (val - stops[i].v) / (stops[i+1].v - stops[i].v);
            return [
                (stops[i].c[0] * (1-t) + stops[i+1].c[0] * t) | 0,
                (stops[i].c[1] * (1-t) + stops[i+1].c[1] * t) | 0,
                (stops[i].c[2] * (1-t) + stops[i+1].c[2] * t) | 0
            ];
        }
    }
    return stops[stops.length-1].c;
  }

  // --- INIT ---
  window.addEventListener('load', async () => {
    map = L.map('map', { zoomControl: false, fadeAnimation: true, markerZoomAnimation: true }).fitBounds(SICILY_BOUNDS);
    
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', { className: 'dark-relief-tiles' }).addTo(map);

    const mk = (z, cl) => {
        const c = L.DomUtil.create('canvas', 'leaflet-layer ' + (cl||''));
        c.style.zIndex = z;
        map.getPanes().overlayPane.appendChild(c);
        return c;
    };

    scalarCanvases.wind = mk(200, 'scalar-layer');
    scalarCanvases.temp = mk(210, 'scalar-layer');
    scalarCanvases.rain = mk(220, 'scalar-layer');
    scalarCanvases.rh = mk(230, 'scalar-layer');
    scalarCanvases.press = mk(240, 'scalar-layer');
    arrowCanvas = mk(300);
    isoCanvas = mk(310);
    thermCanvas = mk(320);

    await loadCatalog();
    map.on('moveend zoomend', redrawAll);
    map.on('mousemove', onPick);
  });

  async function loadCatalog() {
    const r = await fetch('data_weather/catalog.json?t=' + Date.now());
    catalog = await r.json();
    const s = document.getElementById('time-slider');
    s.max = catalog.length - 1;
    s.oninput = (e) => {
        // Throttling: carica solo se l'utente smette di muovere per 50ms
        clearTimeout(window.loadTimeout);
        window.loadTimeout = setTimeout(() => loadStep(parseInt(e.target.value)), 50);
    };
    await loadStep(0);
  }

  async function loadStep(i) {
    const r = await fetch('data_weather/' + catalog[i].file);
    currentData = await r.json();
    document.getElementById('time-label').innerText = catalog[i].label;
    document.getElementById('valid-time').innerText = "VALID: " + catalog[i].label;
    redrawAll();
  }

  // --- RENDERING CORE (GPU OPTIMIZED) ---
  function redrawAll() {
    if (!currentData) return;
    const size = map.getSize();
    const m = currentData.meta;

    // Reposition canvases
    const panePos = map.containerPointToLayerPoint([0, 0]);
    [...Object.values(scalarCanvases), arrowCanvas, isoCanvas, thermCanvas].forEach(c => {
        c.width = size.x * DPR; c.height = size.y * DPR;
        c.style.width = size.x + 'px'; c.style.height = size.y + 'px';
        L.DomUtil.setPosition(c, panePos);
    });

    drawScalarLayers();
    drawWindVectors();
    if(showIsobars) drawContours(isoCanvas, currentData.press, [980, 1000, 1013, 1020, 1030], "#fff");
    if(showIsotherms) drawContours(thermCanvas, currentData.temp, [0, 10, 20, 30], "rgba(255,255,255,0.5)");
    updateParticles();
  }

  function drawScalarLayers() {
    const m = currentData.meta;
    const size = map.getSize();

    ['wind','temp','rain','rh','press'].forEach(l => {
        if (!selected.has(l)) { scalarCanvases[l].getContext('2d').clearRect(0,0,size.x*DPR,size.y*DPR); return; }
        
        // Creiamo una "texture" dai dati raw (veloce)
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = m.nx; tempCanvas.height = m.ny;
        const tCtx = tempCanvas.getContext('2d');
        const img = tCtx.createImageData(m.nx, m.ny);
        
        let stops = l==='temp'?TEMP_STOPS: l==='rain'?RAIN_STOPS: l==='rh'?RH_STOPS: l==='press'?PRESS_STOPS:null;
        
        for (let i = 0; i < m.nx * m.ny; i++) {
            let val = (l === 'wind') ? Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2) : currentData[l][i];
            let c = stops ? getStopColor(val, stops) : [255,255,255];
            const p = i * 4;
            img.data[p] = c[0]; img.data[p+1] = c[1]; img.data[p+2] = c[2];
            img.data[p+3] = (l==='rain' && val < 0.6) ? 0 : 180;
        }
        tCtx.putImageData(img, 0, 0);

        // Proiettiamo la texture sulla mappa (GPU Accelerated)
        const ctx = scalarCanvases[l].getContext('2d');
        const nw = map.latLngToContainerPoint([m.la1, m.lo1]);
        const se = map.latLngToContainerPoint([m.la2, m.lo2]);
        
        ctx.save();
        ctx.scale(DPR, DPR);
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(tempCanvas, nw.x, nw.y, se.x - nw.x, se.y - nw.y);
        ctx.restore();
    });
  }

  function drawWindVectors() {
    if (!selected.has('wind')) return;
    const ctx = arrowCanvas.getContext('2d');
    const m = currentData.meta;
    const z = map.getZoom();
    const stride = z >= 11 ? 4 : 6; // Meno calcoli
    
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;

    for (let y = 0; y < m.ny; y += stride) {
        for (let x = 0; x < m.nx; x += stride) {
            const i = y * m.nx + x;
            const u = currentData.wind_u.data[i], v = currentData.wind_v.data[i];
            const speed = Math.sqrt(u*u + v*v);
            if (speed < 2) continue;

            const p = map.latLngToContainerPoint([m.la1 - y*m.dy, m.lo1 + x*m.dx]);
            const ang = Math.atan2(-v, u);
            const len = Math.min(speed * 1.5, 30);

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(ang);
            ctx.beginPath(); ctx.moveTo(-len/2, 0); ctx.lineTo(len/2, 0);
            ctx.lineTo(len/2-5, -3); ctx.moveTo(len/2,0); ctx.lineTo(len/2-5, 3);
            ctx.stroke();
            ctx.restore();
        }
    }
  }

  function drawContours(canvas, data, thresholds, color) {
    const ctx = canvas.getContext('2d');
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const m = currentData.meta;
    const contours = d3.contours().size([m.nx, m.ny]).thresholds(thresholds)(data);
    
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    contours.forEach(c => {
        c.coordinates.forEach(poly => {
            poly.forEach(ring => {
                ctx.beginPath();
                ring.forEach((p, j) => {
                    const pt = map.latLngToContainerPoint([m.la1 - p[1]*m.dy, m.lo1 + p[0]*m.dx]);
                    if(j===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
                });
                ctx.stroke();
            });
        });
    });
  }

  function updateParticles() {
    if (velocityLayer) map.removeLayer(velocityLayer);
    if (!selected.has('wind')) return;
    velocityLayer = L.velocityLayer({
        displayValues: false, data: [currentData.wind_u, currentData.wind_v],
        maxVelocity: 20, velocityScale: 0.005, particleMultiplier: 1/200, 
        lineWidth: 1, opacity: 0.4, colorScale: ["#fff"]
    }).addTo(map);
  }

  function onPick(e) {
    if(!currentData) return;
    const m = currentData.meta;
    const gx = Math.round((e.latlng.lng - m.lo1) / m.dx);
    const gy = Math.round((m.la1 - e.latlng.lat) / m.dy);
    if(gx<0 || gy<0 || gx>=m.nx || gy>=m.ny) return;
    const i = gy * m.nx + gx;

    let val = "--", unit = "";
    if(selected.has('temp')) { val = currentData.temp[i].toFixed(1); unit = "°C"; }
    else if(selected.has('wind')) { 
        val = (Math.sqrt(currentData.wind_u.data[i]**2 + currentData.wind_v.data[i]**2)*3.6).toFixed(1); 
        unit = "km/h"; 
    }
    else if(selected.has('rain')) { val = currentData.rain[i].toFixed(1); unit = "mm"; }
    
    document.getElementById('val-display').innerText = val;
    document.getElementById('unit-display').innerText = unit;
  }

  window.toggleLayer = (l) => {
    if(selected.has(l)) selected.delete(l); else selected.add(l);
    document.querySelectorAll('.toggle').forEach(btn => {
        if(btn.innerText.toLowerCase().includes(l)) btn.classList.toggle('active');
    });
    redrawAll();
  };

  window.toggleIsobars = () => { showIsobars = !showIsobars; document.getElementById('btn-iso').classList.toggle('active'); redrawAll(); };
  window.toggleIsotherms = () => { showIsotherms = !showIsotherms; document.getElementById('btn-therm').classList.toggle('active'); redrawAll(); };

  function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('play-btn').innerText = isPlaying ? "❚❚" : "►";
    if(isPlaying) playLoop();
  }

  function playLoop() {
    if(!isPlaying) return;
    const s = document.getElementById('time-slider');
    let v = parseInt(s.value) + 1;
    if(v >= catalog.length) v = 0;
    s.value = v;
    loadStep(v).then(() => setTimeout(playLoop, 500));
  }
</script>
</body>
</html>
