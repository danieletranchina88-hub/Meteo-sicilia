<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Italia MeteoHub Pro | ICON-2I</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <style>
        :root { --ink: #111820; --accent: #0a69d8; --paper: rgba(255, 255, 255, 0.9); }
        body { margin: 0; font-family: system-ui, sans-serif; background: #eef2f5; overflow: hidden; }
        #map { position: fixed; inset: 0; z-index: 1; }
        .glass { background: var(--paper); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.1); }
        #ui-layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .panel { pointer-events: auto; padding: 16px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        #bottomBar { display: flex; align-items: center; gap: 15px; justify-content: center; }
        .btn { padding: 8px 16px; border-radius: 8px; border: none; background: #eee; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #ddd; }
        #loading { position: fixed; top: 20px; right: 20px; padding: 10px 20px; border-radius: 8px; background: var(--ink); color: #fff; display: none; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="loading" class="glass">Caricamento...</div>

    <div id="ui-layer">
        <header class="panel glass">
            <h1 style="margin:0; font-size:18px;">Italia MeteoHub Pro</h1>
            <div id="status">Inizializzazione...</div>
        </header>

        <footer id="bottomBar" class="panel glass">
            <button class="btn" id="prevBtn">&larr;</button>
            <div id="timeLabel">--:--</div>
            <button class="btn" id="nextBtn">&rarr;</button>
        </footer>
    </div>

    <script>
        let catalog = [];
        let currentIndex = 0;
        let currentData = null;

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
            center: [13.5, 37.5],
            zoom: 6
        });

        async function init() {
            try {
                // 1. Carica il catalogo generato dal tuo script Python
                const response = await fetch('data_weather/catalog.json');
                catalog = await response.json();
                renderStep(0);
            } catch (e) {
                document.getElementById('status').innerText = "Errore caricamento catalogo";
            }
        }

        async function renderStep(index) {
            if (index < 0 || index >= catalog.length) return;
            currentIndex = index;
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('status').innerText = "Caricamento dati...";

            try {
                // 2. Carica lo step specifico (file_X.json)
                const res = await fetch(`data_weather/${catalog[index].file}`);
                currentData = await res.json();
                
                // Aggiorna UI
                document.getElementById('timeLabel').innerText = catalog[index].label;
                document.getElementById('status').innerText = `Run valida: ${currentData.meta.refTime}`;

                // --- QUI INSERISCI LA LOGICA DI RENDERING ---
                // Esempio: currentData.temp contiene l'array flat.
                // Usa currentData.meta.nx e ny per ricostruire la griglia se serve.
                console.log("Dati caricati:", currentData);

            } catch (e) {
                console.error(e);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        document.getElementById('prevBtn').onclick = () => renderStep(currentIndex - 1);
        document.getElementById('nextBtn').onclick = () => renderStep(currentIndex + 1);

        map.on('load', init);
    </script>
</body>
</html>
