<!DOCTYPE html>
<html lang="it">
<head>
  <title>Italia MeteoHub Scientifico - ICON-2I</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-velocity@1.8.0/dist/leaflet-velocity.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; background: #0a0a0a; font-family: 'Segoe UI', Roboto, sans-serif; color: #ddd; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #0a0a0a; }

    #gps-overlay {
        position: absolute; top: -200px; left: 0; right: 0; 
        background: rgba(10,10,10,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        z-index: 6000; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
        border-bottom: 2px solid #0077ff; transition: top 0.4s ease;
        padding: 25px 10px 15px 10px; box-shadow: 0 10px 40px #000;
    }
    #gps-overlay.active { top: 0; }
    .gps-stat { width: 30%; text-align: center; margin-bottom: 12px; }
    .gps-stat div:first-child { font-size: 0.65em; color: #888; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
    .gps-stat div:last-child { font-size: 1.5em; font-weight: 900; color: #fff; }
    #close-gps { position: absolute; right: 15px; top: 10px; cursor: pointer; color: #888; font-size: 1.4em; font-weight: bold; padding: 5px;}

    #model-info { position: absolute; top: 15px; left: 70px; z-index: 5000; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    #model-title { font-size: 18px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
    #model-sub { font-size: 11px; color: #00eaff; font-family: monospace; font-weight: bold; }

    #info-box { position: absolute; top: 15px; left: 20px; z-index: 5000; pointer-events: none; }
    #val-group { margin-top: 55px; }
    #val-display { font-size: 3.5em; font-weight: 950; color: #fff; text-shadow: 0 2px 15px #000; line-height: 0.8; font-variant-numeric: tabular-nums; }
    #unit-display { font-size: 1.1em; color: #ccc; font-weight: 700; margin-top: 5px; margin-left: 5px; }

    #ui-container { position: absolute; top: 10px; right: 10px; z-index: 5000; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; max-height: 85vh; overflow-y: auto; padding-right: 5px; scrollbar-width: none; }
    #ui-container::-webkit-scrollbar { display: none; }
    .panel { background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .toggle { width: 150px; display:flex; align-items:center; justify-content:space-between; padding: 12px 10px; margin: 4px 0; background: rgba(255,255,255,0.04); border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 11px; transition: all 0.2s; color: #bbb; border: 1px solid transparent; letter-spacing: 0.5px;}
    .toggle:hover { background: rgba(255,255,255,0.1); }
    .toggle.active { background: #0077ff !important; color: #fff !important; box-shadow: 0 2px 8px rgba(0,119,255,0.4); border: 1px solid rgba(255,255,255,0.2); }
    .gps-btn { width: 170px; padding: 14px; border-radius: 8px; font-size: 13px; background: #23a045; color: white; cursor: pointer; font-weight: 900; border: none; margin-bottom: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

    .mini { width: 170px; padding: 12px; border-radius: 8px; font-size:12px; background: rgba(255,255,255,0.08); color:#fff; cursor:pointer; font-weight:800; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 5px; }
    .mini.active { background: #eee !important; color:#111 !important; }

    #bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0.8), transparent); display: flex; align-items: center; padding: 0 15px; z-index: 5000; }
    input[type=range] { flex-grow: 1; accent-color: #0077ff; cursor: pointer; height: 6px; }
    
    .leaflet-control-scale-line { border: 2px solid #777; border-top: none; line-height: 1.1; padding: 2px 5px; color: #eee; font-weight: bold; background: rgba(0,0,0,0.5); }
    .dark-relief-tiles { filter: invert(100%) hue-rotate(180deg) brightness(0.5) contrast(1.2) saturate(0); }
    canvas.leaflet-layer { pointer-events: none !important; position: absolute; top: 0; left: 0; }
    canvas.leaflet-layer.scalar-layer { opacity: 0.85; mix-blend-mode: hard-light; } 
  </style>
</head>

<body>
  <div id="gps-overlay">
    <div id="close-gps" onclick="toggleGpsPanel(false)">✕</div>
    <div class="gps-stat"><div>Temp.</div><div id="gps-t">--</div></div>
    <div class="gps-stat"><div>Percepita</div><div id="gps-tf">--</div></div>
    <div class="gps-stat"><div>Pioggia</div><div id="gps-r">--</div></div>
    <div class="gps-stat"><div>Vento</div><div id="gps-w">--</div></div>
    <div class="gps-stat"><div>Umidità</div><div id="gps-h">--</div></div>
    <div class="gps-stat"><div>Pressione</div><div id="gps-p">--</div></div>
  </div>

  <div id="model-info">
    <div id="model-title">ITALIA METEOHUB <span style="color:#00eaff">ICON-2I</span></div>
    <div id="model-sub">LIVE SYNC | VALID: <span id="valid-time">--</span></div>
  </div>

  <div id="info-box"><div id="val-group"><div id="val-display">--</div><div id="unit-display">Attendere...</div></div></div>

  <div id="ui-container">
    <button class="gps-btn" onclick="getMyWeather()">📍 IL MIO METEO</button>
    <div class="panel">
      <button id="btn-flow" class="mini active" onclick="toggleParticles()">PARTICELLE 🌬️ (ON)</button>
    </div>
    <div class="panel">
      <div class="toggle active" id="btn-wind" onclick="toggleLayer('wind')">VENTO 🧭</div>
      <div class="toggle" id="btn-temp" onclick="toggleLayer('temp')">TEMP 🌡️</div>
      <div class="toggle" id="btn-feels" onclick="toggleLayer('feels')">PERCEPITA 🤒</div>
      <div class="toggle" id="btn-rain" onclick="toggleLayer('rain')">PIOGGIA ☔</div>
      <div class="toggle" id="btn-rh" onclick="toggleLayer('rh')">UMIDITÀ 💧</div>
      <div class="toggle" id="btn-press" onclick="toggleLayer('press')">PRESSIONE ⏲️</div>
      <div class="toggle" id="btn-cloud" onclick="toggleLayer('cloud')">NUVOLE ☁️</div>
      <div style="height:1px; background: rgba(255,255,255,0.1); margin:8px 0;"></div>
      <div class="toggle" id="btn-iso" onclick="toggleIsobars()">ISOBARE + A/B 〰️</div>
    </div>
  </div>

  <div id="map"></div>

  <div id="bottom-bar">
    <button id="play-btn" style="background:none; border:none; color:white; font-size:2.2em; cursor:pointer; margin-right: 10px;" onclick="togglePlay()">►</button>
    <input type="range" id="time-slider" min="0" max="0" value="0">
    <div id="time-label" style="color:white; font-weight:bold; margin-left:15px; font-family: monospace; font-size: 1em;">--/-- --:--</div>
  </div>

<script>
  const DPR = window.devicePixelRatio || 1;
  const ITALY_BOUNDS = L.latLngBounds(L.latLng(35.0, 6.0), L.latLng(47.5, 19.5));
  
  let map, currentData = null, catalog = [], isPlaying = false;
  const selected = new Set(['wind']);
  let showIsobars = false, particlesOn = true; 
  let scalarCanvases = {}, arrowCanvas, isoCanvas, userMarker, velocityLayer = null; 

  const WIND_BG_STOPS = [{v:0, c:[30,30,35], a:0.6}, {v:5, c:[0,60,120], a:0.7}, {v:15, c:[0,120,160], a:0.75}, {v:30, c:[0,180,140], a:0.8}, {v:50, c:[160,200,40], a:0.85}, {v:70, c:[220,160,0], a:0.9}, {v:90, c:[220,60,0], a:0.9}, {v:120, c:[180,0,40], a:0.95}];
  function vividWindArrowColor(s){
    if(s<5) return {r:100,g:150,b:255}; if(s<15) return {r:0,g:220,b:255}; if(s<30) return {r:0,g:255,b:100}; if(s<50) return {r:200,g:255,b:0}; if(s<80) return {r:255,g:140,b:0}; if(s<110) return {r:255,g:30,b:0}; return {r:255,g:0,b:180};
  }
  
  const TEMP_STOPS = [
    {v:-30,c:[48,0,89]}, {v:-20,c:[115,0,171]}, {v:-10,c:[0,43,161]}, {v:-5,c:[0,115,255]}, 
    {v:0,c:[0,217,255]}, {v:5,c:[0,191,134]}, {v:10,c:[51,184,51]}, {v:15,c:[166,217,43]}, 
    {v:20,c:[255,242,0]}, {v:25,c:[255,166,0]}, {v:30,c:[255,64,0]}, {v:35,c:[204,0,0]}, 
    {v:40,c:[128,0,34]}, {v:45,c:[224,137,204]}
  ];
  
  const RAIN_STOPS = [{v:0.0,c:[0,0,0],a:0},{v:0.2,c:[80,160,255],a:0.6},{v:1.0,c:[0,100,255],a:0.8},{v:3.0,c:[0,40,200],a:0.85},{v:7.0,c:[40,180,40],a:0.9},{v:15,c:[255,220,0],a:0.9},{v:30,c:[255,120,0],a:0.92},{v:60,c:[220,20,0],a:0.95},{v:100,c:[140,0,60],a:0.95}];
  const RH_STOPS = [{v:0,c:[160,80,40]},{v:20,c:[180,130,60]},{v:40,c:[180,180,80]},{v:60,c:[120,180,120]},{v:80,c:[60,160,180]},{v:95,c:[20,100,180]},{v:100,c:[60,40,160]}];
  const PRESS_STOPS = [{v:970,c:[60,0,80]},{v:985,c:[0,40,120]},{v:1000,c:[0,100,160]},{v:1010,c:[100,180,200]},{v:1013,c:[220,220,220]},{v:1016,c:[200,200,120]},{v:1025,c:[180,120,40]},{v:1040,c:[120,40,20]},{v:1050,c:[80,0,0]}];
  const CLOUD_STOPS = [{v:0,c:[50,80,120],a:0},{v:20,c:[100,130,170],a:0.4},{v:60,c:[160,170,180],a:0.7},{v:100,c:[230,230,240],a:0.9}];

  function getStopColor(val, stops) {
    if (val <= stops[0].v) return [...stops[0].c, (stops[0].a !== undefined ? stops[0].a : 0.85)];
    for (let i = 0; i < stops.length - 1; i++) {
      if (val >= stops[i].v && val <= stops[i+1].v) {
        const t = (val - stops[i].v) / (stops[i+1].v - stops[i].v);
        const a1 = stops[i].a !== undefined ? stops[i].a : 0.85, a2 = stops[i+1].a !== undefined ? stops[i+1].a : 0.85;
        return [(stops[i].c[0]*(1-t)+stops[i+1].c[0]*t)|0, (stops[i].c[1]*(1-t)+stops[i+1].c[1]*t)|0, (stops[i].c[2]*(1-t)+stops[i+1].c[2]*t)|0, (a1*(1-t)+a2*t)];
      }
    }
    return [...stops[stops.length-1].c, 0.85];
  }

  // NUOVA MAGIA: Interpolazione Bilineare (Elimina i pixel quadrati)
  function getBilinear(arr, gx, gy, nx, ny) {
      let x = Math.floor(gx), y = Math.floor(gy);
      if(x < 0) x = 0; if(x >= nx-1) x = nx-2;
      if(y < 0) y = 0; if(y >= ny-1) y = ny-2;
      const fx = gx - x, fy = gy - y;
      
      const i00 = y*nx + x;
      const v00 = arr[i00], v10 = arr[i00 + 1], v01 = arr[i00 + nx], v11 = arr[i00 + nx + 1];
      
      return v00*(1-fx)*(1-fy) + v10*fx*(1-fy) + v01*(1-fx)*fy + v11*fx*fy;
  }

  function toggleGpsPanel(show) { document.getElementById('gps-overlay').className = show ? 'active' : ''; }
  function getMyWeather() { map.locate({setView: true, maxZoom: 9}); }

  window.addEventListener('load', async () => {
    map = L.map('map', { zoomControl: false, background: '#0a0a0a', inertia: true }).fitBounds(ITALY_BOUNDS);
    L.control.scale({position: 'bottomleft', metric: true, imperial: false}).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', { opacity: 0.6, className: 'dark-relief-tiles' }).addTo(map);
    map.createPane('labels').style.zIndex = 1100;
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', { pane: 'labels', opacity: 0.8 }).addTo(map);

    map.createPane('scalarPane').style.zIndex = 200;
    map.createPane('particlePane').style.zIndex = 300; 
    map.createPane('vectorPane').style.zIndex = 400;   
    map.createPane('topPane').style.zIndex = 1000;    

    fetch('https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson')
      .then(r => r.json()).then(data => L.geoJSON(data, { pane: 'topPane', style: { color: "#ffffff", weight: 1, opacity: 0.4, fillOpacity: 0 } }).addTo(map));

    const mk = (z, pane, cl) => { const c = L.DomUtil.create('canvas', 'leaflet-layer '+(cl||'')); map.getPane(pane).appendChild(c); return c; };
    scalarCanvases = { wind: mk(1,'scalarPane'), temp: mk(2,'scalarPane'), feels: mk(3,'scalarPane'), rain: mk(4,'scalarPane'), rh: mk(5,'scalarPane'), press: mk(6,'scalarPane'), cloud: mk(7,'scalarPane') };
    arrowCanvas = mk(1, 'vectorPane'); isoCanvas = mk(2, 'vectorPane'); 

    map.on('locationfound', (e) => {
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.circleMarker(e.latlng, { radius: 8, color: '#0077ff', weight: 4, fillOpacity: 1, fillColor: 'white' }).addTo(map);
        updateGpsReadout(e.latlng);
    });

    await loadCatalog();
    
    map.on('moveend zoomend resize', redrawAll);
    map.on('mousemove click', onPick);
  });

  function updateGpsReadout(latlng) {
      if(!currentData) return;
      const m = currentData.meta;
      const gx = (latlng.lng - m.lo1) / m.dx;
      const gy = (m.la1 - latlng.lat) / m.dy;
      
      if(gx>=0 && gy>=0 && gx < m.nx && gy < m.ny) {
          const t = getBilinear(currentData.temp, gx, gy, m.nx, m.ny);
          const tf = getBilinear(currentData.feels_like, gx, gy, m.nx, m.ny);
          const r = getBilinear(currentData.rain, gx, gy, m.nx, m.ny);
          const u = getBilinear(currentData.wind_u.data, gx, gy, m.nx, m.ny);
          const v = getBilinear(currentData.wind_v.data, gx, gy, m.nx, m.ny);
          const rh = getBilinear(currentData.rh, gx, gy, m.nx, m.ny);
          const p = getBilinear(currentData.cleanP, gx, gy, m.nx, m.ny);
          
          document.getElementById('gps-t').innerText = t.toFixed(1) + "°";
          document.getElementById('gps-tf').innerText = tf.toFixed(1) + "°"; 
          document.getElementById('gps-r').innerText = r.toFixed(1) + "mm";
          document.getElementById('gps-w').innerText = (Math.sqrt(u*u + v*v)*3.6).toFixed(0) + "km/h";
          document.getElementById('gps-h').innerText = Math.round(rh) + "%";
          document.getElementById('gps-p').innerText = Math.round(p) + "hPa"; 
          toggleGpsPanel(true);
      }
  }

  async function loadCatalog() {
    const r = await fetch('data_weather/catalog.json?t=' + Date.now());
    catalog = await r.json();
    const slider = document.getElementById('time-slider');
    slider.max = catalog.length - 1;
    slider.oninput = (e) => loadStep(parseInt(e.target.value));

    const now = new Date(); let bestIdx = 0, minD = Infinity;
    catalog.forEach((item, idx) => {
        const p = item.label.split(' '); const dP = p[0].split('/'); const tP = p[1].split(':');
        const sD = new Date(now.getFullYear(), parseInt(dP[1])-1, parseInt(dP[0]), parseInt(tP[0]), parseInt(tP[1]));
        const d = Math.abs(now - sD); if(d < minD) { minD = d; bestIdx = idx; }
    });
    slider.value = bestIdx;
    await loadStep(bestIdx);
  }

  async function loadStep(i) {
    const r = await fetch('data_weather/' + catalog[i].file);
    currentData = await r.json();
    document.getElementById('time-label').innerText = catalog[i].label;
    document.getElementById('valid-time').innerText = catalog[i].label;
    
    const m = currentData.meta;
    const len = currentData.temp ? currentData.temp.length : 0;

    if(currentData.press) {
        currentData.cleanP = new Float32Array(len);
        for(let j=0; j<len; j++) {
            let v = currentData.press[j]; if(v > 2000) v /= 100; 
            currentData.cleanP[j] = (!v || v < 850 || v > 1080) ? 1013 : v;
        }

        const downStep = 5; 
        const smallNx = Math.ceil(m.nx / downStep);
        const smallNy = Math.ceil(m.ny / downStep);
        const smallData = new Float32Array(smallNx * smallNy);

        for (let y = 0; y < smallNy; y++) {
            for (let x = 0; x < smallNx; x++) {
                const origY = Math.min(y * downStep, m.ny - 1);
                const origX = Math.min(x * downStep, m.nx - 1);
                smallData[y * smallNx + x] = currentData.cleanP[origY * m.nx + origX];
            }
        }

        const thresholds = d3.range(970, 1052, 2); 
        currentData.cachedContours = d3.contours().size([smallNx, smallNy]).thresholds(thresholds)(smallData);
        currentData.contourDownStep = downStep; 
    }

    if(currentData.temp && currentData.rh && currentData.wind_u) {
        currentData.feels_like = new Float32Array(len);
        for(let j=0; j<len; j++) {
            let T = currentData.temp[j];
            let RH = currentData.rh[j];
            let v_ms = Math.sqrt(currentData.wind_u.data[j]**2 + currentData.wind_v.data[j]**2);
            let e = (RH / 100.0) * 6.105 * Math.exp((17.27 * T) / (237.7 + T));
            currentData.feels_like[j] = T + 0.33 * e - 0.70 * v_ms - 4.00;
        }
    }

    redrawAll();
    if(userMarker) updateGpsReadout(userMarker.getLatLng());
  }

  function redrawAll() {
    if (!currentData) return;
    const size = map.getSize(), panePos = map.containerPointToLayerPoint([0, 0]);
    [...Object.values(scalarCanvases), arrowCanvas, isoCanvas].forEach(c => {
        c.width = size.x * DPR; c.height = size.y * DPR;
        c.style.width = size.x + 'px'; c.style.height = size.y + 'px';
        L.DomUtil.setPosition(c, panePos);
    });
    drawSmoothScalar();
    drawWindArrows(); 
    if(showIsobars) drawContours(); 
    updateParticles();
  }

  function drawSmoothScalar() {
    const m = currentData.meta, size = map.getSize();
    // ScaleFactor 0.6 garantisce massima fluidità. La bilineare fa sembrare tutto 4K!
    const scaleFactor = 0.6;
    const ctx_w = Math.ceil(size.x * scaleFactor), ctx_h = Math.ceil(size.y * scaleFactor);

    ['wind','temp','feels','rain','rh','press','cloud'].forEach(l => {
        const c = scalarCanvases[l], ctx = c.getContext('2d');
        ctx.clearRect(0,0,c.width,c.height);
        if(!selected.has(l)) return;

        const img = ctx.createImageData(ctx_w, ctx_h), d = img.data;
        let arr = (l==='cloud' ? (currentData.cloud || currentData.cld) : (l==='press'?currentData.cleanP : (l==='feels'?currentData.feels_like : currentData[l])));
        let stops = l==='wind'?WIND_BG_STOPS : (l==='temp'||l==='feels')?TEMP_STOPS : l==='rain'?RAIN_STOPS : l==='rh'?RH_STOPS : l==='press'?PRESS_STOPS : CLOUD_STOPS;

        for(let y=0; y<ctx_h; y++) {
            for(let x=0; x<ctx_w; x++) {
                const ll = map.containerPointToLatLng([x/scaleFactor, y/scaleFactor]);
                const gx = (ll.lng-m.lo1)/m.dx;
                const gy = (m.la1-ll.lat)/m.dy;
                
                // Salto i pixel fuori dall'Italia
                if(gx < -1 || gy < -1 || gx > m.nx || gy > m.ny) continue;

                const idx = (y*ctx_w + x)*4;
                let col;

                if(l==='wind'){
                    const u = getBilinear(currentData.wind_u.data, gx, gy, m.nx, m.ny);
                    const v = getBilinear(currentData.wind_v.data, gx, gy, m.nx, m.ny);
                    const sp_ms = Math.sqrt(u*u + v*v);
                    const res = getStopColor(sp_ms * 3.6, stops); 
                    col={r:res[0],g:res[1],b:res[2],a:res[3]};
                } else {
                    const val = getBilinear(arr, gx, gy, m.nx, m.ny);
                    if(l==='cloud' && val < 5) continue;
                    if(l==='rain' && val < 0.05) continue;
                    if(l==='cloud') {
                        col={r:240,g:240,b:255,a:val/100 * 0.85};
                    } else {
                        const res = getStopColor(val, stops); 
                        col={r:res[0],g:res[1],b:res[2],a:res[3]};
                    }
                }
                
                d[idx]=col.r; d[idx+1]=col.g; d[idx+2]=col.b; d[idx+3]=col.a*255;
            }
        }
        
        const tC = document.createElement('canvas'); tC.width=ctx_w; tC.height=ctx_h; 
        tC.getContext('2d').putImageData(img,0,0);
        ctx.setTransform(DPR,0,0,DPR,0,0); 
        ctx.imageSmoothingEnabled = true; 
        ctx.drawImage(tC, 0, 0, size.x, size.y);
    });
  }

  function drawWindArrows() {
    if(!selected.has('wind')) return;
    const ctx = arrowCanvas.getContext('2d'), size = map.getSize();
    ctx.clearRect(0,0,arrowCanvas.width, arrowCanvas.height); 
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = currentData.meta, z = map.getZoom();
    const stride = z >= 11 ? 30 : (z >= 9 ? 45 : (z >= 7 ? 60 : 80));

    for(let y=stride/2; y < size.y; y += stride) {
        for(let x=stride/2; x < size.x; x += stride) {
            const ll = map.containerPointToLatLng([x, y]);
            const gx = Math.round((ll.lng-m.lo1)/m.dx), gy = Math.round((m.la1-ll.lat)/m.dy);
            if(gx<0||gy<0||gx>=m.nx||gy>=m.ny) continue;
            
            const idx = gy*m.nx+gx;
            const u = currentData.wind_u.data[idx], v = currentData.wind_v.data[idx];
            const sp_kmh = Math.sqrt(u*u+v*v) * 3.6;

            if(sp_kmh < 3) continue; 

            let len = Math.min(sp_kmh * 1.8, 70); if(len < 18) len = 18; 
            const ang = Math.atan2(-v, u); 
            const c = vividWindArrowColor(sp_kmh);

            ctx.save();
            ctx.translate(x, y); ctx.rotate(ang);
            ctx.strokeStyle = "rgba(0,0,0,0.8)"; ctx.lineWidth = len > 40 ? 6 : 5; 
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            ctx.beginPath(); const headLen = len * 0.35; 
            ctx.moveTo(-len/2, 0); ctx.lineTo(len/2, 0); 
            ctx.moveTo(len/2 - headLen, -headLen*0.6); ctx.lineTo(len/2, 0); ctx.lineTo(len/2 - headLen, headLen*0.6); 
            ctx.stroke(); 

            ctx.strokeStyle = `rgb(${c.r},${c.g},${c.b})`; ctx.lineWidth = len > 40 ? 3.5 : 3;
            ctx.stroke(); ctx.restore();
        }
    }
  }

  function drawContours() {
    const ctx = isoCanvas.getContext('2d');
    ctx.clearRect(0,0,isoCanvas.width, isoCanvas.height);
    if (!currentData || !currentData.cachedContours) return;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = currentData.meta;
    const contours = currentData.cachedContours; 
    const step = currentData.contourDownStep; 

    ctx.shadowColor = "rgba(0,0,0,0.8)"; 
    ctx.shadowBlur = 3; 

    contours.forEach(c => {
        const val = Math.round(c.value);
        const isMajor = val % 4 === 0; 
        
        ctx.lineWidth = isMajor ? 2.5 : 1.2;
        ctx.strokeStyle = isMajor ? "rgba(255,255,255,1)" : "rgba(255,255,255,0.6)";

        c.coordinates.forEach(poly => poly.forEach(ring => {
            ctx.beginPath(); 
            let pts=[]; 
            ring.forEach((p, j) => {
                const origX = p[0] * step;
                const origY = p[1] * step;
                const pt = map.latLngToContainerPoint([m.la1 - origY * m.dy, m.lo1 + origX * m.dx]);
                
                if(j===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); 
                pts.push(pt);
            }); 
            ctx.stroke();

            // Etichetta "tagliata" nella linea (senza quadrato nero)
            if(pts.length > 30 && isMajor) { 
                let midIdx = Math.floor(pts.length/2); 
                const mid = pts[midIdx];
                
                ctx.shadowBlur = 0; // Togliamo l'ombra dal testo per renderlo pulito
                ctx.font = "bold 13px 'Segoe UI', Arial"; 
                ctx.textAlign="center"; ctx.textBaseline="middle";
                
                // Creiamo un contorno spesso nero per tagliare la linea bianca
                ctx.lineWidth = 5;
                ctx.strokeStyle = "rgba(0,0,0,0.85)";
                ctx.strokeText(val, mid.x, mid.y);
                
                // Testo bianco all'interno
                ctx.fillStyle = "#ffffff"; 
                ctx.fillText(val, mid.x, mid.y);
                
                ctx.shadowBlur = 3; // Ripristiniamo l'ombra per le prossime isobare
            }
        }));
    });
    ctx.shadowBlur = 0;
    
    // Ricerca Intelligente di A e B
    drawExtremaSmart(ctx, m);
  }

  // NUOVO ALGORITMO A/B: Infallibile e leggerissimo (0.001 sec)
  function drawExtremaSmart(ctx, m) {
      const data = currentData.cleanP;
      const nx = m.nx, ny = m.ny;
      // Step da 25 punti griglia (circa 50km quadrati a settore)
      const step = 25; 
      const w = Math.floor(nx / step);
      const h = Math.floor(ny / step);

      let extrema = [];

      for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
              let maxV = -Infinity, minV = Infinity;
              let maxX = 0, maxY = 0, minX = 0, minY = 0;

              // Trova il picco esatto del settore
              for (let dy = 0; dy < step; dy++) {
                  for (let dx = 0; dx < step; dx++) {
                      const cx = x * step + dx;
                      const cy = y * step + dy;
                      const val = data[cy * nx + cx];
                      if (val > maxV) { maxV = val; maxX = cx; maxY = cy; }
                      if (val < minV) { minV = val; minX = cx; minY = cy; }
                  }
              }

              // Filtro Sinottico: Solo se sono vere Alte o Basse Pressioni di rilievo
              if (maxV > 1018) extrema.push({ type: 'A', val: maxV, x: maxX, y: maxY });
              if (minV < 1012) extrema.push({ type: 'B', val: minV, x: minX, y: minY });
          }
      }

      // Disegna dai più importanti ai meno importanti
      extrema.sort((a,b) => (b.val - a.val) * (a.type === 'A' ? 1 : -1));

      let drawn = [];
      extrema.forEach(ex => {
          const pt = map.latLngToContainerPoint([m.la1 - ex.y * m.dy, m.lo1 + ex.x * m.dx]);
          
          // Se un altro simbolo è stato già disegnato vicino, lo ignoriamo (evita ammassi)
          if (!drawn.some(d => Math.hypot(d.x - pt.x, d.y - pt.y) < 130)) { 
              drawn.push(pt);
              
              ctx.font = "900 42px 'Arial Black', sans-serif";
              ctx.textAlign="center"; ctx.textBaseline="middle";
              ctx.fillStyle = ex.type === 'A' ? "#ff3333" : "#0077ff";
              ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
              
              ctx.shadowColor="rgba(0,0,0,0.8)"; ctx.shadowBlur=8; ctx.shadowOffsetY=2;
              
              ctx.strokeText(ex.type, pt.x, pt.y);
              ctx.fillText(ex.type, pt.x, pt.y);

              // Valore pressione
              ctx.font = "bold 15px sans-serif"; ctx.lineWidth = 3; ctx.shadowBlur=3;
              ctx.strokeText(Math.round(ex.val), pt.x, pt.y + 30);
              ctx.fillText(Math.round(ex.val), pt.x, pt.y + 30);
          }
      });
  }

  function updateParticles() {
    if (velocityLayer) map.removeLayer(velocityLayer);
    if (!particlesOn) return;
    velocityLayer = L.velocityLayer({ 
        displayValues: false, data: [currentData.wind_u, currentData.wind_v], 
        maxVelocity: 30, velocityScale: 0.005, particleMultiplier: 1/400, 
        lineWidth: 2, frameRate: 40, opacity: 0.7, colorScale: ["#ffffff"], pane: 'particlePane' 
    }).addTo(map);
  }

  function onPick(e){
    if(!currentData) return;
    const m = currentData.meta;
    const gx = (e.latlng.lng - m.lo1) / m.dx;
    const gy = (m.la1 - e.latlng.lat) / m.dy;
    
    if(gx<0 || gy<0 || gx>=m.nx || gy>=m.ny) { document.getElementById('val-display').innerText = "--"; return; }
    
    let val = "--", unit = "";
    if(selected.has('temp')) { val = getBilinear(currentData.temp, gx, gy, m.nx, m.ny).toFixed(1); unit = "°C"; }
    else if(selected.has('feels')) { val = getBilinear(currentData.feels_like, gx, gy, m.nx, m.ny).toFixed(1); unit = "°C"; } 
    else if(selected.has('wind')) { 
        const u = getBilinear(currentData.wind_u.data, gx, gy, m.nx, m.ny);
        const v = getBilinear(currentData.wind_v.data, gx, gy, m.nx, m.ny);
        val = (Math.sqrt(u*u+v*v)*3.6).toFixed(0); unit = "km/h"; 
        const deg = (Math.atan2(u, v) * (180 / Math.PI) + 180) % 360;
        unit += ` (${Math.round(deg)}°)`;
    }
    else if(selected.has('rain')) { val = getBilinear(currentData.rain, gx, gy, m.nx, m.ny).toFixed(1); unit = "mm"; }
    else if(selected.has('rh')) { val = Math.round(getBilinear(currentData.rh, gx, gy, m.nx, m.ny)); unit = "%"; }
    else if(selected.has('press')) { val = getBilinear(currentData.cleanP, gx, gy, m.nx, m.ny).toFixed(1); unit = "hPa"; }
    else if(selected.has('cloud')) { 
        const c_val = currentData.cloud || currentData.cld;
        val = Math.round(getBilinear(c_val, gx, gy, m.nx, m.ny)); unit = "%"; 
    }
    
    document.getElementById('val-display').innerText = val; document.getElementById('unit-display').innerText = unit;
  }

  window.toggleLayer = (l) => { if(selected.has(l)) selected.delete(l); else selected.add(l); updateUI(); redrawAll(); };
  window.toggleIsobars = () => { showIsobars = !showIsobars; updateUI(); redrawAll(); };
  window.toggleParticles = () => { particlesOn = !particlesOn; updateUI(); redrawAll(); };

  function updateUI(){
    ['wind','temp','feels','rain','rh','press','cloud'].forEach(l => {
        const btn = document.getElementById('btn-' + l);
        if(selected.has(l)) btn.classList.add('active'); else btn.classList.remove('active');
    });
    if(showIsobars) document.getElementById('btn-iso').classList.add('active'); else document.getElementById('btn-iso').classList.remove('active');
    if(particlesOn) document.getElementById('btn-flow').classList.add('active'); else document.getElementById('btn-flow').classList.remove('active');
  }

  function togglePlay() { isPlaying = !isPlaying; document.getElementById('play-btn').innerText = isPlaying ? "❚❚" : "►"; if(isPlaying) playLoop(); }
  function playLoop() { if(!isPlaying) return; const s = document.getElementById('time-slider'); let v = parseInt(s.value) + 1; if(v >= catalog.length) v = 0; s.value = v; loadStep(v); setTimeout(playLoop, 800); }
</script>
